<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosage Forms &amp; NAPLEX Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E7;
  --paper-2:#EFE7D8;
  --surface:#FFFDF9;
  --ink:#20302E;
  --ink-soft:#4B5B58;
  --muted:#8C8377;
  --line:#DCD2BE;
  --teal:#1F4B4A;
  --teal-deep:#12302F;
  --amber:#B87A2E;
  --amber-soft:#E7C592;
  --sage:#4C7A5D;
  --sage-soft:#DCE8DE;
  --clay:#AE5038;
  --clay-soft:#F2DBD2;
  --plum:#6B4A7A;
  --plum-soft:#E6DCEA;
  --slate:#3E5C76;
  --slate-soft:#DCE3EA;
  --azure:#3B6E8C;
  --azure-soft:#D7E4E9;
  --ochre:#96742E;
  --ochre-soft:#EAE0C9;
  --rose:#9C5568;
  --rose-soft:#EFDCE2;
  --moss:#5C7A3E;
  --moss-soft:#E1E8D3;
  --coral:#BD6440;
  --coral-soft:#F1DACE;
  --indigo:#4A4E85;
  --indigo-soft:#DEDDEB;
  --shadow: 0 1px 2px rgba(32,48,46,.06), 0 8px 24px -12px rgba(32,48,46,.18);
  --radius: 10px;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'IBM Plex Mono', 'SF Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 1px 1px, rgba(32,48,46,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--amber-soft);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ---------- Layout shell ---------- */
#app{max-width:1080px;margin:0 auto;padding:0 20px 80px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 0 16px;
  border-bottom:1px solid var(--line);
  margin-bottom:28px;
  gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:40px;height:40px;border-radius:10px;
  background:var(--teal);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:22px;height:22px;}
.brand-text h1{font-family:var(--serif);font-weight:600;font-size:1.28rem;margin:0;letter-spacing:.2px;}
.brand-text p{margin:1px 0 0;font-size:.72rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600;}

nav.tabs{display:flex;gap:4px;background:var(--paper-2);padding:4px;border-radius:10px;}
nav.tabs button{
  border:none;background:transparent;color:var(--ink-soft);
  font-size:.85rem;font-weight:600;padding:9px 15px;border-radius:7px;
  transition:background .15s,color .15s;
}
nav.tabs button.active{background:var(--surface);color:var(--teal-deep);box-shadow:var(--shadow);}
nav.tabs button:hover:not(.active){color:var(--ink);}

main#view{min-height:400px;}

/* ---------- Cards / primitives ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.pad{padding:22px 24px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

h2.section-title{
  font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:0 0 4px;color:var(--teal-deep);
}
p.section-sub{color:var(--ink-soft);margin:0 0 20px;font-size:.92rem;line-height:1.5;}

.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  border:1px solid transparent;border-radius:8px;
  padding:11px 20px;font-weight:700;font-size:.88rem;
  transition:transform .1s, box-shadow .15s, background .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--teal);color:#F6F1E7;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-amber{background:var(--amber);color:#2A1B08;}
.btn-amber:hover{background:#A16B25;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-deep);}
.btn-sm{padding:7px 13px;font-size:.78rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;
}
.pill-teal{background:#E4EEEC;color:var(--teal-deep);}
.pill-amber{background:var(--amber-soft);color:#5C3B10;}
.pill-sage{background:var(--sage-soft);color:#26402F;}
.pill-clay{background:var(--clay-soft);color:#6B2C1B;}
.pill-muted{background:var(--paper-2);color:var(--muted);}

.stat-num{font-family:var(--mono);font-weight:600;}

/* Dashboard hero */
.hero{
  display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:20px;
}
@media(max-width:800px){.hero{grid-template-columns:1fr;}}
.readiness-card{
  background:linear-gradient(155deg, var(--teal) 0%, var(--teal-deep) 100%);
  color:#F6F1E7;border-radius:var(--radius);padding:26px 26px 22px;
  position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.readiness-card::after{
  content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
}
.readiness-eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700;margin:0 0 10px;}
.readiness-value{font-family:var(--serif);font-size:3.2rem;font-weight:600;line-height:1;display:flex;align-items:baseline;gap:6px;}
.readiness-value span{font-size:1.3rem;opacity:.7;font-weight:500;}
.readiness-label{margin-top:8px;font-size:.88rem;opacity:.85;max-width:380px;line-height:1.45;}
.readiness-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:18px;overflow:hidden;}
.readiness-bar > div{height:100%;background:var(--amber);border-radius:99px;transition:width .5s ease;}

.quickstats{display:flex;flex-direction:column;gap:12px;}
.qs-row{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);
}
.qs-row .label{font-size:.78rem;color:var(--ink-soft);font-weight:600;}
.qs-row .value{font-family:var(--mono);font-weight:600;font-size:1.1rem;color:var(--teal-deep);}

/* topic bars */
.topic-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-row .ticon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.topic-row .tname{font-size:.86rem;font-weight:700;flex:0 0 150px;}
.topic-row .tbarwrap{flex:1;height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden;}
.topic-row .tbar{height:100%;border-radius:99px;}
.topic-row .tpct{font-family:var(--mono);font-size:.78rem;font-weight:600;width:38px;text-align:right;flex-shrink:0;}

.recommend-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);
}
.recommend-item:last-child{border-bottom:none;}
.recommend-item .ricon{width:34px;height:34px;border-radius:8px;background:var(--clay-soft);color:#6B2C1B;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--serif);font-weight:700;}
.recommend-item h4{margin:0 0 3px;font-size:.9rem;}
.recommend-item p{margin:0 0 8px;font-size:.8rem;color:var(--ink-soft);line-height:1.4;}

/* ---------- Setup screen ---------- */
.setup-group{margin-bottom:26px;}
.setup-group > label.grouplabel{
  display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:12px;
}
.mode-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:720px){.mode-cards{grid-template-columns:1fr;}}
.mode-card{
  border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;background:var(--surface);
  transition:border-color .15s, background .15s;
}
.mode-card:hover{border-color:var(--amber);}
.mode-card.selected{border-color:var(--teal);background:#EEF4F2;}
.mode-card h4{margin:0 0 4px;font-family:var(--serif);font-size:1.05rem;}
.mode-card p{margin:0;font-size:.78rem;color:var(--ink-soft);line-height:1.45;}

.topic-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:720px){.topic-picker{grid-template-columns:1fr 1fr;}}
.topic-chip{
  border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface);
  display:flex;align-items:center;gap:9px;text-align:left;
}
.topic-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.topic-chip .tc-name{font-size:.8rem;font-weight:700;flex:1;}
.topic-chip .tc-pct{font-family:var(--mono);font-size:.72rem;color:var(--muted);}
.topic-chip.selected{border-color:var(--teal);background:#EEF4F2;}

.seg{display:inline-flex;background:var(--paper-2);border-radius:9px;padding:3px;}
.seg button{border:none;background:transparent;padding:8px 16px;border-radius:6px;font-size:.82rem;font-weight:600;color:var(--ink-soft);}
.seg button.active{background:var(--surface);color:var(--teal-deep);box-shadow:var(--shadow);}

.range-row{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;accent-color:var(--teal);}
.count-badge{font-family:var(--mono);font-weight:700;background:var(--teal);color:#F6F1E7;padding:6px 12px;border-radius:7px;min-width:44px;text-align:center;}

/* ---------- Quiz screen ---------- */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.progress-track{height:6px;background:var(--paper-2);border-radius:99px;overflow:hidden;flex:1;margin:0 16px;}
.progress-track > div{height:100%;background:var(--amber);border-radius:99px;transition:width .3s;}

.qcard{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  position:relative;padding:0;overflow:hidden;
}
.qcard-perf{
  height:14px;
  background-image: radial-gradient(circle, var(--paper) 3px, transparent 3.5px);
  background-size:16px 16px;background-position:6px center;
  border-bottom:1px dashed var(--line);
}
.qcard-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 26px 0;
}
.qcard-body{padding:14px 26px 26px;}
.qtext{font-family:var(--serif);font-size:1.18rem;line-height:1.5;font-weight:500;color:var(--teal-deep);margin:6px 0 22px;}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;text-align:left;background:var(--surface);
  transition:border-color .12s, background .12s;
}
.opt:hover:not(.locked){border-color:var(--amber);background:#FBF6EC;}
.opt .okey{
  font-family:var(--mono);font-weight:700;font-size:.78rem;
  width:24px;height:24px;border-radius:6px;background:var(--paper-2);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.opt .otext{font-size:.92rem;line-height:1.45;padding-top:2px;}
.opt.selected{border-color:var(--teal);background:#EEF4F2;}
.opt.selected .okey{background:var(--teal);color:#fff;}
.opt.correct{border-color:var(--sage);background:var(--sage-soft);}
.opt.correct .okey{background:var(--sage);color:#fff;}
.opt.incorrect{border-color:var(--clay);background:var(--clay-soft);}
.opt.incorrect .okey{background:var(--clay);color:#fff;}

.feedback-box{
  margin-top:18px;border-radius:10px;padding:16px 18px;
  border:1.5px solid var(--line);
}
.feedback-box.correct{background:var(--sage-soft);border-color:var(--sage);}
.feedback-box.incorrect{background:var(--clay-soft);border-color:var(--clay);}
.feedback-head{font-weight:800;font-size:.86rem;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.feedback-box.correct .feedback-head{color:#26402F;}
.feedback-box.incorrect .feedback-head{color:#6B2C1B;}
.feedback-body{font-size:.87rem;line-height:1.55;color:var(--ink);}
.feedback-ref{margin-top:10px;font-size:.75rem;color:var(--ink-soft);font-style:italic;}

.quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

/* ---------- Results ---------- */
.result-hero{text-align:center;padding:36px 20px;}
.result-score{font-family:var(--serif);font-size:4rem;font-weight:700;color:var(--teal-deep);line-height:1;}
.result-score span{font-size:1.6rem;color:var(--muted);font-weight:500;}
.result-msg{font-size:.95rem;color:var(--ink-soft);margin-top:10px;}

.review-item{border-bottom:1px solid var(--line);padding:18px 0;}
.review-item:last-child{border-bottom:none;}
.review-q{font-family:var(--serif);font-weight:500;font-size:1rem;margin:8px 0 10px;color:var(--teal-deep);}
.review-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.review-opt{font-size:.83rem;padding:8px 12px;border-radius:7px;border:1px solid var(--line);display:flex;gap:8px;}
.review-opt.correct{background:var(--sage-soft);border-color:var(--sage);font-weight:600;}
.review-opt.incorrect{background:var(--clay-soft);border-color:var(--clay);}

/* ---------- Empty / misc ---------- */
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty h3{font-family:var(--serif);color:var(--teal-deep);margin-bottom:6px;}
.divider{border:none;border-top:1px dashed var(--line);margin:22px 0;}

/* ---------- Manual / Help ---------- */
.manual-toc{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
.manual-layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start;}
.manual-layout > *{min-width:0;}
.manual-layout .manual-nav-card{position:sticky;top:16px;}
@media(max-width:720px){
  .manual-layout{grid-template-columns:1fr;}
  .manual-layout .manual-nav-card{position:static;}
}
.manual-toc a{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  font-size:.86rem;font-weight:600;color:var(--teal-deep);text-decoration:none;
}
.manual-toc a:hover{background:var(--paper-2);}
.manual-toc a .tocnum{
  font-family:var(--mono);font-size:.72rem;color:var(--muted);width:20px;flex-shrink:0;
}
.note-box{
  border:1.5px solid var(--teal);border-left-width:5px;background:#EEF4F2;border-radius:9px;
  padding:14px 18px;margin:16px 0;
}
.note-box.amber{border-color:var(--amber);background:#FBF3E4;}
.calc-answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;}
.calc-answer-input{
  flex:1;min-width:180px;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;
  font-family:var(--mono);font-size:.9rem;color:var(--ink);background:var(--surface);
}
.calc-answer-input:focus{outline:none;border-color:var(--teal);}
.calc-answer-row.locked-row{background:var(--paper-2);border-radius:8px;padding:10px 14px;margin-top:0;}
.calc-your-answer{font-size:.85rem;color:var(--ink-soft);}
.calc-your-answer strong{font-family:var(--mono);color:var(--teal-deep);}
.override-row{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
.note-box h4{margin:0 0 5px;font-size:.85rem;color:var(--teal-deep);font-weight:800;}
.note-box.amber h4{color:#5C3B10;}
.note-box p{margin:0;font-size:.85rem;line-height:1.55;color:var(--ink);}
.manual-section{padding-top:6px;}
.manual-section h3.mh{font-family:var(--serif);font-size:1.3rem;color:var(--teal-deep);font-weight:600;margin:0 0 12px;scroll-margin-top:90px;}
.manual-section h4.mh4{font-size:.95rem;color:var(--ink);font-weight:800;margin:20px 0 8px;}
.manual-section p{font-size:.88rem;line-height:1.65;color:var(--ink);margin:0 0 12px;}
.manual-section ul{margin:0 0 14px;padding-left:20px;}
.manual-section li{font-size:.88rem;line-height:1.6;color:var(--ink);margin-bottom:6px;}
.manual-section ol{margin:0 0 14px;padding-left:20px;}
.manual-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:10px 0 18px;}
.manual-table th{background:var(--teal-deep);color:#fff;text-align:left;padding:9px 12px;font-weight:700;}
.manual-table td{padding:9px 12px;border-bottom:1px solid var(--line);}
.manual-table tr:nth-child(even) td{background:var(--paper-2);}
.manual-faq dt{font-weight:800;font-size:.88rem;color:var(--teal-deep);margin:16px 0 4px;}
.manual-faq dd{margin:0;font-size:.86rem;line-height:1.6;color:var(--ink);}

.site-footer{
  max-width:1080px;margin:36px auto 0;padding:16px 20px 28px;
  border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
  font-size:.74rem;color:var(--muted);
}
.site-footer-links{display:flex;gap:16px;}
.site-footer-links a{color:var(--ink-soft);text-decoration:none;font-weight:600;}
.site-footer-links a:hover{color:var(--teal-deep);text-decoration:underline;}
@media(max-width:600px){.site-footer{flex-direction:column;align-items:flex-start;padding:16px 14px 24px;}}

/* ---------- Consent Modal ---------- */
.consent-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(18,48,47,0.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.consent-modal{
  background:var(--surface);border-radius:14px;box-shadow:0 20px 60px -12px rgba(18,48,47,0.5);
  max-width:640px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}
.consent-header{
  padding:24px 28px 16px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.consent-header h2{font-family:var(--serif);font-size:1.4rem;color:var(--teal-deep);margin:0 0 4px;font-weight:600;}
.consent-header p{margin:0;font-size:.82rem;color:var(--ink-soft);}
.consent-body{padding:18px 28px;overflow-y:auto;flex:1;}
.consent-body h4{font-size:.82rem;font-weight:800;color:var(--teal-deep);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;}
.consent-body h4:first-child{margin-top:0;}
.consent-body ul{margin:0 0 4px;padding-left:20px;}
.consent-body li{font-size:.85rem;line-height:1.55;color:var(--ink);margin-bottom:5px;}
.consent-body p{font-size:.85rem;line-height:1.55;color:var(--ink);margin:0 0 10px;}
.consent-footer{
  padding:18px 28px 24px;border-top:1px solid var(--line);flex-shrink:0;background:var(--paper-2);
}
.consent-check{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;cursor:pointer;}
.consent-check input{width:17px;height:17px;margin-top:2px;accent-color:var(--teal);flex-shrink:0;cursor:pointer;}
.consent-check span{font-size:.84rem;line-height:1.5;color:var(--ink);}
.consent-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.consent-decline{background:none;border:none;color:var(--muted);font-size:.78rem;text-decoration:underline;padding:8px 0;}
.consent-decline:hover{color:var(--clay);}
.consent-declined-msg{font-size:.85rem;color:var(--clay);font-weight:600;}
@media(max-width:600px){
  .consent-header{padding:20px 20px 14px;}
  .consent-body{padding:16px 20px;}
  .consent-footer{padding:16px 20px 20px;}
}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.small-muted{font-size:.78rem;color:var(--muted);}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.checkbox-row{display:flex;align-items:center;gap:9px;font-size:.85rem;padding:9px 0;}
.checkbox-row input{width:16px;height:16px;accent-color:var(--teal);}

.sticky-cta{position:sticky;bottom:16px;margin-top:24px;}

.mastery-badge{
  font-family:var(--mono);font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:.03em;
}
.m-mastered{background:var(--sage-soft);color:#26402F;}
.m-developing{background:var(--amber-soft);color:#5C3B10;}
.m-weak{background:var(--clay-soft);color:#6B2C1B;}
.m-new{background:var(--paper-2);color:var(--muted);}

@media(max-width:600px){
  #app{padding:0 14px 60px;}
  .qtext{font-size:1.05rem;}
  .grid-3{grid-template-columns:1fr;}
}

<script>
window.__QUESTIONS__ = [{"id":"ointments_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"According to USP <795>, what is the maximum Beyond-Use Date (BUD) for an anhydrous topical ointment stored at controlled room temperature, assuming all ingredients expire in more than 1 year?","options":[{"key":"A","text":"14 days"},{"key":"B","text":"30 days"},{"key":"C","text":"90 days"},{"key":"D","text":"180 days"}],"correct":"D","explanation":"Anhydrous non-sterile preparations have a maximum BUD of 180 days (6 months) or the expiration date of any individual component, whichever is shorter.","reference":"Ointments & Semisolids"},{"id":"ointments_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which of the following base types is non-washable, anhydrous, occlusive, and insoluble in water?","options":[{"key":"A","text":"Oleaginous base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-removable base"},{"key":"D","text":"Water-soluble base"}],"correct":"A","explanation":"Oleaginous bases (e.g., White Petrolatum) are hydrocarbon-based, highly occlusive, non-washable, and contain no water.","reference":"Ointments & Semisolids"},{"id":"ointments_3","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"When compounding an ointment with a water-insoluble solid drug using a hydrocarbon base, which levigating agent is most appropriate?","options":[{"key":"A","text":"Glycerin"},{"key":"B","text":"Mineral oil"},{"key":"C","text":"Propylene glycol"},{"key":"D","text":"Purified water"}],"correct":"B","explanation":"Mineral oil is lipophilic and miscible with hydrocarbon/oleaginous bases. Glycerin and propylene glycol are hydrophilic and used for water-washable bases.","reference":"Ointments & Semisolids"},{"id":"ointments_4","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"An absorption base such as Aquaphor differs from an oleaginous base primarily because it:","options":[{"key":"A","text":"Is easily washed off with water"},{"key":"B","text":"Can absorb significant amounts of aqueous solution"},{"key":"C","text":"Contains zero hydrocarbons"},{"key":"D","text":"Does not provide an occlusive barrier"}],"correct":"B","explanation":"Absorption bases are anhydrous but contain emulsifiers (like lanolin alcohols) allowing them to absorb water to form W/O emulsions.","reference":"Ointments & Semisolids"},{"id":"ointments_5","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"According to the revised USP <795> (effective Nov 2023), what is the maximum Beyond-Use Date (BUD) for a PRESERVED water-containing (aqueous) topical cream, assuming no other applicable stability data or USP monograph exists?","options":[{"key":"A","text":"14 days refrigerated"},{"key":"B","text":"35 days at controlled room temperature or refrigerated"},{"key":"C","text":"90 days"},{"key":"D","text":"180 days"}],"correct":"B","explanation":"Under the revised USP <795> (effective November 2023), preserved aqueous preparations (water activity aw \u2265 0.6) default to a 35-day BUD at controlled room temperature or refrigerated. Non-preserved aqueous preparations are limited to 14 days refrigerated. This replaced the older flat '30 days at room temperature' rule.","reference":"Ointments & Semisolids"},{"id":"ointments_6","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Mineral oil is added during the incorporation of a powder into petrolatum to perform which specific compounding process?","options":[{"key":"A","text":"Trituration"},{"key":"B","text":"Levigation"},{"key":"C","text":"Pulverization by intervention"},{"key":"D","text":"Sifting"}],"correct":"B","explanation":"Levigation is the process of reducing particle size and dispersing a powder in a small amount of liquid (levigating agent) in which it is insoluble.","reference":"Ointments & Semisolids"},{"id":"ointments_7","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which ingredient functions as a stiffening agent in ointment compounding?","options":[{"key":"A","text":"Cetyl esters wax"},{"key":"B","text":"Polysorbate 80"},{"key":"C","text":"Methylparaben"},{"key":"D","text":"Propylene glycol"}],"correct":"A","explanation":"Waxes such as cetyl esters wax, white wax, or yellow wax are added to raise the melting point and increase viscosity (stiffening).","reference":"Ointments & Semisolids"},{"id":"ointments_8","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Hydrophilic Ointment USP is classified under which ointment base category?","options":[{"key":"A","text":"Hydrocarbon base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-removable base"},{"key":"D","text":"Water-soluble base"}],"correct":"C","explanation":"Hydrophilic Ointment USP is an oil-in-water (O/W) emulsion base that can be easily washed from skin or clothing with water.","reference":"Ointments & Semisolids"},{"id":"ointments_9","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Polyethylene Glycol (PEG) Ointment NF is an example of a:","options":[{"key":"A","text":"Water-soluble base"},{"key":"B","text":"Water-removable base"},{"key":"C","text":"Oleaginous base"},{"key":"D","text":"W/O emulsion base"}],"correct":"A","explanation":"PEG ointment contains only water-soluble components, contains no mineral oil or petrolatum, and washes off completely with water.","reference":"Ointments & Semisolids"},{"id":"ointments_10","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"Why are hydrocarbon bases generally avoided on acutely inflamed, oozing dermatological lesions?","options":[{"key":"A","text":"They cause excessive systemic absorption"},{"key":"B","text":"They trap heat and moisture, worsening skin maceration"},{"key":"C","text":"They rapidly dissolve in skin exudate"},{"key":"D","text":"They cause severe contact dermatitis"}],"correct":"B","explanation":"Occlusive bases prevent sweat evaporation and exudate drainage, which can worsen weeping or macerated lesions.","reference":"Ointments & Semisolids"},{"id":"ointments_11","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"When incorporating a crystalline drug soluble in alcohol into an ointment base, which method is used to reduce particle size before mixing?","options":[{"key":"A","text":"Geometric dilution"},{"key":"B","text":"Pulverization by intervention"},{"key":"C","text":"Spatulation"},{"key":"D","text":"Fusion"}],"correct":"B","explanation":"Pulverization by intervention involves dissolving a solid in a volatile solvent (e.g., alcohol), spreading it, and letting the solvent evaporate to leave fine crystals.","reference":"Ointments & Semisolids"},{"id":"ointments_12","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"What is the primary function of parabens in water-containing cream or ointment preparations?","options":[{"key":"A","text":"Antioxidant protection"},{"key":"B","text":"Antimicrobial preservation"},{"key":"C","text":"Emulsification"},{"key":"D","text":"Chelation"}],"correct":"B","explanation":"Methylparaben and propylparaben are antimicrobial preservatives essential for inhibiting microbial growth in aqueous formulations.","reference":"Ointments & Semisolids"},{"id":"ointments_13","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which method of ointment preparation is mandatory when incorporating high-melting-point waxes into an ointment base?","options":[{"key":"A","text":"Incorporation by spatulation"},{"key":"B","text":"Fusion method"},{"key":"C","text":"Geometric dilution"},{"key":"D","text":"Trituration"}],"correct":"B","explanation":"The fusion method involves melting components with the highest melting points first, then cooling slowly while adding heat-labile ingredients.","reference":"Ointments & Semisolids"},{"id":"ointments_14","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A patient asks why their cold sore ointment contains 5% acyclovir in a PEG base rather than petrolatum. The main advantage of the PEG base here is:","options":[{"key":"A","text":"Prolonged retention at the site"},{"key":"B","text":"Enhanced water washability and rapid drug release"},{"key":"C","text":"Greater skin hydration"},{"key":"D","text":"Elimination of skin stinging"}],"correct":"B","explanation":"Water-soluble PEG bases release lipophilic drugs more readily and are cosmetically elegant for facial application.","reference":"Ointments & Semisolids"},{"id":"ointments_15","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Incorporating an aqueous drug solution into an oleaginous petrolatum base directly will result in:","options":[{"key":"A","text":"A clear gel"},{"key":"B","text":"Phase separation and failure to incorporate"},{"key":"C","text":"A stable O/W emulsion"},{"key":"D","text":"A solid paste"}],"correct":"B","explanation":"Hydrocarbon bases cannot absorb aqueous fluids directly. An emulsifier or absorption base must be incorporated first.","reference":"Ointments & Semisolids"},{"id":"ointments_16","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which term describes an ointment that contains a high percentage (e.g., 20--50%) of finely dispersed insoluble solids?","options":[{"key":"A","text":"Cream"},{"key":"B","text":"Paste"},{"key":"C","text":"Gel"},{"key":"D","text":"Magma"}],"correct":"B","explanation":"Pastes (e.g., Zinc Oxide Paste) contain high proportions of solid materials, making them stiffer, less greasy, and more absorbent than regular ointments.","reference":"Ointments & Semisolids"},{"id":"ointments_17","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which component in lanolin is most commonly associated with contact allergy or hypersensitivity reactions?","options":[{"key":"A","text":"Free fatty alcohols"},{"key":"B","text":"Petroleum hydrocarbons"},{"key":"C","text":"Glycerol trioleate"},{"key":"D","text":"Stearic acid"}],"correct":"A","explanation":"Lanolin alcohols are known skin sensitizers, making refined or lanolin-free bases preferable for patients with sensitive skin or eczema.","reference":"Ointments & Semisolids"},{"id":"ointments_18","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"What is the role of BHT (butylated hydroxytoluene) in an anhydrous ointment containing vegetable oils?","options":[{"key":"A","text":"Preservative against bacteria"},{"key":"B","text":"Antioxidant to prevent rancidity"},{"key":"C","text":"Surfactant for solubilization"},{"key":"D","text":"Humectant"}],"correct":"B","explanation":"BHT is a lipid-soluble antioxidant used to prevent autoxidation and rancidity of unsaturated fatty acids and oils.","reference":"Ointments & Semisolids"},{"id":"ointments_19","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"When preparing an ointment using the fusion method, in what order should the ingredients be melted?","options":[{"key":"A","text":"Lowest melting point to highest"},{"key":"B","text":"Highest melting point to lowest"},{"key":"C","text":"All together at maximum heat"},{"key":"D","text":"Solids first, liquids second regardless of melting point"}],"correct":"B","explanation":"Melting components in decreasing order of melting point prevents overheating ingredients with lower melting points.","reference":"Ointments & Semisolids"},{"id":"ointments_20","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"Zinc Oxide Ointment USP contains 20% zinc oxide. What compounding technique ensures even distribution when mixing this powder into white ointment?","options":[{"key":"A","text":"Sifting"},{"key":"B","text":"Geometric dilution"},{"key":"C","text":"Direct fusion"},{"key":"D","text":"Maceration"}],"correct":"B","explanation":"Geometric dilution ensures uniform distribution of a smaller quantity of powder into a larger mass of base by adding equal portions sequentially.","reference":"Ointments & Semisolids"},{"id":"capsules_21","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule size represents the SMALLEST capacity for human oral administration?","options":[{"key":"A","text":"000"},{"key":"B","text":"00"},{"key":"C","text":"0"},{"key":"D","text":"5"}],"correct":"D","explanation":"Capsule sizing works inversely: 000 is the largest human size (~1.37 mL) and 5 is the smallest (~0.13 mL).","reference":"Capsules"},{"id":"capsules_22","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Soft gelatin capsules require which functional additive to maintain shell flexibility and prevent brittleness?","options":[{"key":"A","text":"Titanium dioxide"},{"key":"B","text":"Glycerin or sorbitol"},{"key":"C","text":"Sodium lauryl sulfate"},{"key":"D","text":"Methylparaben"}],"correct":"B","explanation":"Plasticizers like glycerin, sorbitol, or propylene glycol are added to softgel formulations to keep the gelatin shell pliable.","reference":"Capsules"},{"id":"capsules_23","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which of the following pancreatic enzyme capsule formulations (e.g., Creon) can be opened and sprinkled on food, provided the food meets which condition?","options":[{"key":"A","text":"High-protein food like yogurt"},{"key":"B","text":"Soft acidic food with pH 4.5 or less, like applesauce"},{"key":"C","text":"Warm liquid like oatmeal"},{"key":"D","text":"High-fat food like milk"}],"correct":"B","explanation":"Pancrelipase (e.g., CREON) beads are enteric-coated to protect them until they reach the small intestine. Per current FDA labeling, capsule contents may be sprinkled on a small amount of soft acidic food with a pH of 4.5 or less (e.g., applesauce, bananas, plain Greek yogurt) and swallowed immediately without chewing or crushing.","reference":"Capsules"},{"id":"capsules_24","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"What ingredient is added to hard gelatin capsule shells to render them opaque and protect light-sensitive drugs?","options":[{"key":"A","text":"Titanium dioxide"},{"key":"B","text":"Magnesium stearate"},{"key":"C","text":"Lactose monohydrate"},{"key":"D","text":"Silicon dioxide"}],"correct":"A","explanation":"Titanium dioxide is an opacifier added during shell manufacturing to block light transmission.","reference":"Capsules"},{"id":"capsules_25","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which environmental condition is most critical when storing hard gelatin capsules to prevent softening/sticking or brittleness?","options":[{"key":"A","text":"Direct UV exposure"},{"key":"B","text":"Relative humidity between 30% and 50%"},{"key":"C","text":"Sub-zero freezing temperatures"},{"key":"D","text":"100% dry nitrogen atmosphere"}],"correct":"B","explanation":"Hard gelatin capsules contain 12-16% moisture. High humidity makes them soft and tacky; low humidity makes them brittle and prone to cracking.","reference":"Capsules"},{"id":"capsules_26","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Vyvanse (lisdexamfetamine) capsules are unique because their contents can be dissolved in water or orange juice due to which pharmacological property?","options":[{"key":"A","text":"It is a prodrug requiring enzymatic cleavage in RBCs"},{"key":"B","text":"It is an immediate-release tablet inside a shell"},{"key":"C","text":"It is enteric-coated at the molecular level"},{"key":"D","text":"It is formulated as an osmotic pump"}],"correct":"A","explanation":"Lisdexamfetamine is an inactive prodrug converted to dextroamphetamine by RBC enzymes; opening the capsule does not alter its extended-release profile.","reference":"Capsules"},{"id":"capsules_27","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which excipient is commonly added as a glidant to improve powder flow during automated capsule filling?","options":[{"key":"A","text":"Colloidal silicon dioxide"},{"key":"B","text":"Croscarmellose sodium"},{"key":"C","text":"Sodium starch glycolate"},{"key":"D","text":"Gelatin"}],"correct":"A","explanation":"Colloidal silicon dioxide reduces interparticle friction, acting as a glidant to ensure uniform capsule fill weight.","reference":"Capsules"},{"id":"capsules_28","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Softgel capsules are GENERALLY unsuitable for encapsulating which type of formulation fill?","options":[{"key":"A","text":"Lipophilic oils"},{"key":"B","text":"Water-miscible liquids with > 5% water"},{"key":"C","text":"Non-aqueous liquid suspensions"},{"key":"D","text":"PEG 400 solutions"}],"correct":"B","explanation":"High water content dissolves the gelatin shell of softgels. Liquids encapsulated in softgels must be non-aqueous or low-water formulations.","reference":"Capsules"},{"id":"capsules_29","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"What is the primary advantage of hypromellose (HPMC) hard capsules as an alternative to gelatin?","options":[{"key":"A","text":"They melt at body temperature faster than gelatin"},{"key":"B","text":"They are vegetable-derived and have lower moisture content (2-7%)"},{"key":"C","text":"They are naturally resistant to gastric acid"},{"key":"D","text":"They do not require any disintegrants"}],"correct":"B","explanation":"HPMC capsules are vegetarian alternatives with low moisture content, making them less prone to cross-linking and ideal for hygroscopic drugs.","reference":"Capsules"},{"id":"capsules_30","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Cross-linking in gelatin capsules, which leads to impaired dissolution, is primarily triggered by exposure to:","options":[{"key":"A","text":"Trace aldehydes or high heat and humidity"},{"key":"B","text":"Direct fluorescent light"},{"key":"C","text":"Lipids and fixed oils"},{"key":"D","text":"High concentrations of sodium chloride"}],"correct":"A","explanation":"Aldehydes (e.g., formaldehyde) cause covalent cross-linking of gelatin chains, creating a pellicle that prevents capsule dissolution.","reference":"Capsules"},{"id":"capsules_31","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"When a patient has a nasogastric (NG) tube, which type of extended-release capsule contents should generally NOT be crushed, since doing so may destroy the release mechanism and cause dose dumping?","options":[{"key":"A","text":"Uncoated immediate-release powder capsule"},{"key":"B","text":"Extended-release beads/pellets designed to remain intact"},{"key":"C","text":"Microencapsulated sprinkleable beads specifically labeled for opening"},{"key":"D","text":"Vegetarian HPMC immediate-release capsule"}],"correct":"B","explanation":"Crushing intact extended-release matrix beads/pellets destroys the release-controlling mechanism, causing the full dose to release at once (dose dumping) and risking toxicity. Whether a given ER capsule's contents may be opened and given whole (not crushed) via an NG tube depends on the specific product's labeling \u2014 some ER beads are explicitly approved for this, others are not \u2014 so product labeling should always be checked rather than assuming a blanket rule.","reference":"Capsules"},{"id":"capsules_32","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"The 'punch method' is a manual compounding technique used specifically for filling:","options":[{"key":"A","text":"Softgel capsules with liquids"},{"key":"B","text":"Hard gelatin capsules with powder mass"},{"key":"C","text":"Suppositories into molds"},{"key":"D","text":"Tablet triturates"}],"correct":"B","explanation":"In the punch method, the powder bed is compressed to a uniform depth and the body of the hard capsule is repeatedly pressed into the powder until filled.","reference":"Capsules"},{"id":"capsules_33","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Depakote Sprinkles (divalproex sodium) capsules are designed to be administered by:","options":[{"key":"A","text":"Chewing the intact capsule shell"},{"key":"B","text":"Opening and sprinkling intact granules onto a small amount of soft"},{"key":"C","text":"Dissolving completely in hot tea"},{"key":"D","text":"Crushing the contents to a fine powder before administration"}],"correct":"B","explanation":"Chewing the granules destroys the enteric coating, causing premature gastric release and mucosal irritation.","reference":"Capsules"},{"id":"capsules_34","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following capsule formulation excipients acts as a wetting agent to enhance dissolution of hydrophobic drugs?","options":[{"key":"A","text":"Sodium lauryl sulfate"},{"key":"B","text":"Stearic acid"},{"key":"C","text":"Microcrystalline cellulose"},{"key":"D","text":"Talc"}],"correct":"A","explanation":"Sodium lauryl sulfate is an anionic surfactant that lowers surface tension, improving water penetration and drug dissolution.","reference":"Capsules"},{"id":"capsules_35","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"What is the function of the locking mechanism (e.g., Coni-Snap) on modern hard gelatin capsules?","options":[{"key":"A","text":"Prevents premature dissolution in the stomach"},{"key":"B","text":"Ensures the cap and body remain securely closed during high-speed"},{"key":"C","text":"Prevents moisture entry completely"},{"key":"D","text":"Provides child-resistant closure for individual doses"}],"correct":"B","explanation":"Grooves and dimples on the cap and body lock together to prevent accidental separation during packaging and shipping.","reference":"Capsules"},{"id":"capsules_36","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which of the following drugs is formulated as an oral capsule containing a liquid solubilized in lipophilic surfactants to enhance absorption?","options":[{"key":"A","text":"Neoral (cyclosporine modified)"},{"key":"B","text":"Amoxicillin"},{"key":"C","text":"Gabapentin"},{"key":"D","text":"Celebrex"}],"correct":"A","explanation":"Neoral is a microemulsion pre-concentrate in a softgel capsule that self-emulsifies upon contact with GI fluids to improve bioavailability.","reference":"Capsules"},{"id":"capsules_37","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"If a compounded capsule formulation contains hygroscopic ingredients, which packaging is essential?","options":[{"key":"A","text":"Amber glass bottle with a tight seal and desiccant"},{"key":"B","text":"Paper box"},{"key":"C","text":"Clear plastic blister without foil seal"},{"key":"D","text":"Standard non-tight prescription vial"}],"correct":"A","explanation":"Hygroscopic powders absorb atmospheric moisture, leading to clumping or capsule shell degradation. Tight containers with desiccants prevent this.","reference":"Capsules"},{"id":"capsules_38","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"What is the primary advantage of enteric-coated capsules over standard gelatin capsules?","options":[{"key":"A","text":"Faster onset of action in the stomach"},{"key":"B","text":"Protection of acid-labile drugs from gastric destruction"},{"key":"C","text":"Reduced manufacturing cost"},{"key":"D","text":"Elimination of hepatic metabolism"}],"correct":"B","explanation":"Enteric coatings resist dissolution in the acidic stomach environment (pH ~1.2) but dissolve at higher intestinal pH (>5.5), protecting acid-labile drugs from gastric destruction and/or reducing gastric irritation from the drug.","reference":"Capsules"},{"id":"capsules_39","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which USP general chapter governs Uniformity of Dosage Units testing (weight variation and/or content uniformity) for hard capsules during quality control?","options":[{"key":"A","text":"USP <905>, Uniformity of Dosage Units"},{"key":"B","text":"USP <601>, Aerosols, Nasal Sprays, Metered-Dose Inhalers, and Dry Powder Inhalers"},{"key":"C","text":"USP <711>, Dissolution"},{"key":"D","text":"USP <1151>, Pharmaceutical Dosage Forms"}],"correct":"A","explanation":"USP <905>, Uniformity of Dosage Units, governs weight variation and content uniformity testing to ensure consistent drug content across dosage units. USP <601> instead covers inhalation/nasal delivery products and is not applicable to capsule weight/content uniformity. Which specific test (weight variation vs. content uniformity) applies depends on the dosage form and the proportion of active ingredient, per USP <905> criteria \u2014 not every capsule undergoes both tests in every situation.","reference":"Capsules"},{"id":"capsules_40","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Why should patients taking doxycycline hyclate capsules be instructed to drink a full glass of water and remain upright for at least 30 minutes?","options":[{"key":"A","text":"To prevent severe systemic hypotension"},{"key":"B","text":"To prevent esophageal ulceration from capsule retention"},{"key":"C","text":"To enhance renal elimination of the drug"},{"key":"D","text":"To prevent hepatic toxicity"}],"correct":"B","explanation":"Doxycycline can cause significant esophageal irritation and ulceration if the capsule remains lodged in the esophagus rather than passing fully into the stomach. Taking it with a full glass of water and remaining upright for at least 30 minutes reduces the risk of the capsule adhering to the esophageal wall.","reference":"Capsules"},{"id":"tablets_41","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Nitroglycerin sublingual tablets (Nitrostat) must be kept in their original glass container because the drug is highly prone to:","options":[{"key":"A","text":"Oxidative degradation by ambient nitrogen"},{"key":"B","text":"Volatilization and adsorption to plastic walls"},{"key":"C","text":"Rapid hydrolysis in dark environments"},{"key":"D","text":"Photodegradation from visible light"}],"correct":"B","explanation":"Nitroglycerin is a volatile liquid drug adsorbed onto tablet excipients; it can evaporate or adsorb into plastic containers, losing potency.","reference":"Tablets"},{"id":"tablets_42","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which tablet excipient category includes croscarmellose sodium, sodium starch glycolate, and crospovidone?","options":[{"key":"A","text":"Binders"},{"key":"B","text":"Superdisintegrants"},{"key":"C","text":"Glidants"},{"key":"D","text":"Lubricants"}],"correct":"B","explanation":"Superdisintegrants promote rapid tablet breakdown upon contact with GI fluids through rapid swelling or wicking.","reference":"Tablets"},{"id":"tablets_43","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What is the primary role of magnesium stearate in compressed tablet formulations?","options":[{"key":"A","text":"Binder to improve hardness"},{"key":"B","text":"Lubricant to reduce friction between tablet and die wall"},{"key":"C","text":"Diluent to increase weight"},{"key":"D","text":"Disintegrant to speed breakdown"}],"correct":"B","explanation":"Magnesium stearate acts as a boundary lubricant during ejection of the tablet from the die cavity.","reference":"Tablets"},{"id":"tablets_44","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Over-lubrication of a tablet formulation with excessive magnesium stearate can result in:","options":[{"key":"A","text":"Excessive tablet hardness and reduced dissolution rate"},{"key":"B","text":"Increased tablet friability"},{"key":"C","text":"Rapid disintegration"},{"key":"D","text":"Capping and lamination"}],"correct":"A","explanation":"Magnesium stearate is hydrophobic. Excess hydrophobic lubricant creates a barrier around particles, retarding water penetration and dissolution.","reference":"Tablets"},{"id":"tablets_45","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Tablet 'capping' refers to which manufacturing defect?","options":[{"key":"A","text":"Separation of the top or bottom crown from the main body of the"},{"key":"B","text":"Division of the tablet into multiple horizontal layers"},{"key":"C","text":"Adhesion of tablet material to the punch face"},{"key":"D","text":"Uneven distribution of color on the tablet surface"}],"correct":"A","explanation":"Capping is the partial or complete separation of the top or bottom crown from the main body, often caused by air entrapment.","reference":"Tablets"},{"id":"tablets_46","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Sublingual tablets bypass which physiological process to provide rapid systemic onset?","options":[{"key":"A","text":"Renal filtration"},{"key":"B","text":"First-pass hepatic metabolism"},{"key":"C","text":"Biliary excretion"},{"key":"D","text":"Systemic circulation"}],"correct":"B","explanation":"Sublingual absorption drains directly into the superior vena cava via oral mucosa blood vessels, avoiding first-pass metabolism.","reference":"Tablets"},{"id":"tablets_47","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which test measures a tablet's resistance to mechanical shock and abrasion during handling and shipping?","options":[{"key":"A","text":"Disintegration testing"},{"key":"B","text":"Dissolution testing"},{"key":"C","text":"Friability testing"},{"key":"D","text":"Hardness testing"}],"correct":"C","explanation":"Friability testing (using a Roche friabilator) evaluates the percentage of weight loss when tablets are subjected to tumbling shock. Acceptable limit is usually < 1%.","reference":"Tablets"},{"id":"tablets_48","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Effervescent tablets release carbon dioxide when placed in water due to the reaction between:","options":[{"key":"A","text":"Sodium bicarbonate and an organic acid (e.g., citric acid)"},{"key":"B","text":"Calcium carbonate and sodium chloride"},{"key":"C","text":"Magnesium oxide and water"},{"key":"D","text":"Sodium hydroxide and tartaric acid"}],"correct":"A","explanation":"The acid-base reaction between citric/tartaric acid and sodium bicarbonate produces CO2 gas, assisting rapid disintegration.","reference":"Tablets"},{"id":"tablets_49","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which coating type is applied to protect tablets from gastric acid, mask taste, or prevent stomach irritation?","options":[{"key":"A","text":"Sugar coating"},{"key":"B","text":"Film coating with HPMC"},{"key":"C","text":"Enteric coating with cellulose acetate phthalate"},{"key":"D","text":"Gelatin dip coating"}],"correct":"C","explanation":"Enteric polymers are insoluble in acidic media (stomach) but dissolve in alkaline/neutral media (small intestine).","reference":"Tablets"},{"id":"tablets_50","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What is the primary advantage of orally disintegrating tablets (ODTs) like Maxalt-MLT?","options":[{"key":"A","text":"Guaranteed 100% bioavailability for all drugs"},{"key":"B","text":"Convenience for patients with dysphagia without requiring water"},{"key":"C","text":"Complete protection against enzymatic degradation"},{"key":"D","text":"Zero risk of accidental swallowing"}],"correct":"B","explanation":"ODTs dissolve rapidly on the tongue without water, ideal for patients with swallowing difficulties, nausea, or motion sickness.","reference":"Tablets"},{"id":"tablets_51","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which functional component of a tablet matrix acts as a bulking agent when the active drug dose is very small (< 5 mg)?","options":[{"key":"A","text":"Diluent/Filler (e.g., lactose, microcrystalline cellulose)"},{"key":"B","text":"Disintegrant"},{"key":"C","text":"Glidant"},{"key":"D","text":"Anti-adherent"}],"correct":"A","explanation":"Diluents add bulk to low-dose drugs to create a practical, compressible tablet size.","reference":"Tablets"},{"id":"tablets_52","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Which tablet manufacturing technique is most suitable for moisture- and heat-sensitive drugs that possess good flow and compressibility?","options":[{"key":"A","text":"Direct compression"},{"key":"B","text":"Wet granulation"},{"key":"C","text":"Dry granulation (roller compaction)"},{"key":"D","text":"Fluid bed granulation"}],"correct":"A","explanation":"Direct compression eliminates exposure to moisture and heat (no liquid binders or drying steps required).","reference":"Tablets"},{"id":"tablets_53","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Mottling on a coated or compressed tablet refers to:","options":[{"key":"A","text":"Unbalanced distribution of color on the tablet surface"},{"key":"B","text":"Cracking of the film coat"},{"key":"C","text":"Sticking to the die wall"},{"key":"D","text":"Formation of pinholes in the coat"}],"correct":"A","explanation":"Mottling is an unequal or uneven distribution of color on a tablet, usually due to migration of water-soluble dyes during drying.","reference":"Tablets"},{"id":"tablets_54","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"The FDA Orange Book rating 'AB' assigned to a generic tablet product indicates:","options":[{"key":"A","text":"Therapeutic equivalence with demonstrated bioequivalence to the"},{"key":"B","text":"Incomplete bioequivalence data requiring further testing"},{"key":"C","text":"Topical application equivalence only"},{"key":"D","text":"Lack of pharmaceutical equivalence"}],"correct":"A","explanation":"' specifically indicates products meeting necessary bioequivalence requirements.","reference":"Tablets"},{"id":"tablets_55","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Why should patients taking orally disintegrating tablets (ODTs) packaged in foil blisters be counseled to peel back the foil rather than push the tablet through?","options":[{"key":"A","text":"Pushing through damages the foil seal on adjacent doses"},{"key":"B","text":"ODTs are friable/fragile and push-through force can crush them"},{"key":"C","text":"Contact with aluminum causes chemical oxidation"},{"key":"D","text":"The foil is toxic if ingested"}],"correct":"B","explanation":"ODTs manufactured by lyophilization are porous and fragile; pushing them through foil destroys the tablet structure.","reference":"Tablets"},{"id":"tablets_56","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which excipient functions primarily as a binder in wet granulation tablet formulations?","options":[{"key":"A","text":"Povidone (PVP)"},{"key":"B","text":"Talc"},{"key":"C","text":"Sodium lauryl sulfate"},{"key":"D","text":"Colloidal silicon dioxide"}],"correct":"A","explanation":"Povidone (polyvinylpyrrolidone), starch paste, and hydroxypropyl cellulose act as adhesive binders to form granules.","reference":"Tablets"},{"id":"tablets_57","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Buccal tablets are designed to be placed where in the oral cavity?","options":[{"key":"A","text":"Under the tongue"},{"key":"B","text":"Between the cheek and gum"},{"key":"C","text":"On top of the tongue"},{"key":"D","text":"In the posterior pharynx"}],"correct":"B","explanation":"Buccal tablets are placed between the cheek and upper/lower gum for slow, systemic mucosal absorption.","reference":"Tablets"},{"id":"tablets_58","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What happens if an enteric-coated tablet is crushed and administered via a gastrostomy tube?","options":[{"key":"A","text":"Drug absorption is delayed further"},{"key":"B","text":"The drug is destroyed by gastric acid or causes severe gastric"},{"key":"C","text":"The bioavailability increases 10-fold predictably"},{"key":"D","text":"The tube becomes lubricated and easier to flush"}],"correct":"B","explanation":"Destruction of the enteric coat exposes acid-sensitive drugs to stomach acid (inactivation) or causes mucosal irritation.","reference":"Tablets"},{"id":"tablets_59","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Microcrystalline cellulose (Avicel) is a widely used tablet excipient because it functions as both a:","options":[{"key":"A","text":"Dry binder and disintegrant"},{"key":"B","text":"Lubricant and glidant"},{"key":"C","text":"Opacifier and colorant"},{"key":"D","text":"Preservative and surfactant"}],"correct":"A","explanation":"Avicel is a versatile direct-compression binder with excellent compressibility and wicking-action disintegrant properties.","reference":"Tablets"},{"id":"tablets_60","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Which mechanism explains why chewable tablets (e.g., chewable calcium or antacids) do NOT require a disintegrant in their formulation?","options":[{"key":"A","text":"They dissolve instantly upon swallowing"},{"key":"B","text":"Mechanical mastication performs the disintegration process"},{"key":"C","text":"Saliva contains specific enzymes that break them down"},{"key":"D","text":"They contain effervescent agents that activate in the mouth"}],"correct":"B","explanation":"Chewable tablets are mechanically broken into smaller particles by mastication (chewing) before swallowing, so a conventional disintegrant is generally not required for the same purpose as in conventional swallowed tablets.","reference":"Tablets"},{"id":"powders_61","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"When two solid crystalline compounds like camphor and menthol liquefy upon mixing at room temperature, the result is termed a:","options":[{"key":"A","text":"Eutectic mixture"},{"key":"B","text":"Hygroscopic mixture"},{"key":"C","text":"Deliquescent mixture"},{"key":"D","text":"Effervescent mixture"}],"correct":"A","explanation":"Eutectic mixtures have a combined melting point lower than room temperature due to mutual depression of melting points.","reference":"Medicinal Powders"},{"id":"powders_62","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which compounding term describes absorbing moisture from the air to the point that the powder dissolves and becomes a liquid?","options":[{"key":"A","text":"Hygroscopic"},{"key":"B","text":"Deliquescent"},{"key":"C","text":"Efflorescent"},{"key":"D","text":"Eutectic"}],"correct":"B","explanation":"Deliquescent powders absorb enough atmospheric water to dissolve completely into solution (e.g., calcium chloride).","reference":"Medicinal Powders"},{"id":"powders_63","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Geometric dilution is a compounding technique used when blending:","options":[{"key":"A","text":"Two liquids of differing viscosities"},{"key":"B","text":"A small quantity of potent drug with a large quantity of diluent"},{"key":"C","text":"Volatile essential oils into water"},{"key":"D","text":"Two eutectic substances"}],"correct":"B","explanation":"Geometric dilution ensures uniform distribution of a small amount of potent drug by mixing it with equal portions of diluent step-by-step.","reference":"Medicinal Powders"},{"id":"powders_64","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Efflorescent powders are characterized by their tendency to:","options":[{"key":"A","text":"Absorb atmospheric water and turn into gel"},{"key":"B","text":"Release water of crystallization, turning the powder damp or pasty"},{"key":"C","text":"Liquefy when mixed with camphor"},{"key":"D","text":"Explode when subjected to friction"}],"correct":"B","explanation":"Efflorescent hydrates lose water of crystallization to dry atmosphere, turning the powder damp or sticky.","reference":"Medicinal Powders"},{"id":"powders_65","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Which mortar and pestle set is best suited for mixing liquids and non-abrasive materials, but is a poor choice for vigorous trituration (fine particle-size reduction) due to its smooth surface?","options":[{"key":"A","text":"Wedgwood mortar"},{"key":"B","text":"Porcelain mortar"},{"key":"C","text":"Glass mortar"},{"key":"D","text":"Brass mortar"}],"correct":"C","explanation":"Glass mortars have smooth, non-porous surfaces that are excellent for mixing liquids, dyes, and potent drugs without absorption or staining, but their lack of surface friction makes them a poor choice for vigorous trituration/particle-size reduction. Porcelain or Wedgwood-type mortars, with their rougher surfaces, are preferred when the goal is fine particle-size reduction of non-porous powders.","reference":"Medicinal Powders"},{"id":"powders_66","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"The process of reducing particle size using a small amount of liquid solvent in which the powder is insoluble is known as:","options":[{"key":"A","text":"Trituration"},{"key":"B","text":"Levigation"},{"key":"C","text":"Pulverization by intervention"},{"key":"D","text":"Sifting"}],"correct":"B","explanation":"Levigation uses a nonsolvent liquid (levigating agent) to paste and grind powder particles into finer sizes.","reference":"Medicinal Powders"},{"id":"powders_67","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A powdered drug that rapidly absorbs moisture from the atmosphere without necessarily liquefying is described as:","options":[{"key":"A","text":"Efflorescent"},{"key":"B","text":"Hygroscopic"},{"key":"C","text":"Aerosolized"},{"key":"D","text":"Anhydrous"}],"correct":"B","explanation":"Hygroscopic substances readily absorb atmospheric water vapor (e.g., sodium chloride, starch) without dissolving completely.","reference":"Medicinal Powders"},{"id":"powders_68","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"What is the primary purpose of adding inert absorbent powders like kaolin or light magnesium oxide when compounding eutectic mixtures?","options":[{"key":"A","text":"To increase the solubility of the eutectic components"},{"key":"B","text":"To absorb any formed liquid and keep the mixture a free-flowing"},{"key":"C","text":"To accelerate the melting process"},{"key":"D","text":"To preserve the mixture against microbial growth"}],"correct":"B","explanation":"Absorbents physically separate reactant particles and adsorb liquid formed, keeping the final product dry.","reference":"Medicinal Powders"},{"id":"powders_69","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Particle size reduction using Wedgewood mortars is achieved primarily through which mechanical force?","options":[{"key":"A","text":"Impact and attrition"},{"key":"B","text":"Shear force alone"},{"key":"C","text":"Thermal degradation"},{"key":"D","text":"Ultrasonic cavitation"}],"correct":"A","explanation":"Rough-surfaced Wedgewood mortars produce particle size reduction via attrition (friction) and impact against the walls.","reference":"Medicinal Powders"},{"id":"powders_70","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Oral antibiotic powder for suspension (e.g., Amoxicillin) requires reconstitution with water. According to standard practice, how should the water be added?","options":[{"key":"A","text":"All at once and shaken vigorously for 5 minutes"},{"key":"B","text":"In two portions: add half, shake thoroughly, then add the"},{"key":"C","text":"Boiling water added in small drops"},{"key":"D","text":"Mixed with alcohol first, then water"}],"correct":"B","explanation":"Adding water in two portions prevents caking at the bottle bottom and ensures uniform suspension volume.","reference":"Medicinal Powders"},{"id":"powders_71","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"What is the USP <795> recommended maximum Beyond-Use Date for reconstituted oral antibiotic suspensions stored under refrigeration unless otherwise specified in the package insert?","options":[{"key":"A","text":"7 days"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days"},{"key":"D","text":"60 days"}],"correct":"B","explanation":"Oral water-containing liquid suspensions (like reconstituted antibiotics) carry a default maximum BUD of 14 days refrigerated under USP <795>.","reference":"Medicinal Powders"},{"id":"powders_72","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Divided powders (chartulae or powder papers) are traditional dosage forms where individual doses are wrapped in paper. Which paper type is impermeable to moisture?","options":[{"key":"A","text":"Vegetable parchment paper"},{"key":"B","text":"Glassine paper"},{"key":"C","text":"Wax paper"},{"key":"D","text":"Bond paper"}],"correct":"C","explanation":"Wax paper is waterproof and moisture-resistant, essential for wrapping hygroscopic or deliquescent powders.","reference":"Medicinal Powders"},{"id":"powders_73","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"The term 'comminution' in pharmaceutical compounding refers to:","options":[{"key":"A","text":"Blending two powders together evenly"},{"key":"B","text":"Reducing the particle size of a solid material"},{"key":"C","text":"Drying a wet powder mass"},{"key":"D","text":"Dissolving a powder completely in solvent"}],"correct":"B","explanation":"Comminution encompasses all operations aimed at reducing particle size (trituration, levigation, pulverization).","reference":"Medicinal Powders"},{"id":"powders_74","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Dry powder inhalers (DPIs) rely on which force to aerosolize and deliver drug particles into the lower respiratory tract?","options":[{"key":"A","text":"Compressed hydrofluoroalkane (HFA) propellant"},{"key":"B","text":"Patient\\'s deep, rapid inspiratory flow"},{"key":"C","text":"Piezoelectric ultrasonic vibration"},{"key":"D","text":"Internal motorized fan"}],"correct":"B","explanation":"'s inhalation effort fluidizes and disperses the dry powder formulation.","reference":"Medicinal Powders"},{"id":"powders_75","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Pulverization by intervention is the preferred method for particle size reduction of which type of solid?","options":[{"key":"A","text":"Soft waxes"},{"key":"B","text":"Hard, gummy, or crystalline solids soluble in volatile solvents"},{"key":"C","text":"Insoluble inorganic minerals like zinc oxide"},{"key":"D","text":"Oily seeds"}],"correct":"B","explanation":"Pulverization by intervention uses a volatile liquid (e.g., alcohol for camphor) to dissolve the gummy solid, which then recrystallizes into fine particles upon solvent evaporation.","reference":"Medicinal Powders"},{"id":"powders_76","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Why is particle size uniformity critical in pharmaceutical bulk dusting powders?","options":[{"key":"A","text":"To ensure rapid systemic transdermal absorption"},{"key":"B","text":"To prevent skin irritation and ensure smooth application without"},{"key":"C","text":"To alter the pH of the stratum corneum"},{"key":"D","text":"To make the powder insoluble in all solvents"}],"correct":"B","explanation":"Uniform fine particle size prevents mechanical irritation on open or inflamed skin and ensures uniform spreading.","reference":"Medicinal Powders"},{"id":"powders_77","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which equipment is used to measure the powder flowability based on the angle of repose?","options":[{"key":"A","text":"Friabilator"},{"key":"B","text":"Funnel and flat surface measuring height and radius of powder cone"},{"key":"C","text":"Sieve shaker set"},{"key":"D","text":"Pycnometer"}],"correct":"B","explanation":"Angle of repose (tan theta = height/radius) assesses powder flowability. Angles < 30 deg indicate excellent flow; > 50 deg indicate poor flow.","reference":"Medicinal Powders"},{"id":"powders_78","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which sieve number represents the FINER mesh size (smaller opening)?","options":[{"key":"A","text":"Sieve No. 10"},{"key":"B","text":"Sieve No. 20"},{"key":"C","text":"Sieve No. 40"},{"key":"D","text":"Sieve No. 80"}],"correct":"D","explanation":"Sieve numbers indicate openings per linear inch. Higher sieve numbers mean smaller mesh openings and finer powders.","reference":"Medicinal Powders"},{"id":"powders_79","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"What is the main counseling point for patients reconstituting and administering Questran (cholestyramine) powder?","options":[{"key":"A","text":"Swallow dry powder directly from packet"},{"key":"B","text":"Mix thoroughly with water or liquid and never swallow in dry form"},{"key":"C","text":"Inhale the powder deeply for systemic effect"},{"key":"D","text":"Mix only with hot carbonated beverages"}],"correct":"B","explanation":"Bulk-producing resin powders like cholestyramine can swell and block the esophagus or airway if swallowed dry.","reference":"Medicinal Powders"},{"id":"powders_80","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Reconstitution of Augmentin (amoxicillin/clavulanate) powder for oral suspension must be stored under refrigeration primarily to prevent:","options":[{"key":"A","text":"Precipitation of amoxicillin"},{"key":"B","text":"Hydrolytic degradation of heat/water-sensitive clavulanate"},{"key":"C","text":"Evaporation of the liquid base"},{"key":"D","text":"Fungal fermentation of sucrose"}],"correct":"B","explanation":"'s potency.","reference":"Medicinal Powders"},{"id":"suppositories_81","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Cocoa Butter (Theobroma Oil) heated above 35 deg C transforms into an unstable polymorphic form (alpha form) which leads to:","options":[{"key":"A","text":"A suppository that fails to solidify at room temperature"},{"key":"B","text":"Rapid explosive decomposition of active drug"},{"key":"C","text":"A suppository that melts at 50 deg C"},{"key":"D","text":"Excessive expansion cracking the mold"}],"correct":"A","explanation":"Overheating cocoa butter causes it to solidify into metastable polymorphs with low melting points (20-24 deg C), failing to set at room temperature.","reference":"Suppositories"},{"id":"suppositories_82","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Which suppository base is water-soluble, melts by dissolving in mucosal fluids rather than body heat, and requires no mold lubrication?","options":[{"key":"A","text":"Cocoa butter"},{"key":"B","text":"Fattibase"},{"key":"C","text":"Polyethylene Glycol (PEG) blends"},{"key":"D","text":"Witepsol"}],"correct":"C","explanation":"PEG suppository bases dissolve in body fluids rather than melting at body temperature and do not adhere to metal molds.","reference":"Suppositories"},{"id":"suppositories_83","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Systemic drug absorption following rectal suppository placement in the LOWER rectal canal partially bypasses first-pass hepatic metabolism because drainage occurs via:","options":[{"key":"A","text":"Superior hemorrhoidal vein"},{"key":"B","text":"Middle and inferior hemorrhoidal veins"},{"key":"C","text":"Portal vein system"},{"key":"D","text":"Renal lymphatic capillaries"}],"correct":"B","explanation":"The lower and middle rectal veins drain directly into the inferior vena cava, bypassing the liver portal system.","reference":"Suppositories"},{"id":"suppositories_84","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Why must PEG suppositories be dipped in water briefly prior to insertion by the patient?","options":[{"key":"A","text":"To activate the drug microencapsulation"},{"key":"B","text":"To prevent mucosal stinging/irritation caused by osmotic draw of"},{"key":"C","text":"To lower the melting point below 37 deg C"},{"key":"D","text":"To wash away topical preservatives"}],"correct":"B","explanation":"Unmoistened PEG suppositories draw water from mucosal membranes osmotically, causing irritation or stinging.","reference":"Suppositories"},{"id":"suppositories_85","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"The displacement factor (DF) calculation in suppository compounding accounts for:","options":[{"key":"A","text":"The density difference between active drug powder and suppository"},{"key":"B","text":"The speed at which the base melts in rectal fluid"},{"key":"C","text":"The volumetric shrinkage upon cooling"},{"key":"D","text":"The rate of drug release into systemic circulation"}],"correct":"A","explanation":"Drugs occupy different volumes than bases due to density differences. Displacement factors ensure accurate base quantities when adding drug powder.","reference":"Suppositories"},{"id":"suppositories_86","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"When using cocoa butter as a suppository base, what mold lubricant is required?","options":[{"key":"A","text":"Mineral oil"},{"key":"B","text":"Glycerin or green soap tincture"},{"key":"C","text":"Cocoa butter liquid"},{"key":"D","text":"Anhydrous lanolin"}],"correct":"B","explanation":"Fatty bases (like cocoa butter) require a water-miscible/hydrophilic lubricant (such as glycerin) so the suppository releases cleanly from the mold.","reference":"Suppositories"},{"id":"suppositories_87","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Which suppository base type is most appropriate for delivering a hydrophobic/lipophilic drug when RAPID mucosal release is desired?","options":[{"key":"A","text":"Fatty/Oleaginous base (Cocoa butter)"},{"key":"B","text":"Water-soluble base (PEG blend)"},{"key":"C","text":"Pure hydrocarbon base"},{"key":"D","text":"Hydrogenated vegetable oil base"}],"correct":"B","explanation":"Lipophilic drugs partition out of water-soluble bases into aqueous rectal fluid much faster than out of fatty bases.","reference":"Suppositories"},{"id":"suppositories_88","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"According to USP <795>, what is the maximum Beyond-Use Date for a non-sterile compounded suppository containing a commercial tablet ingredient in a PEG base, assuming distant ingredient expiration?","options":[{"key":"A","text":"14 days refrigerated"},{"key":"B","text":"30 days"},{"key":"C","text":"90 days"},{"key":"D","text":"180 days"}],"correct":"D","explanation":"Anhydrous solid compounded formulations (like PEG suppositories) have a maximum 180-day BUD at controlled room temperature.","reference":"Suppositories"},{"id":"suppositories_89","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which suppository manufacturing method is used commercially for heat-labile drugs that cannot tolerate melting of the base?","options":[{"key":"A","text":"Compression molding / Cold compression"},{"key":"B","text":"Fusion / Pour molding"},{"key":"C","text":"Hand rolling and shaping"},{"key":"D","text":"Dip coating"}],"correct":"A","explanation":"Cold compression forces a mass of base and drug into molds without heat, protecting heat-sensitive drugs and preventing powder settling.","reference":"Suppositories"},{"id":"suppositories_90","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Glycerinated gelatin suppositories are most commonly used for which anatomical site and therapeutic indication?","options":[{"key":"A","text":"Rectal delivery of systemic opioids"},{"key":"B","text":"
