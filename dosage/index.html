ess.","reference":"Tablets"},{"id":"tablets_b4_18","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient is prescribed a buccal tablet. The pharmacist should instruct the patient to:","options":[{"key":"A","text":"Place the tablet between the gum and cheek and allow it to dissolve"},{"key":"B","text":"Swallow the tablet whole with water"},{"key":"C","text":"Chew the tablet thoroughly"},{"key":"D","text":"Place under the tongue"}],"correct":"A","explanation":"Buccal tablets are placed between the gum and cheek (buccal mucosa) for absorption through the oral mucosa, bypassing first-pass metabolism. Sublingual tablets go under the tongue.","reference":"Tablets"},{"id":"tablets_b4_19","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of orally disintegrating tablets (ODTs)?","options":[{"key":"A","text":"They must be taken with a full glass of water"},{"key":"B","text":"They dissolve rapidly in the mouth without water"},{"key":"C","text":"They are always enteric-coated"},{"key":"D","text":"They have a slower onset than conventional tablets"}],"correct":"B","explanation":"ODTs are designed to disintegrate or dissolve rapidly in the oral cavity (within seconds) without the need for water, making them ideal for pediatric, geriatric, and dysphagic patients.","reference":"Tablets"},{"id":"tablets_b4_20","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Which of the following tablet excipients is used to reduce the friction between the tablet surface and the die wall during ejection?","options":[{"key":"A","text":"Binder"},{"key":"B","text":"Disintegrant"},{"key":"C","text":"Diluent"},{"key":"D","text":"Lubricant"}],"correct":"D","explanation":"Lubricants (e.g., magnesium stearate, stearic acid) reduce friction between the tablet and die wall during ejection, preventing sticking and ensuring smooth tablet release. Glidants improve powder flow.","reference":"Tablets"},{"id":"tablets_b5_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which dosage form is generally the most convenient, economical, and physically stable for long-term outpatient administration?","options":[{"key":"A","text":"Intravenous infusion"},{"key":"B","text":"Tablet"},{"key":"C","text":"Sterile emulsion"},{"key":"D","text":"Implantable pellet"},{"key":"E","text":"Rectal enema"}],"correct":"B","explanation":"Tablets are compact, accurately dosed, chemically and physically stable, and inexpensive to manufacture and ship, which suits long-term outpatient therapy.","reference":"Tablets"},{"id":"tablets_b5_2","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Why are dosage forms used to deliver active pharmaceutical ingredients?","options":[{"key":"A","text":"To permit accurate dosing of potent drugs"},{"key":"B","text":"To improve chemical or physical stability"},{"key":"C","text":"To mask unpleasant taste or odor"},{"key":"D","text":"To modify drug-release or pharmacokinetic behavior"},{"key":"E","text":"All of the above"}],"correct":"E","explanation":"Dosage forms allow accurate dosing of potent drugs, improve stability, mask taste or odor, and can modify drug release, so all of the listed reasons apply.","reference":"Tablets"},{"id":"tablets_b5_3","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"An effervescent tablet is designed to be:","options":[{"key":"A","text":"Swallowed intact without water"},{"key":"B","text":"Chewed for buccal absorption"},{"key":"C","text":"Dissolved in water before oral administration"},{"key":"D","text":"Placed under the tongue for immediate action"},{"key":"E","text":"Inserted rectally"}],"correct":"C","explanation":"Effervescent tablets contain an acid and a carbonate/bicarbonate that react in water; the tablet is dissolved in water before drinking.","reference":"Tablets"},{"id":"tablets_b5_4","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What is the main function of a disintegrant in a tablet formulation?","options":[{"key":"A","text":"Reduce friction during compression and ejection"},{"key":"B","text":"Improve powder flow into dies"},{"key":"C","text":"Promote breakup of the tablet after contact with fluid"},{"key":"D","text":"Increase tablet sweetness"},{"key":"E","text":"Provide an enteric coating"}],"correct":"C","explanation":"Disintegrants promote tablet breakup into smaller particles after contact with fluid, aiding dissolution.","reference":"Tablets"},{"id":"tablets_b5_5","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient is instructed to dissolve a tablet in a glass of water before drinking it. This dosage form is a:","options":[{"key":"A","text":"Buccal tablet"},{"key":"B","text":"Sublingual tablet"},{"key":"C","text":"Effervescent tablet"},{"key":"D","text":"Enteric-coated tablet"},{"key":"E","text":"Extended-release tablet"}],"correct":"C","explanation":"A tablet dissolved in water before drinking is an effervescent tablet.","reference":"Tablets"},{"id":"tablets_b5_6","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which dosage form is most likely to provide a rapid onset while avoiding oral swallowing?","options":[{"key":"A","text":"Enteric-coated tablet"},{"key":"B","text":"Sublingual tablet"},{"key":"C","text":"Extended-release capsule"},{"key":"D","text":"Delayed-release granule"},{"key":"E","text":"Controlled-release transdermal patch"}],"correct":"B","explanation":"Sublingual tablets dissolve under the tongue for rapid absorption without swallowing.","reference":"Tablets"},{"id":"tablets_b5_7","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient with stable angina is prescribed nitroglycerin sublingual tablets for acute chest pain. Which instruction is most appropriate?","options":[{"key":"A","text":"Swallow the tablet with a full glass of water"},{"key":"B","text":"Place the tablet under the tongue and allow it to dissolve"},{"key":"C","text":"Chew the tablet to accelerate absorption"},{"key":"D","text":"Take the tablet with food to reduce gastric irritation"},{"key":"E","text":"Apply the tablet to intact skin on the upper arm"}],"correct":"B","explanation":"Sublingual administration enables rapid absorption through the oral mucosa and avoids GI transit and much of first-pass hepatic metabolism.","reference":"Tablets"},{"id":"tablets_b6_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient takes enteric-coated aspirin for gastrointestinal protection. Which instruction is most appropriate?","options":[{"key":"A","text":"Crush the tablet and mix with applesauce."},{"key":"B","text":"Chew the tablet thoroughly before swallowing."},{"key":"C","text":"Swallow the tablet whole with water."},{"key":"D","text":"Split the tablet if a lower dose is desired."},{"key":"E","text":"Dissolve the tablet in warm water before administration."}],"correct":"C","explanation":"Enteric-coated aspirin must be swallowed whole; crushing, chewing or splitting destroys the coating and defeats the GI protection.","reference":"Tablets"},{"id":"tablets_b6_2","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient receives ondansetron orally disintegrating tablets (ODTs). Which instruction is most appropriate?","options":[{"key":"A","text":"Swallow the tablet immediately with at least 240 mL of water."},{"key":"B","text":"Place the tablet on the tongue and allow it to disintegrate."},{"key":"C","text":"Crush the tablet and administer through an enteral tube."},{"key":"D","text":"Store tablets in a weekly pill organizer after removing them from their blister packaging."},{"key":"E","text":"Chew the tablet only after eating a meal."}],"correct":"B","explanation":"ODTs disintegrate on the tongue within seconds and need no water; they should not be crushed or split, and should be removed from the blister just before use.","reference":"Tablets"},{"id":"tablets_b6_3","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which administration route generally provides the most rapid systemic absorption for a medication formulated for treatment of acute angina?","options":[{"key":"A","text":"Oral immediate-release tablet"},{"key":"B","text":"Buccal tablet"},{"key":"C","text":"Sublingual tablet"},{"key":"D","text":"Enteric-coated tablet"},{"key":"E","text":"Rectal suppository"}],"correct":"C","explanation":"Sublingual tablets (e.g., nitroglycerin) absorb rapidly through the sublingual mucosa and bypass first-pass metabolism.","reference":"Tablets"},{"id":"tablets_b7_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A patient is prescribed an extended-release metformin tablet but has difficulty swallowing large tablets. Which recommendation is most appropriate?","options":[{"key":"A","text":"Crush the tablet and mix it with applesauce."},{"key":"B","text":"Chew the tablet thoroughly with meals."},{"key":"C","text":"Split the tablet into several pieces and take the pieces separately."},{"key":"D","text":"Swallow the tablet whole; contact the prescriber or pharmacist to discuss an alternative formulation if swallowing is difficult."},{"key":"E","text":"Dissolve the tablet in warm water before taking it."}],"correct":"D","explanation":"Extended-release tablets should generally not be crushed, chewed, or split unless the specific manufacturer labeling explicitly permits it. Altering the tablet can disrupt the modified-release mechanism, potentially causing rapid drug release, increased adverse effects, and reduced duration of therapeutic action.","reference":"Tablets"},{"id":"powders_b4_1","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which of the following is the smallest sieve size (largest mesh number) used in powder classification according to the USP?","options":[{"key":"A","text":"No. 120"},{"key":"B","text":"No. 40"},{"key":"C","text":"No. 60"},{"key":"D","text":"No. 80"}],"correct":"A","explanation":"Sieve numbers increase as particle size decreases. No. 120 is the finest sieve listed, corresponding to particles that pass through a 125-micron mesh. No. 20 corresponds to 850-micron particles.","reference":"Medicinal Powders"},{"id":"powders_b4_2","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A powder that passes through a No. 60 sieve and is retained on a No. 100 sieve is classified as:","options":[{"key":"A","text":"Coarse powder"},{"key":"B","text":"Moderately coarse powder"},{"key":"C","text":"Moderately fine powder"},{"key":"D","text":"Fine powder"}],"correct":"C","explanation":"According to USP powder fineness classification: moderately fine powder passes No. 60 and is retained on No. 100. Coarse passes No. 20/retained on No. 40. Fine passes No. 80/retained on No. 100. Very fine passes No. 100.","reference":"Medicinal Powders"},{"id":"powders_b4_3","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of powder dosage forms over liquid dosage forms?","options":[{"key":"A","text":"Faster onset of action after being taken"},{"key":"B","text":"Better stability and longer shelf life"},{"key":"C","text":"Easier to swallow for all patients"},{"key":"D","text":"More accurate dosing"}],"correct":"B","explanation":"Powders generally have better chemical and physical stability than aqueous solutions because they lack water, which can hydrolyze drugs or support microbial growth. Solutions may have faster onset.","reference":"Medicinal Powders"},{"id":"powders_b4_4","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"A bulk powder for internal use is best described as:","options":[{"key":"A","text":"A powder enclosed in a gelatin shell and taken by patient through mouth"},{"key":"B","text":"A powder packaged in individual sachets"},{"key":"C","text":"A powder applied topically to the skin"},{"key":"D","text":"A powder divided into individual doses by the patient using a measuring device"}],"correct":"D","explanation":"Bulk powders are supplied in bulk containers (bottles) and the patient measures out each dose using a scoop or measuring device. Divided powders are pre-measured into individual packets.","reference":"Medicinal Powders"},{"id":"powders_b4_5","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Which of the following is a disadvantage of powder dosage forms?","options":[{"key":"A","text":"Unpleasant taste of drugs is more apparent"},{"key":"B","text":"Dosing accuracy may be poor if not measured carefully"},{"key":"C","text":"Hygroscopic drugs may cake or degrade"},{"key":"D","text":"They are more expensive to manufacture than tablets"}],"correct":"A,B,C","explanation":"Powders expose the drug to taste buds, making unpleasant tastes more apparent. Dosing accuracy depends on patient technique. Hygroscopic powders can cake. Powders are generally inexpensive and stable.","reference":"Medicinal Powders"},{"id":"powders_b4_6","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"The process of reducing a powder to a fine state by grinding with a mortar and pestle is called:","options":[{"key":"A","text":"Levigation"},{"key":"B","text":"Trituration"},{"key":"C","text":"Pulverization"},{"key":"D","text":"Sifting"}],"correct":"B","explanation":"Trituration is the process of grinding a powder to a fine state using a mortar and pestle. Pulverization is a general term for size reduction. Levigation involves a liquid. Geometric dilution is a mixing technique.","reference":"Medicinal Powders"},{"id":"powders_b4_7","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is the most appropriate container for dispensing a hygroscopic powder?","options":[{"key":"A","text":"A clear glass bottle with a screw cap"},{"key":"B","text":"A wide-mouth plastic jar"},{"key":"C","text":"A tight, light-resistant container with a desiccant"},{"key":"D","text":"A paper envelope"}],"correct":"C","explanation":"Hygroscopic powders require protection from moisture. A tight, light-resistant container with a desiccant packet provides the best protection. Paper envelopes and open containers allow moisture ingress.","reference":"Medicinal Powders"},{"id":"powders_b4_8","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"A pharmacist needs to compound a powder containing 0.5 mg of digoxin in each 500 mg dose. Which technique should be used to ensure uniform distribution of the potent drug?","options":[{"key":"A","text":"Simple mixing"},{"key":"B","text":"Fusion method"},{"key":"C","text":"Geometric dilution"},{"key":"D","text":"Levigation"}],"correct":"C","explanation":"Geometric dilution is the technique of mixing a potent drug with an equal volume of diluent, then progressively adding more diluent in equal portions. This ensures uniform distribution of potent or toxic drugs.","reference":"Medicinal Powders"},{"id":"powders_b4_9","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which of the following powders is classified as a dusting powder?","options":[{"key":"A","text":"A powder for reconstitution into a solution"},{"key":"B","text":"A powder intended for external application to the skin"},{"key":"C","text":"A powder for inhalation"},{"key":"D","text":"A powder for internal use in bulk form"}],"correct":"B","explanation":"Dusting powders are intended for external application to the skin. They must be very fine (pass No. 100 sieve) and free from grittiness. Talc and starch are common bases.","reference":"Medicinal Powders"},{"id":"powders_b4_10","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is a requirement for powders used for inhalation?","options":[{"key":"A","text":"Particles must be larger than 100 microns"},{"key":"B","text":"Particles must be between 1 and 5 microns for optimal deposition in the lungs"},{"key":"C","text":"Particles must be soluble in water"},{"key":"D","text":"Particles must be coated with a sugar layer"}],"correct":"B","explanation":"For inhalation powders, particles between 1--5 microns deposit optimally in the bronchioles and alveoli. Particles >10 microns deposit in the oropharynx. Particles <0.5 microns are exhaled.","reference":"Medicinal Powders"},{"id":"powders_b4_11","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"A pharmacist is preparing a powder mixture containing camphor and menthol. Which technique is most appropriate for mixing these volatile substances?","options":[{"key":"A","text":"Trituration in a warm mortar"},{"key":"B","text":"Geometric dilution with lactose"},{"key":"C","text":"Mixing in a cold mortar to prevent volatilization"},{"key":"D","text":"Dissolving in alcohol first"}],"correct":"C","explanation":"Volatile substances like camphor and menthol should be mixed in a cold mortar to minimize volatilization and loss of active material. Warm mortars would increase loss.","reference":"Medicinal Powders"},{"id":"powders_b4_12","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is an example of an effervescent powder?","options":[{"key":"A","text":"A powder containing sodium bicarbonate and tartaric acid"},{"key":"B","text":"A powder containing only the active drug"},{"key":"C","text":"A powder containing a suspending agent"},{"key":"D","text":"A powder containing an enteric coating"}],"correct":"A","explanation":"Effervescent powders contain an acid (e.g., tartaric acid, citric acid) and a carbonate/bicarbonate (e.g., sodium bicarbonate) that react with water to produce carbon dioxide, aiding dissolution and palatability.","reference":"Medicinal Powders"},{"id":"powders_b4_13","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which of the following is true regarding the particle size of a powder and its dissolution rate?","options":[{"key":"A","text":"Larger particles dissolve faster due to greater surface area"},{"key":"B","text":"Only crystalline powders are affected by particle size"},{"key":"C","text":"Particle size has no effect on dissolution rate"},{"key":"D","text":"Smaller particles dissolve faster due to greater surface area"}],"correct":"D","explanation":"According to the Noyes-Whitney equation, smaller particles have a greater surface area-to-volume ratio, leading to faster dissolution. This is a fundamental principle of biopharmaceutics.","reference":"Medicinal Powders"},{"id":"powders_b4_14","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A patient is prescribed a bulk powder of potassium chloride. Which counseling point is most important?","options":[{"key":"A","text":"Take the powder dry without liquid"},{"key":"B","text":"Dissolve the measured dose in at least 4 ounces of water or juice and take with food"},{"key":"C","text":"Take the powder immediately before bedtime"},{"key":"D","text":"Mix the powder with hot water for faster dissolution"}],"correct":"B","explanation":"Potassium chloride bulk powder must be dissolved in sufficient liquid (\u22654 oz) and taken with food to prevent gastric irritation and ulceration. Taking dry or with insufficient liquid is dangerous.","reference":"Medicinal Powders"},{"id":"powders_b4_15","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following methods is used to determine the particle size distribution of a powder?","options":[{"key":"A","text":"Sieve analysis and microscopy"},{"key":"B","text":"UV spectrophotometry"},{"key":"C","text":"Titration"},{"key":"D","text":"Chromatography"}],"correct":"A","explanation":"Sieve analysis (for larger particles) and microscopy (for fine particles) are standard methods for determining particle size distribution. Other techniques include laser diffraction and sedimentation.","reference":"Medicinal Powders"},{"id":"powders_b4_16","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which of the following is a characteristic of a very fine powder according to USP?","options":[{"key":"A","text":"All particles pass through a No. 60 sieve"},{"key":"B","text":"All particles pass through a No. 80 sieve"},{"key":"C","text":"All particles pass through a No. 100 sieve"},{"key":"D","text":"Particles are between No. 40 and No. 60"}],"correct":"C","explanation":"A very fine powder is defined as one in which all particles pass through a No. 100 sieve. Fine powder passes No. 80 and is retained on No. 100. Moderately fine passes No. 60, retained on No. 100.","reference":"Medicinal Powders"},{"id":"powders_b4_17","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"A pharmacist needs to prepare 10 powders, each containing 300 mg of drug and 700 mg of lactose. What is the total weight of lactose required?","options":[{"key":"A","text":"3 g"},{"key":"B","text":"5 g"},{"key":"C","text":"7 g"},{"key":"D","text":"10 g"}],"correct":"C","explanation":"10 powders \u00d7 700 mg lactose/powder = 7,000 mg = 7 g. Total powder per packet = 1 g; total for 10 packets = 10 g, with 3 g drug and 7 g lactose.","reference":"Medicinal Powders"},{"id":"powders_b4_18","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is the best description of an insufflation powder?","options":[{"key":"A","text":"A powder for oral administration"},{"key":"B","text":"A powder for external application to wounds"},{"key":"C","text":"A fine powder blown into a body cavity such as the ear, nose, or throat"},{"key":"D","text":"A powder for reconstitution"}],"correct":"C","explanation":"Insufflation powders are very fine powders intended to be blown into body cavities (ear, nose, throat, vagina) using an insufflator. They must be extremely fine and sterile if used in surgical sites.","reference":"Medicinal Powders"},{"id":"powders_b4_19","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"hard","question":"Which of the following factors can affect the flow properties of a powder?","options":[{"key":"A","text":"Particle size and shape"},{"key":"B","text":"Moisture content"},{"key":"C","text":"Surface texture"},{"key":"D","text":"Electrostatic charge"}],"correct":"A,B,C,D","explanation":"All listed factors affect powder flow. Smaller, irregular, rough, moist, or electrostatically charged particles have poorer flow. Spherical, dry, smooth particles flow better.","reference":"Medicinal Powders"},{"id":"powders_b4_20","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A powder mixture containing iodine and potassium iodide is being prepared. The purpose of potassium iodide in this mixture is to:","options":[{"key":"A","text":"Act as a diluent"},{"key":"B","text":"Increase the solubility of iodine by forming a water-soluble complex"},{"key":"C","text":"Act as a disintegrant"},{"key":"D","text":"Improve the flow properties of the powder"}],"correct":"B","explanation":"Potassium iodide forms a water-soluble complex (KI\u2083) with iodine, increasing its aqueous solubility. This is the basis of Lugol 's solution and iodine powder formulations.","reference":"Medicinal Powders"},{"id":"powders_b5_1","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"A prescription requires dilution of 2.4 g of drug powder occupying 3.0 mL. Which lactose diluent would best match the bulk density of the drug to minimize segregation?","options":[{"key":"A","text":"0.20 g/mL"},{"key":"B","text":"0.40 g/mL"},{"key":"C","text":"0.80 g/mL"},{"key":"D","text":"1.60 g/mL"},{"key":"E","text":"2.40 g/mL"}],"correct":"C","explanation":"Bulk density of the drug = 2.4 g / 3.0 mL = 0.80 g/mL. Choosing a diluent with similar bulk density reduces segregation.","reference":"Medicinal Powders"},{"id":"powders_b5_2","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which is least directly related to the therapeutic performance of a medicated powder?","options":[{"key":"A","text":"Dissolution rate"},{"key":"B","text":"Absorption rate"},{"key":"C","text":"Oral bioavailability"},{"key":"D","text":"Drug solubility behavior"},{"key":"E","text":"Retail packaging cost"}],"correct":"E","explanation":"Dissolution, absorption, bioavailability and solubility affect therapeutic performance; retail packaging cost does not.","reference":"Medicinal Powders"},{"id":"powders_b5_3","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which technique cannot directly determine particle-size distribution?","options":[{"key":"A","text":"Optical microscopy"},{"key":"B","text":"Laser diffraction"},{"key":"C","text":"Sieve analysis"},{"key":"D","text":"Sedimentation analysis"},{"key":"E","text":"Analytical balance alone"}],"correct":"E","explanation":"Microscopy, laser diffraction, sieving and sedimentation can measure particle-size distribution; a balance alone cannot.","reference":"Medicinal Powders"},{"id":"powders_b5_4","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which issue is least central to routine extemporaneous powder compounding?","options":[{"key":"A","text":"Hygroscopicity"},{"key":"B","text":"Eutectic formation"},{"key":"C","text":"Efflorescence"},{"key":"D","text":"Explosive potential"},{"key":"E","text":"Tablet-film coating polymer selection"}],"correct":"E","explanation":"Hygroscopicity, eutectic formation, efflorescence and explosive potential matter in powder compounding; tablet film-coating polymers do not.","reference":"Medicinal Powders"},{"id":"powders_b5_5","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which parameter is least useful for characterizing a dry powder?","options":[{"key":"A","text":"Angle of repose"},{"key":"B","text":"Particle-size distribution"},{"key":"C","text":"Bulk density"},{"key":"D","text":"Porosity"},{"key":"E","text":"Viscosity of a liquid vehicle"}],"correct":"E","explanation":"Angle of repose, particle-size distribution, bulk density and porosity characterize a dry powder; viscosity applies to liquids.","reference":"Medicinal Powders"},{"id":"powders_b5_6","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A typical effervescent powder system contains:","options":[{"key":"A","text":"Sodium bicarbonate, citric acid, and tartaric acid"},{"key":"B","text":"Sodium chloride, citric acid, and stearic acid"},{"key":"C","text":"Sodium hydroxide, citric acid, and glycerin"},{"key":"D","text":"Calcium carbonate, hydrochloric acid, and lactose"},{"key":"E","text":"Sodium bicarbonate, mineral oil, and sucrose"}],"correct":"A","explanation":"Effervescent powders combine sodium bicarbonate with citric and/or tartaric acid, which react in water to release CO2.","reference":"Medicinal Powders"},{"id":"powders_b5_7","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which statement about pharmaceutical granules is incorrect?","options":[{"key":"A","text":"They are aggregates of smaller powder particles"},{"key":"B","text":"They may improve powder flow"},{"key":"C","text":"They can be filled into capsules"},{"key":"D","text":"They may be coated for modified release"},{"key":"E","text":"They are routinely administered to body cavities using insufflators"}],"correct":"E","explanation":"Granules are aggregates of powder particles used for flow, capsule filling or coating; they are not typically given by insufflators into body cavities.","reference":"Medicinal Powders"},{"id":"suppositories_b4_1","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which of the following is the most commonly used suppository base for rectal suppositories in the United States?","options":[{"key":"A","text":"Cocoa butter (theobroma oil)"},{"key":"B","text":"Glycerinated gelatin"},{"key":"C","text":"Polyethylene glycol (PEG)"},{"key":"D","text":"Hydrogenated vegetable oil"}],"correct":"A","explanation":"Cocoa butter (theobroma oil) is the traditional and most commonly used base for rectal suppositories. It melts at body temperature ( ~34\u00b0C) and is non-irritating. However, PEG and hydrogenated vegetable oil bases are also widely used.","reference":"Suppositories"},{"id":"suppositories_b4_2","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"A patient is prescribed a glycerin suppository for constipation. The mechanism of action of glycerin suppositories is primarily:","options":[{"key":"A","text":"Stimulation of peristalsis through chemical irritation"},{"key":"B","text":"Osmotic dehydration of rectal tissue and local irritation"},{"key":"C","text":"Lubrication of the fecal mass"},{"key":"D","text":"Softening of stool by emulsification"}],"correct":"B","explanation":"Glycerin suppositories work primarily by osmotic dehydration of rectal tissue and local irritation, which stimulates peristalsis and promotes evacuation. They also have some lubricating effect.","reference":"Suppositories"},{"id":"suppositories_b4_3","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is a disadvantage of cocoa butter as a suppository base?","options":[{"key":"A","text":"It is too hard at room temperature"},{"key":"B","text":"It is incompatible with many drugs"},{"key":"C","text":"It exhibits polymorphism and can become brittle if overheated"},{"key":"D","text":"It is water-soluble"}],"correct":"C","explanation":"Cocoa butter exhibits polymorphism --- when overheated during melting, it can form unstable crystal forms that result in a brittle, grainy, or soft suppository with altered melting characteristics. It must be melted gently.","reference":"Suppositories"},{"id":"suppositories_b4_4","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Which of the following suppository bases is water-soluble and does not melt at body temperature but rather dissolves in rectal fluid?","options":[{"key":"A","text":"Cocoa butter"},{"key":"B","text":"Hydrogenated vegetable oil"},{"key":"C","text":"Polyethylene glycol (PEG)"},{"key":"D","text":"Theobroma oil"}],"correct":"C","explanation":"PEG bases are water-soluble and dissolve in rectal fluids rather than melting. Cocoa butter, theobroma oil, hydrogenated vegetable oils, and Witepsol are fatty bases that melt at body temperature.","reference":"Suppositories"},{"id":"suppositories_b4_5","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"The ideal weight of an adult rectal suppository is approximately:","options":[{"key":"A","text":"2 g"},{"key":"B","text":"1 g"},{"key":"C","text":"3 g"},{"key":"D","text":"5 g"}],"correct":"A","explanation":"The standard weight of an adult rectal suppository is approximately 2 g. Infant rectal suppositories weigh about 1 g, and vaginal suppositories (pessaries) weigh about 3--5 g.","reference":"Suppositories"},{"id":"suppositories_b4_6","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"A pharmacist is preparing suppositories using the fusion method. Which of the following steps is correct?","options":[{"key":"A","text":"Heat the base to boiling to ensure sterility"},{"key":"B","text":"Add heat-sensitive drugs to the molten base while hot"},{"key":"C","text":"Pour the mixture into molds that have been chilled in the refrigerator"},{"key":"D","text":"Allow the suppositories to cool at room temperature before removing from molds"}],"correct":"C","explanation":"In the fusion method, molds are typically chilled (refrigerated or placed on ice) to promote rapid, uniform solidification. The base should not be overheated (especially cocoa butter). Heat-sensitive drugs are added after cooling.","reference":"Suppositories"},{"id":"suppositories_b4_7","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of Witepsol bases compared to cocoa butter?","options":[{"key":"A","text":"Witepsol bases exhibit polymorphism"},{"key":"B","text":"Witepsol bases have a narrower melting range"},{"key":"C","text":"Witepsol bases are more susceptible to rancidity"},{"key":"D","text":"Witepsol bases require careful temperature control during melting"}],"correct":"B","explanation":"Witepsol bases (hydrogenated vegetable oils) have a narrower, more stable melting range and do not exhibit polymorphism like cocoa butter. They are synthetic, more stable, and easier to work with.","reference":"Suppositories"},{"id":"suppositories_b4_8","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"A patient is using a progesterone vaginal suppository. Which counseling point is most appropriate?","options":[{"key":"A","text":"Insert the suppository while standing"},{"key":"B","text":"Refrigerate the suppository until immediately before use"},{"key":"C","text":"Take the suppository orally with food"},{"key":"D","text":"Insert the suppository deeply into the vagina while lying down"}],"correct":"D","explanation":"Vaginal suppositories should be inserted deeply into the vagina while the patient is lying down to prevent leakage and ensure retention. Standing or sitting positions promote expulsion.","reference":"Suppositories"},{"id":"suppositories_b4_9","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Which of the following factors can affect the rate of drug release from a suppository?","options":[{"key":"A","text":"Melting point of the base"},{"key":"B","text":"Viscosity of the molten base"},{"key":"C","text":"Drug particle size"},{"key":"D","text":"Presence of surfactants"}],"correct":"A,B,C,D","explanation":"All listed factors affect drug release. Lower melting points, lower viscosity, smaller drug particles, and surfactants (which increase wetting and spreading) all enhance drug release from suppository bases.","reference":"Suppositories"},{"id":"suppositories_b4_10","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"The displacement value (or displacement factor) of a drug in suppository formulation is used to:","options":[{"key":"A","text":"Determine the drug 's solubility in the base"},{"key":"B","text":"Calculate how much base is displaced by a given weight of drug"},{"key":"C","text":"Measure the melting point of the suppository"},{"key":"D","text":"Determine the hardness of the finished suppository"}],"correct":"B","explanation":"The displacement value indicates how much base is displaced by a given weight of drug. For example, a displacement value of 2 means 1 g of drug displaces 0.5 g of base. This is essential for accurate suppository formulation.","reference":"Suppositories"},{"id":"suppositories_b4_11","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of the rectal route of administration?","options":[{"key":"A","text":"Complete avoidance of first-pass metabolism"},{"key":"B","text":"Rapid absorption comparable to IV administration"},{"key":"C","text":"Useful when oral administration is not possible (vomiting, unconsciousness)"},{"key":"D","text":"Predictable and complete drug absorption"}],"correct":"C","explanation":"Rectal administration is useful when oral administration is contraindicated (vomiting, unconsciousness, seizures). However, absorption is variable, and some drugs still undergo partial hepatic first-pass metabolism via the rectal veins.","reference":"Suppositories"},{"id":"suppositories_b4_12","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"A pharmacist needs to prepare 12 rectal suppositories using a mold calibrated for cocoa butter (2 g each). The active drug has a displacement value of 1.5. If each suppository contains 300 mg of drug, how many grams of cocoa butter base are needed?","options":[{"key":"A","text":"21.6 g"},{"key":"B","text":"22.0 g"},{"key":"C","text":"23.4 g"},{"key":"D","text":"24.0 g"}],"correct":"A","explanation":"Total base without drug = 12 \u00d7 2 g = 24 g. Drug displaces base: 300 mg = 0.3 g; displacement value = 1.5, so 0.3 g drug displaces 0.3/1.5 = 0.2 g base per suppository. Total displacement = 12 \u00d7 0.2 = 2.4 g. Base needed = 24 -- 2.4 = 21.6 g.","reference":"Suppositories"},{"id":"suppositories_b4_13","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is a common use of glycerinated gelatin suppositories?","options":[{"key":"A","text":"Vaginal suppositories for local drug delivery"},{"key":"B","text":"Treatment of constipation in adults"},{"key":"C","text":"Rectal delivery of lipophilic drugs"},{"key":"D","text":"Pediatric rectal administration"}],"correct":"A","explanation":"Glycerinated gelatin is commonly used for vaginal suppositories (pessaries) because it dissolves slowly in body fluids, providing prolonged local action. It is not suitable for rectal use due to potential irritation and slow dissolution.","reference":"Suppositories"},{"id":"suppositories_b4_14","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following statements about rectal drug absorption is correct?","options":[{"key":"A","text":"All drugs absorbed rectally bypass hepatic first-pass metabolism completely"},{"key":"B","text":"Drugs absorbed from the lower rectum bypass the portal circulation to some extent"},{"key":"C","text":"Rectal absorption is faster than sublingual absorption for all drugs"},{"key":"D","text":"Rectal bioavailability is always greater than oral bioavailability"}],"correct":"B","explanation":"Drugs absorbed from the lower rectum (inferior hemorrhoidal veins) drain into the systemic circulation, partially bypassing the portal vein and first-pass metabolism. Upper rectal absorption still enters the portal circulation.","reference":"Suppositories"},{"id":"suppositories_b4_15","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is NOT an appropriate method for preparing suppositories?","options":[{"key":"A","text":"Fusion (melting and pouring) method"},{"key":"B","text":"Cold compression method"},{"key":"C","text":"Hand rolling and shaping"},{"key":"D","text":"Trituration method"}],"correct":"D","explanation":"Trituration is a powder-mixing technique, not a suppository preparation method. Suppositories are prepared by fusion (melting/pouring), cold compression, hand rolling, or molding.","reference":"Suppositories"},{"id":"suppositories_b4_16","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"A patient asks the pharmacist how long they should retain a bisacodyl rectal suppository for optimal effect. The best recommendation is:","options":[{"key":"A","text":"5 minutes"},{"key":"B","text":"1 hour"},{"key":"C","text":"4 hours"},{"key":"D","text":"15--30 minutes"}],"correct":"D","explanation":"Bisacodyl suppositories typically produce a bowel movement within 15--60 minutes. Patients should retain the suppository for at least 15--30 minutes to allow sufficient drug release and local irritation to stimulate peristalsis.","reference":"Suppositories"},{"id":"suppositories_b4_17","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which of the following bases would be most appropriate for a suppository containing a water-soluble drug?","options":[{"key":"A","text":"Cocoa butter"},{"key":"B","text":"Witepsol"},{"key":"C","text":"Hydrogenated vegetable oil"},{"key":"D","text":"Polyethylene glycol (PEG)"}],"correct":"D","explanation":"PEG bases are water-soluble and can accommodate water-soluble drugs better than fatty bases. Fatty bases (cocoa butter, Witepsol) are better suited for lipophilic drugs.","reference":"Suppositories"},{"id":"suppositories_b4_18","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is a potential side effect of rectal suppository use?","options":[{"key":"A","text":"Systemic hypertension"},{"key":"B","text":"Hyperglycemia"},{"key":"C","text":"Nephrotoxicity"},{"key":"D","text":"Local rectal irritation and mucosal damage with prolonged use"}],"correct":"D","explanation":"Prolonged or frequent use of rectal suppositories can cause local rectal irritation, mucosal damage, and dependence on laxative effect. Systemic side effects are uncommon with typical suppository use.","reference":"Suppositories"},{"id":"suppositories_b4_19","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"The process of preparing suppositories by mixing the base and drug at room temperature and compressing into molds is called:","options":[{"key":"A","text":"Fusion method"},{"key":"B","text":"Trituration method"},{"key":"C","text":"Cold compression method"},{"key":"D","text":"Levigation method"}],"correct":"C","explanation":"The cold compression method involves mixing the base and drug without heating and compressing the mixture into molds. The fusion method involves melting the base.","reference":"Suppositories"},{"id":"suppositories_b4_20","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is an important storage consideration for cocoa butter suppositories?","options":[{"key":"A","text":"Store in a refrigerator to prevent melting and rancidity"},{"key":"B","text":"Store in a warm place to maintain softness and weight"},{"key":"C","text":"Store in direct sunlight to prevent mold growth"},{"key":"D","text":"Store in an open container for ventilation"}],"correct":"A","explanation":"Cocoa butter suppositories should be stored in a cool place (refrigerator) to prevent melting and oxidative rancidity. Warm temperatures cause melting; light and humidity promote degradation.","reference":"Suppositories"},{"id":"suppositories_b5_1","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which is a practical limitation of rectal suppository administration?","options":[{"key":"A","text":"It can never produce systemic effects"},{"key":"B","text":"Drug absorption may be variable"},{"key":"C","text":"It completely avoids hepatic first-pass metabolism"},{"key":"D","text":"It always produces a more accurate dose than oral tablets"},{"key":"E","text":"It cannot be used in pediatric patients"}],"correct":"B","explanation":"Rectal absorption can be irregular and variable (and only partially bypasses first-pass metabolism), which limits its reliability.","reference":"Suppositories"},{"id":"suppositories_b5_2","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which action should be avoided when dispensing suppositories?","options":[{"key":"A","text":"Packaging individual cocoa-butter suppositories"},{"key":"B","text":"Storing cocoa-butter suppositories under cool conditions when appropriate"},{"key":"C","text":"Discarding products with abnormal odor"},{"key":"D","text":"Dispensing products with unexplained color changes"},{"key":"E","text":"Protecting hygroscopic PEG suppositories from excess moisture"}],"correct":"D","explanation":"Suppositories with unexplained color changes may be degraded or contaminated and should not be dispensed.","reference":"Suppositories"},{"id":"suppositories_b5_3","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"A rectal suppository containing acetaminophen is administered to reduce fever. This is best classified as:","options":[{"key":"A","text":"Enteral, systemic drug delivery"},{"key":"B","text":"Enteral, local drug delivery"},{"key":"C","text":"Parenteral, systemic drug delivery"},{"key":"D","text":"Parenteral, local drug delivery"},{"key":"E","text":"Transdermal, systemic drug delivery"}],"correct":"A","explanation":"A rectal suppository is given by the enteral route (GI tract); acetaminophen given to reduce fever acts systemically.","reference":"Suppositories"},{"id":"suppositories_b5_4","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"Prepare 10 cocoa-butter suppositories containing 300 mg drug each. A blank suppository weighs 2.0 g, and the displacement factor of the drug is 1.5. How many grams of cocoa butter are needed, excluding excess for mold calibration?","options":[{"key":"A","text":"16.0 g"},{"key":"B","text":"17.0 g"},{"key":"C","text":"18.0 g"},{"key":"D","text":"19.0 g"},{"key":"E","text":"20.0 g"}],"correct":"C","explanation":"Base displaced per suppository = 0.3 g / 1.5 = 0.2 g; base per suppository = 2.0 - 0.2 = 1.8 g; 1.8 x 10 = 18.0 g cocoa butter.","reference":"Suppositories"},{"id":"suppositories_b5_5","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A suppository mold holds 2.0 mL. The pure base has a density of 0.9 g/mL, and drug X has a density of 1.8 g/mL. Each of 12 suppositories contains 250 mg of drug X. How many grams of base are required, assuming no excess is needed?","options":[{"key":"A","text":"15.3 g"},{"key":"B","text":"18.0 g"},{"key":"C","text":"19.8 g"},{"key":"D","text":"20.1 g"},{"key":"E","text":"21.6 g"}],"correct":"D","explanation":"Blank capacity = 2.0 mL x 0.9 g/mL = 1.8 g. Drug volume = 0.25 g / 1.8 g/mL = 0.139 mL. Base per suppository = (2.0 - 0.139) mL x 0.9 = 1.675 g; x 12 = 20.1 g.","reference":"Suppositories"},{"id":"suppositories_b5_6","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which counseling point is most appropriate for a patient receiving a rectal suppository?","options":[{"key":"A","text":"Swallow the suppository with water."},{"key":"B","text":"Insert the suppository pointed end first beyond the anal sphincter."},{"key":"C","text":"Store all suppositories at room temperature regardless of base."},{"key":"D","text":"Crush the suppository before administration."},{"key":"E","text":"Use the suppository only for local effects."}],"correct":"B","explanation":"Proper insertion beyond the anal sphincter helps retain the dosage form. Storage depends on the base and labeling; cocoa-butter products may soften at elevated temperatures.","reference":"Suppositories"},{"id":"suppositories_b5_7","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"You are asked to compound 10 suppositories, each containing 300 mg of Drug A, using cocoa butter as the base1. Blank suppository weight is 2.0g, Density Factor of Drug A is 1.5. How many total grams of cocoa butter do you need?","options":[{"key":"A","text":"15.0g"},{"key":"B","text":"18.0 g."},{"key":"C","text":"20.0 g"},{"key":"D","text":"22.0 g"},{"key":"E","text":"23.5 g"}],"correct":"B","explanation":"Base displaced per suppository = 0.3 g / 1.5 = 0.2 g; base per suppository = 2.0 - 0.2 = 1.8 g; 1.8 x 10 = 18.0 g cocoa butter.","reference":"Suppositories"},{"id":"suppositories_b5_8","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"Prepare 20 suppositories, each containing 125 mg of drug A, using a PEG base. Each blank suppository prepared with the PEG base weighs 1.8 g. Drug A has a displacement value of 2.0 in the PEG base. Prepare 10% excess to allow for manufacturing loss. How many grams of PEG base are needed?","options":[{"key":"A","text":"32.63 g"},{"key":"B","text":"34.38 g"},{"key":"C","text":"36.00 g"},{"key":"D","text":"38.23 g"},{"key":"E","text":"39.60 g"}],"correct":"D","explanation":"Drug per suppository = 0.125 g, displacing 0.125/2.0 = 0.0625 g of base. Base per suppository = 1.8 - 0.0625 = 1.7375 g. For 20 suppositories = 34.75 g; adding 10% excess = 38.23 g.","reference":"Suppositories"},{"id":"suppositories_b5_9","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A pharmacist has 18.0 g of cocoa butter available. The mold capacity is 2.0 g per blank suppository. Each suppository is to contain 250 mg of drug E, with a displacement value of 1.25. Ignore loss during preparation. What is the maximum whole number of suppositories that can be prepared?","options":[{"key":"A","text":"8"},{"key":"B","text":"9"},{"key":"C","text":"10"},{"key":"D","text":"11"},{"key":"E","text":"12"}],"correct":"C","explanation":"Displaced base per suppository = 0.25 g / 1.25 = 0.2 g, so base per suppository = 2.0 - 0.2 = 1.8 g. 18.0 g / 1.8 g = 10 suppositories.","reference":"Suppositories"},{"id":"suppositories_b5_10","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"easy","question":"A suppository mold has a volume of 2.0 mL. The intended base has a density of 0.90 g/mL. What is the expected blank mold capacity using this base?","options":[{"key":"A","text":"0.90 g"},{"key":"B","text":"1.10 g"},{"key":"C","text":"1.80 g"},{"key":"D","text":"2.00 g"},{"key":"E","text":"2.22 g"}],"correct":"C","explanation":"Blank capacity = volume x density = 2.0 mL x 0.90 g/mL = 1.80 g.","reference":"Suppositories"},{"id":"suppositories_b5_11","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A 2.0-mL mold is used to prepare 12 suppositories, each containing 300 mg of drug F. The base density is 0.90 g/mL, and drug F density is 1.80 g/mL. Ignore excess. How many grams of base are needed?","options":[{"key":"A","text":"16.2 g"},{"key":"B","text":"17.4 g"},{"key":"C","text":"18.0 g"},{"key":"D","text":"19.8 g"},{"key":"E","text":"21.6 g"}],"correct":"D","explanation":"Drug volume per suppository = 0.3 g / 1.8 g/mL = 0.167 mL. Base volume = 2.0 - 0.167 = 1.833 mL = 1.65 g. 1.65 g x 12 = 19.8 g.","reference":"Suppositories"},{"id":"suppositories_b5_12","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"A pharmacist prepares 10 suppositories, each with a final target weight of 2.0 g, containing 100 mg of drug G per suppository. What is the approximate percentage strength, w/w, of drug G in the finished suppositories?","options":[{"key":"A","text":"2.5%"},{"key":"B","text":"5%"},{"key":"C","text":"10%"},{"key":"D","text":"20%"},{"key":"E","text":"50%"}],"correct":"B","explanation":"0.1 g / 2.0 g x 100 = 5% w/w.","reference":"Suppositories"},{"id":"suppositories_b6_1","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which dosage form is commonly designed to dissolve or disintegrate in the vagina to provide local antifungal therapy?","options":[{"key":"A","text":"Vaginal tablet or ovule"},{"key":"B","text":"Sublingual tablet"},{"key":"C","text":"Transdermal system"},{"key":"D","text":"Nasal spray"},{"key":"E","text":"Ophthalmic ointment"}],"correct":"A","explanation":"Vaginal tablets and ovules are inserts that dissolve in the vagina to deliver local antifungal therapy.","reference":"Suppositories"},{"id":"suppositories_b6_2","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"Prepare 12 suppositories, each containing 250 mg of drug X, using cocoa butter. A blank suppository prepared in the calibrated mold weighs 2.0 g. Drug X has a displacement value of 1.25, defined as grams of drug that displace 1 g of cocoa butter. Ignore excess. How many grams of cocoa butter are required?","options":[{"key":"A","text":"20.4 g"},{"key":"B","text":"21.0 g"},{"key":"C","text":"21.6 g"},{"key":"D","text":"22.8 g"},{"key":"E","text":"24.0 g"}],"correct":"C","explanation":"Displaced base per suppository = 0.25 g / 1.25 = 0.2 g; base per suppository = 2.0 - 0.2 = 1.8 g; 1.8 g x 12 = 21.6 g.","reference":"Suppositories"},{"id":"suppositories_b6_3","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which instruction is most appropriate for a patient using a rectal suppository?","options":[{"key":"A","text":"Swallow the suppository with water."},{"key":"B","text":"Insert the suppository beyond the anal sphincter."},{"key":"C","text":"Crush the suppository before insertion."},{"key":"D","text":"Store all suppositories at room temperature, regardless of base."},{"key":"E","text":"Use the suppository only for local effects."}],"correct":"B","explanation":"A rectal suppository is inserted beyond the anal sphincter; it must not be swallowed or crushed.","reference":"Suppositories"},{"id":"aqueous_solutions_b4_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is the primary solvent used in aqueous pharmaceutical solutions?","options":[{"key":"A","text":"Ethanol"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Water"},{"key":"D","text":"Glycerin"}],"correct":"C","explanation":"Water (purified water, water for injection) is the primary solvent for aqueous pharmaceutical solutions. It is nontoxic, nonflammable, and has excellent solvent properties for many drugs.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A pharmacist is preparing an oral solution. Which type of water should be used according to USP standards?","options":[{"key":"A","text":"Tap water"},{"key":"B","text":"Distilled water"},{"key":"C","text":"Purified water"},{"key":"D","text":"Water for injection"}],"correct":"C","explanation":"Purified water (USP) is the standard water quality for non-parenteral pharmaceutical preparations, including oral solutions. Water for injection is required for parenteral products. Tap water is not acceptable.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"hard","question":"Which of the following factors increases the solubility of a drug in an aqueous solution?","options":[{"key":"A","text":"Increasing temperature (for most solids)"},{"key":"B","text":"Adding a cosolvent (e.g., ethanol, propylene glycol)"},{"key":"C","text":"Adjusting pH to ionize the drug"},{"key":"D","text":"Decreasing particle size"}],"correct":"A,B,C","explanation":"Increasing temperature (A), adding a cosolvent (B), and adjusting pH to ionize the drug (C) all increase equilibrium solubility. Decreasing particle size (D) increases the DISSOLUTION RATE (per the Noyes-Whitney equation, via greater surface area) but does not change equilibrium solubility itself, which is a fixed thermodynamic property at a given temperature, pH, and solvent system.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a true solution?","options":[{"key":"A","text":"Milk"},{"key":"B","text":"Blood"},{"key":"C","text":"Simple syrup"},{"key":"D","text":"Calamine lotion"}],"correct":"C","explanation":"Simple syrup is a true solution where sucrose is completely dissolved in water at the molecular level, forming a homogeneous, clear mixture. Milk and blood are colloids; calamine lotion is a suspension.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"The concentration of a solution expressed as grams of solute per 100 mL of solution is defined as:","options":[{"key":"A","text":"Molarity"},{"key":"B","text":"Molality"},{"key":"C","text":"Percent weight/volume (% w/v)"},{"key":"D","text":"Percent weight/weight (% w/w)"}],"correct":"C","explanation":"Percent weight/volume (% w/v) is defined as grams of solute per 100 mL of solution. This is the most common concentration expression in pharmacy for liquid preparations.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A pharmacist needs to prepare 500 mL of a 0.9% sodium chloride solution. How many grams of sodium chloride are required?","options":[{"key":"A","text":"2.25 g"},{"key":"B","text":"4.5 g"},{"key":"C","text":"9.0 g"},{"key":"D","text":"0.45 g"}],"correct":"B","explanation":"0.9% w/v = 0.9 g/100 mL. For 500 mL: 0.9 g \u00d7 (500/100) = 0.9 \u00d7 5 = 4.5 g. This is isotonic saline (normal saline).","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following aqueous solutions is used as an antimicrobial preservative in ophthalmic preparations?","options":[{"key":"A","text":"Benzalkonium chloride"},{"key":"B","text":"Sodium chloride"},{"key":"C","text":"Dextrose"},{"key":"D","text":"Boric acid"}],"correct":"A","explanation":"Benzalkonium chloride is a cationic surfactant and antimicrobial preservative commonly used in ophthalmic solutions. Boric acid is a buffer and mild antimicrobial. Sodium chloride is for tonicity.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a disadvantage of aqueous solutions as a dosage form?","options":[{"key":"A","text":"Faster onset of action compared to solid dosage forms"},{"key":"B","text":"Ease of swallowing for pediatric and geriatric patients"},{"key":"C","text":"Susceptibility to microbial growth and hydrolysis"},{"key":"D","text":"Flexibility in dose adjustment"}],"correct":"C","explanation":"Aqueous solutions are susceptible to microbial contamination and chemical degradation (e.g., hydrolysis of ester bonds) due to the presence of water. This requires preservatives and stability testing.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_9","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"The process of adding a solute to a solvent until no more solute dissolves at a given temperature is called:","options":[{"key":"A","text":"Saturation"},{"key":"B","text":"Dilution"},{"key":"C","text":"Supersaturation"},{"key":"D","text":"Solvation"}],"correct":"A","explanation":"A saturated solution contains the maximum amount of solute that can dissolve at a given temperature. Supersaturation contains more than this amount (metastable). Solvation and dissolution are general processes.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_10","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is the best definition of an isotonic solution?","options":[{"key":"A","text":"A solution with the same pH as blood"},{"key":"B","text":"A solution with the same osmotic pressure as blood or tears"},{"key":"C","text":"A solution with the same density as water"},{"key":"D","text":"A solution that does not contain electrolytes"}],"correct":"B","explanation":"An isotonic solution has the same osmotic pressure as biological fluids (blood, tears, ~0.9% NaCl equivalent). This prevents tissue damage, pain, or cell lysis upon administration.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_11","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A pharmacist is preparing an ophthalmic solution. Which of the following is the most important consideration?","options":[{"key":"A","text":"The solution must be hypertonic to enhance drug penetration"},{"key":"B","text":"The solution should be acidic to prevent microbial growth"},{"key":"C","text":"The solution must be sterile and isotonic"},{"key":"D","text":"The solution should contain alcohol as a preservative"}],"correct":"C","explanation":"Ophthalmic solutions must be sterile and isotonic to prevent infection and ocular irritation. Hypertonic solutions cause pain and cell shrinkage. Alcohol is too irritating for the eye.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_12","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a common sweetening agent used in oral aqueous solutions?","options":[{"key":"A","text":"Sodium benzoate"},{"key":"B","text":"Methylparaben"},{"key":"C","text":"Citric acid"},{"key":"D","text":"Sucrose"}],"correct":"D","explanation":"Sucrose is the most common sweetening agent in oral solutions (e.g., simple syrup, flavored syrups). Sodium benzoate and methylparaben are preservatives. Citric acid is a flavoring/acidulant.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_13","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"The pH of a solution is defined as:","options":[{"key":"A","text":"The negative logarithm of the hydroxide ion concentration"},{"key":"B","text":"The negative logarithm of the hydrogen ion concentration"},{"key":"C","text":"The logarithm of the hydrogen ion concentration"},{"key":"D","text":"The sum of hydrogen and hydroxide ion concentrations"}],"correct":"B","explanation":"pH = -log H\u207a , where H\u207a is the hydrogen ion concentration. This is a fundamental definition in pharmaceutical calculations and physical pharmacy.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_14","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is a method to increase the stability of a drug prone to hydrolysis in aqueous solution?","options":[{"key":"A","text":"Increase the water content"},{"key":"B","text":"Adjust pH away from the drug 's optimal hydrolysis pH"},{"key":"C","text":"Store at elevated temperatures"},{"key":"D","text":"Add more solvent"}],"correct":"B","explanation":"Hydrolysis rates are pH-dependent. Adjusting pH away from the pH of maximum degradation (often acidic or basic) can significantly improve stability. Lower temperatures and reduced water content also help.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_15","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"hard","question":"A pharmacist needs to prepare 100 mL of a 10% dextrose solution from a 50% dextrose stock solution. How many mL of the stock solution are needed?","options":[{"key":"A","text":"10 mL"},{"key":"B","text":"20 mL"},{"key":"C","text":"25 mL"},{"key":"D","text":"50 mL"}],"correct":"B","explanation":"Using C1V1 = C2V2: (50%) \u00d7 V1 = (10%) \u00d7 100 mL. V1 = (10 \u00d7 100) / 50 = 20 mL. Dilute 20 mL of 50% dextrose to 100 mL final volume.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_16","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is an example of a cosolvent used in aqueous pharmaceutical solutions to enhance drug solubility?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Ethanol"},{"key":"C","text":"Boric acid"},{"key":"D","text":"Sodium phosphate"}],"correct":"B","explanation":"Ethanol is a common cosolvent used in aqueous solutions to increase the solubility of poorly water-soluble drugs by reducing the dielectric constant of the solvent mixture.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_17","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following statements about syrups is correct?","options":[{"key":"A","text":"Syrups contain less than 50% sugar"},{"key":"B","text":"Syrups are always preserved with alcohol"},{"key":"C","text":"Syrups are concentrated aqueous solutions of sugar with or without added medicinal substances"},{"key":"D","text":"Syrups cannot be used as vehicles for other drugs"}],"correct":"C","explanation":"Syrups are concentrated aqueous solutions of sugar (sucrose), typically 64--66% w/w sucrose, with or without medicinal substances. Their high sugar content provides preservation and palatability.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_18","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is the purpose of adding a buffer to an aqueous pharmaceutical solution?","options":[{"key":"A","text":"To increase the osmotic pressure"},{"key":"B","text":"To maintain a stable pH and prevent drug degradation"},{"key":"C","text":"To increase the viscosity of the solution"},{"key":"D","text":"To prevent microbial growth"}],"correct":"B","explanation":"Buffers resist pH changes, maintaining a stable pH that optimizes drug stability, solubility, and patient comfort. They do not primarily affect osmotic pressure, viscosity, or microbial growth.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_19","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A patient is prescribed potassium chloride oral solution 20 mEq/15 mL. The patient should be counseled to:","options":[{"key":"A","text":"Take the solution on an empty stomach for better absorption"},{"key":"B","text":"Dilute the dose in at least 4 ounces of water or juice and take with food"},{"key":"C","text":"Take the solution directly without dilution"},{"key":"D","text":"Take the solution immediately before bedtime"}],"correct":"B","explanation":"Potassium chloride oral solution is highly irritating to the gastric mucosa. It must be diluted in at least 4 oz of liquid and taken with food to prevent ulceration and GI distress.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b4_20","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following aqueous solutions is classified as an aromatic water?","options":[{"key":"A","text":"Simple syrup"},{"key":"B","text":"Peppermint water"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Dextrose 5% solution"}],"correct":"B","explanation":"Aromatic waters are saturated aqueous solutions of volatile oils (e.g., peppermint water, camphor water) used as flavoring agents and vehicles. They are prepared by distillation or solution methods.","reference":"Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is the most commonly used non-aqueous solvent in oral pharmaceutical solutions?","options":[{"key":"A","text":"Chloroform"},{"key":"B","text":"Ethanol"},{"key":"C","text":"Ether"},{"key":"D","text":"Acetone"}],"correct":"B","explanation":"Ethanol is the most commonly used non-aqueous solvent in oral pharmaceutical preparations due to its water miscibility, good solvent properties, and relative safety at low concentrations.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"A drug that is unstable in water due to hydrolysis would be best formulated as:","options":[{"key":"A","text":"An aqueous solution"},{"key":"B","text":"A non-aqueous solution"},{"key":"C","text":"An aqueous suspension"},{"key":"D","text":"An emulsion"}],"correct":"B","explanation":"","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following non-aqueous solvents is classified as a co-solvent when mixed with water?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Glycerin"},{"key":"C","text":"Sucrose"},{"key":"D","text":"Boric acid"}],"correct":"B","explanation":"Glycerin is a viscous, hygroscopic liquid that acts as a co-solvent when mixed with water, enhancing the solubility of poorly water-soluble drugs and providing humectant properties.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is a disadvantage of using ethanol as a solvent in pediatric oral solutions?","options":[{"key":"A","text":"It is incompatible with most drugs"},{"key":"B","text":"It can cause CNS depression and other toxic effects in children"},{"key":"C","text":"It has poor solvent properties for lipophilic drugs"},{"key":"D","text":"It is immiscible with water"}],"correct":"B","explanation":"Ethanol can cause CNS depression, hypoglycemia, and metabolic acidosis in children, especially at higher concentrations. Pediatric formulations should minimize or avoid ethanol content.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_5","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following non-aqueous solvents is commonly used as a vehicle for injectable solutions?","options":[{"key":"A","text":"Ethanol"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Glycerin"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Ethanol, propylene glycol, glycerin, and PEG 400 are all used as co-solvents in parenteral formulations to enhance drug solubility. However, they must be used within safe concentration limits.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_6","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Propylene glycol is preferred over ethanol in some pharmaceutical formulations because:","options":[{"key":"A","text":"It has better solvent properties for all drugs"},{"key":"B","text":"It is less volatile and has lower toxicity"},{"key":"C","text":"It is cheaper than ethanol"},{"key":"D","text":"It is immiscible with water"}],"correct":"B","explanation":"Propylene glycol is less volatile than ethanol and has a better safety profile, especially for pediatric and geriatric patients. It is miscible with water and has good solvent properties.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_7","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a non-aqueous oral solution?","options":[{"key":"A","text":"Simple syrup"},{"key":"B","text":"Aromatic elixir"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Dextrose 5% injection"}],"correct":"B","explanation":"Aromatic elixir contains alcohol (ethanol) as a significant component, making it a non-aqueous or hydroalcoholic solution. Simple syrup and saline are aqueous.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_8","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"hard","question":"A pharmacist is counseling a patient on a medication containing 10% alcohol. The patient is taking metronidazole. What is the most appropriate action?","options":[{"key":"A","text":"Dispense the medication without concern"},{"key":"B","text":"Counsel the patient to avoid alcohol-containing products due to disulfiram-like reaction"},{"key":"C","text":"Recommend taking with food to reduce alcohol absorption"},{"key":"D","text":"Suggest diluting the solution with water"}],"correct":"B","explanation":"Metronidazole causes a disulfiram-like reaction (flushing, nausea, vomiting, headache) when combined with alcohol. The pharmacist should counsel avoidance of alcohol-containing products and contact the prescriber for an alternative.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_9","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following non-aqueous solvents is used in topical solutions to enhance drug penetration through the skin?","options":[{"key":"A","text":"Water"},{"key":"B","text":"Ethanol"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Dextrose solution"}],"correct":"B","explanation":"Ethanol and other alcohols are used in topical solutions (e.g., tinctures, liniments) because they enhance drug penetration through the stratum corneum and evaporate quickly, leaving the drug on the skin.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_10","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of elixirs?","options":[{"key":"A","text":"They contain no alcohol"},{"key":"B","text":"They are hydroalcoholic solutions sweetened and flavored"},{"key":"C","text":"They are always isotonic"},{"key":"D","text":"They contain a high concentration of sugar"}],"correct":"B","explanation":"Elixirs are clear, hydroalcoholic, sweetened, flavored solutions containing a medicinal substance. They typically contain 5--40% alcohol and less sugar than syrups.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_11","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following solvents is classified as a fixed oil?","options":[{"key":"A","text":"Ethanol"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Peanut oil"},{"key":"D","text":"Glycerin"}],"correct":"C","explanation":"Fixed oils (e.g., peanut oil, sesame oil, corn oil) are non-volatile, non-aqueous lipophilic solvents used for oil-soluble drugs, particularly in parenteral and topical formulations.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_12","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A drug is poorly soluble in both water and ethanol. Which of the following solvent combinations might be most effective?","options":[{"key":"A","text":"Water and normal saline"},{"key":"B","text":"Ethanol and propylene glycol"},{"key":"C","text":"Water and glycerin"},{"key":"D","text":"Normal saline and dextrose"}],"correct":"B","explanation":"A combination of ethanol and propylene glycol (or other co-solvents) can provide synergistic solubility enhancement for drugs poorly soluble in either solvent alone, due to altered dielectric properties.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_13","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is a potential problem when using high concentrations of propylene glycol in parenteral formulations?","options":[{"key":"A","text":"Hyperglycemia"},{"key":"B","text":"Hyperosmolality and potential CNS depression"},{"key":"C","text":"Hypertension"},{"key":"D","text":"Respiratory alkalosis"}],"correct":"B","explanation":"High concentrations of propylene glycol in parenteral formulations can cause hyperosmolality, CNS depression, hyperosmolar lactic acidosis, and renal dysfunction, especially in neonates and patients with renal impairment.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_14","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a tincture?","options":[{"key":"A","text":"Aqueous solution of potassium chloride"},{"key":"B","text":"Hydroalcoholic solution of a drug or chemical"},{"key":"C","text":"Oily solution of vitamin E"},{"key":"D","text":"Aqueous suspension of calamine"}],"correct":"B","explanation":"Tinctures are hydroalcoholic solutions prepared by extraction (maceration or percolation) of drugs or chemicals. They typically contain 25--90% ethanol depending on the drug 's solubility.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b4_15","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following non-aqueous solvents is used in ophthalmic solutions primarily as a viscosity agent?","options":[{"key":"A","text":"Ethanol"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Polyvinyl alcohol"},{"key":"D","text":"Glycerin"}],"correct":"D","explanation":"Glycerin is used in ophthalmic solutions as a viscosity agent and humectant, increasing residence","reference":"Non-Aqueous Solutions"},{"id":"colloids_b4_1","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the typical particle size range for a pharmaceutical colloid?","options":[{"key":"A","text":"< 1 nm"},{"key":"B","text":"1 nm -- 1000 nm"},{"key":"C","text":"1 \u00b5m -- 100 \u00b5m"},{"key":"D","text":"> 100 \u00b5m"}],"correct":"B","explanation":"Colloidal dispersions contain particles ranging from approximately 1 nm to 1000 nm (1 \u00b5m). Particles smaller than 1 nm form true solutions, while particles larger than 1000 nm fall into the coarse dispersion category (suspensions).","reference":"Colloids"},{"id":"colloids_b4_2","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which property distinguishes a colloidal dispersion from a true solution?","options":[{"key":"A","text":"Colloids are always colored"},{"key":"B","text":"Colloids cannot pass through a semipermeable membrane"},{"key":"C","text":"Colloids have lower osmotic pressure"},{"key":"D","text":"Colloids are always electrically neutral"}],"correct":"B","explanation":"Colloidal particles are large enough to be retained by semipermeable membranes (dialysis/ultrafiltration), whereas true solutions pass through freely. This is a fundamental distinguishing feature.","reference":"Colloids"},{"id":"colloids_b4_3","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The Tyndall effect observed in colloids is due to:","options":[{"key":"A","text":"Brownian motion"},{"key":"B","text":"Scattering of light by colloidal particles"},{"key":"C","text":"Electrical charge on particles"},{"key":"D","text":"Gravitational settling"}],"correct":"B","explanation":"The Tyndall effect is the scattering of light by colloidal particles that are comparable in size to the wavelength of light. True solutions do not exhibit this effect because their particles are too small to scatter light.","reference":"Colloids"},{"id":"colloids_b4_4","topicId":"colloids","topicName":"Colloids","type":"mcq","difficul
