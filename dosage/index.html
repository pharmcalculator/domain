ty":"easy","question":"Brownian motion in colloids is caused by:","options":[{"key":"A","text":"Gravitational forces"},{"key":"B","text":"Unequal bombardment by solvent molecules"},{"key":"C","text":"Electrostatic repulsion"},{"key":"D","text":"Viscous drag"}],"correct":"B","explanation":"Brownian motion is the random, zigzag movement of colloidal particles resulting from unbalanced collisions with molecules of the dispersion medium. It helps counteract sedimentation.","reference":"Colloids"},{"id":"colloids_b4_5","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"A lyophilic colloid is BEST characterized by:","options":[{"key":"A","text":"Strong affinity between dispersed phase and dispersion medium"},{"key":"B","text":"Requirement of electrolytes for stability"},{"key":"C","text":"Irreversible nature upon coagulation"},{"key":"D","text":"Minimal hydration of particles"}],"correct":"A","explanation":"Lyophilic (solvent-loving) colloids have a strong affinity for the dispersion medium, are self-stabilizing, readily solvated, and reversible upon coagulation. Examples include acacia, tragacanth, and proteins.","reference":"Colloids"},{"id":"colloids_b4_6","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a lyophobic colloid?","options":[{"key":"A","text":"Gelatin in water"},{"key":"B","text":"Starch in water"},{"key":"C","text":"Gold sol (gold in water)"},{"key":"D","text":"Methylcellulose in water"}],"correct":"C","explanation":"Lyophobic (solvent-fearing) colloids have little affinity for the dispersion medium and require stabilizing agents. Gold sol is a classic example; it is not spontaneously dispersible and is irreversible upon coagulation.","reference":"Colloids"},{"id":"colloids_b4_7","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The zeta potential of a colloidal particle represents:","options":[{"key":"A","text":"The total surface charge"},{"key":"B","text":"The potential at the slipping plane between the fixed and mobile layers of counterions"},{"key":"C","text":"The osmotic pressure of the colloid"},{"key":"D","text":"The particle size distribution"}],"correct":"B","explanation":"Zeta potential is the electrokinetic potential at the shear plane (slipping plane) between the Stern layer and the diffuse layer. It determines the stability of colloidal dispersions; higher magnitude means greater repulsion and stability.","reference":"Colloids"},{"id":"colloids_b4_8","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"According to DLVO theory, colloidal stability depends on the balance between:","options":[{"key":"A","text":"Gravitational force and buoyant force"},{"key":"B","text":"Attractive van der Waals forces and repulsive electrostatic forces"},{"key":"C","text":"Osmotic pressure and hydrostatic pressure"},{"key":"D","text":"Viscous force and inertial force"}],"correct":"B","explanation":"DLVO theory (Derjaguin-Landau-Verwey-Overbeek) explains colloidal stability as a balance between long-range attractive van der Waals forces and short-range repulsive electrostatic forces between particles.","reference":"Colloids"},{"id":"colloids_b4_9","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"The addition of a small amount of gelatin to a gold sol prevents its coagulation by electrolytes. This phenomenon is called:","options":[{"key":"A","text":"Peptization"},{"key":"B","text":"Protection"},{"key":"C","text":"Dialysis"},{"key":"D","text":"Electrophoresis"}],"correct":"B","explanation":"The protective action occurs when a lyophilic colloid (gelatin) coats lyophobic particles (gold), preventing coagulation. This is the basis of the gold number, which measures protective power.","reference":"Colloids"},{"id":"colloids_b4_10","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The \"gold number \" is defined as:","options":[{"key":"A","text":"The weight of gold in milligrams protected by 1 mL of colloid"},{"key":"B","text":"The minimum milligrams of protective colloid to prevent coagulation of 10 mL gold sol by 1 mL of 10% NaCl"},{"key":"C","text":"The concentration of gold required to form a colloid"},{"key":"D","text":"The zeta potential of gold nanoparticles"}],"correct":"B","explanation":"The gold number (introduced by Zsigmondy) is the minimum milligrams of a hydrophilic colloid to prevent coagulation of 10 mL of gold sol by 1 mL of 10% sodium chloride solution. Lower gold number = greater protective power.","reference":"Colloids"},{"id":"colloids_b4_11","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following has the LOWEST gold number (greatest protective power)?","options":[{"key":"A","text":"Gelatin"},{"key":"B","text":"Casein"},{"key":"C","text":"Albumin"},{"key":"D","text":"Starch"}],"correct":"A","explanation":"Gelatin has a very low gold number (approximately 0.005--0.01), indicating extremely high protective power. Starch has a much higher gold number ( ~25), meaning it is a poor protective colloid.","reference":"Colloids"},{"id":"colloids_b4_12","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Electrophoresis refers to:","options":[{"key":"A","text":"Movement of solvent molecules under an electric field"},{"key":"B","text":"Movement of colloidal particles under an electric field"},{"key":"C","text":"Movement of ions through a semipermeable membrane"},{"key":"D","text":"Sedimentation of particles under gravity"}],"correct":"B","explanation":"Electrophoresis is the movement of charged colloidal particles toward the oppositely charged electrode in an electric field. It is used to characterize the surface charge and zeta potential of colloids.","reference":"Colloids"},{"id":"colloids_b4_13","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The isoelectric point of a protein colloid is the pH at which:","options":[{"key":"A","text":"The protein has maximum solubility"},{"key":"B","text":"The protein carries no net electrical charge"},{"key":"C","text":"The protein is most hydrated"},{"key":"D","text":"The colloid is most stable"}],"correct":"B","explanation":"At the isoelectric point, the protein has zero net charge, meaning equal numbers of positive and negative charges. Solubility and stability are typically at their minimum at this pH due to lack of electrostatic repulsion.","reference":"Colloids"},{"id":"colloids_b4_14","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Coagulation of a lyophobic colloid can be caused by:","options":[{"key":"A","text":"Adding more dispersion medium"},{"key":"B","text":"Adding electrolytes"},{"key":"C","text":"Diluting the colloid"},{"key":"D","text":"Increasing the temperature slightly"}],"correct":"B","explanation":"Electrolytes compress the electrical double layer, reducing zeta potential and allowing attractive van der Waals forces to dominate, leading to coagulation. This is described by the Schulze-Hardy rule.","reference":"Colloids"},{"id":"colloids_b4_15","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"According to the Schulze-Hardy rule, the coagulating power of an ion depends primarily on:","options":[{"key":"A","text":"Its concentration only"},{"key":"B","text":"Its charge (valence) and sign opposite to the colloid"},{"key":"C","text":"The pH of the dispersion medium"},{"key":"D","text":"The viscosity of the medium"}],"correct":"B","explanation":"The Schulze-Hardy rule states that the ion with the charge opposite to that of the colloidal particle is effective in causing coagulation, and its effectiveness increases dramatically with charge (valence).","reference":"Colloids"},{"id":"colloids_b4_16","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"A colloidal dispersion of silver proteins used as an anti-infective is an example of:","options":[{"key":"A","text":"A true solution"},{"key":"B","text":"A colloidal suspension"},{"key":"C","text":"An emulsion"},{"key":"D","text":"A foam"}],"correct":"B","explanation":"Mild silver protein and strong silver protein are colloidal preparations where silver is combined with protein to form stable colloidal silver, used topically as anti-infectives.","reference":"Colloids"},{"id":"colloids_b4_17","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Micelles are classified as which type of colloidal system?","options":[{"key":"A","text":"Molecular colloids"},{"key":"B","text":"Association colloids"},{"key":"C","text":"Multimolecular colloids"},{"key":"D","text":"Mechanical colloids"}],"correct":"B","explanation":"Association colloids (micelles) form when amphiphilic molecules aggregate above the critical micelle concentration (CMC). They are thermodynamically stable and reversibly formed.","reference":"Colloids"},{"id":"colloids_b4_18","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The critical micelle concentration (CMC) is best defined as:","options":[{"key":"A","text":"The temperature at which micelles precipitate"},{"key":"B","text":"The concentration above which surfactant molecules aggregate into micelles"},{"key":"C","text":"The concentration at which all surfactant molecules are in micellar form"},{"key":"D","text":"The pH at which micelle formation is optimal"}],"correct":"B","explanation":"CMC is the concentration above which surfactant monomers self-assemble into micelles. Below CMC, surfactant exists primarily as monomers; above CMC, additional surfactant forms micelles.","reference":"Colloids"},{"id":"colloids_b4_19","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Which technique is used to separate low molecular weight electrolytes from a colloidal dispersion?","options":[{"key":"A","text":"Centrifugation"},{"key":"B","text":"Dialysis"},{"key":"C","text":"Distillation"},{"key":"D","text":"Filtration through Whatman paper"}],"correct":"B","explanation":"Dialysis uses a semipermeable membrane to separate small molecules/ions (crystalloids) from larger colloidal particles. It is used to purify colloids and in artificial kidney machines.","reference":"Colloids"},{"id":"colloids_b4_20","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"hard","question":"Ultrafiltration differs from ordinary filtration in that it:","options":[{"key":"A","text":"Uses higher temperatures"},{"key":"B","text":"Uses membranes with much smaller pore sizes to retain colloidal particles"},{"key":"C","text":"Requires vacuum pressure only"},{"key":"D","text":"Cannot separate proteins from salts"}],"correct":"B","explanation":"Ultrafiltration uses membranes with pore sizes small enough to retain colloidal particles and macromolecules while allowing solvent and small solutes to pass. It operates under pressure.","reference":"Colloids"},{"id":"colloids_b4_21","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"In a colloidal gold preparation used for diagnostic imaging, stability is primarily achieved by:","options":[{"key":"A","text":"High viscosity of the medium"},{"key":"B","text":"Electrostatic repulsion between particles"},{"key":"C","text":"High osmotic pressure"},{"key":"D","text":"Low particle density"}],"correct":"B","explanation":"Colloidal gold nanoparticles are stabilized primarily by electrostatic repulsion (zeta potential) and sometimes steric hindrance from surface coatings. Without this repulsion, they would aggregate.","reference":"Colloids"},{"id":"colloids_b4_22","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"The phenomenon where a gel transforms into a sol upon shaking and reverts to a gel upon standing is called:","options":[{"key":"A","text":"Syneresis"},{"key":"B","text":"Thixotropy"},{"key":"C","text":"Peptization"},{"key":"D","text":"Imbibition"}],"correct":"B","explanation":"Thixotropy is a reversible, time-dependent shear-thinning property where a gel liquefies upon agitation and re-gels upon standing. It is important in pharmaceutical semisolids.","reference":"Colloids"},{"id":"colloids_b4_23","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Peptization is best described as:","options":[{"key":"A","text":"Coagulation of a colloid by electrolytes"},{"key":"B","text":"Conversion of a precipitate into a colloidal sol by adding a peptizing agent"},{"key":"C","text":"Separation of colloids by electrophoresis"},{"key":"D","text":"Precipitation of proteins at the isoelectric point"}],"correct":"B","explanation":"Peptization is the process of converting a freshly prepared precipitate into a colloidal sol by adding a small amount of electrolyte (peptizing agent). Example: Fe(OH)\u2083 precipitate peptized by FeCl\u2083.","reference":"Colloids"},{"id":"colloids_b4_24","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is NOT a kinetic property of colloids?","options":[{"key":"A","text":"Brownian motion"},{"key":"B","text":"Diffusion"},{"key":"C","text":"Tyndall effect"},{"key":"D","text":"Sedimentation"}],"correct":"C","explanation":"The Tyndall effect is an optical property, not a kinetic property. Kinetic properties include Brownian motion, diffusion, osmotic pressure, and sedimentation, which relate to particle movement.","reference":"Colloids"},{"id":"colloids_b4_25","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"A multimolecular colloid is formed when:","options":[{"key":"A","text":"Individual large molecules dissolve"},{"key":"B","text":"Many small molecules aggregate to form colloidal particles"},{"key":"C","text":"Surfactant molecules form micelles"},{"key":"D","text":"Ions combine to form crystals"}],"correct":"B","explanation":"Multimolecular colloids (e.g., sulfur sol, gold sol) form when many small atoms or molecules aggregate to form particles of colloidal size. They are typically lyophobic.","reference":"Colloids"},{"id":"colloids_b4_26","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The Donnan membrane equilibrium becomes significant when:","options":[{"key":"A","text":"Colloidal particles are uncharged"},{"key":"B","text":"A non-diffusible colloidal ion is present with diffusible counterions"},{"key":"C","text":"The system is at the isoelectric point"},{"key":"D","text":"Electrolyte concentration is zero"}],"correct":"B","explanation":"The Donnan equilibrium describes the unequal distribution of diffusible ions across a membrane when a non-diffusible colloidal ion is present on one side. This affects pH and ionic distribution in protein solutions.","reference":"Colloids"},{"id":"colloids_b4_27","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about lyophilic colloids is TRUE?","options":[{"key":"A","text":"They are irreversible upon coagulation"},{"key":"B","text":"They require stabilizing agents for preparation"},{"key":"C","text":"They exhibit greater viscosity than lyophobic colloids at the same concentration"},{"key":"D","text":"They show the Tyndall effect strongly"}],"correct":"C","explanation":"Lyophilic colloids (e.g., polymers, proteins) are highly solvated and often form viscous solutions. They are reversible upon coagulation, self-stabilizing, and may show weak Tyndall effects due to strong solvation.","reference":"Colloids"},{"id":"colloids_b4_28","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Steric stabilization of colloids involves:","options":[{"key":"A","text":"Increasing zeta potential"},{"key":"B","text":"Coating particles with polymer layers that prevent close approach"},{"key":"C","text":"Adding high concentrations of electrolytes"},{"key":"D","text":"Reducing particle size below 1 nm"}],"correct":"B","explanation":"Steric stabilization occurs when adsorbed polymer or surfactant layers create a physical barrier that prevents particles from approaching close enough for attractive forces to cause aggregation.","reference":"Colloids"},{"id":"colloids_b4_29","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which pharmaceutical product is a colloidal dispersion of a liquid in a solid?","options":[{"key":"A","text":"Aerosol foam"},{"key":"B","text":"Jelly (gel)"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Aerosol spray"}],"correct":"B","explanation":"A gel (jelly) is a colloidal dispersion where liquid is dispersed in a solid matrix. Aerosol foams are gas-in-liquid, emulsions are liquid-in-liquid, and aerosol sprays are liquid-in-gas.","reference":"Colloids"},{"id":"colloids_b4_30","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"The primary reason colloidal particle size affects drug absorption is:","options":[{"key":"A","text":"Colloidal particles are always ionized"},{"key":"B","text":"Smaller particles have greater surface area for dissolution and absorption"},{"key":"C","text":"Colloids cannot cross biological membranes"},{"key":"D","text":"Colloids are always metabolized faster"}],"correct":"B","explanation":"Colloidal size provides a large surface area-to-volume ratio, enhancing dissolution rate (per Noyes-Whitney equation) and potentially improving bioavailability of poorly soluble drugs formulated as colloidal dispersions.","reference":"Colloids"},{"id":"colloids_b5_1","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which system is not classified as a dispersed system?","options":[{"key":"A","text":"Suspension"},{"key":"B","text":"Emulsion"},{"key":"C","text":"Aerosol"},{"key":"D","text":"Gel"},{"key":"E","text":"True solution"}],"correct":"E","explanation":"A true solution is a molecular (single-phase) dispersion, not a dispersed system. Suspensions, emulsions, aerosols and gels are dispersed systems.","reference":"Colloids"},{"id":"colloids_b5_2","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"A colloidal dispersion of solid particles in a liquid is called a:","options":[{"key":"A","text":"Sol"},{"key":"B","text":"Gel"},{"key":"C","text":"Foam"},{"key":"D","text":"Emulsion"},{"key":"E","text":"Aerosol"}],"correct":"A","explanation":"A sol is a colloidal dispersion of solid particles in a liquid. A gel is a semisolid network, a foam is gas in liquid, and an aerosol is liquid or solid in gas.","reference":"Colloids"},{"id":"colloids_b5_3","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Which carbomer grade is widely used as a pharmaceutical gelling and viscosity-enhancing polymer?","options":[{"key":"A","text":"Carbomer 71G"},{"key":"B","text":"Carbomer 934P"},{"key":"C","text":"Carbomer 971P only for injectable emulsions"},{"key":"D","text":"Carbomer 1382 only for aerosols"},{"key":"E","text":"Carbomer 5984 only for transdermal patches"}],"correct":"B","explanation":"Carbomer 934P is a pharmaceutical-grade cross-linked polyacrylic acid widely used as a gelling and viscosity-enhancing polymer.","reference":"Colloids"},{"id":"suspensions_b4_1","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the typical particle size range for particles in a pharmaceutical suspension?","options":[{"key":"A","text":"< 1 nm"},{"key":"B","text":"1 nm -- 1000 nm"},{"key":"C","text":"> 1000 nm ( > 1 \u00b5m)"},{"key":"D","text":"0.1 nm -- 1 nm"}],"correct":"C","explanation":"Suspensions are coarse dispersions with particle sizes typically greater than 1 \u00b5m (1000 nm). This distinguishes them from colloids (1--1000 nm) and true solutions ( < 1 nm).","reference":"Suspensions"},{"id":"suspensions_b4_2","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"According to Stokes ' law, the sedimentation rate of a suspension is DIRECTLY proportional to:","options":[{"key":"A","text":"The viscosity of the medium"},{"key":"B","text":"The square of the particle radius"},{"key":"C","text":"The density of the medium"},{"key":"D","text":"The particle charge"}],"correct":"B","explanation":"Stokes ' law states: v = 2r\u00b2(\u03c1p -- \u03c1m)g / 9\u03b7. Sedimentation rate is directly proportional to the square of particle radius (r\u00b2) and the density difference, and inversely proportional to viscosity.","reference":"Suspensions"},{"id":"suspensions_b4_3","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"Which factor does NOT directly affect the sedimentation rate according to Stokes ' law?","options":[{"key":"A","text":"Particle diameter"},{"key":"B","text":"Density difference between particle and medium"},{"key":"C","text":"Zeta potential"},{"key":"D","text":"Viscosity of the dispersion medium"}],"correct":"C","explanation":"Stokes ' law considers particle size, density difference, and medium viscosity. Zeta potential affects flocculation and stability but is not a variable in the Stokes ' sedimentation equation.","reference":"Suspensions"},{"id":"suspensions_b4_4","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A flocculated suspension is characterized by:","options":[{"key":"A","text":"Particles settling as individual, dense particles"},{"key":"B","text":"Particles forming loose, porous aggregates that settle rapidly"},{"key":"C","text":"Particles remaining permanently suspended"},{"key":"D","text":"Particles dissolving in the medium"}],"correct":"B","explanation":"In flocculated suspensions, particles form loose, porous flocs (aggregates) held together by weak van der Waals forces. They sediment rapidly but are easily redispersed due to the loose, network-like structure.","reference":"Suspensions"},{"id":"suspensions_b4_5","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A deflocculated suspension forms a:","options":[{"key":"A","text":"Loose, easily redispersed sediment"},{"key":"B","text":"Hard, compact cake that is difficult to resuspend"},{"key":"C","text":"Clear supernatant immediately"},{"key":"D","text":"Gel-like structure"}],"correct":"B","explanation":"Deflocculated particles settle individually, forming a dense, compact sediment (cake) due to close packing and strong particle-particle interactions. This cake is difficult to redisperse ( \"caking \").","reference":"Suspensions"},{"id":"suspensions_b4_6","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"The sedimentation volume (F) is defined as:","options":[{"key":"A","text":"The ratio of final sediment volume to original suspension volume"},{"key":"B","text":"The rate of particle settling"},{"key":"C","text":"The density of the sediment"},{"key":"D","text":"The particle size distribution"}],"correct":"A","explanation":"Sedimentation volume F = Vu/V\u2080, where Vu is the ultimate sediment volume and V\u2080 is the original suspension volume. F ranges from 0 to 1; higher values indicate better suspendability.","reference":"Suspensions"},{"id":"suspensions_b4_7","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"The degree of flocculation (\u03b2) is calculated as:","options":[{"key":"A","text":"F/flocculated \u00f7 F/deflocculated"},{"key":"B","text":"F/deflocculated \u00f7 F/flocculated"},{"key":"C","text":"Sedimentation rate \u00d7 viscosity"},{"key":"D","text":"Zeta potential \u00d7 particle size"}],"correct":"A","explanation":"\u03b2 = F(flocculated) / F(deflocculated). Since flocculated suspensions have higher sedimentation volumes, \u03b2 is always greater than 1. Higher \u03b2 values indicate better flocculation and redispersibility.","reference":"Suspensions"},{"id":"suspensions_b4_8","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is a common flocculating agent used in suspensions?","options":[{"key":"A","text":"Tragacanth"},{"key":"B","text":"Sodium citrate"},{"key":"C","text":"Methylcellulose"},{"key":"D","text":"Glycerin"}],"correct":"B","explanation":"Sodium citrate is an electrolyte that can act as a flocculating agent by reducing zeta potential. Tragacanth and methylcellulose are suspending agents (viscosity builders), and glycerin is a wetting agent/humectant.","reference":"Suspensions"},{"id":"suspensions_b4_9","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"The primary purpose of a wetting agent in a suspension is to:","options":[{"key":"A","text":"Increase viscosity"},{"key":"B","text":"Reduce the contact angle and allow the liquid to spread over hydrophobic particles"},{"key":"C","text":"Increase zeta potential"},{"key":"D","text":"Prevent microbial growth"}],"correct":"B","explanation":"Wetting agents (surfactants like polysorbates) lower the interfacial tension and contact angle between hydrophobic particles and the aqueous medium, ensuring particles are wetted and dispersed rather than floating.","reference":"Suspensions"},{"id":"suspensions_b4_10","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is a structured vehicle (non-Newtonian) used in suspensions?","options":[{"key":"A","text":"Simple syrup"},{"key":"B","text":"Aluminum magnesium silicate (Veegum) gel"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Purified water"}],"correct":"B","explanation":"Structured vehicles like Veegum (magnesium aluminum silicate) form thixotropic or pseudoplastic gels that provide yield value, keeping particles suspended and preventing caking.","reference":"Suspensions"},{"id":"suspensions_b4_11","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Controlled flocculation in suspensions is achieved by:","options":[{"key":"A","text":"Adding excess suspending agent"},{"key":"B","text":"Adding a flocculating agent to reduce zeta potential to a controlled level"},{"key":"C","text":"Eliminating all electrolytes"},{"key":"D","text":"Reducing particle size to colloidal range"}],"correct":"B","explanation":"Controlled flocculation deliberately reduces zeta potential using electrolytes or ionic surfactants to promote gentle aggregation into flocs, creating a stable, easily redispersed suspension.","reference":"Suspensions"},{"id":"suspensions_b4_12","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"The zeta potential in a deflocculated suspension is typically:","options":[{"key":"A","text":"Near zero"},{"key":"B","text":"High (large magnitude, positive or negative)"},{"key":"C","text":"Always positive"},{"key":"D","text":"Independent of pH"}],"correct":"B","explanation":"Deflocculated suspensions have high zeta potential, creating strong electrostatic repulsion between particles. This prevents aggregation but leads to slow settling and caking.","reference":"Suspensions"},{"id":"suspensions_b4_13","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which rheological property is most desirable for an oral suspension vehicle?","options":[{"key":"A","text":"Newtonian flow"},{"key":"B","text":"Pseudoplastic or thixotropic flow with a yield value"},{"key":"C","text":"Dilatant flow"},{"key":"D","text":"Plastic flow without a yield value"}],"correct":"B","explanation":"Pseudoplastic/thixotropic vehicles with yield value allow easy pouring (shear thinning) while maintaining particles in suspension at rest due to the yield stress that prevents sedimentation.","reference":"Suspensions"},{"id":"suspensions_b4_14","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Caking in a deflocculated suspension is caused by:","options":[{"key":"A","text":"Formation of loose, porous flocs"},{"key":"B","text":"Close packing of individual particles with strong attractive forces at contact points"},{"key":"C","text":"High viscosity of the vehicle"},{"key":"D","text":"Excessive Brownian motion"}],"correct":"B","explanation":"Caking occurs when deflocculated particles settle into a dense sediment. The close contact allows strong attractive forces (van der Waals) to bind particles into a hard cake resistant to redispersion.","reference":"Suspensions"},{"id":"suspensions_b4_15","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which method is commonly used to reduce particle size during suspension preparation?","options":[{"key":"A","text":"Lyophilization"},{"key":"B","text":"Wet milling (comminution)"},{"key":"C","text":"Dialysis"},{"key":"D","text":"Distillation"}],"correct":"B","explanation":"Wet milling (comminution) reduces particle size by grinding solids in a liquid medium using equipment like ball mills, colloid mills, or homogenizers. Smaller particles sediment more slowly per Stokes ' law.","reference":"Suspensions"},{"id":"suspensions_b4_16","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Ostwald ripening in suspensions refers to:","options":[{"key":"A","text":"Growth of large crystals at the expense of smaller ones due to differences in solubility"},{"key":"B","text":"Microbial contamination"},{"key":"C","text":"Evaporation of the vehicle"},{"key":"D","text":"Polymerization of the active ingredient"}],"correct":"A","explanation":"Ostwald ripening occurs because smaller particles have higher solubility than larger ones (Kelvin equation). Dissolved drug from small particles deposits onto larger particles, causing crystal growth and potential instability.","reference":"Suspensions"},{"id":"suspensions_b4_17","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which excipient would be most appropriate to prevent caking in a reconstitutable antibiotic suspension?","options":[{"key":"A","text":"Mannitol"},{"key":"B","text":"A flocculating agent like sodium chloride"},{"key":"C","text":"A suspending agent like xanthan gum"},{"key":"D","text":"A wetting agent like polysorbate 80"}],"correct":"C","explanation":"Suspending agents like xanthan gum increase viscosity and form structured vehicles that slow sedimentation and prevent caking. In reconstitutable suspensions, they help maintain uniform dispersion.","reference":"Suspensions"},{"id":"suspensions_b4_18","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"The \"shake well \" label on a suspension container is primarily intended to:","options":[{"key":"A","text":"Improve taste"},{"key":"B","text":"Ensure uniform distribution of drug particles before dosing"},{"key":"C","text":"Prevent microbial growth"},{"key":"D","text":"Increase viscosity"}],"correct":"B","explanation":"Suspensions settle upon standing. Shaking redistributes particles uniformly to ensure dose-to-dose consistency. Without shaking, the first doses may be underdosed and later doses overdosed.","reference":"Suspensions"},{"id":"suspensions_b4_19","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which type of suspension is generally preferred for parenteral administration?","options":[{"key":"A","text":"Flocculated suspension"},{"key":"B","text":"Deflocculated suspension"},{"key":"C","text":"Colloidal suspension"},{"key":"D","text":"True solution"}],"correct":"B","explanation":"Parenteral suspensions should be deflocculated to prevent aggregation and ensure small, uniform particle size. Large flocs could clog needles or cause variable absorption. However, they must be resuspendable.","reference":"Suspensions"},{"id":"suspensions_b4_20","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A reconstitutable oral suspension (for constitution) is prepared by:","options":[{"key":"A","text":"The pharmacist adding water to the powder mixture before dispensing"},{"key":"B","text":"The manufacturer adding water and shipping as a liquid"},{"key":"C","text":"The patient adding water to the dry powder at home"},{"key":"D","text":"Both A and C"}],"correct":"D","explanation":"Reconstitutable suspensions are dry powder mixtures (often with stability issues in liquid form) that are reconstituted with water by the pharmacist or patient immediately before use.","reference":"Suspensions"},{"id":"suspensions_b4_21","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"The Hausner ratio is used to assess:","options":[{"key":"A","text":"Particle flowability of powders before suspension"},{"key":"B","text":"Viscosity of the suspension"},{"key":"C","text":"Zeta potential"},{"key":"D","text":"pH stability"}],"correct":"A","explanation":"The Hausner ratio (tapped density/bulk density) indicates powder flowability. It is relevant during suspension manufacturing to assess how well powders will disperse and wet.","reference":"Suspensions"},{"id":"suspensions_b4_22","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following suspending agents is an anionic polysaccharide?","options":[{"key":"A","text":"Xanthan gum"},{"key":"B","text":"Sodium carboxymethylcellulose (CMC)"},{"key":"C","text":"Tragacanth"},{"key":"D","text":"Povidone"}],"correct":"B","explanation":"Sodium CMC is an anionic (negatively charged) cellulose derivative. Xanthan gum and tragacanth are nonionic or weakly anionic natural gums. Povidone is a synthetic nonionic polymer.","reference":"Suspensions"},{"id":"suspensions_b4_23","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"In a flocculated suspension, the supernatant appears:","options":[{"key":"A","text":"Completely clear"},{"key":"B","text":"Cloudy due to dispersed individual particles"},{"key":"C","text":"Clear or nearly clear because particles are in flocs"},{"key":"D","text":"Colored but transparent"}],"correct":"C","explanation":"In flocculated suspensions, particles aggregate into flocs that settle rapidly, leaving a relatively clear supernatant. In deflocculated suspensions, individual particles may remain dispersed, creating a cloudy supernatant.","reference":"Suspensions"},{"id":"suspensions_b4_24","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which factor would INCREASE the physical stability of a suspension?","options":[{"key":"A","text":"Increasing particle size"},{"key":"B","text":"Increasing the density difference between particle and medium"},{"key":"C","text":"Increasing the viscosity of the dispersion medium"},{"key":"D","text":"Decreasing the zeta potential to zero"}],"correct":"C","explanation":"Per Stokes ' law, increasing viscosity decreases sedimentation rate. However, excessive viscosity may affect pourability. The optimal approach balances viscosity with acceptable flow characteristics.","reference":"Suspensions"},{"id":"suspensions_b4_25","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"The term \"controlled flocculation \" implies:","options":[{"key":"A","text":"Complete prevention of particle aggregation"},{"key":"B","text":"Deliberate formation of easily redispersible flocs while maintaining adequate stability"},{"key":"C","text":"Elimination of all electrolytes"},{"key":"D","text":"Conversion of suspension to a solution"}],"correct":"B","explanation":"Controlled flocculation achieves a balance where particles form loose, reversible flocs that settle rapidly but are easily redispersed, avoiding both caking (deflocculated) and excessive sedimentation.","reference":"Suspensions"},{"id":"suspensions_b4_26","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is a concern specific to parenteral suspensions?","options":[{"key":"A","text":"Need for flavoring agents"},{"key":"B","text":"Particle size must be small enough to pass through needles without clogging"},{"key":"C","text":"Requirement for high sugar content"},{"key":"D","text":"Need for bright coloring"}],"correct":"B","explanation":"Parenteral suspensions require very fine, uniform particles (typically < 5 \u00b5m) to prevent needle blockage and embolism. This is not a concern for oral suspensions.","reference":"Suspensions"},{"id":"suspensions_b4_27","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A thixotropic suspension vehicle is advantageous because:","options":[{"key":"A","text":"It flows easily at high shear (pouring) and maintains structure at rest"},{"key":"B","text":"It always remains fluid"},{"key":"C","text":"It becomes more viscous when shaken"},{"key":"D","text":"It has constant viscosity regardless of shear"}],"correct":"A","explanation":"Thixotropic vehicles shear-thin upon shaking/pouring (becoming fluid) and rebuild structure at rest, maintaining particles in suspension. This provides both stability and acceptable pourability.","reference":"Suspensions"},{"id":"suspensions_b4_28","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which technique is used to evaluate the redispersibility of a suspension?","options":[{"key":"A","text":"pH measurement"},{"key":"B","text":"Observing the number of inversions required to resuspend sediment"},{"key":"C","text":"Osmolality measurement"},{"key":"D","text":"UV spectroscopy"}],"correct":"B","explanation":"Redispersibility is practically assessed by determining how many gentle inversions of the container are needed to uniformly resuspend the sediment. Good suspensions require minimal inversions.","reference":"Suspensions"},{"id":"suspensions_b4_29","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Crystal growth in suspensions can be minimized by:","options":[{"key":"A","text":"Using a narrow particle size distribution"},{"key":"B","text":"Adding a second, less soluble form of the drug"},{"key":"C","text":"Both A and B"},{"key":"D","text":"Neither A nor B"}],"correct":"C","explanation":"Crystal growth (Ostwald ripening) is minimized by using uniformly sized particles (narrow distribution reduces dissolution gradients) and by adding a less soluble salt/form to equalize solubility.","reference":"Suspensions"},{"id":"suspensions_b4_30","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"When formulating a suspension of a hydrophobic drug, the FIRST step in the preparation process should typically be:","options":[{"key":"A","text":"Adding the suspending agent"},{"key":"B","text":"Wetting the powder with a wetting agent before adding the aqueous vehicle"},{"key":"C","text":"Adding the preservative"},{"key":"D","text":"Adjusting the pH"}],"correct":"B","explanation":"Hydrophobic drugs resist wetting by water and may float or clump. Pre-wetting with a surfactant solution or hydroalcoholic liquid ensures proper dispersion before adding other excipients and the bulk vehicle.","reference":"Suspensions"},{"id":"emulsions_b4_1","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"hard","question":"Which of the following best defines an emulsion?","options":[{"key":"A","text":"A homogeneous mixture of two miscible liquids"},{"key":"B","text":"A heterogeneous system of two immiscible liquids, one dispersed as droplets in the other"},{"key":"C","text":"A solid dispersed in a liquid"},{"key":"D","text":"A gas dispersed in a liquid"}],"correct":"B","explanation":"An emulsion is a heterogeneous system consisting of two immiscible liquids (typically oil and water), where one liquid is dispersed as fine droplets in the other continuous phase.","reference":"Emulsions"},{"id":"emulsions_b4_2","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"In an oil-in-water (O/W) emulsion, which of the following is the continuous phase?","options":[{"key":"A","text":"Oil"},{"key":"B","text":"Water"},{"key":"C","text":"Both oil and water"},{"key":"D","text":"The emulsifying agent"}],"correct":"B","explanation":"In an O/W emulsion, oil droplets are dispersed in a continuous water phase. In a W/O emulsion, water droplets are dispersed in a continuous oil phase.","reference":"Emulsions"},{"id":"emulsions_b4_3","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a common oil-in-water (O/W) emulsifying agent?","options":[{"key":"A","text":"Wool fat (lanolin)"},{"key":"B","text":"Calcium oleate"},{"key":"C","text":"Sodium lauryl sulfate"},{"key":"D","text":"Sorbitan monooleate (Span 80)"}],"correct":"C","explanation":"Sodium lauryl sulfate is an anionic surfactant that forms O/W emulsions. Calcium oleate, sorbitan monooleate (Span 80), lanolin, and cholesterol are more commonly used for W/O emulsions.","reference":"Emulsions"},{"id":"emulsions_b4_4","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a common water-in-oil (W/O) emulsifying agent?","options":[{"key":"A","text":"Polysorbate 80 (Tween 80)"},{"key":"B","text":"Sodium lauryl sulfate"},{"key":"C","text":"Triethanolamine oleate"},{"key":"D","text":"Sorbitan monostearate (Span 60)"}],"correct":"D","explanation":"Sorbitan monostearate (Span 60) and other Span surfactants have low HLB values (4--8) and are used for W/O emulsions. Tween surfactants and sodium lauryl sulfate have high HLB values and form O/W emulsions.","reference":"Emulsions"},{"id":"emulsions_b4_5","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"The HLB (Hydrophile-Lipophile Balance) system is used to:","options":[{"key":"A","text":"Measure the pH of an emulsion"},{"key":"B","text":"Select appropriate emulsifying agents based on their hydrophilic-lipophilic properties"},{"key":"C","text":"Determine the viscosity of an emulsion"},{"key":"D","text":"Calculate the particle size of emulsion droplets"}],"correct":"B","explanation":"The HLB system quantifies the balance between hydrophilic and lipophilic portions of a surfactant. Emulsifiers with HLB 3--6 favor W/O emulsions; HLB 8--18 favor O/W emulsions.","reference":"Emulsions"},{"id":"emulsions_b4_6","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"Which of the following HLB ranges is most appropriate for an oil-in-water (O/W) emulsifying agent?","options":[{"key":"A","text":"1--3"},{"key":"B","text":"3--6"},{"key":"C","text":"8--18"},{"key":"D","text":"20--30"}],"correct":"C","explanation":"Surfactants with HLB values of 8--18 are hydrophilic and favor the formation of O/W emulsions. W/O emulsifiers typically have HLB values of 3--6.","reference":"Emulsions"},{"id":"emulsions_b4_7","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a pharmaceutical emulsion?","options":[{"key":"A","text":"Simple syrup"},{"key":"B","text":"Mineral oil emulsion (oral)"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Tincture of iodine"}],"correct":"B","explanation":"Mineral oil emulsion (e.g., Haley 's M-O) is a classic oral emulsion used as a laxative. Simple syrup and saline are solutions. Tincture of iodine is a solution.","reference":"Emulsions"},{"id":"emulsions_b4_8","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"hard","question":"Which of the following is a potential instability problem in emulsions?","options":[{"key":"A","text":"Creaming"},{"key":"B","text":"Cracking (breaking)"},{"key":"C","text":"Phase inversion"},{"key":"D","text":"Microbial contamination"}],"correct":"A,B,C,D","explanation":"All are common emulsion instability problems. Creaming is upward concentration of droplets. Cracking is irreversible separation of phases. Phase inversion is conversion from O/W to W/O or vice versa. Microbes can degrade emulsifiers.","reference":"Emulsions"},{"id":"emulsions_b4_9","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Creaming in an emulsion is best described as:","options":[{"key":"A","text":"The irreversible separation of oil and water phases"},{"key":"B","text":"The upward concentration of dispersed droplets due to density differences"},{"key":"C","text":"The conversion of an O/W emulsion to a W/O emulsion"},{"key":"D","text":"The growth of droplet size over time"}],"correct":"B","explanation":"Creaming is the upward (or downward) movement of dispersed droplets due to density differences between the phases. It is usually reversible with gentle shaking. Cracking is irreversible separation.","reference":"Emulsions"},{"id":"emulsions_b4_10","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following factors can cause phase inversion in an emulsion?","options":[{"key":"A","text":"Adding too much of the dispersed phase"},{"key":"B","text":"Changing the temperature significantly"},{"key":"C","text":"Adding an emulsifier with opposite HLB preference"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Phase inversion can be caused by adding excess dispersed phase, temperature changes, adding an emulsifier with opposite HLB preference, or mechanical agitation. It results in reversal of the continuous and dispersed phases.","reference":"Emulsions"},{"id":"emulsions_b4_11","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a method to prepare an emulsion?","options":[{"key":"A","text":"Trituration method (dry gum method / continental method)"},{"key":"B","text":"Wet gum method (English method)"},{"key":"C","text":"Bottle method (for volatile oils)"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"All are valid emulsion preparation methods. The dry gum method uses acacia as the emulsifier with oil and water. The wet gum method prepares a mucilage first. The bottle method is for volatile oils. Homogenization is industrial.","reference":"Emulsions"},{"id":"emulsions_b4_12","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"In the dry gum method (continental method) of emulsion preparation, the primary emulsion is formed by triturating:","options":[{"key":"A","text":"Oil, water, and gum in a 4:2:1 ratio"},{"key":"B","text":"Oil, water, and gum in a 2:2:1 ratio"},{"key":"C","text":"Oil, water, and gum in a 4:2:1 ratio by volume for fixed oils"},{"key":"D","text":"Equal parts of oil, water, and gum"}],"correct":"C","explanation":"In the dry gum method, the primary emulsion is formed using a 4:2:1 ratio by volume (oil:water:acacia) for fixed oils, and 3:2:1 for volatile oils. This is a fundamental compounding principle.","reference":"Emulsions"},{"id":"emulsions_b4_13","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of a W/O emulsion compared to an O/W emulsion?","options":[{"key":"A","text":"W/O emulsions are more easily washed off with water"},{"key":"B","text":"W/O emulsions are more occlusive and greasy"},{"key":"C","text":"W/O emulsions have a lower viscosity"},{"key":"D","text":"W/O emulsions are preferred for internal use"}],"correct":"B","explanation":"W/O emulsions have oil as the continuous phase, making them more occlusive, greasy, and water-resistant. O/W emulsions are more washable, less greasy, and preferred for internal and cosmetic use.","reference":"Emulsions"},{"id":"emulsions_b4_14","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a natural emulsifying agent derived from acacia?","options":[{"key":"A","text":"Tragacanth"},{"key":"B","text":"Acacia (gum arabic)"},{"key":"C","text":"Methylcellulose"},{"key":"D","text":"Carbomer"}],"correct":"B","explanation":"Acacia (gum arabic) is a natural polysaccharide emulsifying agent commonly used in the preparation of oral emulsions (e.g., cod liver oil emulsion). It forms O/W emulsions.","reference":"Emulsions"},{"id":"emulsions_b4_15","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"hard","question":"A pharmacist is preparing an emulsion and notices that the emulsion separates into two distinct layers that cannot be reconstituted by shaking. This is best described as:","options":[{"key":"A","text":"Creaming"},{"key":"B","text":"Flocculation"},{"key":"C","text":"Cracking (breaking)"},{"key":"D","text":"Phase inversion"}],"correct":"C","explanation":"Cracking (or breaking) is the irreversible separation of an emulsion into two distinct layers that cannot be reconstituted by shaking. It indicates destruction of the emulsifying film around droplets.","reference":"Emulsions"},{"id":"emulsions_b4_16","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of emulsions as a dosage form?","options":[{"key":"A","text":"They are always more stable than solutions"},{"key":"B","text":"They can mask unpleasant tastes of oils and improve palatability"},{"key":"C","text":"They do not require preservatives"},{"key":"D","text":"They have a longer shelf life than tablets"}],"correct":"B","explanation":"Emulsions can mask the unpleasant taste and odor of oils (e.g., cod liver oil, castor oil) by dispersing them in a palatable aqueous phase with flavoring agents. They do require preservatives and have limited stability.","reference":"Emulsions"},{"id":"emulsions_b4_17","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is used as a preservative in emulsions?","options":[{"key":"A","text":"Acacia"},{"key":"B","text":"Methylcellulose"},{"key":"C","text":"Methylparaben"},{"key":"D","text":"Mineral oil"}],"correct":"C","explanation":"Methylparaben (and propylparaben) are commonly used antimicrobial preservatives in emulsions. Acacia is an emulsifier. Methylcellulose is a thickener. Mineral oil is the dispersed phase.","reference":"Emulsions"},{"id":"emulsions_b4_18","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a method to test the type of emulsion (O/W vs. W/O)?","options":[{"key":"A","text":"Dilution test --- O/W emulsions dilute with water; W/O emulsions dilute with oil"},{"key":"B","text":"Conductivity test --- O/W emulsions conduct electricity; W/O emulsions do not"},{"key":"C","text":"Dye test --- water-soluble dye disperses in O/W; oil-soluble dye disperses in W/O"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"All three tests are used to determine emulsion type. O/W emulsions dilute with water, conduct electricity (water is continuous), and disperse water-soluble dyes. W/O emulsions show the opposite behavior.","reference":"Emulsions"},{"id":"emulsions_b4_19","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a parenteral emulsion?","options":[{"key":"A","text":"Dextrose 5% injection"},{"key":"B","text":"Intralipid 20% emulsion"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Lidocaine injection"}],"correct":"B","explanation":"Intralipid 20% is an intravenous fat emulsion used for parenteral nutrition. It is an O/W emulsion of soybean oil in water. The other options are parenteral solutions, not emulsions.","reference":"Emulsions"},{"id":"emulsions_b4_20","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a common cause of emulsion instability?","options":[{"key":"A","text":"Use of an appropriate emulsifier at the correct concentration"},{"key":"B","text":"Storage at controlled room temperature"},{"key":"C","text":"Growth of microorganisms that degrade the emulsifying agent"},{"key":"D","text":"Use of purified water"}],"correct":"C","explanation":"Microbial growth can degrade emulsifying agents (especially natural gums like acacia), leading to loss of emulsion stability, cracking, or phase separation. Proper preservation is essential.","reference":"Emulsions"},{"id":"sterile_forms_b4_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is the most reliable method for sterilizing heat-sensitive parenteral solutions?","options":[{"key":"A","text":"Autoclaving (steam sterilization)"},{"key":"B","text":"Dry heat sterilization"},{"key":"C","text":"Filtration sterilization"},{"key":"D","text":"Ethylene oxide gas sterilization"}],"correct":"C","explanation":"Filtration sterilization (using 0.22-micron filters) is the method of choice for heat-sensitive parenteral solutions. Autoclaving and dry heat require high temperatures. Ethylene oxide is for medical devices, not solutions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following types of water is required for the preparation of parenteral solutions?","options":[{"key":"A","text":"Purified water"},{"key":"B","text":"Distilled water"},{"key":"C","text":"Water for injection (WFI)"},{"key":"D","text":"Tap water"}],"correct":"C","explanation":"Water for injection (WFI) is the only water quality acceptable for parenteral preparations according to USP standards. It is pyrogen-free and meets strict chemical and microbial specifications.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of pyrogens?","options":[{"key":"A","text":"They are living bacteria that cause fever"},{"key":"B","text":"They are heat-stable lipopolysaccharides from Gram-negative bacteria that cause fever"},{"key":"C","text":"They are easily destroyed by autoclaving at 121\u00b0C"},{"key":"D","text":"They are only found in oral dosage forms"}],"correct":"B","explanation":"Pyrogens are heat-stable lipopolysaccharides (endotoxins) from Gram-negative bacteria that cause fever when injected. They are not destroyed by autoclaving and must be removed by distillation or ultrafiltration.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is the standard temperature and time for autoclaving (steam sterilization) of parenteral products?","options":[{"key":"A","text":"100\u00b0C for 30 minutes"},{"key":"B","text":"121\u00b0C at 15 psi for 15--20 minutes"},{"key":"C","text":"160\u00b0C for 2 hours"},{"key":"D","text":"80\u00b0C for 60 minutes"}],"correct":"B","explanation":"Autoclaving at 121\u00b0C (250\u00b0F) and 15 psi pressure for 15--20 minutes is the standard for sterilizing heat-stable parenteral products and equipment. 160\u00b0C for 2 hours is dry heat sterilization.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following is a method used to test for the presence of pyrogens in parenteral products?","options":[{"key":"A","text":"Rabbit pyrogen test"},{"key":"B","text":"Limulus Amebocyte Lysate (LAL) test"},{"key":"C","text":"Sterility test"},{"key":"D","text":"Endotoxin test"}],"correct":"A,B,D","explanation":"The rabbit pyrogen test and LAL test (which detects bacterial endotoxins) are used to test for pyrogens. The sterility test checks for viable microorganisms, not pyrogens specifically.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a requirement for aseptic processing of parenteral products?","options":[{"key":"A","text":"Processing in a Class 100 (ISO 5) environment"},{"key":"B","text":"Use of non-sterile equipment"},{"key":"C","text":"Processing at room temperature without humidity control"},{"key":"D","text":"Use of tap water for rinsing"}],"correct":"A","explanation":"Aseptic processing of parenteral products must occur in a Class 100 (ISO 5) cleanroom environment with HEPA-filtered air, sterile equipment, and trained personnel following strict aseptic technique.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of parenteral administration over oral administration?","options":[{"key":"A","text":"Slower onset of action"},{"key":"B","text":"Bypass of first-pass hepatic metabolism"},{"key":"C","text":"Greater patient convenience"},{"key":"D","text":"Lower risk of infection"}],"correct":"B","explanation":"Parenteral administration bypasses the gastrointestinal tract and first-pass hepatic metabolism, providing complete bioavailability for many drugs. It is less convenient and carries a higher infection risk.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following is a common route of parenteral administration?","options":[{"key":"A","text":"Intravenous (IV)"},{"key":"B","text":"Intramuscular (IM)"},{"key":"C","text":"Subcutaneous (SC)"},{"key":"D","text":"Intradermal (ID)"}],"correct":"A,B,C,D","explanation":"All are common parenteral routes. IV delivers drug directly into the bloodstream. IM is into muscle tissue. SC is into subcutaneous tissue. ID is into the dermis (e.g., TB skin test).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a disadvantage of intravenous administration?","options":[{"key":"A","text":"Rapid onset of action"},{"key":"B","text":"Complete bioavailability"},{"key":"C","text":"Risk of infection, phlebitis, and embolism"},{"key":"D","text":"Ability to administer large fluid volumes"}],"correct":"C","explanation":"IV administration carries risks of infection (sepsis), phlebitis (inflammation of the vein), and embolism (air or particulate). Rapid onset and complete bioavailability are advantages.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is the purpose of adding an antioxidant to a parenteral solution?","options":[{"key":"A","text":"To prevent microbial growth"},{"key":"B","text":"To prevent oxidation degradation of the drug"},{"key":"C","text":"To adjust the pH of the solution"},{"key":"D","text":"To increase the osmotic pressure"}],"correct":"B","explanation":"Antioxidants (e.g., sodium bisulfite, ascorbic acid, sodium metabisulfite) are added to parenteral solutions to prevent oxidative degradation of oxidation-sensitive drugs. They do not prevent microbial growth.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_11","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a common vehicle used for intravenous injections?","options":[{"key":"A","text":"Sesame oil"},{"key":"B","text":"Normal saline (0.9% NaCl)"},{"key":"C","text":"Peanut oil"},{"key":"D","text":"Ethanol"}],"correct":"B","explanation":"Normal saline (0.9% sodium chloride) is the most common vehicle for IV injections and infusions because it is isotonic and compatible with blood. Oils and ethanol are used for IM injections, not IV.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_12","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a requirement for ophthalmic preparations?","options":[{"key":"A","text":"They must be isotonic but not necessarily sterile"},{"key":"B","text":"They must be sterile and isotonic"},{"key":"C","text":"They only need to be preserved, not sterile"},{"key":"D","text":"They must be hypertonic to enhance drug penetration"}],"correct":"B","explanation":"Ophthalmic preparations must be sterile and isotonic to prevent infection and ocular irritation. Hypertonic solutions cause pain and cell shrinkage. Preservation alone is insufficient for multi-dose products.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_13","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a method of sterilization that uses ionizing radiation?","options":[{"key":"A","text":"Autoclaving"},{"key":"B","text":"Dry heat sterilization"},{"key":"C","text":"Gamma irradiation"},{"key":"D","text":"Filtration"}],"correct":"C","explanation":"Gamma irradiation uses ionizing radiation (gamma rays from cobalt-60) to sterilize heat-sensitive materials, including some pharmaceuticals and medical devices. It does not use heat.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_14","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"A pharmacist is preparing a compounded sterile preparation (CSP). Which of the following is the most critical factor?","options":[{"key":"A","text":"Using the cheapest available ingredients"},{"key":"B","text":"Maintaining aseptic technique throughout the entire process"},{"key":"C","text":"Preparing the solution as quickly as possible"},{"key":"D","text":"Using non-sterile water to save costs"}],"correct":"B","explanation":"Aseptic technique is the most critical factor in preparing compounded sterile preparations (CSPs). Any break in technique can lead to microbial contamination and patient harm. USP <797 > provides detailed guidance.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_15","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a terminally sterilized parenteral product?","options":[{"key":"A","text":"A product prepared by aseptic filling without final sterilization"},{"key":"B","text":"A product that is filled into containers and then autoclaved"},{"key":"C","text":"A product filtered but not heat-treated"},{"key":"D","text":"A product prepared in a non-sterile environment"}],"correct":"B","explanation":"Terminal sterilization involves filling the product into its final container and then sterilizing the entire product (e.g., by autoclaving). This is more reliable than aseptic processing alone.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_16","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a common chelating agent used in parenteral formulations to prevent metal-catalyzed oxidation?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Edetate disodium (EDTA)"},{"key":"C","text":"Dextrose"},{"key":"D","text":"Benzyl alcohol"}],"correct":"B","explanation":"Edetate disodium (EDTA) is a chelating agent that binds trace metal ions (e.g., iron, copper) that can catalyze oxidation reactions, thereby stabilizing oxidation-sensitive drugs in parenteral formulations.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_17","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a potential consequence of administering a hypotonic intravenous solution?","options":[{"key":"A","text":"Cell shrinkage and pain at the injection site"},{"key":"B","text":"Hemolysis of red blood cells"},{"key":"C","text":"Increased intravascular osmotic pressure"},{"key":"D","text":"Decreased drug solubility"}],"correct":"B","explanation":"Hypotonic IV solutions cause water to move into red blood cells by osmosis, leading to cell swelling and hemolysis (rupture of RBCs). Hypertonic solutions cause cell shrinkage.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_18","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a common buffering agent used in parenteral formulations?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Sodium phosphate buffer"},{"key":"C","text":"Dextrose"},{"key":"D","text":"Mannitol"}],"correct":"B","explanation":"Sodium phosphate buffer is commonly used to maintain pH stability in parenteral formulations. Sodium chloride is for isotonicity. Dextrose is a nutrient/osmotic agent. Mannitol is an osmotic diuretic.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_19","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is true about USP Chapter <797 >?","options":[{"key":"A","text":"It provides standards for non-sterile compounding"},{"key":"B","text":"It establishes standards for compounding sterile preparations to ensure patient safety"},{"key":"C","text":"It only applies to hospital pharmacies"},{"key":"D","text":"It does not require environmental monitoring"}],"correct":"B","explanation":"USP <797 > establishes standards for compounding sterile preparations (CSPs), including personnel training, environmental quality, aseptic technique, and quality assurance to prevent contamination and ensure patient safety.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b4_20","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a common tonicity agent used in ophthalmic and parenteral solutions?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Benzalkonium chloride"},{"key":"C","text":"Methylparaben"},{"key":"D","text":"Citric acid"}],"correct":"A","explanation":"Sodium chloride is the most common tonicity agent used to adjust ophthalmic and parenteral solutions to isotonicity ( ~0.9% w/v). Benzalkonium chloride and methylparaben are preservatives. Citric acid is a buffer.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which excipient is generally inappropriate in a clear ophthalmic solution?","options":[{"key":"A","text":"Buffer"},{"key":"B","text":"Tonicity-adjusting agent"},{"key":"C","text":"Antimicrobial preservative, when applicable"},{"key":"D","text":"Viscosity-enhancing polymer"},{"key":"E","text":"An oil-in-water emulsifier"}],"correct":"E","explanation":"Ophthalmic solutions must be clear. An emulsifier implies an oil-in-water emulsion, which would be cloudy. Buffers, tonicity agents, preservatives and viscosity enhancers are all standard ophthalmic excipients.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"A light- and oxidation-sensitive alkaloid salt is being prepared as an ophthalmic solution. Which approach is least appropriate?","options":[{"key":"A","text":"Use an appropriate antioxidant"},{"key":"B","text":"Add a chelating agent if trace metals promote degradation"},{"key":"C","text":"Package in a light-resistant container"},{"key":"D","text":"Adjust tonicity for ophthalmic use"},{"key":"E","text":"Autoclave without first confirming heat stability"}],"correct":"E","explanation":"Heat sterilization should never be assumed for a light- or oxidation-sensitive drug; heat stability must be confirmed first (otherwise use sterile filtration). Antioxidants, chelators, light-resistant packaging and tonicity adjustment are all appropriate.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"Calculate the amount of sodium chloride needed to make 50 mL of an isotonic ophthalmic solution containing 1% w/v drug A. The sodium chloride equivalent, E, of drug A is 0.18.","options":[{"key":"A","text":"0.225 g"},{"key":"B","text":"0.360 g"},{"key":"C","text":"0.405 g"},{"key":"D","text":"0.450 g"},{"key":"E","text":"0.900 g"}],"correct":"B","explanation":"1% x 50 mL = 0.5 g drug; 0.5 g x 0.18 = 0.09 g NaCl equivalent. An isotonic solution needs 0.9% x 50 mL = 0.45 g NaCl, so add 0.45 - 0.09 = 0.36 g.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"A 1% w/v solution of a drug produces a freezing-point depression of 0.08\u00b0C. Boric acid produces a freezing-point depression of 0.29\u00b0C at 1% w/v. How many grams of boric acid are needed to make 100 mL of the drug solution isotonic, assuming an isotonic freezing-point depression of 0.52\u00b0C?","options":[{"key":"A","text":"0.44 g"},{"key":"B","text":"0.76 g"},{"key":"C","text":"1.52 g"},{"key":"D","text":"2.00 g"},{"key":"E","text":"5.50 g"}],"correct":"C","explanation":"Additional depression needed = 0.52 - 0.08 = 0.44 C. Boric acid gives 0.29 C per 1% w/v, so 0.44/0.29 = 1.52% = 1.52 g per 100 mL.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which route is most appropriate for a sterile progesterone formulation dissolved in sesame oil?","options":[{"key":"A","text":"Intravenous bolus"},{"key":"B","text":"Intravenous infusion"},{"key":"C","text":"Intradermal"},{"key":"D","text":"Intramuscular"},{"key":"E","text":"Intra-arterial"}],"correct":"D","explanation":"Oil-based (depot) injections are given intramuscularly. Oils must never be given intravenously or intra-arterially because of the risk of embolism.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Primary engineering control for aseptic compounding must provide at least:","options":[{"key":"A","text":"ISO Class 4 air quality"},{"key":"B","text":"ISO Class 5 air quality"},{"key":"C","text":"ISO Class 6 air quality"},{"key":"D","text":"ISO Class 7 air quality"},{"key":"E","text":"ISO Class 8 air quality"}],"correct":"B","explanation":"USP <797> requires the primary engineering control (laminar airflow workbench, biological safety cabinet) to provide ISO Class 5 air quality.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which statement about HEPA filters is incorrect?","options":[{"key":"A","text":"They are integral to laminar-airflow workbenches"},{"key":"B","text":"They remove at least 99.97% of 0.3-\u00b5m particles under the standard rating condition"},{"key":"C","text":"They support an ISO Class 5 environment in certified primary engineering controls"},{"key":"D","text":"They must be replaced every month as routine practice"},{"key":"E","text":"Their performance must be verified through scheduled certification"}],"correct":"D","explanation":"HEPA filters are not replaced monthly; they are certified at least every 6 months and whenever the hood is moved or repaired. They remove at least 99.97% of 0.3 micrometer particles.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which direction is preferred when cleaning the interior work surface of a laminar-airflow workbench?","options":[{"key":"A","text":"Bottom to top, front to back"},{"key":"B","text":"Top to bottom, back to front"},{"key":"C","text":"Front to back toward the HEPA filter"},{"key":"D","text":"Random circular movements"},{"key":"E","text":"Side to side beginning at the front edge"}],"correct":"B","explanation":"Clean from top to bottom and back to front so that debris moves away from the HEPA-filtered airflow and is not redeposited on surfaces already cleaned.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which item is not an appropriate vehicle for reconstituting a sterile injectable product?","options":[{"key":"A","text":"Sterile Water for Injection"},{"key":"B","text":"Bacteriostatic Water for Injection, if permitted by labeling"},{"key":"C","text":"Water for Injection"},{"key":"D","text":"Purified Water"},{"key":"E","text":"A manufacturer-supplied diluent"}],"correct":"D","explanation":"Purified Water is not sterile or pyrogen-free. Reconstitution requires Sterile Water for Injection, bacteriostatic water (if labeling permits) or the manufacturer-supplied diluent.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which statement about ampules is incorrect?","options":[{"key":"A","text":"Ampules are usually intended for single-dose use"},{"key":"B","text":"A filter needle or filter straw should be used to reduce the risk of drawing glass particles"},{"key":"C","text":"Ampules do not ordinarily require antimicrobial preservative"},{"key":"D","text":"An ampule is a sealed container that must be opened before withdrawal"},{"key":"E","text":"Air should be injected into an ampule before withdrawing solution"}],"correct":"E","explanation":"An ampule is a sealed glass container with no rubber closure, so air is not injected to equalize pressure; the solution is withdrawn using a filter needle or filter straw to avoid glass particles.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_11","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"For a heat-stable aqueous IV solution, the preferred terminal sterilization method is generally:","options":[{"key":"A","text":"Autoclaving with saturated steam"},{"key":"B","text":"Dry-heat sterilization"},{"key":"C","text":"Gas sterilization"},{"key":"D","text":"Gamma irradiation"},{"key":"E","text":"Ultraviolet exposure"}],"correct":"A","explanation":"Moist heat (saturated steam autoclaving) is the preferred terminal sterilization method for heat-stable aqueous solutions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_12","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"A lyophilized monoclonal-antibody formulation contains trehalose. The principal purpose of trehalose is commonly to act as a:","options":[{"key":"A","text":"Preservative"},{"key":"B","text":"Buffer"},{"key":"C","text":"Surfactant"},{"key":"D","text":"Lyoprotectant"},{"key":"E","text":"Chelating agent"}],"correct":"D","explanation":"Trehalose is a sugar used as a lyoprotectant; it stabilizes proteins during freezing and drying.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_13","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which membrane-filter pore size is conventionally used for sterilizing filtration of heat-labile parenteral solutions?","options":[{"key":"A","text":"0.10 \u00b5m"},{"key":"B","text":"0.22 \u00b5m"},{"key":"C","text":"0.45 \u00b5m"},{"key":"D","text":"0.80 \u00b5m"},{"key":"E","text":"1.20 \u00b5m"}],"correct":"B","explanation":"A 0.22 micrometer membrane filter retains bacteria and is the standard for sterilizing heat-labile solutions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_14","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which agent is routinely used for disinfecting the interior surfaces of a laminar-airflow hood during aseptic compounding?","options":[{"key":"A","text":"Sterile water"},{"key":"B","text":"30% isopropyl alcohol"},{"key":"C","text":"70% isopropyl alcohol"},{"key":"D","text":"100% ethanol"},{"key":"E","text":"Household detergent"}],"correct":"C","explanation":"Sterile 70% isopropyl alcohol is the standard disinfectant for hood surfaces; 70% is more effective than higher concentrations because water aids penetration and protein denaturation.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_15","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"A low-risk compounded sterile preparation is prepared in an ISO Class 5 segregated compounding area rather than an ISO Class 7 buffer room. What principle should guide the beyond-use date assignment?","options":[{"key":"A","text":"It may always be assigned a 14-day refrigerated beyond-use date"},{"key":"B","text":"It must follow the shortest applicable beyond-use-date category allowed for the compounding environment and preparation type"},{"key":"C","text":"Refrigeration automatically permits a 30-day beyond-use date"},{"key":"D","text":"It may be stored indefinitely if a preservative is used"},{"key":"E","text":"Environmental controls are irrelevant if the product is sterile-filtered"}],"correct":"B","explanation":"Beyond-use dates are set by risk category, storage conditions and the compounding environment (USP <797>). The most restrictive applicable limit governs; refrigeration, preservatives or filtration do not automatically extend it.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_16","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which admixture is most likely to create a visible precipitation risk because of acid\u2013base incompatibility?","options":[{"key":"A","text":"Morphine sulfate with metoclopramide hydrochloride"},{"key":"B","text":"Diphenhydramine hydrochloride with normal saline"},{"key":"C","text":"Hydroxyzine hydrochloride with aminophylline"},{"key":"D","text":"Magnesium sulfate with dextrose"},{"key":"E","text":"Potassium chloride with insulin"}],"correct":"C","explanation":"Hydroxyzine HCl is acidic and aminophylline is alkaline; mixing them can precipitate because of pH incompatibility.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_17","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which combination poses a major precipitation concern in total parenteral nutrition?","options":[{"key":"A","text":"Sodium chloride and potassium chloride"},{"key":"B","text":"Calcium gluconate and potassium phosphate"},{"key":"C","text":"Insulin and zinc sulfate"},{"key":"D","text":"Magnesium sulfate and sodium acetate"},{"key":"E","text":"Dextrose and amino acids"}],"correct":"B","explanation":"Calcium and phosphate can form insoluble calcium phosphate crystals in parenteral nutrition, a potentiall
