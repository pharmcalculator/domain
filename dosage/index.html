y":"A","text":"pH"},{"key":"B","text":"Temperature"},{"key":"C","text":"Light exposure"},{"key":"D","text":"Color of the container label"}],"correct":"D","explanation":"The color of the label has no effect on chemical stability. pH, temperature, light exposure, and container material are all important stability factors.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_16","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the primary advantage of using an aqueous solution over a solid dosage form?","options":[{"key":"A","text":"Longer shelf-life"},{"key":"B","text":"Drug is already dissolved and immediately available for absorption"},{"key":"C","text":"Lower cost"},{"key":"D","text":"Better taste"}],"correct":"B","explanation":"In aqueous solutions, the drug is already in solution, eliminating the dissolution step required for tablets and capsules. This can result in faster and more complete absorption.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_17","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is a commonly used antioxidant in aqueous solutions to prevent oxidation?","options":[{"key":"A","text":"Sodium bisulfite"},{"key":"B","text":"Methylparaben"},{"key":"C","text":"Sodium chloride"},{"key":"D","text":"Magnesium stearate"}],"correct":"A","explanation":"Sodium bisulfite (and sodium metabisulfite) are common antioxidants used in aqueous solutions to prevent oxidative degradation. They act by reacting with oxygen or free radicals.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_18","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A patient with diabetes is prescribed an oral liquid medication. What should be checked before dispensing?","options":[{"key":"A","text":"Sugar content of the formulation"},{"key":"B","text":"Color of the liquid"},{"key":"C","text":"Viscosity of the liquid"},{"key":"D","text":"Container type"}],"correct":"A","explanation":"Diabetic patients need to avoid excessive sugar. The formulation 's sugar content (sucrose, sorbitol, etc.) should be checked and the patient counseled appropriately.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_19","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"What is the recommended BUD for water-containing topical/dermal/mucosal liquid formulations according to USP <795>?","options":[{"key":"A","text":"7 days"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days"},{"key":"D","text":"45 days"}],"correct":"C","explanation":"USP <795 > states that water-containing topical/dermal/mucosal liquids have a maximum BUD of 30 days. This applies to creams, lotions, solutions, and similar products.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_20","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is the most appropriate counseling point for a patient using an oral aqueous solution?","options":[{"key":"A","text":"Use a household spoon for accurate dosing"},{"key":"B","text":"Always use the dosing device provided with the medication for accurate dosing"},{"key":"C","text":"The solution can be mixed with hot beverages"},{"key":"D","text":"Refrigeration is not needed for any aqueous solution"}],"correct":"B","explanation":"Oral solutions require accurate dosing using the provided device (dropper, oral syringe, dosing cup). Household spoons are inaccurate and can lead to dosing errors.","reference":"Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of non-aqueous solutions?","options":[{"key":"A","text":"They always contain water as the solvent"},{"key":"B","text":"They use solvents other than water, such as alcohol or propylene glycol"},{"key":"C","text":"They cannot be used orally"},{"key":"D","text":"They are always sterile"}],"correct":"B","explanation":"Non-aqueous solutions use solvents other than water (ethanol, propylene glycol, glycerin, fixed oils) for drugs that are poorly water-soluble or hydrolytically unstable.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"According to the revised USP <795>, what is the default Beyond-Use Date (BUD) for a nonaqueous ORAL LIQUID (e.g., a drug dissolved in propylene glycol), assuming no applicable USP monograph or stability data exists?","options":[{"key":"A","text":"14 days"},{"key":"B","text":"90 days"},{"key":"C","text":"180 days"},{"key":"D","text":"1 year"}],"correct":"B","explanation":"Nonaqueous oral liquids (water activity aw < 0.6) default to a 90-day BUD. This is distinct from 'other' nonaqueous dosage forms (capsules, tablets, suppositories, nonaqueous topicals, etc.), which default to 180 days instead.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of non-aqueous solutions over aqueous solutions?","options":[{"key":"A","text":"They are always less expensive"},{"key":"B","text":"Drugs that are insoluble or unstable in water can be formulated"},{"key":"C","text":"They require no preservatives"},{"key":"D","text":"They have a better taste"}],"correct":"B","explanation":"Non-aqueous solvents dissolve poorly water-soluble drugs and protect hydrolysis-sensitive drugs. This expands the range of drugs that can be formulated as solutions.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the primary solvent in an elixir?","options":[{"key":"A","text":"Water only"},{"key":"B","text":"Alcohol and water mixture"},{"key":"C","text":"Propylene glycol only"},{"key":"D","text":"Glycerin only"}],"correct":"B","explanation":"Elixirs are hydroalcoholic solutions containing 5-40% ethanol. The alcohol-water mixture dissolves both water-soluble and alcohol-soluble drugs.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_5","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a common non-aqueous solvent used in pharmaceutical preparations?","options":[{"key":"A","text":"Purified water"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Sodium chloride solution"},{"key":"D","text":"Dextrose solution"}],"correct":"B","explanation":"Propylene glycol is a versatile non-aqueous solvent used in oral, topical, and injectable formulations. It is miscible with water and has good solvent properties.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_6","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"What is the key counseling point for a patient using a non-aqueous solution that contains alcohol?","options":[{"key":"A","text":"The solution can be taken with other alcohol-containing products without concern"},{"key":"B","text":"The patient should be aware of the alcohol content, especially if they avoid alcohol or are taking disulfiram"},{"key":"C","text":"Alcohol enhances the drug effect in all cases"},{"key":"D","text":"Alcohol content is not a concern for any patient population"}],"correct":"B","explanation":"Alcohol-containing solutions should be avoided by patients taking disulfiram (Antabuse), metronidazole, or those with alcohol use disorder, liver disease, or pregnancy.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_7","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Non-aqueous solutions may be preferred over aqueous solutions when the drug:","options":[{"key":"A","text":"Is highly water-soluble"},{"key":"B","text":"Is hydrolytically unstable in water"},{"key":"C","text":"Requires rapid absorption"},{"key":"D","text":"Tastes better in water"}],"correct":"B","explanation":"Drugs prone to hydrolysis (esters, amides, lactams) are formulated in non-aqueous solvents to prevent degradation. Examples include certain antibiotics and cardiovascular drugs.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_8","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is used as a solvent in non-aqueous solutions for topical application?","options":[{"key":"A","text":"Isopropyl alcohol"},{"key":"B","text":"Magnesium stearate"},{"key":"C","text":"Lactose"},{"key":"D","text":"Povidone"}],"correct":"A","explanation":"Isopropyl alcohol is commonly used in topical solutions (rubs, liniments) due to its solvent properties, rapid evaporation, and skin penetration enhancement.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_9","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the primary concern when preparing non-aqueous solutions?","options":[{"key":"A","text":"Microbial contamination"},{"key":"B","text":"Solvent flammability and toxicity"},{"key":"C","text":"Drug precipitation on dilution with water"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Non-aqueous solutions have multiple concerns: microbial contamination (if water is present), solvent flammability and toxicity, and drug precipitation when diluted with water.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_10","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about glycerin as a pharmaceutical solvent?","options":[{"key":"A","text":"It is completely non-hygroscopic"},{"key":"B","text":"It is viscous, sweet-tasting, and miscible with water and alcohol"},{"key":"C","text":"It is primarily used for external preparations only"},{"key":"D","text":"It cannot be used in oral formulations"}],"correct":"B","explanation":"Glycerin is a viscous, hygroscopic liquid with a sweet taste. It is miscible with water and alcohol, making it useful as a solvent, humectant, and sweetener.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_11","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the purpose of adding a co-solvent to a non-aqueous solution?","options":[{"key":"A","text":"To increase the viscosity"},{"key":"B","text":"To improve the solubility of the drug"},{"key":"C","text":"To add color to the solution"},{"key":"D","text":"To reduce the cost"}],"correct":"B","explanation":"Co-solvents alter the dielectric constant of the solvent system, increasing the solubility of poorly soluble drugs. Common co-solvents include ethanol, propylene glycol, and glycerin.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_12","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"hard","question":"A patient is taking a non-aqueous oral solution that contains propylene glycol. Which patient population should be monitored more closely?","options":[{"key":"A","text":"Pediatric patients"},{"key":"B","text":"Adult patients with normal renal function"},{"key":"C","text":"Patients with well-controlled diabetes"},{"key":"D","text":"Elderly patients with no comorbidities"}],"correct":"A","explanation":"propylene glycol can accumulate in pediatric patients","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_13","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the difference between a solution and a tincture?","options":[{"key":"A","text":"Tinctures are alcoholic solutions of nonvolatile plant constituents"},{"key":"B","text":"Solutions always contain water"},{"key":"C","text":"Tinctures are always sugar-free"},{"key":"D","text":"Solutions have a higher alcohol content than tinctures"}],"correct":"A","explanation":"Tinctures are hydroalcoholic solutions prepared by extraction of plant materials (maceration or percolation). They typically contain 25-90% ethanol.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_14","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following factors should be considered when selecting a non-aqueous solvent?","options":[{"key":"A","text":"Solubility of the drug"},{"key":"B","text":"Toxicity and irritation potential"},{"key":"C","text":"Compatibility with other ingredients"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Solvent selection requires consideration of drug solubility, toxicity and irritation potential, and compatibility with other ingredients. Safety and efficacy are paramount.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_15","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the recommended storage condition for non-aqueous solutions that are volatile?","options":[{"key":"A","text":"In a tightly closed container in a cool place"},{"key":"B","text":"At room temperature in an open container"},{"key":"C","text":"In the refrigerator in an open container"},{"key":"D","text":"In the freezer"}],"correct":"A","explanation":"Volatile non-aqueous solvents (ethanol, isopropyl alcohol) require tightly closed containers and cool storage to prevent evaporation and maintain concentration.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_16","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is used as a preservative in non-aqueous solutions?","options":[{"key":"A","text":"Methylparaben"},{"key":"B","text":"Propylparaben"},{"key":"C","text":"Both A and B may be used"},{"key":"D","text":"No preservative is needed in all non-aqueous solutions"}],"correct":"C","explanation":"Methylparaben and propylparaben are used as preservatives in non-aqueous solutions where water is present or when antimicrobial activity is needed.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_17","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the primary advantage of using fixed oils as a solvent for non-aqueous preparations?","options":[{"key":"A","text":"They are inexpensive"},{"key":"B","text":"They dissolve many lipophilic drugs"},{"key":"C","text":"They are water-miscible"},{"key":"D","text":"They have a long shelf-life"}],"correct":"B","explanation":"Fixed oils (peanut, sesame, cottonseed, corn oil) are excellent solvents for lipophilic drugs, providing stable solutions for oral and injectable (IM) use.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_18","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which patient counseling point is MOST important for non-aqueous solutions containing alcohol?","options":[{"key":"A","text":"Take with food to reduce stomach upset"},{"key":"B","text":"Do not consume with grapefruit juice"},{"key":"C","text":"Use the dosing device provided, not a household spoon"},{"key":"D","text":"Keep away from heat and flame"}],"correct":"D","explanation":"alcohol-based solutions are flammable","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_19","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"What is the function of a surfactant in a non-aqueous solution?","options":[{"key":"A","text":"To increase drug solubility"},{"key":"B","text":"To improve flow properties"},{"key":"C","text":"To act as a preservative"},{"key":"D","text":"To add color"}],"correct":"A","explanation":"Surfactants in non-aqueous solutions act as solubilizing agents, forming micelles that encapsulate poorly soluble drugs and increase their apparent solubility.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b3_20","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is a characteristic of oil-based non-aqueous solutions for parenteral administration?","options":[{"key":"A","text":"They should be administered intravenously only"},{"key":"B","text":"They are sterile and may be used for intramuscular injection"},{"key":"C","text":"They require no special storage"},{"key":"D","text":"They are always clear and colorless"}],"correct":"B","explanation":"Oil-based parenteral solutions are sterile and used for IM injection (depot preparations). They are not suitable for IV administration due to embolism risk.","reference":"Non-Aqueous Solutions"},{"id":"colloids_b3_1","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the defining characteristic of a colloidal dispersion?","options":[{"key":"A","text":"Particle size between 0.001 and 1 micron"},{"key":"B","text":"Particles are visible to the naked eye"},{"key":"C","text":"Particles settle rapidly"},{"key":"D","text":"Particles are only in liquid form"}],"correct":"A","explanation":"Colloidal dispersions have particles between 1 nm (0.001 \u00b5m) and 1000 nm (1 \u00b5m). This size range is between true solutions ( <1 nm) and coarse dispersions ( >1 \u00b5m).","reference":"Colloids"},{"id":"colloids_b3_2","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a colloidal system?","options":[{"key":"A","text":"Sodium chloride solution"},{"key":"B","text":"Milk"},{"key":"C","text":"Simple syrup"},{"key":"D","text":"Purified water"}],"correct":"B","explanation":"Milk is a colloidal dispersion of fat globules and proteins in water. It exhibits the Tyndall effect and other colloidal properties.","reference":"Colloids"},{"id":"colloids_b3_3","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the difference between a colloid and a true solution?","options":[{"key":"A","text":"Colloids have larger particle sizes and scatter light (Tyndall effect)"},{"key":"B","text":"Colloids are always unstable"},{"key":"C","text":"True solutions are always colored"},{"key":"D","text":"Colloids require heating to prepare"}],"correct":"A","explanation":"Colloidal particles (1-1000 nm) scatter light (Tyndall effect), while true solution particles ( <1 nm) do not. Colloids are also more complex and often not thermodynamically stable.","reference":"Colloids"},{"id":"colloids_b3_4","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the Tyndall effect?","options":[{"key":"A","text":"The precipitation of colloids when heated"},{"key":"B","text":"The scattering of light by colloidal particles"},{"key":"C","text":"The stability of colloids in solution"},{"key":"D","text":"The color change of colloids at different temperatures"}],"correct":"B","explanation":"The Tyndall effect is the scattering of light by colloidal particles. It occurs because colloidal particles are comparable in size to the wavelength of visible light.","reference":"Colloids"},{"id":"colloids_b3_5","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is a lyophilic colloid?","options":[{"key":"A","text":"Gold sol"},{"key":"B","text":"Gelatin"},{"key":"C","text":"Silver iodide"},{"key":"D","text":"Sulfur sol"}],"correct":"B","explanation":"Gelatin is a lyophilic (solvent-loving) colloid that spontaneously disperses in water, forming stable colloidal solutions due to strong solvent-particle interactions.","reference":"Colloids"},{"id":"colloids_b3_6","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"hard","question":"What is the primary stabilization mechanism for lyophobic colloids?","options":[{"key":"A","text":"Solvent layer"},{"key":"B","text":"Charge repulsion (electrical double layer)"},{"key":"C","text":"Hydrophilic groups"},{"key":"D","text":"High molecular weight"}],"correct":"B","explanation":"Lyophobic colloids (e.g., gold sol) are stabilized by electrostatic repulsion from the electrical double layer. The zeta potential prevents particle aggregation.","reference":"Colloids"},{"id":"colloids_b3_7","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is an application of colloids in pharmacy?","options":[{"key":"A","text":"All injectable formulations"},{"key":"B","text":"Some intravenous lipid emulsions (for nutrition)"},{"key":"C","text":"All oral tablets"},{"key":"D","text":"Only external preparations"}],"correct":"B","explanation":"Colloidal systems in pharmacy include IV lipid emulsions (nutrition), liposomes (drug delivery), and colloidal dispersions (injectable iron preparations).","reference":"Colloids"},{"id":"colloids_b3_8","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What factor can destabilize a lyophobic colloid?","options":[{"key":"A","text":"Addition of an electrolyte"},{"key":"B","text":"Increase in temperature"},{"key":"C","text":"Prolonged storage"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Lyophobic colloids can be destabilized by electrolytes (compressing the double layer), temperature changes, and prolonged storage (particle growth).","reference":"Colloids"},{"id":"colloids_b3_9","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about lyophilic colloids?","options":[{"key":"A","text":"They are more stable than lyophobic colloids due to solvent interaction"},{"key":"B","text":"They are less stable than lyophobic colloids"},{"key":"C","text":"They are not used in pharmaceutical products"},{"key":"D","text":"They require electrolytes for stability"}],"correct":"A","explanation":"Lyophilic colloids are thermodynamically stable due to strong solvent-particle interactions. They are reversible, self-stabilizing, and do not require electrolytes.","reference":"Colloids"},{"id":"colloids_b3_10","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"What is the process of coagulation in colloids?","options":[{"key":"A","text":"The dispersion of particles in the solution"},{"key":"B","text":"The aggregation and precipitation of colloidal particles"},{"key":"C","text":"The dissolution of particles in the solvent"},{"key":"D","text":"The heating of the colloid"}],"correct":"B","explanation":"Coagulation (or flocculation) is the aggregation of colloidal particles into larger masses that precipitate. This is often irreversible for lyophobic colloids.","reference":"Colloids"},{"id":"colloids_b3_11","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is a protective colloid used to stabilize other colloidal systems?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Acacia"},{"key":"C","text":"Magnesium sulfate"},{"key":"D","text":"Calcium carbonate"}],"correct":"B","explanation":"Acacia (gum arabic) is a protective colloid that adsorbs onto lyophobic particles and prevents their coagulation. It stabilizes suspensions and emulsions.","reference":"Colloids"},{"id":"colloids_b3_12","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the Gold number used to measure?","options":[{"key":"A","text":"The stability of gold sols"},{"key":"B","text":"The protective power of colloids"},{"key":"C","text":"The size of gold particles"},{"key":"D","text":"The color of gold solutions"}],"correct":"B","explanation":"The Gold number measures the protective power of a colloid --- the minimum milligrams needed to prevent coagulation of 10 mL of gold sol by 1 mL of 10% NaCl.","reference":"Colloids"},{"id":"colloids_b3_13","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following colloidal systems is used as a diagnostic agent?","options":[{"key":"A","text":"Colloidal iron"},{"key":"B","text":"Colloidal sulfur"},{"key":"C","text":"Colloidal gold"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Colloidal iron (hematinics), colloidal sulfur (scabicides), and colloidal gold (diagnostic imaging) are all used in pharmacy and medicine.","reference":"Colloids"},{"id":"colloids_b3_14","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"What is the term for the movement of colloidal particles under the influence of an electric field?","options":[{"key":"A","text":"Brownian movement"},{"key":"B","text":"Electrophoresis"},{"key":"C","text":"Tyndall effect"},{"key":"D","text":"Dialysis"}],"correct":"B","explanation":"Electrophoresis is the movement of charged colloidal particles toward the oppositely charged electrode in an electric field. It is used to characterize particle charge.","reference":"Colloids"},{"id":"colloids_b3_15","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Which of the following is the most important factor in determining the stability of a lyophobic colloid?","options":[{"key":"A","text":"Size of the particles"},{"key":"B","text":"Charge on the particles"},{"key":"C","text":"Color of the solution"},{"key":"D","text":"Temperature of the solution"}],"correct":"B","explanation":"The zeta potential (charge) is the most important stability factor for lyophobic colloids. Higher charge \u2192 greater repulsion \u2192 more stable colloid.","reference":"Colloids"},{"id":"colloids_b3_16","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is dialysis in the context of colloids?","options":[{"key":"A","text":"The purification of colloids by removing electrolytes or small molecules through a semipermeable membrane"},{"key":"B","text":"The measurement of particle size"},{"key":"C","text":"The heating of colloids"},{"key":"D","text":"The precipitation of colloids"}],"correct":"A","explanation":"Dialysis uses a semipermeable membrane to separate small molecules/ions from larger colloidal particles. It purifies colloids and removes electrolytes.","reference":"Colloids"},{"id":"colloids_b3_17","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a colloidal drug delivery system?","options":[{"key":"A","text":"Liposomes"},{"key":"B","text":"Tablets"},{"key":"C","text":"Syrups"},{"key":"D","text":"Capsules"}],"correct":"A","explanation":"Liposomes are colloidal vesicles composed of lipid bilayers. They encapsulate drugs and provide targeted, controlled delivery.","reference":"Colloids"},{"id":"colloids_b3_18","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is Brownian movement in colloidal systems?","options":[{"key":"A","text":"The settling of particles to the bottom"},{"key":"B","text":"The random motion of particles due to molecular collisions"},{"key":"C","text":"The movement of particles in an electric field"},{"key":"D","text":"The aggregation of particles"}],"correct":"B","explanation":"Brownian motion is the random, zigzag movement of colloidal particles resulting from unequal collisions with solvent molecules. It prevents sedimentation.","reference":"Colloids"},{"id":"colloids_b3_19","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Which of the following would be classified as a colloidal dispersion?","options":[{"key":"A","text":"An intravenous lipid emulsion"},{"key":"B","text":"A simple sugar solution"},{"key":"C","text":"A tablet"},{"key":"D","text":"A capsule shell"}],"correct":"A","explanation":"IV lipid emulsions (e.g., Intralipid) are colloidal dispersions of oil droplets (100-500 nm) in water. They are stable colloidal systems.","reference":"Colloids"},{"id":"colloids_b3_20","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"What is the primary application of colloids in drug delivery?","options":[{"key":"A","text":"To improve drug solubility and stability"},{"key":"B","text":"To increase tablet hardness"},{"key":"C","text":"To improve capsule appearance"},{"key":"D","text":"To reduce the cost of manufacturing"}],"correct":"A","explanation":"Colloidal delivery systems (liposomes, micelles, nanoparticles) improve solubility of poorly water-soluble drugs, protect them from degradation, and enable targeted delivery.","reference":"Colloids"},{"id":"suspensions_b3_1","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the difference between an emulsion and a suspension?","options":[{"key":"A","text":"Emulsions contain solid particles in a liquid; suspensions contain two immiscible liquids"},{"key":"B","text":"Emulsions are two immiscible liquids (liquid in liquid); suspensions contain solid particles in a liquid"},{"key":"C","text":"Emulsions are always sterile; suspensions are never sterile"},{"key":"D","text":"Suspensions are always stable; emulsions are never stable"}],"correct":"B","explanation":"Emulsions are liquid-in-liquid dispersions (oil in water or water in oil). Suspensions are solid-in-liquid dispersions where solid particles are dispersed in a liquid vehicle.","reference":"Suspensions"},{"id":"suspensions_b3_2","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A patient is prescribed an oral suspension of amoxicillin. What counseling point is most important?","options":[{"key":"A","text":"Shake well before each use to ensure uniform dosing"},{"key":"B","text":"Keep the suspension in the freezer"},{"key":"C","text":"Use a household spoon for accurate dosing"},{"key":"D","text":"Do not refrigerate the suspension"}],"correct":"A","explanation":"Oral suspensions settle on standing. Shaking ensures uniform distribution of drug particles, providing accurate dosing. Failure to shake can result in underdosing or overdosing.","reference":"Suspensions"},{"id":"suspensions_b3_3","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the function of a wetting agent in a suspension?","options":[{"key":"A","text":"To prevent microbial growth"},{"key":"B","text":"To displace air from the surface of solid particles and allow them to be wetted by the liquid"},{"key":"C","text":"To increase the viscosity of the suspension"},{"key":"D","text":"To adjust the pH of the suspension"}],"correct":"B","explanation":"Wetting agents (surfactants) reduce surface tension, allowing the liquid vehicle to displace air from hydrophobic particle surfaces. This prevents floating and ensures uniform dispersion.","reference":"Suspensions"},{"id":"suspensions_b3_4","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following excipients is commonly used as a suspending agent?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Carboxymethylcellulose (CMC)"},{"key":"C","text":"Lactose"},{"key":"D","text":"Sucrose"}],"correct":"B","explanation":"CMC (carboxymethylcellulose sodium) is a suspending agent that increases viscosity and reduces sedimentation. Other suspending agents include xanthan gum, tragacanth, and methylcellulose.","reference":"Suspensions"},{"id":"suspensions_b3_5","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the primary problem with suspensions that must be addressed during formulation?","options":[{"key":"A","text":"Caking or sedimentation of particles"},{"key":"B","text":"Color instability"},{"key":"C","text":"Lack of taste"},{"key":"D","text":"Excessive clarity"}],"correct":"A","explanation":"Sedimentation and caking are the primary physical stability problems. Suspensions must be formulated to settle slowly and redisperse easily without forming hard cakes.","reference":"Suspensions"},{"id":"suspensions_b3_6","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"hard","question":"A patient who cannot swallow tablets is prescribed a dopamine agonist. Which dopamine agonist dosage form is available for patients with swallowing difficulties?","options":[{"key":"A","text":"Oral suspension"},{"key":"B","text":"Oral tablets"},{"key":"C","text":"Transdermal patch"},{"key":"D","text":"Sublingual tablet"}],"correct":"B,C","explanation":"Oral suspension is NOT available for dopamine agonists","reference":"Suspensions"},{"id":"suspensions_b3_7","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the recommended BUD for water-containing oral suspensions?","options":[{"key":"A","text":"7 days"},{"key":"B","text":"14 days when stored at controlled cold temperature"},{"key":"C","text":"30 days"},{"key":"D","text":"45 days"}],"correct":"B","explanation":"USP <795 > specifies that water-containing oral suspensions have a maximum BUD of 14 days under refrigeration. This limits microbial growth and degradation.","reference":"Suspensions"},{"id":"suspensions_b3_8","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is a flocculated suspension?","options":[{"key":"A","text":"A suspension where particles are evenly distributed and do not settle"},{"key":"B","text":"A suspension where particles form loose aggregates (flocs) that settle but are easily redispersed"},{"key":"C","text":"A suspension where particles are permanently aggregated and cannot be redispersed"},{"key":"D","text":"A suspension where particles are dissolved"}],"correct":"B","explanation":"Flocculated suspensions form loose, porous aggregates that settle rapidly but are easily redispersed with gentle shaking. This prevents hard caking.","reference":"Suspensions"},{"id":"suspensions_b3_9","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the purpose of a suspending agent in an oral suspension?","options":[{"key":"A","text":"To reduce the particle size of the drug"},{"key":"B","text":"To increase the viscosity and retard settling of particles"},{"key":"C","text":"To improve the taste of the suspension"},{"key":"D","text":"To add color to the suspension"}],"correct":"B","explanation":"Suspending agents increase viscosity, reducing sedimentation rate. They also form a network that entraps particles, preventing caking and improving redispersibility.","reference":"Suspensions"},{"id":"suspensions_b3_10","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is a characteristic of a well-formulated suspension?","options":[{"key":"A","text":"Particles settle slowly and are easily redispersed with shaking"},{"key":"B","text":"Particles are always suspended without settling"},{"key":"C","text":"The suspension is always clear"},{"key":"D","text":"No preservative is needed"}],"correct":"A","explanation":"A well-formulated suspension strikes a balance: slow settling provides dosing window, easy redispersion prevents caking. Complete suspension is impractical.","reference":"Suspensions"},{"id":"suspensions_b3_11","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A patient is given a prescription for an antibiotic suspension that must be reconstituted. What should be counseled?","options":[{"key":"A","text":"The suspension should be stored at room temperature"},{"key":"B","text":"The suspension should be shaken well and discarded after the BUD"},{"key":"C","text":"The suspension does not require shaking"},{"key":"D","text":"The suspension can be frozen for up to 1 year"}],"correct":"B","explanation":"Reconstituted suspensions have limited stability. Patients should be counseled to shake well before each use, refrigerate as directed, and discard after the BUD.","reference":"Suspensions"},{"id":"suspensions_b3_12","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the difference between a flocculated and a deflocculated suspension?","options":[{"key":"A","text":"Flocculated particles are larger and settle faster; deflocculated particles are smaller and settle slowly"},{"key":"B","text":"Flocculated suspensions are always preferred"},{"key":"C","text":"Deflocculated suspensions are easier to redisperse"},{"key":"D","text":"There is no difference between the two"}],"correct":"A","explanation":"Flocculated suspensions form aggregates that settle rapidly (Stokes ' law). Deflocculated particles settle slowly but form hard cakes. Both have advantages and disadvantages.","reference":"Suspensions"},{"id":"suspensions_b3_13","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is used as a preservative in suspensions?","options":[{"key":"A","text":"Methylparaben"},{"key":"B","text":"Propylparaben"},{"key":"C","text":"Both methylparaben and propylparaben"},{"key":"D","text":"No preservative is needed in all suspensions"}],"correct":"C","explanation":"Methylparaben and propylparaben are commonly used together in suspensions for broad-spectrum antimicrobial activity. They are effective against bacteria and fungi.","reference":"Suspensions"},{"id":"suspensions_b3_14","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the importance of particle size in suspension formulation?","options":[{"key":"A","text":"Smaller particles settle more slowly and provide better bioavailability"},{"key":"B","text":"Larger particles are always preferred"},{"key":"C","text":"Particle size does not affect suspension stability"},{"key":"D","text":"Smaller particles are always more stable"}],"correct":"A","explanation":"Smaller particles settle more slowly (Stokes ' law) and have greater surface area for dissolution, improving bioavailability. However, very small particles may be difficult to wet.","reference":"Suspensions"},{"id":"suspensions_b3_15","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following drugs is commonly available as an oral suspension?","options":[{"key":"A","text":"Amoxicillin"},{"key":"B","text":"Lisinopril"},{"key":"C","text":"Atorvastatin"},{"key":"D","text":"Metformin"}],"correct":"A","explanation":"Amoxicillin is commonly available as an oral suspension for pediatric use. Other antibiotics (azithromycin, cefdinir) and antacids are also available as suspensions.","reference":"Suspensions"},{"id":"suspensions_b3_16","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the primary advantage of a suspension over a solution?","options":[{"key":"A","text":"It is always more stable"},{"key":"B","text":"Poorly soluble drugs can be formulated as suspensions"},{"key":"C","text":"It tastes better"},{"key":"D","text":"It requires no shaking before use"}],"correct":"B","explanation":"Suspensions allow formulation of poorly water-soluble drugs that cannot be formulated as solutions. They provide oral delivery for drugs with limited aqueous solubility.","reference":"Suspensions"},{"id":"suspensions_b3_17","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is caking in a suspension?","options":[{"key":"A","text":"The formation of a hard, non-redispersible mass at the bottom of the container"},{"key":"B","text":"The uniform distribution of particles throughout the suspension"},{"key":"C","text":"The dissolution of particles"},{"key":"D","text":"The fermentation of the suspension"}],"correct":"A","explanation":"Caking occurs when deflocculated particles settle into a dense sediment. Strong interparticle forces create a hard mass that cannot be redispersed by shaking.","reference":"Suspensions"},{"id":"suspensions_b3_18","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A patient is prescribed a topical corticosteroid suspension for a skin condition. What should be counseled?","options":[{"key":"A","text":"Shake well before use"},{"key":"B","text":"Apply only to dry skin"},{"key":"C","text":"Use only on the face"},{"key":"D","text":"Do not shake before use"}],"correct":"A","explanation":"Topical suspensions, like oral suspensions, require shaking before use to ensure uniform drug distribution. This is especially important for lotions and topical steroid suspensions.","reference":"Suspensions"},{"id":"suspensions_b3_19","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"What is the function of a surfactant in a suspension?","options":[{"key":"A","text":"To act as a wetting agent"},{"key":"B","text":"To increase the viscosity"},{"key":"C","text":"To act as a preservative"},{"key":"D","text":"To adjust the pH"}],"correct":"A","explanation":"Surfactants act as wetting agents, reducing surface tension and allowing the liquid to wet hydrophobic particle surfaces. This ensures uniform dispersion and prevents floating.","reference":"Suspensions"},{"id":"suspensions_b3_20","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which of the following is the most appropriate storage advice for a reconstituted oral suspension?","options":[{"key":"A","text":"Store at room temperature and discard after 14 days"},{"key":"B","text":"Store in the refrigerator and discard after the manufacturer's recommended BUD"},{"key":"C","text":"Store in the freezer"},{"key":"D","text":"Store in a warm place for better dissolution"}],"correct":"B","explanation":"Reconstituted suspensions should be refrigerated (unless otherwise specified) and discarded after the BUD (typically 7-14 days). Storage conditions vary by product.","reference":"Suspensions"},{"id":"emulsions_b3_1","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"What is the difference between an emulsion and a suspension?","options":[{"key":"A","text":"Emulsions contain solid particles; suspensions contain liquid droplets"},{"key":"B","text":"Emulsions contain liquid droplets dispersed in another liquid; suspensions contain solid particles in a liquid"},{"key":"C","text":"Emulsions are always stable; suspensions are never stable"},{"key":"D","text":"Emulsions require shaking; suspensions do not"}],"correct":"B","explanation":"Emulsions are liquid-in-liquid dispersions; suspensions are solid-in-liquid dispersions. Emulsions require emulsifying agents; suspensions require suspending agents.","reference":"Emulsions"},{"id":"emulsions_b3_2","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of an oil-in-water (O/W) emulsion?","options":[{"key":"A","text":"Milk"},{"key":"B","text":"Butter"},{"key":"C","text":"Margarine"},{"key":"D","text":"Petrolatum"}],"correct":"A","explanation":"Milk is an O/W emulsion with fat globules dispersed in an aqueous continuous phase. Other O/W emulsions include mayonnaise and most pharmaceutical creams.","reference":"Emulsions"},{"id":"emulsions_b3_3","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"What is the function of an emulsifying agent?","options":[{"key":"A","text":"To increase the particle size of the dispersed phase"},{"key":"B","text":"To stabilize the emulsion by reducing interfacial tension and forming a protective film"},{"key":"C","text":"To increase the density of the continuous phase"},{"key":"D","text":"To add color to the emulsion"}],"correct":"B","explanation":"Emulsifying agents reduce interfacial tension between oil and water phases and form a protective film around dispersed droplets, preventing coalescence.","reference":"Emulsions"},{"id":"emulsions_b3_4","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the HLB (Hydrophilic-Lipophilic Balance) number used for?","options":[{"key":"A","text":"To determine the particle size of the emulsion"},{"key":"B","text":"To select the appropriate surfactant for a specific emulsion type"},{"key":"C","text":"To measure the viscosity of the emulsion"},{"key":"D","text":"To determine the color of the emulsion"}],"correct":"B","explanation":"The HLB system helps select surfactants based on their hydrophilicity. Low HLB (3-6) for W/O emulsions; high HLB (8-18) for O/W emulsions.","reference":"Emulsions"},{"id":"emulsions_b3_5","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a water-in-oil (W/O) emulsion?","options":[{"key":"A","text":"Milk"},{"key":"B","text":"Cold cream"},{"key":"C","text":"Vanishing cream"},{"key":"D","text":"Purified water"}],"correct":"B","explanation":"Cold cream is a classic W/O emulsion with water droplets dispersed in an oil continuous phase. It provides occlusive, emollient properties.","reference":"Emulsions"},{"id":"emulsions_b3_6","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the primary difference between an oil-in-water and a water-in-oil emulsion?","options":[{"key":"A","text":"The pH of the formulation"},{"key":"B","text":"The phase that is dispersed and the phase that is continuous"},{"key":"C","text":"The color of the emulsion"},{"key":"D","text":"The viscosity of the formulation"}],"correct":"B","explanation":"In O/W emulsions, oil is dispersed in water. In W/O emulsions, water is dispersed in oil. The continuous phase determines the emulsion 's properties.","reference":"Emulsions"},{"id":"emulsions_b3_7","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which type of emulsion is generally more cosmetically acceptable for topical application?","options":[{"key":"A","text":"Water-in-oil (W/O)"},{"key":"B","text":"Oil-in-water (O/W)"},{"key":"C","text":"Both are equally acceptable"},{"key":"D","text":"Neither is acceptable"}],"correct":"B","explanation":"O/W emulsions are less greasy, easier to spread, and more easily washed off, making them more cosmetically acceptable than W/O emulsions.","reference":"Emulsions"},{"id":"emulsions_b3_8","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is creaming in an emulsion?","options":[{"key":"A","text":"The breaking of the emulsion into separate phases"},{"key":"B","text":"The migration of dispersed droplets to the top or bottom of the emulsion, which is reversible"},{"key":"C","text":"The growth of microorganisms in the emulsion"},{"key":"D","text":"The chemical degradation of the drug"}],"correct":"B","explanation":"Creaming is upward (or downward) movement of dispersed droplets due to density differences. It is reversible with gentle shaking (unlike coalescence).","reference":"Emulsions"},{"id":"emulsions_b3_9","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a commonly used emulsifying agent for O/W emulsions?","options":[{"key":"A","text":"Acacia (gum arabic)"},{"key":"B","text":"Beeswax"},{"key":"C","text":"Petrolatum"},{"key":"D","text":"Hard paraffin"}],"correct":"A","explanation":"Acacia is a natural emulsifying agent used in O/W emulsions (e.g., cod liver oil emulsion). It forms a strong interfacial film around oil droplets.","reference":"Emulsions"},{"id":"emulsions_b3_10","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the primary cause of emulsion instability?","options":[{"key":"A","text":"Coalescence of dispersed droplets leading to phase separation"},{"key":"B","text":"Microbial contamination only"},{"key":"C","text":"Temperature change only"},{"key":"D","text":"Light exposure only"}],"correct":"A","explanation":"Coalescence (merging of droplets) is the most serious instability mechanism, leading to irreversible phase separation (cracking). It is caused by insufficient emulsifier.","reference":"Emulsions"},{"id":"emulsions_b3_11","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the difference between creaming and coalescence in an emulsion?","options":[{"key":"A","text":"Creaming is reversible; coalescence is irreversible"},{"key":"B","text":"Creaming is irreversible; coalescence is reversible"},{"key":"C","text":"Both are reversible"},{"key":"D","text":"Both are irreversible"}],"correct":"A","explanation":"Creaming is reversible by shaking. Coalescence is irreversible --- droplets merge and cannot be separated back into droplets by shaking.","reference":"Emulsions"},{"id":"emulsions_b3_12","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is an appropriate emulsifying agent for parenteral emulsions?","options":[{"key":"A","text":"Egg lecithin"},{"key":"B","text":"Tween 80"},{"key":"C","text":"Span 80"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Egg lecithin, polysorbate 80 (Tween 80), and sorbitan monooleate (Span 80) are all used in parenteral emulsions. Lecithin is most common for IV lipid emulsions.","reference":"Emulsions"},{"id":"emulsions_b3_13","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the primary application of intravenous lipid emulsions in pharmacy?","options":[{"key":"A","text":"As a source of calories (total parenteral nutrition)"},{"key":"B","text":"As a diagnostic agent"},{"key":"C","text":"As a vehicle for oral drugs"},{"key":"D","text":"As a topical preparation"}],"correct":"A","explanation":"IV lipid emulsions (e.g., Intralipid) provide essential fatty acids and calories in total parenteral nutrition (TPN) for patients who cannot eat.","reference":"Emulsions"},{"id":"emulsions_b3_14","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following statements about HLB values is correct?","options":[{"key":"A","text":"Low HLB (3-6) indicates hydrophilic surfactants for O/W emulsions"},{"key":"B","text":"High HLB (8-18) indicates lipophilic surfactants for W/O emulsions"},{"key":"C","text":"Low HLB (3-6) indicates lipophilic surfactants for W/O emulsions"},{"key":"D","text":"HLB values are not useful for emulsifier selection"}],"correct":"C","explanation":"Low HLB surfactants are lipophilic and favor W/O emulsions. High HLB surfactants are hydrophilic and favor O/W emulsions. HLB is a useful selection tool.","reference":"Emulsions"},{"id":"emulsions_b3_15","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is the purpose of a preservative in an emulsion?","options":[{"key":"A","text":"To prevent microbial growth in the aqueous phase"},{"key":"B","text":"To increase the viscosity"},{"key":"C","text":"To improve the color"},{"key":"D","text":"To adjust the pH"}],"correct":"A","explanation":"Preservatives are needed in the aqueous phase of emulsions to prevent microbial growth. The oil phase is generally not susceptible to microbial contamination.","reference":"Emulsions"},{"id":"emulsions_b3_16","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following patient counseling points is most important for an emulsion product?","options":[{"key":"A","text":"Shake well before use"},{"key":"B","text":"Store in the freezer"},{"key":"C","text":"Do not shake before use"},{"key":"D","text":"Use only on the face"}],"correct":"A","explanation":"Like suspensions, emulsions may separate on standing. Shaking before use ensures uniform distribution of drug and excipients.","reference":"Emulsions"},{"id":"emulsions_b3_17","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"What is phase inversion in an emulsion?","options":[{"key":"A","text":"The change of an O/W emulsion to a W/O emulsion or vice versa"},{"key":"B","text":"The increase in particle size"},{"key":"C","text":"The separation of phases"},{"key":"D","text":"The color change of the emulsion"}],"correct":"A","explanation":"Phase inversion occurs when the continuous and dispersed phases switch roles. This can be caused by temperature changes, adding excess dispersed phase, or changing surfactants.","reference":"Emulsions"},{"id":"emulsions_b3_18","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a lipid-soluble emulsifying agent suitable for W/O emulsions?","options":[{"key":"A","text":"Span 80"},{"key":"B","text":"Tween 80"},{"key":"C","text":"Acacia"},{"key":"D","text":"Sodium lauryl sulfate"}],"correct":"A","explanation":"Span 80 (sorbitan monooleate) is a lipophilic surfactant with low HLB, suitable for W/O emulsions. It dissolves in the oil phase.","reference":"Emulsions"},{"id":"emulsions_b3_19","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"What is the recommended BUD for water-containing topical/dermal/mucosal emulsions?","options":[{"key":"A","text":"7 days"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days when stored at controlled cold temperature"},{"key":"D","text":"45 days"}],"correct":"C","explanation":"USP <795 > states that water-containing topical/dermal/mucosal emulsions (creams, lotions) have a maximum BUD of 30 days under refrigeration.","reference":"Emulsions"},{"id":"emulsions_b3_20","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about emulsion stability?","options":[{"key":"A","text":"O/W emulsions are more stable than W/O emulsions"},{"key":"B","text":"The stability of an emulsion depends on the emulsifying agent, temperature, and storage conditions"},{"key":"C","text":"All emulsions are stable indefinitely"},{"key":"D","text":"Emulsions do not require preservatives"}],"correct":"B","explanation":"Emulsion stability depends on multiple factors: emulsifier type/concentration, storage temperature, physical handling, and microbial growth.","reference":"Emulsions"},{"id":"sterile_forms_b3_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which USP chapter addresses sterile compounding?","options":[{"key":"A","text":"USP <795>"},{"key":"B","text":"USP <797>"},{"key":"C","text":"USP <800>"},{"key":"D","text":"USP <1160>"}],"correct":"B","explanation":"USP <797 > is the standard for sterile compounding in pharmacy, covering facility requirements, personnel training, environmental monitoring, and beyond-use dates.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following describes a Category 2 compounded sterile preparation (CSP) under the revised USP <797>?","options":[{"key":"A","text":"Prepared in an ISO Class 5 primary engineering control located within a classified cleanroom suite (ISO 7 buffer room)"},{"key":"B","text":"Prepared in an unclassified segregated compounding area with only an ISO 5 primary engineering control"},{"key":"C","text":"Administered within 4 hours of preparation under immediate-use provisions"},{"key":"D","text":"Always requires sterility testing regardless of storage duration"}],"correct":"A","explanation":"Category 2 CSPs are compounded in an ISO Class 5 primary engineering control located within a classified cleanroom suite (ISO 7 buffer room with an ISO 8 anteroom), allowing longer BUDs than Category 1. Category 1 (B) is instead prepared in a less-controlled segregated compounding area (SCA). Sterility testing (D) is only required to extend certain Category 2/3 BUDs, not universally required.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a Category 2 CSP compounded aseptically from ONLY sterile starting components, without sterility testing, and stored at controlled room temperature?","options":[{"key":"A","text":"1 day"},{"key":"B","text":"4 days"},{"key":"C","text":"12 hours"},{"key":"D","text":"45 days"}],"correct":"B","explanation":"A Category 2 CSP compounded aseptically from only sterile starting components (no sterility testing performed) defaults to 4 days at controlled room temperature, 10 days refrigerated, or 45 days frozen. If one or more NONsterile starting components are used instead, the room-temperature/refrigerated defaults drop to 1 day / 4 days (frozen stays 45 days).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a Category 2 CSP compounded aseptically using one or more NONSTERILE starting components, without sterility testing, when stored at controlled room temperature?","options":[{"key":"A","text":"12 hours"},{"key":"B","text":"1 day"},{"key":"C","text":"4 days"},{"key":"D","text":"10 days"}],"correct":"B","explanation":"A Category 2 CSP prepared aseptically from one or more nonsterile starting components, without sterility testing, defaults to just 1 day at controlled room temperature (4 days refrigerated, 45 days frozen). Using only sterile starting components instead allows longer defaults (4 days CRT / 10 days refrigerated).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the BUD for an immediate-use compounded sterile product?","options":[{"key":"A","text":"1 hour"},{"key":"B","text":"4 hours"},{"key":"C","text":"8 hours"},{"key":"D","text":"12 hours"}],"correct":"B","explanation":"Immediate-use CSPs are prepared for a single patient under emergency or unexpected circumstances. They have a maximum BUD of 4 hours at room temperature.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Under the revised USP <797>, which factor most increases the risk classification of a compounded sterile preparation (CSP), generally requiring more stringent Category 2/3 controls and testing to support an extended BUD?","options":[{"key":"A","text":"Use of one or more nonsterile starting components"},{"key":"B","text":"Preparation from only commercially manufactured sterile products"},{"key":"C","text":"Administration within 1 hour of preparation"},{"key":"D","text":"Use of a single sterile diluent"}],"correct":"A","explanation":"CSPs compounded using one or more NONsterile starting components carry a higher contamination risk and require sterilization (aseptic processing or terminal sterilization), often needing sterility testing to support extended BUDs. This replaces the old 'high-risk' label \u2014 the revised USP <797> classifies CSPs into Category 1/2/3 based on the compounding environment, starting components, and testing performed, rather than a standalone risk tier.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following statements about ophthalmic preparations is true?","options":[{"key":"A","text":"Ophthalmic preparations must be sterile"},{"key":"B","text":"Ophthalmic preparations do not require sterility"},{"key":"C","text":"Only ophthalmic solutions must be sterile"},{"key":"D","text":"Ophthalmic preparations are never sterile"}],"correct":"A","explanation":"Ophthalmic preparations (solutions, suspensions, ointments) must be sterile to prevent serious ocular infections. They must also be isotonic and appropriately buffered.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a Category 2 CSP compounded aseptically from ONLY sterile starting components, without sterility testing, when stored under refrigeration?","options":[{"key":"A","text":"4 days"},{"key":"B","text":"10 days"},{"key":"C","text":"14 days"},{"key":"D","text":"45 days"}],"correct":"B","explanation":"A Category 2 CSP prepared aseptically from only sterile starting components, without sterility testing, defaults to 10 days refrigerated (4 days at controlled room temperature, 45 days frozen) under the revised USP <797>. This differs from the pre-2023 'low-risk' framework, which used different terminology and time limits.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which route of administration does NOT require sterile dosage forms?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Intrathecal"},{"key":"C","text":"Topical"},{"key":"D","text":"Intramuscular"}],"correct":"C","explanation":"Topical application to intact skin does not require sterility","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a Category 2 CSP compounded aseptically (from either sterile or nonsterile starting components), without sterility testing, when stored frozen?","options":[{"key":"A","text":"10 days"},{"key":"B","text":"30 days"},{"key":"C","text":"45 days"},{"key":"D","text":"90 days"}],"correct":"C","explanation":"Under the revised USP <797>, aseptically-processed Category 2 CSPs without sterility testing default to a 45-day frozen BUD regardless of whether starting components were sterile or nonsterile \u2014 that distinction only affects the room-temperature and refrigerated defaults (4 vs. 1 day CRT; 10 vs. 4 days refrigerated).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_11","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a Category 2 CSP compounded aseptically using one or more NONSTERILE starting components, without sterility testing, when stored under refrigeration?","options":[{"key":"A","text":"4 days"},{"key":"B","text":"10 days"},{"key":"C","text":"14 days"},{"key":"D","text":"24 hours"}],"correct":"A","explanation":"A Category 2 CSP compounded aseptically from one or more nonsterile starting components, without sterility testing, defaults to 4 days refrigerated (1 day at controlled room temperature, 45 days frozen). Using only sterile starting components instead allows a longer 10-day refrigerated default.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_12","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary advantage of intravenous (IV) administration?","options":[{"key":"A","text":"Convenience of administration"},{"key":"B","text":"Immediate systemic effect and 100% bioavailability"},{"key":"C","text":"Slower onset of action"},{"key":"D","text":"Ability to self-administer"}],"correct":"B","explanation":"IV administration provides immediate onset and complete (100%) bioavailability because the drug enters the systemic circulation directly, bypassing absorption barriers.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_13","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about intrathecal injection?","options":[{"key":"A","text":"It is used to place medication directly into the cerebrospinal fluid"},{"key":"B","text":"It is used for topical anesthesia"},{"key":"C","text":"It is the same as an intramuscular injection"},{"key":"D","text":"It is used for local effect on the skin"}],"correct":"A","explanation":"Intrathecal injection delivers medication directly into the CSF (spinal canal), bypassing the blood-brain barrier. Used for chemotherapy, antibiotics, and pain management.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_14","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which parenteral route is commonly used for depot preparations with prolonged effect?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Intramuscular"},{"key":"C","text":"Subcutaneous"},{"key":"D","text":"Intradermal"}],"correct":"B","explanation":"Intramuscular (IM) injection is commonly used for depot preparations (e.g., antipsychotics, hormones) because muscle tissue provides slower absorption and drug release.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_15","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary advantage of subcutaneous administration?","options":[{"key":"A","text":"Immediate onset of action"},{"key":"B","text":"Allows gradual absorption and sustained delivery"},{"key":"C","text":"Can administer large volumes"},{"key":"D","text":"Always sterile"}],"correct":"B","explanation":"Subcutaneous administration provides slower absorption compared to IV or IM, making it suitable for sustained drug delivery (insulin, heparin, biologics).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_16","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which route is used to bypass the blood-brain barrier for targeted central nervous system effects?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Intrathecal"},{"key":"C","text":"Intramuscular"},{"key":"D","text":"Subcutaneous"}],"correct":"B","explanation":"Intrathecal administration delivers medication directly into the CSF, bypassing the blood-brain barrier. Used for CNS-directed chemotherapy and pain management.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_17","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary characteristic of immediate-use compounded sterile products?","options":[{"key":"A","text":"They are intended for emergency use and have a short BUD"},{"key":"B","text":"They are stable for extended periods"},{"key":"C","text":"They are prepared in a cleanroom"},{"key":"D","text":"They require sterility testing"}],"correct":"A","explanation":"Immediate-use CSPs are prepared for emergent situations and have a maximum BUD of 4 hours. They do not require full sterile compounding verification.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_18","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is NOT a route of parenteral administration?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Intramuscular"},{"key":"C","text":"Sublingual"},{"key":"D","text":"Subcutaneous"}],"correct":"C","explanation":"Sublingual is not a parenteral route --- it 's enteral (via the oral cavity). Parenteral routes include intravenous, intramuscular, subcutaneous, and intrathecal.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_19","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary concern when administering intravenous medications?","options":[{"key":"A","text":"Compatibility and stability with IV fluids and other medications"},{"key":"B","text":"Volume of administration only"},{"key":"C","text":"Color of the medication only"},{"key":"D","text":"Route of administration only"}],"correct":"A","explanation":"IV compatibility is critical --- precipitation, physical incompatibility, and chemical degradation can cause serious harm. Compatibility must be verified before administration.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b3_20","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a key principle of sterile compounding?","options":[{"key":"A","text":"Use of non-sterile ingredients for all preparations"},{"key":"B","text":"Aseptic technique to prevent microbial contamination"},{"key":"C","text":"Open-air compounding for speed"},{"key":"D","text":"No need for environmental monitoring"}],"correct":"B","explanation":"Aseptic technique is the foundation of sterile compounding. It includes proper hand hygiene, garbing, environmental control, and minimal manipulation of sterile products.","reference":"Sterile Dosage Forms"},{"id":"modified_release_b3_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What does the abbreviation \"ER\" (or \"XR\") indicate for a dosage form?","options":[{"key":"A","text":"Immediate-release"},{"key":"B","text":"Extended-release, where the drug is released over a prolonged period"},{"key":"C","text":"Enteric-release"},{"key":"D","text":"Effervescent-release"}],"correct":"B","explanation":"ER (Extended-Release), XR (Extended-Release), and SR (Sustained-Release) indicate formulations designed to release drug over an extended period.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary purpose of an extended-release dosage form?","options":[{"key":"A","text":"To achieve faster onset of action"},{"key":"B","text":"To reduce dosing frequency and maintain therapeutic levels"},{"key":"C","text":"To increase the total daily dose"},{"key":"D","text":"To make the drug taste better"}],"correct":"B","explanation":"Extended-release formulations reduce dosing frequency, maintain stable plasma levels, and improve patient adherence by avoiding peak-and-trough fluctuations.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is an osmotic release oral system (OROS)?","options":[{"key":"A","text":"A system that provides fast drug delivery followed by extended release"},{"key":"B","text":"A system that releases drug only in the presence of food"},{"key":"C","text":"A system that provides immediate release only"},{"key":"D","text":"A system that requires the tablet to be chewed"}],"correct":"A","explanation":"OROS uses osmotic pressure to drive drug release at a controlled rate. Some systems (e.g., Concerta) provide an initial immediate-release layer followed by extended-release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary advantage of using long-acting medications?","options":[{"key":"A","text":"To avoid nausea and reduce high \"peaks\" in drug concentration"},{"key":"B","text":"To achieve faster onset of action"},{"key":"C","text":"To make the drug less expensive"},{"key":"D","text":"To improve the taste of the drug"}],"correct":"A","explanation":"Long-acting medications reduce peak concentrations, minimizing dose-related side effects (e.g., nausea, dizziness) while maintaining therapeutic efficacy.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"What should a patient be counseled about an extended-release tablet that appears intact in their stool?","options":[{"key":"A","text":"The medication is not working"},{"key":"B","text":"This is normal; the tablet shell may be visible in the stool (ghost tablet)"},{"key":"C","text":"The patient should stop taking the medication"},{"key":"D","text":"The patient should crush the tablet for better absorption"}],"correct":"B","explanation":"\"Ghost tablets \" are normal for some ER formulations (OROS, matrix systems). The outer shell remains intact while the drug is released. Counsel patients not to be concerned.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about long-acting medications?","options":[{"key":"A","text":"They can be crushed for easier administration"},{"key":"B","text":"Crushing or chewing long-acting medications could lead to a fatal dose"},{"key":"C","text":"They are always less effective than immediate-release formulations"},{"key":"D","text":"They are always more expensive"}],"correct":"B","explanation":"Crushing ER formulations causes dose-dumping, which can lead to severe toxicity or death, especially with narrow therapeutic index drugs (opioids, cardiovascular agents).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is a transdermal patch?","options":[{"key":"A","text":"A topical cream applied to the skin"},{"key":"B","text":"A medicated adhesive patch that delivers drug through the skin for systemic effects"},{"key":"C","text":"An oral tablet for systemic effects"},{"key":"D","text":"An injectable formulation"}],"correct":"B","explanation":"Transdermal patches deliver drugs through the skin into systemic circulation (e.g., fentanyl, nicotine, estradiol, rotigotine).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the main advantage of a transdermal patch compared with oral dosing?","options":[{"key":"A","text":"Faster onset of action"},{"key":"B","text":"Sustained systemic delivery and avoidance of first-pass metabolism"},{"key":"C","text":"Higher doses can be administered"},{"key":"D","text":"Less expensive"}],"correct":"B","explanation":"Transdermal patches provide sustained drug delivery, maintain stable levels, and bypass first-pass metabolism. Onset is slower than oral.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_9","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the difference between an MDI and a DPI inhaler?","options":[{"key":"A","text":"MDI uses a breath-actuated powder; DPI uses a propellant to deliver a liquid mist"},{"key":"B","text":"MDI is propellant-driven; DPI is breath-actuated powder"},{"key":"C","text":"Both use the same mechanism"},{"key":"D","text":"MDI is only for asthma; DPI is only for COPD"}],"correct":"B","explanation":"MDIs use propellants to deliver aerosolized drug; DPIs rely on patient inspiratory force to aerosolize dry powder. Both are used for asthma/COPD.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_10","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary purpose of using a spacer with an MDI?","options":[{"key":"A","text":"To increase the dose delivered"},{"key":"B","text":"To improve lung deposition and reduce oropharyngeal deposition"},{"key":"C","text":"To make the medication taste better"},{"key":"D","text":"To reduce the cost of therapy"}],"correct":"B","explanation":"Spacers increase the distance between the MDI mouthpiece and the patient 's mouth, allowing larger particles to settle and improving lung deposition.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_11","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an important counseling point for using a transdermal patch?","options":[{"key":"A","text":"Cut the patch in half for a lower dose"},{"key":"B","text":"Apply the patch to the same site every day"},{"key":"C","text":"Rotate application sites to avoid skin irritation"},{"key":"D","text":"Remove the patch immediately after application"}],"correct":"C","explanation":"Rotating application sites prevents skin irritation, minimizes local reactions, and ensures consistent drug absorption. The same site should not be reused for at least 7 days.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_12","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"A patient prescribed a long-acting opioid capsule asks if it can be opened and the contents sprinkled on food. What is the appropriate response?","options":[{"key":"A","text":"No, all long-acting opioids cannot be opened"},{"key":"B","text":"Yes, if the prescribing information indicates it can be opened"},{"key":"C","text":"Yes, all long-acting capsules can be opened"},{"key":"D","text":"No, the patient should not take any long-acting opioid"}],"correct":"B","explanation":"Some ER capsules (e.g., Kadian, Avinza) can be opened and sprinkled on food. Others (e.g., OxyContin) cannot. Always check the specific product 's prescribing information.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_13","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the difference between delayed-release and extended-release dosage forms?","options":[{"key":"A","text":"Delayed-release releases drug after a time delay; extended-release releases drug over a prolonged period"},{"key":"B","text":"Delayed-release is the same as extended-release"},{"key":"C","text":"Delayed-release is immediate release; extended-release is sustained release"},{"key":"D","text":"Delayed-release is only for capsules; extended-release is only for tablets"}],"correct":"A","explanation":"Delayed-release (e.g., enteric-coated) releases drug at a specific time or location. Extended-release releases drug continuously over a prolonged period.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_14","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a modified-release dosage form?","options":[{"key":"A","text":"Immediate-release tablet"},{"key":"B","text":"Enter
