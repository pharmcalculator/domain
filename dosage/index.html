":"Softgels are ideal for lipophilic liquids or oil solutions like isotretinoin.","reference":"Capsules"},{"id":"capsules_case_3","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 55-year-old man with hypertension is prescribed a once-daily extended-release capsule. He asks if he can open the capsule and mix the contents with applesauce because he dislikes swallowing capsules. What is the most appropriate response?","options":[{"key":"A","text":"Yes, all extended-release capsules can be opened safely"},{"key":"B","text":"No, extended-release capsules should never be opened"},{"key":"C","text":"Only if the prescribing information specifically allows it"},{"key":"D","text":"Yes, but only if mixed with alcohol for better absorption"}],"correct":"C","explanation":"MR capsules may be opened only if the labeling explicitly permits sprinkling.","reference":"Capsules"},{"id":"capsules_case_4","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 30-year-old woman with celiac disease is prescribed a medication available as gelatin capsules. She is concerned about gluten and animal-derived ingredients. Which capsule shell alternative is most appropriate?","options":[{"key":"A","text":"Porcine-derived hard gelatin capsule shells"},{"key":"B","text":"Bovine-derived hard gelatin capsule shells"},{"key":"C","text":"Hypromellose (HPMC) vegetarian capsule shells"},{"key":"D","text":"Soft gelatin capsules with glycerin fill"}],"correct":"C","explanation":"HPMC capsules are plant-based and suitable for vegetarians and some religious groups.","reference":"Capsules"},{"id":"capsules_case_5","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 72-year-old man living in a humid climate reports that his gelatin capsules have become soft and sticky in the bottle. Which storage recommendation is most appropriate to prevent this?","options":[{"key":"A","text":"Store in a bathroom cabinet near the shower"},{"key":"B","text":"Store in a cool, dry place with controlled humidity"},{"key":"C","text":"Store in the freezer to maintain capsule firmness"},{"key":"D","text":"Store in direct sunlight to evaporate moisture"}],"correct":"B","explanation":"Gelatin capsules require controlled temperature and humidity to prevent softening.","reference":"Capsules"},{"id":"capsules_case_6","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 48-year-old woman is prescribed a proton pump inhibitor available as delayed-release capsules containing enteric-coated granules. She uses a feeding tube for nutrition. How should the medication be administered?","options":[{"key":"A","text":"Crush the granules and mix with water for tube feeding"},{"key":"B","text":"Open the capsule and mix intact granules with water"},{"key":"C","text":"Dissolve the entire capsule in juice before administration"},{"key":"D","text":"Chew the capsule thoroughly before tube administration"}],"correct":"B","explanation":"Enteric-coated granules should not be crushed; they may be mixed with water if allowed.","reference":"Capsules"},{"id":"capsules_case_7","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 60-year-old man with chronic pain is prescribed an extended-release oxycodone capsule. He asks if he can split the capsule in half to reduce the dose. What is the most appropriate response?","options":[{"key":"A","text":"Yes, splitting will provide a proportional dose reduction"},{"key":"B","text":"No, splitting may disrupt the modified-release mechanism"},{"key":"C","text":"Yes, but only if taken with a high-fat meal"},{"key":"D","text":"No, but chewing will achieve the desired dose reduction"}],"correct":"B","explanation":"Splitting or crushing MR capsules can cause dose dumping and toxicity.","reference":"Capsules"},{"id":"capsules_case_8","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 35-year-old woman is prescribed doxycycline capsules for acne. She reports that the capsule sometimes feels like it sticks in her throat. Which counseling point is most appropriate to reduce this risk?","options":[{"key":"A","text":"Take the capsule with a small sip of water while lying down"},{"key":"B","text":"Take the capsule with a full glass of water while upright"},{"key":"C","text":"Crush the capsule and mix with a small amount of food"},{"key":"D","text":"Chew the capsule thoroughly before swallowing it"}],"correct":"B","explanation":"Taking capsules with plenty of water while upright reduces esophageal irritation.","reference":"Capsules"},{"id":"capsules_case_9","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 50-year-old man with a history of religious dietary restrictions declines gelatin capsules due to animal-derived ingredients. Which alternative dosage form is most appropriate if available?","options":[{"key":"A","text":"Porcine gelatin soft capsules with oil fill"},{"key":"B","text":"Bovine gelatin hard capsules with powder fill"},{"key":"C","text":"HPMC vegetarian capsules with powder fill"},{"key":"D","text":"Gelatin capsules with alcohol-based liquid fill"}],"correct":"C","explanation":"HPMC capsules avoid animal-derived gelatin and meet dietary restrictions.","reference":"Capsules"},{"id":"capsules_case_10","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 65-year-old woman with arthritis is prescribed a medication in hard gelatin capsules. She stores her medications in a hot car during summer months. What is the most likely effect on the capsules?","options":[{"key":"A","text":"Capsules will become brittle and crack easily"},{"key":"B","text":"Capsules will soften, deform, or possibly leak"},{"key":"C","text":"Capsules will become more stable and potent"},{"key":"D","text":"Capsules will change color but remain unchanged"}],"correct":"B","explanation":"Heat and humidity can cause gelatin capsules to soften and deform.","reference":"Capsules"},{"id":"tablets_case_1","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"hard","question":"A 75-year-old man with Parkinson's disease has difficulty swallowing solid dosage forms. He is prescribed a medication available as both an immediate-release tablet and an orally disintegrating tablet (ODT). Which formulation is most appropriate?","options":[{"key":"A","text":"Immediate-release tablet to be crushed before use"},{"key":"B","text":"Orally disintegrating tablet placed on the tongue"},{"key":"C","text":"Enteric-coated tablet to be chewed before swallowing"},{"key":"D","text":"Extended-release tablet to be split in half before use"}],"correct":"B","explanation":"ODTs disintegrate in the mouth without water, aiding patients with dysphagia.","reference":"Tablets"},{"id":"tablets_case_2","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 58-year-old woman with gastroesophageal reflux disease is prescribed a proton pump inhibitor. She reports stomach pain when taking the immediate-release tablet on an empty stomach. Which tablet modification is most appropriate?","options":[{"key":"A","text":"Switch to a chewable tablet without coating"},{"key":"B","text":"Switch to an enteric-coated tablet formulation"},{"key":"C","text":"Switch to a sublingual tablet for faster absorption"},{"key":"D","text":"Switch to an immediate-release tablet with food"}],"correct":"B","explanation":"Enteric coating protects the drug from gastric acid and reduces irritation.","reference":"Tablets"},{"id":"tablets_case_3","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 66-year-old man with hypertension is prescribed a once-daily extended-release metoprolol succinate tablet. He asks if he can crush the tablet to mix with pudding due to swallowing difficulty. What is the most appropriate response?","options":[{"key":"A","text":"Yes, crushing will not affect the release profile"},{"key":"B","text":"No, crushing will cause rapid release and possible toxicity"},{"key":"C","text":"Yes, but only if taken with a high-fat meal"},{"key":"D","text":"No, but chewing will achieve the same effect safely"}],"correct":"B","explanation":"Crushing ER tablets destroys the controlled-release mechanism and causes dose dumping.4","reference":"Tablets"},{"id":"tablets_case_4","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 45-year-old woman with migraine is prescribed a sumatriptan tablet. She often experiences nausea and vomiting during attacks and cannot keep oral tablets down. Which alternative tablet type is most appropriate if available?","options":[{"key":"A","text":"Standard immediate-release oral tablet"},{"key":"B","text":"Orally disintegrating tablet placed on the tongue"},{"key":"C","text":"Enteric-coated tablet to delay gastric dissolution"},{"key":"D","text":"Extended-release tablet for prolonged effect"}],"correct":"B","explanation":"ODTs can be taken without water and may be better tolerated during nausea.","reference":"Tablets"},{"id":"tablets_case_5","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 70-year-old man with osteoarthritis is prescribed an enteric-coated diclofenac tablet. He asks why he cannot split the tablet in half to reduce the dose. What is the most appropriate explanation?","options":[{"key":"A","text":"Splitting will improve the drug's absorption significantly"},{"key":"B","text":"Splitting may damage the enteric coating and cause irritation"},{"key":"C","text":"Splitting will convert it to an extended-release product"},{"key":"D","text":"Splitting will make the tablet taste better and easier to take"}],"correct":"B","explanation":"Splitting enteric-coated tablets can compromise the coating and increase gastric irritation.","reference":"Tablets"},{"id":"tablets_case_6","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 52-year-old woman with hyperlipidemia is prescribed a statin tablet. She notices that some tablets have a score line and others do not. She asks if she can split unscored tablets. What is the most appropriate advice?","options":[{"key":"A","text":"All tablets can be split regardless of scoring"},{"key":"B","text":"Only scored tablets should be split unless directed otherwise"},{"key":"C","text":"Unscored tablets are designed to be split for dose adjustment"},{"key":"D","text":"Scored tablets should never be split under any circumstances"}],"correct":"B","explanation":"Scored tablets are intended to be split; unscored tablets generally should not be.","reference":"Tablets"},{"id":"tablets_case_7","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 63-year-old man with type 2 diabetes is prescribed a metformin extended-release tablet. He reports seeing a ghost tablet in his stool and is concerned the drug did not work. What is the most appropriate explanation?","options":[{"key":"A","text":"The tablet did not dissolve and the drug was not absorbed"},{"key":"B","text":"The inert matrix may pass intact while drug is released"},{"key":"C","text":"The tablet was defective and should be reported immediately"},{"key":"D","text":"The drug is only partially absorbed due to food interaction"}],"correct":"B","explanation":"Some ER matrices pass through the GI tract intact after drug release.","reference":"Tablets"},{"id":"tablets_case_8","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 40-year-old woman with hypothyroidism is prescribed levothyroxine tablets. She asks why she must take the tablet on an empty stomach with water. What is the most appropriate reason?","options":[{"key":"A","text":"Food and some liquids can reduce absorption significantly"},{"key":"B","text":"Food increases the risk of tablet caking in the stomach"},{"key":"C","text":"Water causes the tablet to disintegrate more slowly"},{"key":"D","text":"Food enhances first-pass metabolism of levothyroxine"}],"correct":"A","explanation":"Food and certain beverages can significantly reduce levothyroxine absorption.","reference":"Tablets"},{"id":"tablets_case_9","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 55-year-old man with chronic pain is prescribed an immediate-release oxycodone tablet. He asks if he can store the tablets in the bathroom cabinet for convenience. What is the most appropriate storage advice?","options":[{"key":"A","text":"Bathroom storage is ideal due to consistent temperature"},{"key":"B","text":"Store in a cool, dry place away from moisture and heat"},{"key":"C","text":"Store in the freezer to maintain tablet hardness"},{"key":"D","text":"Store in direct sunlight to prevent microbial growth"}],"correct":"B","explanation":"Tablets should be stored in controlled conditions, away from heat and moisture.","reference":"Tablets"},{"id":"tablets_case_10","topicId":"tablets","topicName":"Tablets","type":"case","difficulty":"medium","question":"A 68-year-old woman with osteoporosis is prescribed an alendronate tablet. She asks why she must remain upright for 30 minutes after taking it. What is the most appropriate reason?","options":[{"key":"A","text":"To enhance the taste of the tablet in the mouth"},{"key":"B","text":"To reduce the risk of esophageal irritation and ulceration"},{"key":"C","text":"To increase the rate of tablet disintegration in the stomach"},{"key":"D","text":"To prevent the tablet from sticking to the roof of the mouth"}],"correct":"B","explanation":"Remaining upright reduces esophageal exposure and risk of irritation.","reference":"Tablets"},{"id":"powders_case_1","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 5-year-old child with otitis media is prescribed an antibiotic powder for oral suspension. The mother asks why it is not provided as a ready-made liquid. What is the most appropriate explanation?","options":[{"key":"A","text":"Powder form improves stability before reconstitution"},{"key":"B","text":"Powder form is less accurate for pediatric dosing"},{"key":"C","text":"Powder form is more convenient for adult patients only"},{"key":"D","text":"Powder form reduces the need for shaking before use"}],"correct":"A","explanation":"Powders for reconstitution improve stability for drugs unstable in solution.","reference":"Medicinal Powders"},{"id":"powders_case_2","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 30-year-old man with tinea pedis is prescribed an antifungal powder to apply between his toes. He asks how the powder helps compared to a cream. What is the most appropriate explanation?","options":[{"key":"A","text":"Powder absorbs moisture and reduces friction in the area"},{"key":"B","text":"Powder provides greater occlusion than a cream"},{"key":"C","text":"Powder is more greasy and stays on the skin longer"},{"key":"D","text":"Powder is intended for internal use only"}],"correct":"A","explanation":"Dusting powders absorb moisture and reduce friction, useful in interdigital areas.","reference":"Medicinal Powders"},{"id":"powders_case_3","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 65-year-old woman with chronic constipation is prescribed a bulk-forming laxative powder. She asks how to take it safely. What is the most appropriate instruction?","options":[{"key":"A","text":"Take the powder dry without any liquid"},{"key":"B","text":"Mix the powder with adequate water before ingestion"},{"key":"C","text":"Inhale the powder deeply into the lungs"},{"key":"D","text":"Apply the powder topically to the abdomen"}],"correct":"B","explanation":"Bulk-forming powders must be mixed with sufficient fluid to prevent obstruction.","reference":"Medicinal Powders"},{"id":"powders_case_4","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 40-year-old man with asthma is prescribed a dry powder inhaler (DPI). He asks how this differs from his metered-dose inhaler (MDI). What is the most appropriate distinction?","options":[{"key":"A","text":"DPI delivers drug as a solution in propellant"},{"key":"B","text":"DPI delivers drug as fine powder particles to the lungs"},{"key":"C","text":"DPI is only for nasal administration"},{"key":"D","text":"DPI does not require patient inhalation effort"}],"correct":"B","explanation":"DPIs deliver micronized powder particles that deposit in the lungs.","reference":"Medicinal Powders"},{"id":"powders_case_5","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 25-year-old woman with severe nausea is prescribed an effervescent powder analgesic. She asks how to take it properly. What is the most appropriate instruction?","options":[{"key":"A","text":"Swallow the powder dry followed by a glass of water"},{"key":"B","text":"Dissolve the powder completely in water before drinking"},{"key":"C","text":"Sprinkle the powder on food without dissolving"},{"key":"D","text":"Inhale the powder into the nose for faster effect"}],"correct":"B","explanation":"Effervescent powders must be dissolved in water before ingestion.","reference":"Medicinal Powders"},{"id":"powders_case_6","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 70-year-old man with a surgical wound is prescribed an antibiotic powder for topical use. The nurse asks what property is most important for this powder. What is the most appropriate answer?","options":[{"key":"A","text":"Bright color to indicate application site"},{"key":"B","text":"Sterility and non-irritancy to the wound"},{"key":"C","text":"Strong fragrance to mask odor"},{"key":"D","text":"High hygroscopicity to absorb all moisture"}],"correct":"B","explanation":"Powders for wounds should be sterile and non-irritating.","reference":"Medicinal Powders"},{"id":"powders_case_7","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 50-year-old woman with vitamin D deficiency is prescribed a bulk powder supplement. She asks why the label instructs her to measure each dose carefully. What is the most appropriate reason?","options":[{"key":"A","text":"Bulk powders are pre-divided into individual doses"},{"key":"B","text":"Bulk powders require patient measurement of each dose"},{"key":"C","text":"Bulk powders are always less potent than tablets"},{"key":"D","text":"Bulk powders do not contain active drug"}],"correct":"B","explanation":"Bulk powders are dispensed in a single container with directions to measure doses.","reference":"Medicinal Powders"},{"id":"powders_case_8","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 35-year-old man with a chronic skin condition is prescribed a compounded powder containing a potent corticosteroid. The pharmacist uses geometric dilution during compounding. Why is this technique used?","options":[{"key":"A","text":"To increase the particle size of the drug"},{"key":"B","text":"To ensure uniform distribution of a small amount of drug"},{"key":"C","text":"To sterilize the powder before dispensing"},{"key":"D","text":"To improve the taste of the powder significantly"}],"correct":"B","explanation":"Geometric dilution ensures even distribution of potent drugs in a large diluent mass.","reference":"Medicinal Powders"},{"id":"powders_case_9","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 60-year-old woman with a history of aspiration is prescribed an oral powder that must be mixed with water. She asks what could happen if she inhales some powder by accident. What is the most appropriate concern?","options":[{"key":"A","text":"No risk; powders are safe if inhaled"},{"key":"B","text":"Risk of pulmonary irritation or aspiration pneumonitis"},{"key":"C","text":"Risk of immediate systemic overdose"},{"key":"D","text":"Risk of tablet caking in the esophagus"}],"correct":"B","explanation":"Inhaled powders can irritate the respiratory tract or cause aspiration.","reference":"Medicinal Powders"},{"id":"powders_case_10","topicId":"powders","topicName":"Medicinal Powders","type":"case","difficulty":"medium","question":"A 45-year-old man with a fungal skin infection is prescribed a topical antifungal powder. He lives in a humid climate and notices the powder clumping in the container. What is the most likely cause?","options":[{"key":"A","text":"Exposure to low humidity and cold temperatures"},{"key":"B","text":"Exposure to high humidity causing caking"},{"key":"C","text":"Exposure to direct sunlight causing bleaching"},{"key":"D","text":"Exposure to air causing immediate evaporation"}],"correct":"B","explanation":"Hygroscopic powders can absorb moisture and cake in humid conditions.","reference":"Medicinal Powders"},{"id":"suppositories_case_1","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 32-year-old woman with severe nausea and vomiting in pregnancy cannot tolerate oral medications. She is prescribed an antiemetic suppository. Which advantage does this route offer in her case?","options":[{"key":"A","text":"Guaranteed 100% bioavailability in all patients"},{"key":"B","text":"Avoidance of first-pass metabolism for some drugs"},{"key":"C","text":"Rapid onset for all drugs regardless of formulation"},{"key":"D","text":"No risk of local rectal irritation or discomfort"}],"correct":"B","explanation":"Rectal administration can partially bypass hepatic first-pass metabolism.","reference":"Suppositories"},{"id":"suppositories_case_2","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 68-year-old man with constipation is prescribed a glycerin suppository. He asks how it works. What is the most appropriate explanation?","options":[{"key":"A","text":"It melts at body temperature and acts as a lubricant"},{"key":"B","text":"It is absorbed systemically to stimulate gut motility"},{"key":"C","text":"It draws water into the rectum and stimulates evacuation"},{"key":"D","text":"It inhibits rectal\u5e73\u6ed1\u808c to reduce spasms"}],"correct":"C","explanation":"Glycerin suppositories are hyperosmotic and draw water into the rectum.","reference":"Suppositories"},{"id":"suppositories_case_3","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 45-year-old woman with hemorrhoids is prescribed a hydrocortisone suppository. She reports that the suppository feels soft and difficult to insert during summer. What is the most appropriate storage advice?","options":[{"key":"A","text":"Store in direct sunlight to harden the suppository"},{"key":"B","text":"Store in a cool place or refrigerate if too soft"},{"key":"C","text":"Store in a warm bathroom to maintain flexibility"},{"key":"D","text":"Store in the freezer to make it completely solid"}],"correct":"B","explanation":"Fatty-base suppositories may require cool storage to prevent melting.","reference":"Suppositories"},{"id":"suppositories_case_4","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 55-year-old man with chronic pain is prescribed an acetaminophen suppository because he cannot take oral medications post-surgery. He asks how to insert it properly. What is the most appropriate instruction?","options":[{"key":"A","text":"Insert blunt end first while standing upright"},{"key":"B","text":"Insert pointed end first after removing the wrapper"},{"key":"C","text":"Dissolve in water before rectal insertion"},{"key":"D","text":"Chew the suppository before rectal insertion"}],"correct":"B","explanation":"Suppositories are inserted pointed-end first after unwrapping.","reference":"Suppositories"},{"id":"suppositories_case_5","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 28-year-old woman with a vaginal yeast infection is prescribed an antifungal suppository. She asks how this differs from a rectal suppository. What is the most appropriate distinction?","options":[{"key":"A","text":"Vaginal suppositories are always called tablets"},{"key":"B","text":"Vaginal suppositories are often oval and called ovules"},{"key":"C","text":"Vaginal suppositories are only for systemic therapy"},{"key":"D","text":"Vaginal suppositories cannot contain antifungal agents"}],"correct":"B","explanation":"Vaginal suppositories are often formulated as ovules.","reference":"Suppositories"},{"id":"suppositories_case_6","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 60-year-old man with epilepsy is prescribed a diazepam rectal gel for seizure emergencies. His caregiver asks why it is not a standard suppository. What is the most appropriate reason?","options":[{"key":"A","text":"Gel allows more precise dosing and easier administration"},{"key":"B","text":"Gel is less effective than standard suppositories"},{"key":"C","text":"Gel is only for oral administration"},{"key":"D","text":"Gel does not require rectal administration"}],"correct":"A","explanation":"Rectal gels allow accurate dosing and easier administration in emergencies.","reference":"Suppositories"},{"id":"suppositories_case_7","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 50-year-old woman with migraine is prescribed an antiemetic suppository. She has a history of inflammatory bowel disease with rectal inflammation. What is the most appropriate concern?","options":[{"key":"A","text":"Suppositories are always contraindicated in IBD"},{"key":"B","text":"Rectal irritation may be exacerbated by suppository use"},{"key":"C","text":"Suppositories will cure her inflammatory bowel disease"},{"key":"D","text":"Suppositories will cause immediate systemic toxicity"}],"correct":"B","explanation":"Rectal inflammation may be worsened by suppository insertion.","reference":"Suppositories"},{"id":"suppositories_case_8","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 72-year-old man with fever is prescribed an acetaminophen suppository because he is NPO. He asks why the dose may differ from oral acetaminophen. What is the most appropriate explanation?","options":[{"key":"A","text":"Rectal absorption is always 100% predictable"},{"key":"B","text":"Rectal absorption can be variable and sometimes lower"},{"key":"C","text":"Rectal absorption is always higher than oral"},{"key":"D","text":"Rectal absorption is unaffected by fecal matter"}],"correct":"B","explanation":"Rectal absorption can be variable due to placement and rectal contents.","reference":"Suppositories"},{"id":"suppositories_case_9","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 40-year-old woman with dysmenorrhea is prescribed an NSAID suppository. She asks if she can cut the suppository in half to reduce the dose. What is the most appropriate advice?","options":[{"key":"A","text":"Yes, all suppositories can be split accurately"},{"key":"B","text":"No, splitting may result in uneven drug distribution"},{"key":"C","text":"Yes, but only if melted and reformed at home"},{"key":"D","text":"No, but chewing will achieve dose reduction"}],"correct":"B","explanation":"Splitting suppositories can lead to dose inaccuracy.","reference":"Suppositories"},{"id":"suppositories_case_10","topicId":"suppositories","topicName":"Suppositories","type":"case","difficulty":"medium","question":"A 65-year-old man with prostate enlargement reports difficulty inserting rectal suppositories. He asks if there is an alternative route for his antiemetic medication. What is the most appropriate alternative if available?","options":[{"key":"A","text":"Intravenous or oral formulations if he can tolerate them"},{"key":"B","text":"Topical cream applied to the abdomen"},{"key":"C","text":"Inhalation powder for systemic effect"},{"key":"D","text":"Subcutaneous injection of the same drug"}],"correct":"A","explanation":"If rectal route is difficult, IV or oral routes may be alternatives.","reference":"Suppositories"},{"id":"aqueous_solutions_case_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 6-year-old child with otitis media is prescribed an oral antibiotic suspension, but the pharmacy only has an oral solution. The mother asks the difference. What is the most appropriate distinction?","options":[{"key":"A","text":"Solution contains undissolved particles; suspension does not"},{"key":"B","text":"Solution is a single-phase system; suspension is two-phase"},{"key":"C","text":"Solution must be shaken; suspension does not need shaking"},{"key":"D","text":"Solution is always more viscous than suspension"}],"correct":"B","explanation":"Solutions are single-phase; suspensions contain undissolved particles.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 70-year-old woman with glaucoma is prescribed timolol ophthalmic solution. She asks why the drops must be sterile. What is the most appropriate reason?","options":[{"key":"A","text":"To improve the color and appearance of the solution"},{"key":"B","text":"To prevent infection when applied to the eye"},{"key":"C","text":"To enhance the taste of the solution in the mouth"},{"key":"D","text":"To increase the viscosity for better retention"}],"correct":"B","explanation":"Ophthalmic solutions must be sterile to prevent ocular infection.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 55-year-old man with hypertension is prescribed an oral potassium chloride solution. He complains of gastric irritation when taking it on an empty stomach. What is the most appropriate counseling point?","options":[{"key":"A","text":"Take the solution with a full glass of water or with food"},{"key":"B","text":"Take the solution undiluted on an empty stomach"},{"key":"C","text":"Mix the solution with alcohol to reduce irritation"},{"key":"D","text":"Gargle the solution and spit it out"}],"correct":"A","explanation":"Diluting or taking with food can reduce GI irritation from KCl solutions.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 30-year-old woman with a urinary tract infection is prescribed a multi-dose oral antibiotic solution. She asks why the bottle contains a preservative. What is the most appropriate explanation?","options":[{"key":"A","text":"To improve the color of the solution"},{"key":"B","text":"To prevent microbial growth after opening"},{"key":"C","text":"To increase the sweetness of the solution"},{"key":"D","text":"To reduce the viscosity for easier pouring"}],"correct":"B","explanation":"Multi-dose aqueous solutions often contain preservatives to prevent contamination.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 65-year-old man with heart failure is prescribed an IV furosemide solution. The nurse asks why the solution must be clear and free of particles. What is the most appropriate reason?","options":[{"key":"A","text":"Particles enhance the therapeutic effect of the drug"},{"key":"B","text":"Particles may cause emboli or phlebitis if injected"},{"key":"C","text":"Particles improve the stability of the solution"},{"key":"D","text":"Particles are required for proper dosing accuracy"}],"correct":"B","explanation":"Particulate matter in injectables can cause emboli or vascular irritation.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 40-year-old woman with diabetes is prescribed an insulin injection solution. She asks why it must be stored in the refrigerator before opening. What is the most appropriate reason?","options":[{"key":"A","text":"To enhance the color and appearance of the solution"},{"key":"B","text":"To maintain stability and potency of the protein"},{"key":"C","text":"To increase the viscosity for easier injection"},{"key":"D","text":"To reduce the risk of crystallization in the vial"}],"correct":"B","explanation":"Insulin is a protein that requires refrigeration to maintain stability.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 50-year-old man with a severe bacterial infection is prescribed an IV antibiotic that requires reconstitution with sterile water. The nurse asks what type of solution this will form. What is the most appropriate answer?","options":[{"key":"A","text":"A non-aqueous solution with oil as solvent"},{"key":"B","text":"An aqueous solution with water as solvent"},{"key":"C","text":"A suspension with undissolved particles"},{"key":"D","text":"An emulsion with oil droplets in water"}],"correct":"B","explanation":"Reconstitution with sterile water yields an aqueous solution.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 25-year-old woman with migraines is prescribed an oral ergotamine solution that contains alcohol. She asks if she can take it while driving. What is the most appropriate concern?","options":[{"key":"A","text":"Alcohol content may cause drowsiness or impairment"},{"key":"B","text":"Alcohol content will enhance her migraine symptoms"},{"key":"C","text":"Alcohol content will reduce the drug's absorption"},{"key":"D","text":"Alcohol content will cause immediate allergic reaction"}],"correct":"A","explanation":"Alcohol-containing solutions may cause CNS effects and impair driving.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_9","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 60-year-old man with chronic cough is prescribed a codeine-containing oral solution. He asks why the label warns against sharing the medication. What is the most appropriate reason?","options":[{"key":"A","text":"The solution is custom-compounded for his taste"},{"key":"B","text":"The solution contains a controlled substance with abuse potential"},{"key":"C","text":"The solution is unstable if used by another person"},{"key":"D","text":"The solution will cause immediate allergic reaction in others"}],"correct":"B","explanation":"Codeine solutions are controlled substances with abuse potential.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_case_10","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"case","difficulty":"medium","question":"A 35-year-old woman with dry eyes is prescribed an artificial tear ophthalmic solution. She asks why the solution is buffered. What is the most appropriate reason?","options":[{"key":"A","text":"To change the color of the solution for visibility"},{"key":"B","text":"To match the pH of tears and reduce irritation"},{"key":"C","text":"To increase the viscosity for longer retention"},{"key":"D","text":"To enhance the taste when the drop drains to the throat"}],"correct":"B","explanation":"Buffering helps match physiological pH and reduces ocular irritation.","reference":"Aqueous Solutions"},{"id":"non_aqueous_solutions_case_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 50-year-old man with severe vitamin D deficiency is prescribed a vitamin D oral solution in oil. He asks why it is not in water. What is the most appropriate explanation?","options":[{"key":"A","text":"Vitamin D is highly soluble in water"},{"key":"B","text":"Vitamin D is lipophilic and dissolves better in oil"},{"key":"C","text":"Oil solutions are always less stable than aqueous"},{"key":"D","text":"Oil solutions are intended only for injection"}],"correct":"B","explanation":"Lipophilic drugs like vitamin D are more soluble in non-aqueous vehicles.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 65-year-old woman with chronic pain is prescribed an intramuscular depot injection of an antipsychotic in oil. She asks how this differs from her previous IV solution. What is the most appropriate distinction?","options":[{"key":"A","text":"Oil depot provides slower, prolonged drug release"},{"key":"B","text":"Oil depot provides immediate, rapid drug release"},{"key":"C","text":"Oil depot is intended only for oral administration"},{"key":"D","text":"Oil depot is less sterile than aqueous IV solutions"}],"correct":"A","explanation":"Oil-based IM depots provide sustained release over time.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 40-year-old man with a fungal skin infection is prescribed a topical antifungal solution in alcohol. He asks why alcohol is used instead of water. What is the most appropriate reason?","options":[{"key":"A","text":"Alcohol improves drug solubility and evaporation"},{"key":"B","text":"Alcohol reduces the efficacy of the antifungal"},{"key":"C","text":"Alcohol is used to make the solution more viscous"},{"key":"D","text":"Alcohol is used to change the color of the solution"}],"correct":"A","explanation":"Alcohol can enhance solubility and evaporate quickly, aiding topical delivery.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 55-year-old woman with a severe allergic reaction is prescribed an epinephrine injection. The available product is an aqueous solution, not an oil solution. Why is aqueous preferred here?","options":[{"key":"A","text":"Aqueous solutions provide slower, prolonged effect"},{"key":"B","text":"Aqueous solutions provide rapid onset for emergencies"},{"key":"C","text":"Oil solutions are always more effective for allergies"},{"key":"D","text":"Oil solutions are required for all injectable drugs"}],"correct":"B","explanation":"Aqueous solutions allow rapid absorption needed in emergencies.1","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_5","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 30-year-old man with a chronic condition is prescribed an oral solution that contains propylene glycol as a co-solvent. He asks if this is safe long-term. What is the most appropriate consideration?","options":[{"key":"A","text":"Propylene glycol is always toxic in any amount"},{"key":"B","text":"Propylene glycol is generally safe within approved limits"},{"key":"C","text":"Propylene glycol is only used in topical products"},{"key":"D","text":"Propylene glycol is used to make solutions more colorful"}],"correct":"B","explanation":"Propylene glycol is widely used and safe within established limits.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_6","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 70-year-old man with a bacterial infection is prescribed an IV antibiotic that is poorly water-soluble. The formulation uses a non-aqueous co-solvent system. What is the most important monitoring parameter?","options":[{"key":"A","text":"Color of the infusion solution"},{"key":"B","text":"Signs of infusion-related reactions or toxicity"},{"key":"C","text":"Smell of the solution during administration"},{"key":"D","text":"Taste of the solution as it is infused"}],"correct":"B","explanation":"Non-aqueous co-solvents can cause infusion reactions or toxicity.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_7","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 45-year-old woman with a skin condition is prescribed a topical solution containing high concentrations of alcohol. She has very dry, sensitive skin. What is the most appropriate concern?","options":[{"key":"A","text":"Alcohol may cause excessive dryness and irritation"},{"key":"B","text":"Alcohol will make the solution more moisturizing"},{"key":"C","text":"Alcohol will change the color of her skin permanently"},{"key":"D","text":"Alcohol will increase the viscosity of the solution"}],"correct":"A","explanation":"High alcohol content can be drying and irritating to sensitive skin.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_8","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 60-year-old man with a chronic disease is prescribed an oral elixir containing alcohol. He is recovering from alcohol use disorder. What is the most appropriate alternative consideration?","options":[{"key":"A","text":"Continue the elixir; alcohol content is negligible"},{"key":"B","text":"Switch to an alcohol-free formulation if available"},{"key":"C","text":"Dilute the elixir with more alcohol before use"},{"key":"D","text":"Advise him to avoid all oral medications"}],"correct":"B","explanation":"Alcohol-free alternatives should be considered in patients avoiding alcohol.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_9","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 35-year-old woman is prescribed an intramuscular injection of a hormone in oil. She asks why she cannot receive it intravenously. What is the most appropriate explanation?","options":[{"key":"A","text":"Oil vehicles are unsafe for IV injection"},{"key":"B","text":"Oil vehicles are always preferred for IV use"},{"key":"C","text":"Oil vehicles enhance the taste of the injection"},{"key":"D","text":"Oil vehicles reduce the need for sterile technique"}],"correct":"A","explanation":"Oil-based vehicles are generally not suitable for IV administration.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_case_10","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"case","difficulty":"medium","question":"A 50-year-old man with a chronic condition is prescribed an oral solution stored in a tightly sealed amber bottle. He asks why the bottle is amber and tightly closed. What is the most appropriate reason?","options":[{"key":"A","text":"To protect from light and minimize oxidation"},{"key":"B","text":"To enhance the color of the solution"},{"key":"C","text":"To increase the viscosity of the solution"},{"key":"D","text":"To improve the taste of the solution"}],"correct":"A","explanation":"Amber bottles and tight seals protect from light and oxidation.","reference":"Non-Aqueous Solutions"},{"id":"colloids_case_1","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 60-year-old man receiving parenteral nutrition is given an IV lipid emulsion. He asks how this differs from a simple oil solution. What is the most appropriate distinction?","options":[{"key":"A","text":"Emulsion is a colloidal liquid-in-liquid system"},{"key":"B","text":"Emulsion is a single-phase aqueous solution"},{"key":"C","text":"Emulsion contains no oil at all"},{"key":"D","text":"Emulsion is a solid-in-liquid suspension"}],"correct":"A","explanation":"Lipid emulsions are colloidal o/w systems with tiny oil droplets.","reference":"Colloids"},{"id":"colloids_case_2","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 45-year-old woman is prescribed a topical preparation described as a \"colloidal oatmeal\" lotion for eczema. She asks what \"colloidal\" means. What is the most appropriate explanation?","options":[{"key":"A","text":"Very large particles that settle quickly"},{"key":"B","text":"Very fine particles dispersed in liquid"},{"key":"C","text":"A single-phase solution with no particles"},{"key":"D","text":"A gas dispersed in a solid matrix"}],"correct":"B","explanation":"Colloidal dispersions contain fine particles (1 nm--1 \u00b5m) in a medium.","reference":"Colloids"},{"id":"colloids_case_3","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 55-year-old man with a rare condition is prescribed a drug formulated as micelles to improve solubility. He asks how micelles help. What is the most appropriate explanation?","options":[{"key":"A","text":"Micelles are large tablets that dissolve slowly"},{"key":"B","text":"Micelles are surfactant aggregates that solubilize drug"},{"key":"C","text":"Micelles are gas bubbles in a liquid"},{"key":"D","text":"Micelles are solid particles that settle quickly"}],"correct":"B","explanation":"Micelles are surfactant aggregates that can solubilize lipophilic drugs.","reference":"Colloids"},{"id":"colloids_case_4","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 30-year-old woman is prescribed an IV iron preparation described as a colloidal iron complex. The nurse asks what special consideration is needed. What is the most appropriate concern?","options":[{"key":"A","text":"Risk of hypersensitivity reactions"},{"key":"B","text":"Risk of tablet caking in the IV line"},{"key":"C","text":"Risk of gas embolism from the colloid"},{"key":"D","text":"Risk of immediate oral absorption"}],"correct":"A","explanation":"Colloidal IV iron can cause hypersensitivity reactions.","reference":"Colloids"},{"id":"colloids_case_5","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 70-year-old man with a skin condition is prescribed a topical silver-containing colloid. He asks if it is the same as a regular silver solution. What is the most appropriate distinction?","options":[{"key":"A","text":"Colloid contains fine silver particles dispersed in liquid"},{"key":"B","text":"Colloid contains no silver at all"},{"key":"C","text":"Colloid is a solid tablet for oral use"},{"key":"D","text":"Colloid is a gas used for inhalation"}],"correct":"A","explanation":"Colloidal silver consists of fine silver particles in a liquid medium.","reference":"Colloids"},{"id":"colloids_case_6","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 50-year-old woman with a chronic disease is prescribed a medication formulated as a liposomal injection. She asks how liposomes differ from regular solutions. What is the most appropriate explanation?","options":[{"key":"A","text":"Liposomes are large tablets that dissolve in the stomach"},{"key":"B","text":"Liposomes are lipid vesicles that encapsulate drug"},{"key":"C","text":"Liposomes are gas bubbles used for imaging"},{"key":"D","text":"Liposomes are solid powders for oral use"}],"correct":"B","explanation":"Liposomes are lipid bilayer vesicles that can encapsulate drugs.","reference":"Colloids"},{"id":"colloids_case_7","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 65-year-old man is receiving an IV medication that appears slightly opalescent. He asks if this is normal. What is the most appropriate explanation for some colloidal injectables?","options":[{"key":"A","text":"Opalescence may be normal for some colloidal systems"},{"key":"B","text":"All injectables must be completely clear always"},{"key":"C","text":"Opalescence indicates the drug is expired"},{"key":"D","text":"Opalescence means the drug is for oral use only"}],"correct":"A","explanation":"Some colloidal injectables are intentionally opalescent or milky.","reference":"Colloids"},{"id":"colloids_case_8","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 40-year-old woman is prescribed a topical gel described as a colloidal system. She asks why it feels different from a simple solution. What is the most appropriate explanation?","options":[{"key":"A","text":"Colloidal gel has a network that traps liquid"},{"key":"B","text":"Colloidal gel contains no liquid at all"},{"key":"C","text":"Colloidal gel is a gas-in-solid system"},{"key":"D","text":"Colloidal gel is a single-phase true solution"}],"correct":"A","explanation":"Gels are colloidal systems where liquid is dispersed in a solid matrix.","reference":"Colloids"},{"id":"colloids_case_9","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 55-year-old man with a chronic condition is prescribed a drug formulated with a protective colloid to improve stability. He asks what the protective colloid does. What is the most appropriate explanation?","options":[{"key":"A","text":"It prevents aggregation of fine particles"},{"key":"B","text":"It increases particle size for faster settling"},{"key":"C","text":"It converts the drug into a tablet form"},{"key":"D","text":"It changes the drug into a gas for inhalation"}],"correct":"A","explanation":"Protective colloids adsorb on particles and prevent aggregation.","reference":"Colloids"},{"id":"colloids_case_10","topicId":"colloids","topicName":"Colloids","type":"case","difficulty":"medium","question":"A 35-year-old woman is prescribed an oral liquid described as a microemulsion. She asks how this differs from a regular emulsion. What is the most appropriate distinction?","options":[{"key":"A","text":"Microemulsion has much smaller droplets and is often clear"},{"key":"B","text":"Microemulsion has larger droplets and is always cloudy"},{"key":"C","text":"Microemulsion is a solid dosage form"},{"key":"D","text":"Microemulsion is a gas-in-liquid system"}],"correct":"A","explanation":"Microemulsions have nanoscale droplets and are often transparent.","reference":"Colloids"},{"id":"suspensions_case_1","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 4-year-old child with otitis media is prescribed an amoxicillin oral suspension. The mother asks why the label says \"shake well.\" What is the most appropriate explanation?","options":[{"key":"A","text":"Shaking ensures uniform drug distribution before dosing"},{"key":"B","text":"Shaking improves the taste of the suspension"},{"key":"C","text":"Shaking converts the suspension into a solution"},{"key":"D","text":"Shaking prevents the bottle from breaking"}],"correct":"A","explanation":"Shaking redistributes settled particles for accurate dosing.","reference":"Suspensions"},{"id":"suspensions_case_2","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 65-year-old man with a seizure disorder is prescribed phenytoin oral suspension. He asks why he cannot switch to the capsule without dose adjustment. What is the most appropriate concern?","options":[{"key":"A","text":"Suspension and capsule may have different bioavailability"},{"key":"B","text":"Suspension is always more potent than capsules"},{"key":"C","text":"Suspension is intended only for children"},{"key":"D","text":"Suspension does not contain active drug"}],"correct":"A","explanation":"Different formulations may have different absorption and bioavailability.","reference":"Suspensions"},{"id":"suspensions_case_3","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 30-year-old woman with a bacterial infection is prescribed an antibiotic suspension that must be refrigerated after mixing. She asks why. What is the most appropriate reason?","options":[{"key":"A","text":"To improve the color of the suspension"},{"key":"B","text":"To maintain stability and limit microbial growth"},{"key":"C","text":"To increase the viscosity for easier pouring"},{"key":"D","text":"To change the taste to make it more pleasant"}],"correct":"B","explanation":"Refrigeration improves stability and limits microbial growth in suspensions.","reference":"Suspensions"},{"id":"suspensions_case_4","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 50-year-old man with a chronic cough is prescribed a codeine-containing oral suspension. He notices sediment at the bottom of the bottle. What is the most appropriate action?","options":[{"key":"A","text":"Discard the bottle immediately"},{"key":"B","text":"Shake well to redistribute the sediment"},{"key":"C","text":"Add more water to dissolve the sediment"},{"key":"D","text":"Heat the bottle to dissolve the particles"}],"correct":"B","explanation":"Sediment in suspensions should be redistributed by shaking.","reference":"Suspensions"},{"id":"suspensions_case_5","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 70-year-old woman with glaucoma is prescribed a topical ophthalmic suspension. She asks how to use it properly. What is the most appropriate instruction?","options":[{"key":"A","text":"Shake the bottle well before instilling drops"},{"key":"B","text":"Use the suspension without shaking at all"},{"key":"C","text":"Dilute the suspension with water before use"},{"key":"D","text":"Heat the suspension before instillation"}],"correct":"A","explanation":"Ophthalmic suspensions must be shaken to ensure uniform dosing.","reference":"Suspensions"},{"id":"suspensions_case_6","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 40-year-old man with a fungal infection is prescribed a topical nystatin suspension for oral use. He asks why it is not a solution. What is the most appropriate explanation?","options":[{"key":"A","text":"Nystatin is poorly soluble and formulated as a suspension"},{"key":"B","text":"Nystatin is highly soluble and forms a true solution"},{"key":"C","text":"Suspensions are always more effective than solutions"},{"key":"D","text":"Suspensions are intended only for skin use"}],"correct":"A","explanation":"Poorly soluble drugs are often formulated as suspensions.","reference":"Suspensions"},{"id":"suspensions_case_7","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 55-year-old woman with a chronic condition is prescribed an injectable suspension for IM use. She asks why it cannot be given IV. What is the most appropriate reason?","options":[{"key":"A","text":"Suspensions can cause emboli if given IV"},{"key":"B","text":"Suspensions are always more effective IV"},{"key":"C","text":"Suspensions are intended only for oral use"},{"key":"D","text":"Suspensions are more stable in the bloodstream"}],"correct":"A","explanation":"Particulate suspensions can cause emboli if injected IV.","reference":"Suspensions"},{"id":"suspensions_case_8","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 25-year-old man with acne is prescribed a topical clindamycin suspension. He notices the product separates on standing. What is the most appropriate instruction?","options":[{"key":"A","text":"Discard the product immediately"},{"key":"B","text":"Shake well before each application"},{"key":"C","text":"Add alcohol to prevent separation"},{"key":"D","text":"Heat the bottle to mix the contents"}],"correct":"B","explanation":"Shaking redistributes particles in topical suspensions.","reference":"Suspensions"},{"id":"suspensions_case_9","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 60-year-old woman with a chronic disease is prescribed an oral suspension that forms a hard cake at the bottom if left standing. What term describes this undesirable phenomenon?","options":[{"key":"A","text":"Flocculation"},{"key":"B","text":"Caking"},{"key":"C","text":"Creaming"},{"key":"D","text":"Coalescence"}],"correct":"B","explanation":"Caking is formation of a hard, difficult-to-redisperse layer.","reference":"Suspensions"},{"id":"suspensions_case_10","topicId":"suspensions","topicName":"Suspensions","type":"case","difficulty":"medium","question":"A 35-year-old man with a pediatric patient asks why some oral antibiotics are available as powders for suspension rather than ready-made liquids. What is the most appropriate reason?","options":[{"key":"A","text":"Powders improve stability before reconstitution"},{"key":"B","text":"Powders are less accurate for dosing"},{"key":"C","text":"Powders are intended only for adults"},{"key":"D","text":"Powders do not contain active drug"}],"correct":"A","explanation":"Powders for suspension improve stability for drugs unstable in solution.","reference":"Suspensions"},{"id":"emulsions_case_1","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 60-year-old man receiving parenteral nutrition is given an IV lipid emulsion. The nurse notices a layer of oil on top of the bag. What is the most appropriate action?","options":[{"key":"A","text":"Use the emulsion as is; separation is normal"},{"key":"B","text":"Do not use; visible oil indicates instability"},{"key":"C","text":"Shake vigorously and use immediately"},{"key":"D","text":"Add water to redisperse the oil layer"}],"correct":"B","explanation":"Visible oil separation indicates emulsion instability; do not use.","reference":"Emulsions"},{"id":"emulsions_case_2","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 45-year-old woman with dry skin is prescribed a topical cream described as an oil-in-water emulsion. She asks how this differs from an ointment. What is the most appropriate distinction?","options":[{"key":"A","text":"Creams are less greasy and more washable"},{"key":"B","text":"Creams are more occlusive and greasy"},{"key":"C","text":"Creams are solid dosage forms"},{"key":"D","text":"Creams contain no water at all"}],"correct":"A","explanation":"O/W creams are less greasy and more easily washed off than ointments.","reference":"Emulsions"},{"id":"emulsions_case_3","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 55-year-old man with a fungal infection is prescribed a topical ketoconazole cream. He asks if he can use it on large open wounds. What is the most appropriate advice?","options":[{"key":"A","text":"Yes, emulsions are always safe on open wounds"},{"key":"B","text":"No, many topical emulsions are for intact skin only"},{"key":"C","text":"Yes, emulsions enhance wound healing"},{"key":"D","text":"No, emulsions are only for oral use"}],"correct":"B","explanation":"Many topical emulsions are intended for intact skin, not open wounds.","reference":"Emulsions"},{"id":"emulsions_case_4","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 30-year-old woman with severe acne is prescribed an oral isotretinoin capsule, not an emulsion. She asks why isotretinoin is not given as an oral emulsion. What is the most appropriate reason?","options":[{"key":"A","text":"Isotretinoin is a solid drug suited to capsules"},{"key":"B","text":"Isotretinoin cannot be formulated as an emulsion"},{"key":"C","text":"Emulsions are only for topical use"},{"key":"D","text":"Emulsions are always less effective than capsules"}],"correct":"A","explanation":"Isotretinoin is typically formulated as a solid oral capsule.","reference":"Emulsions"},{"id":"emulsions_case_5","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 70-year-old man with a chronic condition is prescribed a topical corticosteroid available as both a cream and an ointment. His lesions are moist and exudative. Which formulation is most appropriate?","options":[{"key":"A","text":"Ointment for maximum occlusion"},{"key":"B","text":"Cream for less occlusion and better drying"},{"key":"C","text":"Emulsion for systemic absorption"},{"key":"D","text":"Powder for maximum occlusion"}],"correct":"B","explanation":"Creams (O/W) are less occlusive and better for moist lesions.","reference":"Emulsions"},{"id":"emulsions_case_6","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 50-year-old woman with a skin condition is prescribed a water-in-oil topical emulsion. She complains it feels very greasy. What is the most appropriate explanation?","options":[{"key":"A","text":"W/O emulsions are more occlusive and greasy"},{"key":"B","text":"W/O emulsions are always non-greasy"},{"key":"C","text":"W/O emulsions are intended only for oral use"},{"key":"D","text":"W/O emulsions contain no oil"}],"correct":"A","explanation":"W/O emulsions are more occlusive and feel greasier.","reference":"Emulsions"},{"id":"emulsions_case_7","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 65-year-old man with a chronic disease is prescribed an oral emulsion to improve absorption of a lipophilic drug. He asks how it differs from a solution. What is the most appropriate distinction?","options":[{"key":"A","text":"Emulsion contains dispersed oil droplets; solution does not"},{"key":"B","text":"Emulsion is a single-phase system; solution is two-phase"},{"key":"C","text":"Emulsion contains no oil at all"},{"key":"D","text":"Emulsion is a solid dosage form"}],"correct":"A","explanation":"Emulsions are two-phase systems with oil droplets dispersed in water.","reference":"Emulsions"},{"id":"emulsions_case_8","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 40-year-old woman with a child who has eczema is prescribed a topical emollient cream. She asks if she can use adult-strength cream on the child. What is the most appropriate consideration?","options":[{"key":"A","text":"Pediatric skin may absorb more; use appropriate strength"},{"key":"B","text":"Pediatric skin absorbs less; use higher strength"},{"key":"C","text":"Emulsions are always safe at any strength"},{"key":"D","text":"Emulsions are only for adult use"}],"correct":"A","explanation":"Children's skin may have different absorption; use appropriate formulations.","reference":"Emulsions"},{"id":"emulsions_case_9","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 55-year-old man with a chronic condition is prescribed a topical emulsion that separates on standing. He asks what to do. What is the most appropriate instruction?","options":[{"key":"A","text":"Discard immediately; separation is always dangerous"},{"key":"B","text":"Gently mix if the label permits; otherwise consult pharmacist"},{"key":"C","text":"Heat the bottle to recombine the phases"},{"key":"D","text":"Add water to fix the separation"}],"correct":"B","explanation":"Some emulsions can be gently re-mixed; others may be unstable.","reference":"Emulsions"},{"id":"emulsions_case_10","topicId":"emulsions","topicName":"Emulsions","type":"case","difficulty":"medium","question":"A 35-year-old woman with a chronic disease is prescribed an IV emulsion containing a lipophilic drug. The nurse asks what special administration consideration is needed. What is the most appropriate answer?","options":[{"key":"A","text":"Use an in-line filter if recommended"},{"key":"B","text":"Administer as a rapid IV push"},{"key":"C","text":"Mix with other IV drugs in the same line"},{"key":"D","text":"Store at room temperature indefinitely"}],"correct":"A","explanation":"Some IV emulsions require in-line filters and specific handling.","reference":"Emulsions"},{"id":"sterile_forms_case_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 60-year-old man with sepsis is prescribed an IV antibiotic. The nurse asks why the solution must be sterile and pyrogen-free. What is the most appropriate reason?","options":[{"key":"A","text":"To prevent bloodstream infection and fever reactions"},{"key":"B","text":"To improve the color of the solution"},{"key":"C","text":"To enhance the taste of the solution"},{"key":"D","text":"To increase the viscosity for easier infusion"}],"correct":"A","explanation":"Sterility prevents infection; pyrogen-free status prevents febrile reactions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 45-year-old woman with cancer is prescribed a hazardous chemotherapy IV infusion. Which primary engineering control is appropriate for compounding this preparation?","options":[{"key":"A","text":"Class II biological safety cabinet (BSC) or compounding aseptic containment isolator (CACI)"},{"key":"B","text":"A conventional open-front vertical laminar airflow workbench (LAFW)"},{"key":"C","text":"A horizontal laminar airflow workbench"},{"key":"D","text":"A standard fume hood without HEPA filtration"}],"correct":"A","explanation":"Hazardous drugs, including most chemotherapy agents, require a containment primary engineering control \u2014 typically a Class II biological safety cabinet (BSC) or a compounding aseptic containment isolator (CACI) \u2014 per USP <800> and NIOSH guidance. These provide both product sterility protection (ISO 5 air) and personnel/environmental protection from hazardous drug exposure. A conventional open-front LAFW protects the preparation but does not protect the compounder from hazardous drug exposure, so it is not appropriate for chemotherapy compounding.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 70-year-old man with diabetes is prescribed insulin for subcutaneous injection. He asks why he must not reuse needles. What is the most appropriate reason?","options":[{"key":"A","text":"Reuse increases risk of infection and needle damage"},{"key":"B","text":"Reuse improves the effectiveness of insulin"},{"key":"C","text":"Reuse reduces the pain of injection"},{"key":"D","text":"Reuse is required for accurate dosing"}],"correct":"A","explanation":"Needle reuse increases infection risk and can damage the needle.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 55-year-old woman with a severe infection is prescribed a vancomycin IV infusion. The nurse notices small particles in the bag. What is the most appropriate action?","options":[{"key":"A","text":"Use the bag; particles are normal"},{"key":"B","text":"Do not use; inspect and report potential contamination"},{"key":"C","text":"Shake the bag to dissolve the particles"},{"key":"D","text":"Add more fluid to dilute the particles"}],"correct":"B","explanation":"Visible particles in injectables are generally unacceptable.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 30-year-old man with a chronic condition requires a compounded sterile preparation (CSP) in the hospital. The pharmacist asks what determines the beyond-use date (BUD). What is the most appropriate factor, under the revised USP <797>?","options":[{"key":"A","text":"CSP category (1, 2, or 3), storage conditions, preparation method, and applicable USP <797> requirements"},{"key":"B","text":"Color of the solution"},{"key":"C","text":"Smell of the preparation"},{"key":"D","text":"Taste of the preparation"}],"correct":"A","explanation":"Under the revised USP <797>, BUD is determined by the CSP's category (1, 2, or 3), storage conditions (room temperature, refrigerated, or frozen), preparation method (aseptic vs. terminal sterilization), whether starting components were sterile or nonsterile, and whether sterility testing was performed \u2014 not by any sensory characteristic of the preparation.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 65-year-old woman with glaucoma is prescribed timolol ophthalmic solution. The manufacturer's labeling instructs her to discard the multidose bottle 28 days after opening. What is the most appropriate reason?","options":[{"key":"A","text":"To minimize contamination and maintain product quality after opening, per the manufacturer\u2019s labeled in-use period"},{"key":"B","text":"Solution becomes more effective after 28 days"},{"key":"C","text":"Solution changes color to indicate potency"},{"key":"D","text":"Solution becomes less viscous and more comfortable"}],"correct":"A","explanation":"Multidose ophthalmic products carry a manufacturer-specified in-use period (here, 28 days) to limit contamination risk from repeated dropper-tip exposure to the eye and environment. This in-use period is product/label-specific \u2014 not every ophthalmic solution uses exactly 28 days \u2014 so patients should always follow the specific product's labeling.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 50-year-old man with a bacterial infection is prescribed an IV antibiotic that requires reconstitution. The nurse asks which diluent to use. What is the most appropriate choice?","options":[{"key":"A","text":"Sterile water for injection or specified diluent"},{"key":"B","text":"Tap water from the sink"},{"key":"C","text":"Bottled drinking water"},{"key":"D","text":"Any available IV fluid"}],"correct":"A","explanation":"Only sterile, appropriate diluents should be used for reconstitution.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 40-year-old woman with a chronic disease is prescribed a subcutaneous biologic injection. She asks why the product must be refrigerated. What is the most appropriate reason?","options":[{"key":"A","text":"To maintain protein stability and potency"},{"key":"B","text":"To change the color of the solution"},{"key":"C","text":"To increase the viscosity for easier injection"},{"key":"D","text":"To reduce the risk of crystallization only"}],"correct":"A","explanation":"Biologics often require refrigeration to maintain stability.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 75-year-old man with pain is prescribed a patient-controlled analgesia (PCA) morphine infusion. The nurse asks what osmolarity consideration is important for peripheral IV lines. What is the most appropriate limit?","options":[{"key":"A","text":"Solutions should generally be \u2264900 mOsm/L for peripheral use"},{"key":"B","text":"All solutions must be >1000 mOsm/L"},{"key":"C","text":"Osmolarity is irrelevant for IV infusions"},{"key":"D","text":"Only oral solutions have osmolarity limits"}],"correct":"A","explanation":"High osmolarity solutions (>900 mOsm/L) should be given via central lines.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_case_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"case","difficulty":"medium","question":"A 60-year-old woman with a surgical wound is prescribed a sterile irrigation solution. She asks why it must be sterile if it is not injected. What is the most appropriate reason?","options":[{"key":"A","text":"To prevent introduction of microbes into body cavities"},{"key":"B","text":"To improve the color of the irrigation fluid"},{"key":"C","text":"To increase the viscosity for better cleansing"},{"key":"D","text":"To change the taste if swallowed accidentally"}],"correct":"A","explanation":"Irrigations contact internal tissues and must be sterile.","reference":"Sterile Dosage Forms"},{"id":"modified_release_case_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 68-year-old man with hypertension is switched from immediate-release metoprolol tartrate to extended-release metoprolol succinate. He asks how the dosing will change. What is the most appropriate explanation?","options":[{"key":"A","text":"ER allows once-daily dosing with similar total daily dose"},{"key":"B","text":"ER requires more frequent dosing than IR"},{"key":"C","text":"ER is always twice as potent as IR"},{"key":"D","text":"ER must be taken only at bedtime"}],"correct":"A","explanation":"ER formulations often allow once-daily dosing with adjusted mg.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 55-year-old woman with chronic pain is prescribed an extended-release oxycodone tablet. She asks if she can crush it to mix with food due to swallowing difficulty. What is the most appropriate response?","options":[{"key":"A","text":"Yes, crushing is safe for all ER tablets"},{"key":"B","text":"No, crushing may cause rapid release and toxicity"},{"key":"C","text":"Yes, but only with a high-fat meal"},{"key":"D","text":"No, but chewing will achieve the same effect"}],"correct":"B","explanation":"Crushing ER opioids can cause dose dumping and overdose.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 70-year-old man with type 2 diabetes is prescribed a once-daily extended-release metformin tablet. He notices a ghost tablet in his stool. What is the most appropriate explanation?","options":[{"key":"A","text":"The tablet did not release any drug"},{"key":"B","text":"The inert matrix may pass intact after drug release"},{"key":"C","text":"The tablet was defective and should be reported"},{"key":"D","text":"The drug is only partially absorbed due to food"}],"correct":"B","explanation":"Some ER matrices pass through the GI tract intact after drug release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 45-year-old woman with depression is prescribed a delayed-release enteric-coated tablet. She asks why she cannot split it to reduce the dose. What is the most appropriate reason?","options":[{"key":"A","text":"Splitting may damage the enteric coating"},{"key":"B","text":"Splitting will improve the drug's absorption"},{"key":"C","text":"Splitting will convert it to an immediate-release form"},{"key":"D","text":"Splitting will make the tablet taste better"}],"correct":"A","explanation":"Splitting enteric-coated tablets can compromise the coating.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 60-year-old man with a chronic condition is prescribed a transdermal patch for once-weekly dosing. He asks how this differs from his previous oral tablet. What is the most appropriate distinction?","options":[{"key":"A","text":"Patch provides steady systemic levels over days"},{"key":"B","text":"Patch provides immediate peak levels like IR tablets"},{"key":"C","text":"Patch is only for local skin effects"},{"key":"D","text":"Patch does not require adhesion to the skin"}],"correct":"A","explanation":"Transdermal patches provide controlled systemic delivery over time.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 50-year-old woman with a seizure disorder is prescribed an extended-release anticonvulsant. She is scheduled for bariatric surgery. What is the most important consideration?","options":[{"key":"A","text":"Altered GI anatomy may affect ER drug release"},{"key":"B","text":"ER formulations are always safe after bariatric surgery"},{"key":"C","text":"ER formulations are only for oral use"},{"key":"D","text":"ER formulations are not affected by GI changes"}],"correct":"A","explanation":"GI alterations can change ER performance and absorption.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 65-year-old man with a chronic disease is prescribed a pulsatile-release formulation that delivers drug in bursts. He asks how this differs from his previous ER tablet. What is the most appropriate distinction?","options":[{"key":"A","text":"Pulsatile releases drug at specific times; ER is continuous"},{"key":"B","text":"Pulsatile releases drug continuously; ER is in bursts"},{"key":"C","text":"Pulsatile is only for topical use"},{"key":"D","text":"Pulsatile is only for IV administration"}],"correct":"A","explanation":"Pulsatile systems release drug in programmed bursts.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 40-year-old woman with a chronic condition is prescribed an osmotic pump extended-release tablet. She asks how it works. What is the most appropriate explanation?","options":[{"key":"A","text":"Water enters the tablet and pushes drug out at a controlled rate"},{"key":"B","text":"The tablet dissolves immediately in the stomach"},{"key":"C","text":"The tablet releases drug only in the mouth"},{"key":"D","text":"The tablet releases drug only when chewed"}],"correct":"A","explanation":"Osmotic pumps use water influx to drive controlled drug release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_9","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 55-year-old man with a chronic disease is prescribed an extended-release formulation that should be taken with food. He asks why. What is the most appropriate reason?","options":[{"key":"A","text":"Food may be required for consistent drug release"},{"key":"B","text":"Food always reduces the absorption of ER drugs"},{"key":"C","text":"Food has no effect on ER formulations"},{"key":"D","text":"Food converts ER to immediate-release"}],"correct":"A","explanation":"Some ER products require food for consistent release/absorption.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_case_10","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"case","difficulty":"medium","question":"A 70-year-old woman with a chronic condition is prescribed a lo
