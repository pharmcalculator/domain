ns","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with oral aqueous solutions?","options":[{"key":"A","text":"Intramuscular"},{"key":"B","text":"Oral"},{"key":"C","text":"Transdermal"},{"key":"D","text":"Ophthalmic only"}],"correct":"B","explanation":"Oral solutions are taken by mouth.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_12","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about aromatic waters is correct?","options":[{"key":"A","text":"They are concentrated oil solutions"},{"key":"B","text":"They are saturated aqueous solutions of volatile oils"},{"key":"C","text":"They are solid dosage forms"},{"key":"D","text":"They contain no water"}],"correct":"B","explanation":"Aromatic waters are saturated solutions of volatile oils in water.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_13","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most important for oral aqueous solutions?","options":[{"key":"A","text":"\"Shake only if the label says 'suspension'\""},{"key":"B","text":"\"Use the provided measuring device for accurate dosing\""},{"key":"C","text":"\"Dilute with alcohol before taking\""},{"key":"D","text":"\"Store in the freezer\""}],"correct":"B","explanation":"Accurate measurement is critical for liquid doses.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_14","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about collodions is correct?","options":[{"key":"A","text":"They are aqueous solutions for oral use"},{"key":"B","text":"They are solutions of pyroxylin in alcohol/ether for topical use"},{"key":"C","text":"They are solid dosage forms"},{"key":"D","text":"They are used for injection"}],"correct":"B","explanation":"Collodions are topical solutions of pyroxylin in alcohol/ether.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_15","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor would most likely cause precipitation in an aqueous solution?","options":[{"key":"A","text":"Increase in temperature for all drugs"},{"key":"B","text":"Change in pH outside the drug's solubility range"},{"key":"C","text":"Addition of more water"},{"key":"D","text":"Storage in amber bottles"}],"correct":"B","explanation":"pH changes can reduce solubility and cause precipitation.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_16","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about ophthalmic solutions is correct?","options":[{"key":"A","text":"They do not need to be sterile"},{"key":"B","text":"They must be sterile, isotonic, and buffered"},{"key":"C","text":"They can contain large particles"},{"key":"D","text":"They are intended for oral use"}],"correct":"B","explanation":"Ophthalmic solutions must be sterile and physiologically compatible.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_17","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a buffering agent in aqueous solutions?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Sodium phosphate"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Phosphate buffers help maintain pH.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_18","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about spirit preparations is correct?","options":[{"key":"A","text":"They are aqueous solutions with no alcohol"},{"key":"B","text":"They are alcoholic or hydroalcoholic solutions of volatile substances"},{"key":"C","text":"They are solid dosage forms"},{"key":"D","text":"They are used only for injection"}],"correct":"B","explanation":"Spirits are alcoholic solutions of volatile drugs.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_19","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which storage condition is most critical for many aqueous solutions?","options":[{"key":"A","text":"Exposure to direct sunlight"},{"key":"B","text":"Protection from light and temperature extremes"},{"key":"C","text":"Storage at high humidity"},{"key":"D","text":"Freezing is always recommended"}],"correct":"B","explanation":"Light and temperature can degrade many solutions.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_20","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about tinctures is correct?","options":[{"key":"A","text":"They are aqueous solutions with no alcohol"},{"key":"B","text":"They are alcoholic or hydroalcoholic solutions, often of plant materials"},{"key":"C","text":"They are solid dosage forms"},{"key":"D","text":"They are used only topically"}],"correct":"B","explanation":"Tinctures are typically hydroalcoholic extracts.","reference":"Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement best defines a non-aqueous solution?","options":[{"key":"A","text":"A solution where the solvent is primarily water"},{"key":"B","text":"A solution where the solvent is oil, alcohol, glycerin, or other non-water vehicles"},{"key":"C","text":"A solid dosage form"},{"key":"D","text":"A suspension of solid particles in water"}],"correct":"B","explanation":"Non-aqueous solutions use non-water solvents.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which vehicle is commonly used in non-aqueous injectable solutions for poorly water-soluble drugs?","options":[{"key":"A","text":"Water for injection"},{"key":"B","text":"Sterile oil (e.g., sesame oil, cottonseed oil)"},{"key":"C","text":"Normal saline"},{"key":"D","text":"Ringer's solution"}],"correct":"B","explanation":"Oils are used as vehicles for lipophilic drugs in IM injections.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about alcoholic solutions is correct?","options":[{"key":"A","text":"They contain no ethanol"},{"key":"B","text":"They may be used to dissolve drugs poorly soluble in water"},{"key":"C","text":"They are always for parenteral use"},{"key":"D","text":"They cannot be used orally"}],"correct":"B","explanation":"Alcohol can solubilize lipophilic drugs for oral or topical use.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with oleaginous injectable solutions?","options":[{"key":"A","text":"Intravenous only"},{"key":"B","text":"Intramuscular depot injections"},{"key":"C","text":"Oral only"},{"key":"D","text":"Ophthalmic only"}],"correct":"B","explanation":"Oil-based IM injections can provide depot effects.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_5","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about glycerin-based non-aqueous solutions is correct?","options":[{"key":"A","text":"They are always irritating"},{"key":"B","text":"They are hygroscopic and can be used as solvents or co-solvents"},{"key":"C","text":"They cannot be used topically"},{"key":"D","text":"They are solid at room temperature"}],"correct":"B","explanation":"Glycerin is a hygroscopic, water-miscible solvent.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_6","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor is most critical for the safety of non-aqueous injectable solutions?","options":[{"key":"A","text":"Color of the oil"},{"key":"B","text":"Sterility and absence of pyrogens"},{"key":"C","text":"Smell of the vehicle"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"Injectables must be sterile and pyrogen-free regardless of vehicle.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_7","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous oral solutions is correct?","options":[{"key":"A","text":"They are never used"},{"key":"B","text":"They may be used for drugs unstable or insoluble in water"},{"key":"C","text":"They must contain sugar"},{"key":"D","text":"They are always alcohol-free"}],"correct":"B","explanation":"Non-aqueous vehicles can improve stability/solubility for some drugs.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_8","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a co-solvent in non-aqueous solutions?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Sodium chloride"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Propylene glycol is a common co-solvent.1{.underline}()","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_9","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about oil-based topical solutions is correct?","options":[{"key":"A","text":"They are always irritating"},{"key":"B","text":"They can provide occlusive and emollient effects"},{"key":"C","text":"They cannot contain drugs"},{"key":"D","text":"They are only used for internal use"}],"correct":"B","explanation":"Oil-based topicals can be occlusive and emollient.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_10","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor limits the use of non-aqueous vehicles for IV administration?","options":[{"key":"A","text":"Color"},{"key":"B","text":"Potential for embolism and hemolysis if not properly formulated"},{"key":"C","text":"Smell"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"Oils and certain solvents can cause serious IV adverse effects if misused.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_11","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous ophthalmic solutions is correct?","options":[{"key":"A","text":"They are commonly used"},{"key":"B","text":"They are rarely used due to irritation potential"},{"key":"C","text":"They must be non-sterile"},{"key":"D","text":"They are always water-based"}],"correct":"B","explanation":"Non-aqueous ophthalmic products are uncommon due to irritation.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_12","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which storage consideration is particularly important for oil-based solutions?","options":[{"key":"A","text":"Protection from freezing only"},{"key":"B","text":"Protection from oxidation and rancidity"},{"key":"C","text":"No special storage needed"},{"key":"D","text":"Must be stored in direct sunlight"}],"correct":"B","explanation":"Oils can oxidize and become rancid.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_13","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous mouthwashes is correct?","options":[{"key":"A","text":"They must contain water as the main solvent"},{"key":"B","text":"They may contain alcohol as the primary solvent"},{"key":"C","text":"They are always sugar-free"},{"key":"D","text":"They are solid dosage forms"}],"correct":"B","explanation":"Many mouthwashes are hydroalcoholic or alcohol-based.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_14","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor most affects drug release from an oleaginous injectable depot?","options":[{"key":"A","text":"Color of the oil"},{"key":"B","text":"Drug solubility in oil and rate of partitioning into tissue fluids"},{"key":"C","text":"Smell of the oil"},{"key":"D","text":"Viscosity of the container"}],"correct":"B","explanation":"Solubility and partitioning control release from oil depots.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_15","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous nasal solutions is correct?","options":[{"key":"A","text":"They are commonly water-based"},{"key":"B","text":"Non-aqueous vehicles may be used to enhance absorption or stability"},{"key":"C","text":"They must be hypertonic"},{"key":"D","text":"They are always irritant"}],"correct":"B","explanation":"Non-aqueous vehicles can be used in nasal products for specific purposes.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_16","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which excipient is often added to non-aqueous solutions to prevent oxidation?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Antioxidants such as BHT or ascorbyl palmitate"},{"key":"C","text":"Lactose"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Antioxidants help prevent oxidation of oils and lipophilic drugs.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_17","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous topical solutions is correct?","options":[{"key":"A","text":"They cannot penetrate the skin"},{"key":"B","text":"They may enhance penetration of lipophilic drugs"},{"key":"C","text":"They are always water-washable"},{"key":"D","text":"They are never used in dermatology"}],"correct":"B","explanation":"Non-aqueous vehicles can enhance penetration of lipophilic drugs.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_18","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which route is least appropriate for a highly viscous non-aqueous solution?","options":[{"key":"A","text":"Intramuscular"},{"key":"B","text":"Intravenous"},{"key":"C","text":"Topical"},{"key":"D","text":"Oral"}],"correct":"B","explanation":"Highly viscous non-aqueous solutions are generally unsuitable for IV use.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_19","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about non-aqueous solutions for inhalation is correct?","options":[{"key":"A","text":"They are commonly used as nebulizer solutions"},{"key":"B","text":"They are rarely used due to irritation and safety concerns"},{"key":"C","text":"They must be water-based"},{"key":"D","text":"They are always sterile"}],"correct":"B","explanation":"Most inhalation solutions are aqueous; non-aqueous are uncommon.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b2_20","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most important for alcohol-containing oral solutions?","options":[{"key":"A","text":"\"Take with grapefruit juice\""},{"key":"B","text":"\"Be aware of alcohol content, especially if avoiding alcohol\""},{"key":"C","text":"\"Dilute with oil before taking\""},{"key":"D","text":"\"Store in direct sunlight\""}],"correct":"B","explanation":"Patients may need to avoid alcohol for medical or personal reasons.","reference":"Non-Aqueous Solutions"},{"id":"colloids_b2_1","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which particle size range best characterizes colloidal dispersions?","options":[{"key":"A","text":"<1 nm"},{"key":"B","text":"1 nm to 1 \u00b5m"},{"key":"C","text":">1 mm"},{"key":"D","text":"10--100 \u00b5m"}],"correct":"B","explanation":"Colloidal particles are typically 1 nm to ~1 \u00b5m.1{.underline}","reference":"Colloids"},{"id":"colloids_b2_2","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which type of colloid has a liquid dispersed in another liquid?","options":[{"key":"A","text":"Sol"},{"key":"B","text":"Gel"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Foam"}],"correct":"C","explanation":"Emulsions are liquid-in-liquid colloidal systems.","reference":"Colloids"},{"id":"colloids_b2_3","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about lyophilic colloids is correct?","options":[{"key":"A","text":"They have low affinity for the dispersion medium"},{"key":"B","text":"They are solvent-loving and form stable colloids"},{"key":"C","text":"They always precipitate easily"},{"key":"D","text":"They are always solid in liquid"}],"correct":"B","explanation":"Lyophilic colloids have high affinity for the solvent and are stable.","reference":"Colloids"},{"id":"colloids_b2_4","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which type of colloid is a solid dispersed in a liquid?","options":[{"key":"A","text":"Sol"},{"key":"B","text":"Gel"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Aerosol"}],"correct":"A","explanation":"Sols are solid-in-liquid colloidal dispersions.","reference":"Colloids"},{"id":"colloids_b2_5","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which phenomenon describes the scattering of light by colloidal particles?","options":[{"key":"A","text":"Osmosis"},{"key":"B","text":"Tyndall effect"},{"key":"C","text":"Diffusion"},{"key":"D","text":"Sedimentation"}],"correct":"B","explanation":"The Tyndall effect is characteristic of colloids.","reference":"Colloids"},{"id":"colloids_b2_6","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about lyophobic colloids is correct?","options":[{"key":"A","text":"They are solvent-loving"},{"key":"B","text":"They are solvent-hating and less stable without stabilizers"},{"key":"C","text":"They never require stabilizers"},{"key":"D","text":"They are always liquid in liquid"}],"correct":"B","explanation":"Lyophobic colloids have low affinity for the medium and need stabilizers.","reference":"Colloids"},{"id":"colloids_b2_7","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which type of colloid is a liquid dispersed in a solid?","options":[{"key":"A","text":"Gel"},{"key":"B","text":"Sol"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Foam"}],"correct":"A","explanation":"Gels are liquid-in-solid colloidal systems.","reference":"Colloids"},{"id":"colloids_b2_8","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about protective colloids is correct?","options":[{"key":"A","text":"They destabilize colloidal systems"},{"key":"B","text":"They adsorb on particle surfaces and prevent aggregation"},{"key":"C","text":"They are only used in solid dosage forms"},{"key":"D","text":"They increase particle size"}],"correct":"B","explanation":"Protective colloids (e.g., polymers) stabilize colloids by steric/electrostatic effects.","reference":"Colloids"},{"id":"colloids_b2_9","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which colloid type is a gas dispersed in a liquid?","options":[{"key":"A","text":"Foam"},{"key":"B","text":"Sol"},{"key":"C","text":"Gel"},{"key":"D","text":"Emulsion"}],"correct":"A","explanation":"Foams are gas-in-liquid dispersions.","reference":"Colloids"},{"id":"colloids_b2_10","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about micelles is correct?","options":[{"key":"A","text":"They are large particles >10 \u00b5m"},{"key":"B","text":"They are aggregates of surfactant molecules forming colloidal structures"},{"key":"C","text":"They are only found in solid dosage forms"},{"key":"D","text":"They cannot solubilize drugs"}],"correct":"B","explanation":"Micelles are surfactant aggregates that can solubilize lipophilic drugs.","reference":"Colloids"},{"id":"colloids_b2_11","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which factor most affects the stability of a colloidal system?","options":[{"key":"A","text":"Color of the dispersion"},{"key":"B","text":"Surface charge (zeta potential) and steric factors"},{"key":"C","text":"Smell"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"Electrostatic and steric stabilization prevent aggregation.","reference":"Colloids"},{"id":"colloids_b2_12","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which type of colloid is a solid dispersed in a gas?","options":[{"key":"A","text":"Aerosol (solid in gas)"},{"key":"B","text":"Sol"},{"key":"C","text":"Gel"},{"key":"D","text":"Emulsion"}],"correct":"A","explanation":"Solid-in-gas dispersions are aerosols (e.g., smoke).","reference":"Colloids"},{"id":"colloids_b2_13","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about colloidal silver is correct?","options":[{"key":"A","text":"It is a coarse suspension"},{"key":"B","text":"It is a colloidal dispersion of silver particles in liquid"},{"key":"C","text":"It is a solid tablet"},{"key":"D","text":"It is a gas"}],"correct":"B","explanation":"Colloidal silver consists of fine silver particles dispersed in liquid.","reference":"Colloids"},{"id":"colloids_b2_14","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which method is commonly used to prepare colloidal dispersions?","options":[{"key":"A","text":"Direct compression"},{"key":"B","text":"Peptization or dispersion with stabilizers"},{"key":"C","text":"Lyophilization only"},{"key":"D","text":"Melting and molding"}],"correct":"B","explanation":"Colloids are often prepared by dispersion with stabilizers or peptization.","reference":"Colloids"},{"id":"colloids_b2_15","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about the Brownian movement in colloids is correct?","options":[{"key":"A","text":"It causes rapid sedimentation"},{"key":"B","text":"It is the random motion of colloidal particles that helps prevent sedimentation"},{"key":"C","text":"It only occurs in coarse suspensions"},{"key":"D","text":"It is unrelated to colloids"}],"correct":"B","explanation":"Brownian motion helps keep colloidal particles suspended.1{.underline}","reference":"Colloids"},{"id":"colloids_b2_16","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which type of colloid is a gas dispersed in a solid?","options":[{"key":"A","text":"Solid foam"},{"key":"B","text":"Sol"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Gel"}],"correct":"A","explanation":"Solid foams are gas-in-solid colloidal systems.","reference":"Colloids"},{"id":"colloids_b2_17","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about association colloids is correct?","options":[{"key":"A","text":"They are formed by large solid particles"},{"key":"B","text":"They are formed by aggregation of amphiphilic molecules (e.g., surfactants)"},{"key":"C","text":"They are always unstable"},{"key":"D","text":"They cannot solubilize drugs"}],"correct":"B","explanation":"Association colloids include micelles and liquid crystals formed by surfactants.","reference":"Colloids"},{"id":"colloids_b2_18","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"medium","question":"Which analytical technique is commonly used to characterize colloidal particle size?","options":[{"key":"A","text":"Simple visual inspection"},{"key":"B","text":"Dynamic light scattering (DLS)"},{"key":"C","text":"Titration"},{"key":"D","text":"Melting point determination"}],"correct":"B","explanation":"DLS measures particle size in colloidal dispersions.","reference":"Colloids"},{"id":"colloids_b2_19","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which statement about colloidal stability and electrolytes is correct?","options":[{"key":"A","text":"Electrolytes always stabilize all colloids"},{"key":"B","text":"High electrolyte concentrations can destabilize lyophobic colloids by compressing the double layer"},{"key":"C","text":"Electrolytes have no effect on colloids"},{"key":"D","text":"Electrolytes only affect solid dosage forms"}],"correct":"B","explanation":"Electrolytes can reduce zeta potential and cause coagulation.1{.underline}","reference":"Colloids"},{"id":"colloids_b2_20","topicId":"colloids","topicName":"Colloids","type":"mcq","difficulty":"easy","question":"Which pharmaceutical application commonly uses colloidal systems?","options":[{"key":"A","text":"Tablet compression only"},{"key":"B","text":"Parenteral nutrition emulsions and some injectable drug carriers"},{"key":"C","text":"Only solid dosage forms"},{"key":"D","text":"Only topical powders"}],"correct":"B","explanation":"Emulsions and colloidal carriers are used in parenteral and other formulations.","reference":"Colloids"},{"id":"suspensions_b2_1","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement best defines a pharmaceutical suspension?","options":[{"key":"A","text":"A single-phase solution of drug in water"},{"key":"B","text":"A two-phase system with solid particles dispersed in a liquid"},{"key":"C","text":"A liquid-in-liquid dispersion"},{"key":"D","text":"A solid dosage form"}],"correct":"B","explanation":"Suspensions are biphasic systems of solids in liquids.5{.underline}()","reference":"Suspensions"},{"id":"suspensions_b2_2","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which property is desirable for a well-formulated suspension?","options":[{"key":"A","text":"Rapid caking that cannot be redispered"},{"key":"B","text":"Slow settling with easy redispersion upon shaking"},{"key":"C","text":"Immediate precipitation that cannot be shaken"},{"key":"D","text":"No settling at all under any condition"}],"correct":"B","explanation":"Ideal suspensions settle slowly and redisperse easily.","reference":"Suspensions"},{"id":"suspensions_b2_3","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which excipient is commonly used as a suspending agent?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Xanthan gum"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Xanthan gum and similar polymers increase viscosity and suspend particles.","reference":"Suspensions"},{"id":"suspensions_b2_4","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about flocculated suspensions is correct?","options":[{"key":"A","text":"Particles form loose aggregates that settle rapidly but redisperse easily"},{"key":"B","text":"Particles remain completely separate and never settle"},{"key":"C","text":"Particles form hard cakes that cannot be redispered"},{"key":"D","text":"Flocculation is always undesirable"}],"correct":"A","explanation":"Flocculated suspensions settle faster but are more easily redispersed.","reference":"Suspensions"},{"id":"suspensions_b2_5","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about deflocculated suspensions is correct?","options":[{"key":"A","text":"Particles remain as separate entities and may form hard cakes on settling"},{"key":"B","text":"Particles always form flocs"},{"key":"C","text":"They never settle"},{"key":"D","text":"They are always preferred over flocculated systems"}],"correct":"A","explanation":"Deflocculated particles settle slowly but can cake.1{.underline}","reference":"Suspensions"},{"id":"suspensions_b2_6","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which patient counseling point is most important for oral suspensions?","options":[{"key":"A","text":"\"Do not shake; it will ruin the product\""},{"key":"B","text":"\"Shake well before each use\""},{"key":"C","text":"\"Dilute with alcohol before taking\""},{"key":"D","text":"\"Store in the freezer\""}],"correct":"B","explanation":"Shaking ensures uniform dosing.","reference":"Suspensions"},{"id":"suspensions_b2_7","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which factor most affects the sedimentation rate in a suspension?","options":[{"key":"A","text":"Color of the vehicle"},{"key":"B","text":"Particle size and viscosity of the vehicle"},{"key":"C","text":"Smell of the product"},{"key":"D","text":"Taste only"}],"correct":"B","explanation":"Smaller particles and higher viscosity reduce sedimentation (Stokes' law).","reference":"Suspensions"},{"id":"suspensions_b2_8","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"Which statement about controlled flocculation is correct?","options":[{"key":"A","text":"It is used to prevent any settling"},{"key":"B","text":"It is used to optimize settling and redispersion characteristics"},{"key":"C","text":"It always leads to caking"},{"key":"D","text":"It is only used in emulsions"}],"correct":"B","explanation":"Controlled flocculation balances settling and redispersion.","reference":"Suspensions"},{"id":"suspensions_b2_9","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which excipient is commonly used as a wetting agent in suspensions?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Polysorbate 80"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Surfactants like polysorbates wet hydrophobic particles.","reference":"Suspensions"},{"id":"suspensions_b2_10","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about oral antibiotic suspensions is correct?","options":[{"key":"A","text":"They are always stable indefinitely after reconstitution"},{"key":"B","text":"Many require refrigeration and have limited beyond-use dates after mixing"},{"key":"C","text":"They do not need to be shaken"},{"key":"D","text":"They are always alcohol-based"}],"correct":"B","explanation":"Many reconstituted suspensions have limited stability and require refrigeration.","reference":"Suspensions"},{"id":"suspensions_b2_11","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which route of administration is associated with ophthalmic suspensions?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Ocular"},{"key":"C","text":"Rectal"},{"key":"D","text":"Inhalation"}],"correct":"B","explanation":"Ophthalmic suspensions are used in the eye.","reference":"Suspensions"},{"id":"suspensions_b2_12","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about ophthalmic suspensions is correct?","options":[{"key":"A","text":"They do not need to be sterile"},{"key":"B","text":"They must be sterile and have appropriate particle size to avoid irritation"},{"key":"C","text":"They can contain large, sharp particles"},{"key":"D","text":"They are intended for oral use"}],"correct":"B","explanation":"Ophthalmic suspensions must be sterile and finely milled.","reference":"Suspensions"},{"id":"suspensions_b2_13","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about injectable suspensions is correct?","options":[{"key":"A","text":"They can be given intravenously without restriction"},{"key":"B","text":"They are generally for IM or SC use and must be sterile"},{"key":"C","text":"They do not need to be pyrogen-free"},{"key":"D","text":"They can contain large particles for IV use"}],"correct":"B","explanation":"Injectable suspensions are typically IM/SC and must be sterile.","reference":"Suspensions"},{"id":"suspensions_b2_15","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about caking in suspensions is correct?","options":[{"key":"A","text":"It is desirable and indicates stability"},{"key":"B","text":"It refers to formation of a hard layer at the bottom that is difficult to redisperse"},{"key":"C","text":"It only occurs in emulsions"},{"key":"D","text":"It improves dose uniformity"}],"correct":"B","explanation":"Caking is undesirable as it hinders redispersion.","reference":"Suspensions"},{"id":"suspensions_b2_16","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which analytical test is important for assessing suspension uniformity?","options":[{"key":"A","text":"Melting point"},{"key":"B","text":"Sedimentation volume and redispersibility"},{"key":"C","text":"Hardness"},{"key":"D","text":"Friability"}],"correct":"B","explanation":"Sedimentation volume and ease of redispersion indicate physical stability.","reference":"Suspensions"},{"id":"suspensions_b2_17","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about pediatric oral suspensions is correct?","options":[{"key":"A","text":"Dosing is always based on adult doses"},{"key":"B","text":"They allow flexible dosing based on weight or age"},{"key":"C","text":"They cannot contain flavors"},{"key":"D","text":"They are always alcohol-containing"}],"correct":"B","explanation":"Suspensions enable weight-based pediatric dosing.","reference":"Suspensions"},{"id":"suspensions_b2_18","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which excipient is commonly used to adjust the pH of a suspension?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Citric acid/sodium citrate"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Buffers like citrate adjust and maintain pH.1{.underline}","reference":"Suspensions"},{"id":"suspensions_b2_19","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement about reconstitutable dry powders for oral suspension is correct?","options":[{"key":"A","text":"They are already in liquid form"},{"key":"B","text":"They are mixed with a specified volume of water by the patient or caregiver"},{"key":"C","text":"They do not require shaking after mixing"},{"key":"D","text":"They are stable indefinitely after mixing"}],"correct":"B","explanation":"Dry powders are reconstituted with water to form suspensions.","reference":"Suspensions"},{"id":"suspensions_b2_20","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which patient instruction is most appropriate for a suspension that has settled?","options":[{"key":"A","text":"\"Discard the product\""},{"key":"B","text":"\"Shake well until uniform before measuring a dose\""},{"key":"C","text":"\"Heat the bottle before use\""},{"key":"D","text":"\"Add more water to dissolve the particles\""}],"correct":"B","explanation":"Shaking redistributes settled particles for accurate dosing.5{.underline}()","reference":"Suspensions"},{"id":"emulsions_b2_1","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement best defines an emulsion?","options":[{"key":"A","text":"A single-phase solution of drug in water"},{"key":"B","text":"A two-phase system with one liquid dispersed as droplets in another immiscible liquid"},{"key":"C","text":"A solid-in-liquid dispersion"},{"key":"D","text":"A gas-in-liquid dispersion"}],"correct":"B","explanation":"Emulsions are liquid-in-liquid biphasic systems.","reference":"Emulsions"},{"id":"emulsions_b2_2","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which type of emulsion has oil droplets dispersed in water?","options":[{"key":"A","text":"Water-in-oil (w/o)"},{"key":"B","text":"Oil-in-water (o/w)"},{"key":"C","text":"Solid-in-liquid"},{"key":"D","text":"Gas-in-liquid"}],"correct":"B","explanation":"o/w emulsions have oil droplets in a continuous aqueous phase.","reference":"Emulsions"},{"id":"emulsions_b2_3","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which excipient is essential for forming and stabilizing an emulsion?","options":[{"key":"A","text":"Diluent"},{"key":"B","text":"Emulsifying agent (surfactant)"},{"key":"C","text":"Disintegrant"},{"key":"D","text":"Lubricant"}],"correct":"B","explanation":"Emulsifiers reduce interfacial tension and stabilize droplets.6{.underline}","reference":"Emulsions"},{"id":"emulsions_b2_4","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about cream dosage forms is correct?","options":[{"key":"A","text":"They are always o/w emulsions"},{"key":"B","text":"They are semisolid emulsions (o/w or w/o) intended for topical use"},{"key":"C","text":"They are always water-free"},{"key":"D","text":"They are solid dosage forms"}],"correct":"B","explanation":"Creams are semisolid emulsions for topical application.","reference":"Emulsions"},{"id":"emulsions_b2_5","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which test is commonly used to determine the type of emulsion (o/w vs w/o)?","options":[{"key":"A","text":"Melting point test"},{"key":"B","text":"Dilution test with water or oil"},{"key":"C","text":"Hardness test"},{"key":"D","text":"Friability test"}],"correct":"B","explanation":"An o/w emulsion mixes readily with water; w/o with oil.","reference":"Emulsions"},{"id":"emulsions_b2_6","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about microemulsions is correct?","options":[{"key":"A","text":"They are coarse emulsions with large droplets"},{"key":"B","text":"They are thermodynamically stable, transparent systems with very small droplets"},{"key":"C","text":"They always separate on standing"},{"key":"D","text":"They do not require surfactants"}],"correct":"B","explanation":"Microemulsions have nanoscale droplets and are often clear and stable.1{.underline}","reference":"Emulsions"},{"id":"emulsions_b2_7","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which factor most affects the physical stability of an emulsion?","options":[{"key":"A","text":"Color of the oil phase"},{"key":"B","text":"Droplet size, interfacial tension, and viscosity"},{"key":"C","text":"Smell of the product"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"Smaller droplets, low interfacial tension, and appropriate viscosity enhance stability.","reference":"Emulsions"},{"id":"emulsions_b2_8","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which phenomenon describes the upward movement of oil droplets in an o/w emulsion?","options":[{"key":"A","text":"Sedimentation"},{"key":"B","text":"Creaming"},{"key":"C","text":"Caking"},{"key":"D","text":"Crystallization"}],"correct":"B","explanation":"Creaming is the rising of less dense droplets.","reference":"Emulsions"},{"id":"emulsions_b2_9","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about coalescence in emulsions is correct?","options":[{"key":"A","text":"It is desirable and increases stability"},{"key":"B","text":"It refers to merging of droplets leading to phase separation"},{"key":"C","text":"It only occurs in solid dosage forms"},{"key":"D","text":"It improves dose uniformity"}],"correct":"B","explanation":"Coalescence leads to instability and separation.","reference":"Emulsions"},{"id":"emulsions_b2_10","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which emulsion type is typically more greasy and occlusive?","options":[{"key":"A","text":"Oil-in-water"},{"key":"B","text":"Water-in-oil"},{"key":"C","text":"Microemulsion"},{"key":"D","text":"Clear solution"}],"correct":"B","explanation":"w/o emulsions are more occlusive and greasy.","reference":"Emulsions"},{"id":"emulsions_b2_11","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about parenteral nutrition emulsions is correct?","options":[{"key":"A","text":"They are o/w emulsions containing lipids for IV administration"},{"key":"B","text":"They are w/o emulsions"},{"key":"C","text":"They are oral solutions"},{"key":"D","text":"They do not need to be sterile"}],"correct":"A","explanation":"IV lipid emulsions are o/w and must be sterile.","reference":"Emulsions"},{"id":"emulsions_b2_12","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most important for oral emulsions?","options":[{"key":"A","text":"\"Do not shake; it will ruin the product\""},{"key":"B","text":"\"Shake well before each use\""},{"key":"C","text":"\"Dilute with oil before taking\""},{"key":"D","text":"\"Store in direct sunlight\""}],"correct":"B","explanation":"Shaking ensures uniformity before dosing.","reference":"Emulsions"},{"id":"emulsions_b2_13","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about emulsion stability and temperature is correct?","options":[{"key":"A","text":"Temperature has no effect"},{"key":"B","text":"Extreme temperatures can cause phase separation or changes in viscosity"},{"key":"C","text":"Emulsions should always be frozen"},{"key":"D","text":"Emulsions should always be heated before use"}],"correct":"B","explanation":"Temperature extremes can destabilize emulsions.1{.underline}","reference":"Emulsions"},{"id":"emulsions_b2_14","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"Which excipient is commonly used to increase the viscosity of the continuous phase in emulsions?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Carbomer or xanthan gum"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Thickeners help prevent creaming and coalescence.6{.underline}","reference":"Emulsions"},{"id":"emulsions_b2_15","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about multiple emulsions (e.g., w/o/w) is correct?","options":[{"key":"A","text":"They have only two phases"},{"key":"B","text":"They consist of droplets within droplets (e.g., water droplets inside oil droplets dispersed in water)"},{"key":"C","text":"They are always unstable"},{"key":"D","text":"They are solid dosage forms"}],"correct":"B","explanation":"Multiple emulsions have complex internal structures.","reference":"Emulsions"},{"id":"emulsions_b2_16","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"Which analytical technique is commonly used to measure emulsion droplet size?","options":[{"key":"A","text":"Melting point determination"},{"key":"B","text":"Microscopy or light scattering"},{"key":"C","text":"Titration"},{"key":"D","text":"Hardness testing"}],"correct":"B","explanation":"Microscopy and light scattering assess droplet size distribution.","reference":"Emulsions"},{"id":"emulsions_b2_17","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about topical emulsions is correct?","options":[{"key":"A","text":"They are always systemic"},{"key":"B","text":"They can deliver drugs locally to the skin with varying degrees of occlusion"},{"key":"C","text":"They cannot contain preservatives"},{"key":"D","text":"They are always o/w"}],"correct":"B","explanation":"Topical emulsions provide local therapy with different feel/occlusion.","reference":"Emulsions"},{"id":"emulsions_b2_18","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which factor would promote coalescence in an emulsion?","options":[{"key":"A","text":"Adequate emulsifier concentration"},{"key":"B","text":"Insufficient emulsifier or inappropriate HLB"},{"key":"C","text":"High viscosity of the continuous phase"},{"key":"D","text":"Small droplet size"}],"correct":"B","explanation":"Inadequate emulsification leads to droplet merging.","reference":"Emulsions"},{"id":"emulsions_b2_19","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which statement about HLB (hydrophilic-lipophilic balance) is correct?","options":[{"key":"A","text":"Low HLB surfactants favor o/w emulsions"},{"key":"B","text":"High HLB surfactants favor o/w emulsions"},{"key":"C","text":"HLB is irrelevant for emulsions"},{"key":"D","text":"All surfactants have the same HLB"}],"correct":"B","explanation":"High HLB surfactants are more hydrophilic and favor o/w emulsions.","reference":"Emulsions"},{"id":"emulsions_b2_20","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which patient instruction is most appropriate for a topical emulsion that has separated?","options":[{"key":"A","text":"\"Discard immediately\""},{"key":"B","text":"\"Shake or stir gently to re-mix if the label permits; otherwise consult pharmacist\""},{"key":"C","text":"\"Heat until boiling\""},{"key":"D","text":"\"Add water to fix it\""}],"correct":"B","explanation":"Some emulsions can be re-mixed; others may be unstable if separated.","reference":"Emulsions"},{"id":"sterile_forms_b2_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement best defines a sterile dosage form?","options":[{"key":"A","text":"A preparation free of viable microorganisms"},{"key":"B","text":"A preparation that is merely clean"},{"key":"C","text":"A preparation that contains preservatives only"},{"key":"D","text":"A solid dosage form"}],"correct":"A","explanation":"Sterile products must be free of viable microbes.1{.underline}","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which route of administration always requires a sterile product?","options":[{"key":"A","text":"Oral"},{"key":"B","text":"Topical"},{"key":"C","text":"Intravenous"},{"key":"D","text":"Rectal"}],"correct":"C","explanation":"IV products must be sterile.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which method is commonly used to sterilize heat-stable aqueous solutions?","options":[{"key":"A","text":"Filtration through a 0.22 \u00b5m filter"},{"key":"B","text":"Autoclaving (moist heat sterilization)"},{"key":"C","text":"Ethylene oxide gas"},{"key":"D","text":"Radiation only"}],"correct":"B","explanation":"Autoclaving is used for heat-stable solutions and equipment.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which method is preferred for sterilizing heat-labile solutions?","options":[{"key":"A","text":"Autoclaving"},{"key":"B","text":"Membrane filtration (0.22 \u00b5m)"},{"key":"C","text":"Dry heat"},{"key":"D","text":"Boiling"}],"correct":"B","explanation":"Filtration is used for heat-sensitive solutions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about pyrogens is correct?","options":[{"key":"A","text":"They are living microorganisms"},{"key":"B","text":"They are fever-producing substances, often endotoxins from gram-negative bacteria"},{"key":"C","text":"They are removed by standard sterilization alone"},{"key":"D","text":"They are only a concern for oral products"}],"correct":"B","explanation":"Pyrogens (e.g., endotoxins) must be controlled in injectables.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which test is used to detect bacterial endotoxins in parenteral products?","options":[{"key":"A","text":"Sterility test"},{"key":"B","text":"Limulus Amebocyte Lysate (LAL) test"},{"key":"C","text":"Dissolution test"},{"key":"D","text":"Hardness test"}],"correct":"B","explanation":"The LAL test detects endotoxins.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about isotonicity for parenteral solutions is correct?","options":[{"key":"A","text":"All parenteral solutions must be hypertonic"},{"key":"B","text":"IV solutions should generally be isotonic or appropriately formulated for the route"},{"key":"C","text":"Isotonicity is only important for oral solutions"},{"key":"D","text":"Isotonicity is irrelevant for injections"}],"correct":"B","explanation":"Isotonic or carefully designed osmolality is important for IV and other parenterals.2{.underline}","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which container type is commonly used for large-volume parenteral (LVP) solutions?","options":[{"key":"A","text":"Amber vial"},{"key":"B","text":"Glass or plastic IV bag/bottle"},{"key":"C","text":"Ointment tube"},{"key":"D","text":"Capsule shell"}],"correct":"B","explanation":"LVPs are packaged in IV bags or bottles.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about small-volume parenterals (SVPs) is correct?","options":[{"key":"A","text":"They are always >100 mL"},{"key":"B","text":"They are typically \u2264100 mL and often supplied in vials or ampules"},{"key":"C","text":"They are oral solutions"},{"key":"D","text":"They do not need to be sterile"}],"correct":"B","explanation":"SVPs are small-volume injectables in vials/ampules.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which aseptic technique principle is most critical when preparing sterile products?","options":[{"key":"A","text":"Working in a non-controlled environment"},{"key":"B","text":"Maintaining a sterile field and using proper garb and technique"},{"key":"C","text":"Touching critical sites frequently"},{"key":"D","text":"Ignoring airflow patterns"}],"correct":"B","explanation":"Aseptic technique prevents contamination.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_11","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about ophthalmic sterile products is correct?","options":[{"key":"A","text":"They do not need to be sterile"},{"key":"B","text":"They must be sterile, isotonic, and buffered to minimize irritation"},{"key":"C","text":"They can contain large particles"},{"key":"D","text":"They are intended for IV use"}],"correct":"B","explanation":"Ophthalmics must be sterile and physiologically compatible.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_12","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which container type provides a hermetic seal and is commonly used for injectables?","options":[{"key":"A","text":"Ointment jar"},{"key":"B","text":"Glass vial with rubber stopper"},{"key":"C","text":"Tablet bottle"},{"key":"D","text":"Capsule blister pack"}],"correct":"B","explanation":"Vials with rubber stoppers are common for injectables.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_13","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about lyophilized (freeze-dried) injectable products is correct?","options":[{"key":"A","text":"They are liquids ready for injection"},{"key":"B","text":"They are powders that must be reconstituted with a diluent before use"},{"key":"C","text":"They do not need to be sterile"},{"key":"D","text":"They are only for oral use"}],"correct":"B","explanation":"Lyophilized products are reconstituted prior to injection.1{.underline}","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_14","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which beyond-use date (BUD) consideration is most critical for compounded sterile preparations (CSPs) under the revised USP <797>?","options":[{"key":"A","text":"Color of the solution"},{"key":"B","text":"CSP category (1, 2, or 3), storage conditions, and applicable USP <797> requirements"},{"key":"C","text":"Smell of the product"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"The revised USP <797> (effective Nov 2023) replaced the former low/medium/high-risk classification with a Category 1, 2, and 3 system based on the compounding environment, starting components, and testing performed. BUD is determined by category, storage conditions, and applicable requirements \u2014 not by sensory characteristics of the preparation.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_15","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about bacteriostatic vs preservative-free injectables is correct?","options":[{"key":"A","text":"Bacteriostatic products contain agents that inhibit microbial growth"},{"key":"B","text":"Preservative-free products always contain benzyl alcohol"},{"key":"C","text":"Bacteriostatic products are required for all IV infusions"},{"key":"D","text":"Preservatives are preferred for all neonatal IV products"}],"correct":"A","explanation":"Bacteriostatic products contain preservatives; many neonatal/IV products are preservative-free.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_16","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with intrathecal injections?","options":[{"key":"A","text":"Intramuscular"},{"key":"B","text":"Into the spinal canal (subarachnoid space)"},{"key":"C","text":"Subcutaneous"},{"key":"D","text":"Oral"}],"correct":"B","explanation":"Intrathecal injections go into the CSF space.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_17","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about irrigation solutions is correct?","options":[{"key":"A","text":"They do not need to be sterile"},{"key":"B","text":"They must be sterile and are used to wash body cavities or wounds"},{"key":"C","text":"They are always hypertonic"},{"key":"D","text":"They are intended for oral use"}],"correct":"B","explanation":"Irrigations are sterile solutions for washing tissues/cavities.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_18","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about dialysis solutions is correct?","options":[{"key":"A","text":"They do not need to be sterile"},{"key":"B","text":"They must be sterile and pyrogen-free for peritoneal dialysis"},{"key":"C","text":"They are always hypertonic"},{"key":"D","text":"They are only used orally"}],"correct":"B","explanation":"Peritoneal dialysis fluids must be sterile and pyrogen-free.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_19","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most important for self-injectable sterile products?","options":[{"key":"A","text":"\"Reuse needles to save cost\""},{"key":"B","text":"\"Use proper aseptic technique and rotate injection sites\""},{"key":"C","text":"\"Store at room temperature regardless of labeling\""},{"key":"D","text":"\"Mix with tap water before injecting\""}],"correct":"B","explanation":"Aseptic technique and site rotation reduce infection and tissue damage.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b2_20","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about particulate matter in injectables is correct?","options":[{"key":"A","text":"Visible particles are acceptable in all injectables"},{"key":"B","text":"Visible particles are generally not acceptable and may indicate contamination or instability"},{"key":"C","text":"Particulate matter is only a concern for oral products"},{"key":"D","text":"All injectables are allowed to have large particles"}],"correct":"B","explanation":"Visible particulates in injectables are typically unacceptable.","reference":"Sterile Dosage Forms"},{"id":"modified_release_b2_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement best defines a modified-release (MR) dosage form?","options":[{"key":"A","text":"A form that releases drug immediately upon administration"},{"key":"B","text":"A form designed to alter the timing and/or rate of drug release compared to immediate-release"},{"key":"C","text":"A form that is only for topical use"},{"key":"D","text":"A form that contains no drug"}],"correct":"B","explanation":"MR forms control release rate and/or site.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which term describes a dosage form that releases drug slowly over an extended period?","options":[{"key":"A","text":"Immediate-release (IR)"},{"key":"B","text":"Extended-release (ER/XR/XL)"},{"key":"C","text":"Orally disintegrating tablet (ODT)"},{"key":"D","text":"Sublingual tablet"}],"correct":"B","explanation":"ER forms prolong drug release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which term describes a dosage form that delays release until reaching a specific region of the GI tract?","options":[{"key":"A","text":"Immediate-release"},{"key":"B","text":"Delayed-release (e.g., enteric-coated)"},{"key":"C","text":"Sublingual"},{"key":"D","text":"Chewable"}],"correct":"B","explanation":"Delayed-release forms resist gastric conditions and release in the intestine.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about ER tablets is correct?","options":[{"key":"A","text":"They can be crushed to facilitate administration"},{"key":"B","text":"They should generally not be crushed or chewed unless specifically labeled"},{"key":"C","text":"They release all drug in the stomach"},{"key":"D","text":"They are only available as liquids"}],"correct":"B","explanation":"Crushing ER forms can cause dose dumping.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which mechanism is commonly used to achieve extended release in matrix tablets?","options":[{"key":"A","text":"Rapid disintegration"},{"key":"B","text":"Drug diffusion through a polymeric matrix"},{"key":"C","text":"Immediate dissolution"},{"key":"D","text":"Sublimation"}],"correct":"B","explanation":"Matrix systems control release via diffusion/erosion.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about osmotic pump systems (e.g., OROS) is correct?","options":[{"key":"A","text":"They release drug only in the stomach"},{"key":"B","text":"They use osmotic pressure to control drug release over time"},{"key":"C","text":"They are always immediate-release"},{"key":"D","text":"They cannot be used orally"}],"correct":"B","explanation":"Osmotic systems deliver drug at a controlled rate via osmosis.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most important for MR capsules containing coated beads?","options":[{"key":"A","text":"\"Crush the capsule for faster effect\""},{"key":"B","text":"\"Do not crush or chew; some may be opened and sprinkled if labeled\""},{"key":"C","text":"\"Dissolve in alcohol before taking\""},{"key":"D","text":"\"Take only at bedtime\""}],"correct":"B","explanation":"MR beads must not be crushed; sprinkling is allowed only if labeled.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about transdermal patches is correct?","options":[{"key":"A","text":"They are immediate-release oral dosage forms"},{"key":"B","text":"They deliver drug through the skin over an extended period"},{"key":"C","text":"They are only for local skin effects"},{"key":"D","text":"They do not require adhesion"}],"correct":"B","explanation":"Transdermal systems provide systemic MR delivery.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_9","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which factor most affects drug release from a hydrophilic matrix ER tablet?","options":[{"key":"A","text":"Tablet color"},{"key":"B","text":"Polymer hydration, gel layer formation, and erosion"},{"key":"C","text":"Smell of the tablet"},{"key":"D","text":"Taste"}],"correct":"B","explanation":"Hydrophilic matrices form gel layers that control release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_10","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about ion-exchange resin-based MR products is correct?","options":[{"key":"A","text":"They release drug based on pH alone"},{"key":"B","text":"They release drug via exchange of ions in the GI tract"},{"key":"C","text":"They are only for topical use"},{"key":"D","text":"They are always immediate-release"}],"correct":"B","explanation":"Resin complexes release drug via ion exchange.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_11","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which term describes a product designed to release drug in pulses at predetermined times?","options":[{"key":"A","text":"Immediate-release"},{"key":"B","text":"Pulsatile-release"},{"key":"C","text":"Sublingual"},{"key":"D","text":"Chewable"}],"correct":"B","explanation":"Pulsatile systems release drug in bursts.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_12","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about gastroretentive MR systems is correct?","options":[{"key":"A","text":"They are designed to rapidly pass through the stomach"},{"key":"B","text":"They are designed to remain in the stomach for prolonged periods"},{"key":"C","text":"They are only for colonic delivery"},{"key":"D","text":"They are always liquid"}],"correct":"B","explanation":"Gastroretentive systems prolong gastric residence.2{.underline}()","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_13","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which patient instruction is most appropriate for an ER tablet without specific labeling allowing splitting?","options":[{"key":"A","text":"\"Split the tablet in half to reduce dose\""},{"key":"B","text":"\"Swallow whole; do not split, crush, or chew\""},{"key":"C","text":"\"Dissolve in water before taking\""},{"key":"D","text":"\"Chew for faster effect\""}],"correct":"B","explanation":"Most ER tablets must be swallowed whole.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_14","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about target-controlled release (e.g., colonic delivery) is correct?","options":[{"key":"A","text":"It releases drug only in the stomach"},{"key":"B","text":"It uses pH-, time-, or enzyme-dependent systems to release drug in the colon"},{"key":"C","text":"It is only for IV use"},{"key":"D","text":"It is always immediate-release"}],"correct":"B","explanation":"Colonic systems exploit colonic pH, transit time, or enzymes.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_15","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which analytical test is critical for MR products to ensure intended release profile?","options":[{"key":"A","text":"Melting point"},{"key":"B","text":"Dissolution testing at multiple time points"},{"key":"C","text":"Hardness only"},{"key":"D","text":"Color measurement"}],"correct":"B","explanation":"Multi-point dissolution profiles verify MR performance.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_16","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about food effects on some MR products is correct?","options":[{"key":"A","text":"Food never affects MR products"},{"key":"B","text":"Food can alter release or absorption of some MR formulations"},{"key":"C","text":"All MR products must be taken with high-fat meals"},{"key":"D","text":"All MR products must be taken on an empty stomach"}],"correct":"B","explanation":"Food can increase, decrease, or alter the release/absorption of some MR drugs.2{.underline}","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_17","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about implantable MR devices is correct?","options":[{"key":"A","text":"They are oral dosage forms"},{"key":"B","text":"They are placed surgically or via injection to release drug over weeks to years"},{"key":"C","text":"They release drug only for minutes"},{"key":"D","text":"They are only for topical use"}],"correct":"B","explanation":"Implants provide long-term MR delivery.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_18","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about injectable MR depots (e.g., microspheres) is correct?","options":[{"key":"A","text":"They release drug immediately and are gone within hours"},{"key":"B","text":"They release drug over days to months from a depot site"},{"key":"C","text":"They are only for oral use"},{"key":"D","text":"They are always water solutions"}],"correct":"B","explanation":"Depot injections provide prolonged release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_19","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which patient population requires special caution with MR products?","options":[{"key":"A","text":"Patients who can swallow tablets easily"},{"key":"B","text":"Patients with altered GI anatomy or motility (e.g., short bowel, bariatric surgery)"},{"key":"C","text":"Patients who prefer liquids"},{"key":"D","text":"Patients who never take food"}],"correct":"B","explanation":"GI changes can alter MR performance.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b2_20","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement about switching between IR and MR formulations is correct?","options":[{"key":"A","text":"They are always mg-for-mg equivalent"},{"key":"B","text":"Dosing regimens and total daily doses may differ; conversion must follow product-specific guidance"},{"key":"C","text":"MR products can always be given once daily regardless of the drug"},{"key":"D","text":"IR and MR products are interchangeable without consideration"}],"correct":"B","explanation":"IR and MR are not automatically interchangeable; dosing must be adjusted per labeling/guidelines.","reference":"Modified-Release Dosage Forms"},{"id":"ointments_case_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 58-year-old man with chronic eczema on his elbows is prescribed a topical ointment. His skin is very dry and thickened. The prescriber wants maximum occlusion and emollient effect. Which ointment base is most appropriate?","options":[{"key":"A","text":"A water-soluble polyethylene glycol base"},{"key":"B","text":"An oleaginous hydrocarbon base such as petrolatum"},{"key":"C","text":"A water-removable oil-in-water emulsion base"},{"key":"D","text":"An absorption base containing lanolin derivatives"}],"correct":"B","explanation":"Oleaginous bases are highly occlusive and emollient, ideal for very dry, thickened plaques.","reference":"Ointments & Semisolids"},{"id":"ointments_case_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"hard","question":"A 34-year-old woman with psoriasis is prescribed a calcipotriene ointment. She complains that her current ointment is too greasy and difficult to wash off her hands after application. Which base change would best address her concern while maintaining reasonable drug release?","options":[{"key":"A","text":"Switch to a more occlusive hydrocarbon base"},{"key":"B","text":"Switch to a water-removable oil-in-water emulsion base"},{"key":"C","text":"Switch to a purely oleaginous white petrolatum base"},{"key":"D","text":"Switch to a water-free anhydrous lanolin base"}],"correct":"B","explanation":"Water-removable (O/W) bases are less greasy and washable, improving acceptability.","reference":"Ointments & Semisolids"},{"id":"ointments_case_3","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 70-year-old man with a known lanolin allergy is prescribed a topical ointment for contact dermatitis. Which ointment base should be avoided to prevent an allergic reaction?","options":[{"key":"A","text":"White petrolatum USP"},{"key":"B","text":"Hydrophilic petrolatum USP"},{"key":"C","text":"Anhydrous lanolin or lanolin-containing absorption base"},{"key":"D","text":"Polyethylene glycol ointment USP"}],"correct":"C","explanation":"Lanolin and lanolin derivatives can trigger allergy in sensitized patients.","reference":"Ointments & Semisolids"},{"id":"ointments_case_4","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 45-year-old woman with intertrigo under her breasts is prescribed a topical ointment. The area is moist and macerated. The prescriber wants a base that is less occlusive and more breathable. Which base is most appropriate?","options":[{"key":"A","text":"A highly occlusive oleaginous petrolatum base"},{"key":"B","text":"A water-removable oil-in-water emulsion base"},{"key":"C","text":"An anhydrous hydrocarbon ointment base"},{"key":"D","text":"A pure mineral oil--based ointment base"}],"correct":"B","explanation":"O/W emulsion bases are less occlusive and better for moist, macerated areas.","reference":"Ointments & Semisolids"},{"id":"ointments_case_5","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 62-year-old man with a leg ulcer is prescribed a topical antibiotic ointment. The wound is exudative and requires frequent dressing changes. The prescriber wants a base that is easy to remove with water. Which base is most suitable?","options":[{"key":"A","text":"A water-removable oil-in-water emulsion base"},{"key":"B","text":"An oleaginous hydrocarbon base such as white petrolatum"},{"key":"C","text":"An anhydrous absorption base with lanolin"},{"key":"D","text":"A water-free hydrocarbon ointment base"}],"correct":"A","explanation":"Water-removable bases are easily washed off, convenient for exudative wounds.","reference":"Ointments & Semisolids"},{"id":"ointments_case_6","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 28-year-old woman with atopic dermatitis is prescribed a topical corticosteroid ointment. She reports stinging when applying her current ointment to broken skin. Which base is most likely causing the stinging?","options":[{"key":"A","text":"White petrolatum--based oleaginous ointment"},{"key":"B","text":"Polyethylene glycol--based water-soluble ointment"},{"key":"C","text":"Lanolin-containing absorption base ointment"},{"key":"D","text":"Mineral oil--based hydrocarbon ointment"}],"correct":"B","explanation":"PEG bases can sting or irritate damaged or broken skin.","reference":"Ointments & Semisolids"},{"id":"ointments_case_7","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 50-year-old man with chronic hand eczema is prescribed a topical ointment to be applied at night under cotton gloves. The prescriber wants to maximize hydration of thickened plaques. Which property of the ointment base is most important?","options":[{"key":"A","text":"High water content and low oil content"},{"key":"B","text":"High oil content and occlusive nature"},{"key":"C","text":"Low viscosity and rapid absorption"},{"key":"D","text":"High volatility and quick evaporation"}],"correct":"B","explanation":"Occlusive, oil-rich bases enhance stratum corneum hydration and penetration.","reference":"Ointments & Semisolids"},{"id":"ointments_case_8","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 39-year-old woman is compounded a topical ointment containing a heat-sensitive drug. The pharmacist plans to prepare the ointment by fusion. When should the heat-sensitive drug be added?","options":[{"key":"A","text":"Before melting any components of the base"},{"key":"B","text":"After all components are melted and the base has cooled"},{"key":"C","text":"During vigorous heating of the base at high temperature"},{"key":"D","text":"After the ointment has been packaged and labeled"}],"correct":"B","explanation":"Heat-sensitive drugs are added after the base has cooled to avoid degradation.","reference":"Ointments & Semisolids"},{"id":"ointments_case_9","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 66-year-old man with xerosis is prescribed a topical ointment for use on large body surface areas. The prescriber is concerned about cost and ease of application over large areas. Which base characteristic is most desirable?","options":[{"key":"A","text":"Very stiff and difficult to spread"},{"key":"B","text":"Moderately soft and easy to spread thinly"},{"key":"C","text":"Extremely runny and liquid-like in consistency"},{"key":"D","text":"Highly granular and gritty in texture"}],"correct":"B","explanation":"A moderately soft base spreads easily and is practical for large areas.","reference":"Ointments & Semisolids"},{"id":"ointments_case_10","topicId":"ointments","topicName":"Ointments & Semisolids","type":"case","difficulty":"medium","question":"A 42-year-old woman with a history of contact dermatitis is prescribed a topical ointment that will be used on open, weeping lesions. The prescriber wants to avoid trapping excessive moisture. Which base type is most appropriate?","options":[{"key":"A","text":"Highly occlusive oleaginous hydrocarbon base"},{"key":"B","text":"Water-removable oil-in-water emulsion base"},{"key":"C","text":"Anhydrous absorption base with high lipid content"},{"key":"D","text":"Water-free hydrocarbon ointment base"}],"correct":"B","explanation":"O/W emulsion bases are less occlusive and better for weeping lesions.","reference":"Ointments & Semisolids"},{"id":"capsules_case_1","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"hard","question":"A 68-year-old man with dysphagia is prescribed a medication available only as a hard gelatin capsule. He has difficulty swallowing solids but can manage small particles. Which dosage form modification is most appropriate if the product labeling allows?","options":[{"key":"A","text":"Crush the entire capsule and mix with food"},{"key":"B","text":"Open the capsule and sprinkle beads on soft food"},{"key":"C","text":"Dissolve the capsule contents in alcohol before use"},{"key":"D","text":"Chew the capsule thoroughly before swallowing"}],"correct":"B","explanation":"Some capsules contain coated beads that may be sprinkled if labeling permits.","reference":"Capsules"},{"id":"capsules_case_2","topicId":"capsules","topicName":"Capsules","type":"case","difficulty":"medium","question":"A 22-year-old woman is prescribed an isotretinoin soft gelatin capsule for severe acne. She asks why it cannot be supplied as a powder-filled hard capsule. What is the primary reason for using a soft gelatin capsule here?","options":[{"key":"A","text":"To improve the taste of the medication significantly"},{"key":"B","text":"To encapsulate a lipophilic liquid or oil solution"},{"key":"C","text":"To allow rapid disintegration in the oral cavity"},{"key":"D","text":"To enable sublingual administration of the drug"}],"correct":"B","explanation
