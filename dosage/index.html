ic-coated tablet"},{"key":"C","text":"Simple solution"},{"key":"D","text":"Simple suspension"}],"correct":"B","explanation":"Enteric-coated tablets are a modified-release form (delayed-release). They resist gastric acid and release drug in the intestine, altering the timing of release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_15","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"What is the function of an enteric coating on a tablet?","options":[{"key":"A","text":"To provide sustained release"},{"key":"B","text":"To prevent release in the stomach and allow release in the intestine"},{"key":"C","text":"To improve the taste of the tablet"},{"key":"D","text":"To make the tablet easier to swallow"}],"correct":"B","explanation":"Enteric coatings dissolve at intestinal pH (\u22655.5), protecting acid-labile drugs and preventing gastric irritation. They are a form of delayed-release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_16","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient reports that their long-acting medication caused \"jitteriness\" in the morning. What could be the cause?","options":[{"key":"A","text":"The patient is taking the correct dose"},{"key":"B","text":"Dose-dumping from crushing or chewing the tablet"},{"key":"C","text":"The medication is not working"},{"key":"D","text":"The patient is allergic to the medication"}],"correct":"B","explanation":"Jitteriness from long-acting medication suggests dose-dumping, likely from crushing or chewing. This causes rapid release of the entire dose, producing peak toxicity.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_17","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a patient counseling point for a buccal tablet?","options":[{"key":"A","text":"Place between the gum and cheek and allow to dissolve"},{"key":"B","text":"Swallow whole with water"},{"key":"C","text":"Chew before swallowing"},{"key":"D","text":"Place under the tongue"}],"correct":"A","explanation":"Buccal tablets are placed between the gum and cheek (buccal mucosa) and allowed to dissolve slowly. They provide mucosal absorption and first-pass bypass.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_18","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the primary advantage of sublingual administration over oral administration?","options":[{"key":"A","text":"Faster onset and less drug lost to first-pass metabolism"},{"key":"B","text":"Higher doses can be administered"},{"key":"C","text":"Longer duration of action"},{"key":"D","text":"Less expensive"}],"correct":"A","explanation":"Sublingual administration provides faster onset (rich vascular supply) and bypasses first-pass metabolism (systemic circulation instead of portal vein).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_19","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"What is the difference between an orally disintegrating tablet (ODT) and a sublingual tablet?","options":[{"key":"A","text":"ODT disintegrates in the mouth without water; sublingual tablet dissolves under the tongue"},{"key":"B","text":"Both are the same"},{"key":"C","text":"Sublingual tablets are swallowed whole; ODTs are dissolved in water"},{"key":"D","text":"ODTs are for local effect; sublingual tablets are for systemic effect"}],"correct":"A","explanation":"ODTs disintegrate on the tongue and are swallowed; sublingual tablets are placed under the tongue and absorbed directly. Both are convenient for dysphagia.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b3_20","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a correct counseling point for using an MDI inhaler?","options":[{"key":"A","text":"Breathe in quickly and deeply after activating the inhaler"},{"key":"B","text":"Activate the inhaler and then breathe in"},{"key":"C","text":"Use a spacer if coordination is poor"},{"key":"D","text":"Both A and C are correct"}],"correct":"D","explanation":"Patients should breathe in slowly and deeply after activating the inhaler, and use a spacer if coordination is poor. These improve drug delivery.","reference":"Modified-Release Dosage Forms"},{"id":"suppositories_calcfr_1","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A pharmacist prepares 12 suppositories, each intended to weigh 2 g and contain 1 g of drug. The base is cocoa butter (density = 0.9 g/mL). If 1 g of drug displaces 0.8 g of base, calculate the total amount of base needed for the batch.","options":[],"correct":"","explanation":"Base per supp = mold capacity \u2212 (drug \u00d7 displacement rate) = 2 \u2212 (1 \u00d7 0.8) = 1.2g. For 12 suppositories: 1.2 \u00d7 12 = 14.4g base","finalAnswer":"Base per supp = mold capacity \u2212 (drug \u00d7 displacement rate) = 2 \u2212 (1 \u00d7 0.8) = 1.2g. For 12 suppositories: 1.2 \u00d7 12 = 14.4g base","reference":"Suppositories"},{"id":"suppositories_calcfr_2","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"The density factor (displacement value, i.e., grams of Drug X that would displace 1 g of base) of Drug X in cocoa butter is 1.25. Each suppository should contain 200 mg of Drug X and weigh 2 g. For a batch of 10 suppositories, calculate the total amount of cocoa butter required.","options":[],"correct":"","explanation":"Base per supp = mold capacity \u2212 (drug \u00f7 DV) = 2 \u2212 (0.2 \u00f7 1.25) = 1.84g. For 10 suppositories: 1.84 \u00d7 10 = 18.4g cocoa butter","finalAnswer":"Base per supp = mold capacity \u2212 (drug \u00f7 DV) = 2 \u2212 (0.2 \u00f7 1.25) = 1.84g. For 10 suppositories: 1.84 \u00d7 10 = 18.4g cocoa butter","reference":"Suppositories"},{"id":"suppositories_calcfr_3","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A mold produces suppositories that hold 2.2 mL of cocoa butter (density = 0.9 g/mL). If Drug Y has a replacement factor of 0.75 (i.e., 1 g drug replaces 0.75 g base), how much Drug Y can be incorporated per suppository without changing the total weight of 2 g?","options":[],"correct":"","explanation":"Mold capacity = 2.2 mL \u00d7 0.9 g/mL = 1.98 g base alone Replacement factor = 0.75 \u21d2 1 g drug replaces 0.75 g base Let drug mass = x g Total weight = 2 g = x + (1.98 -- 0.75x) 2 = x + 1.98 -- 0.75x \u21d2 2 = 1.98 + 0.25x \u21d2 0.02 = 0.25x \u21d2 x = 0.08 g (80 mg) drug per supp","finalAnswer":"2 = x + 1.98 -- 0.75x \u21d2 2 = 1.98 + 0.25x \u21d2 0.02 = 0.25x \u21d2 x = 0.08 g (80 mg) drug per supp","reference":"Suppositories"},{"id":"suppositories_calcfr_4","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A suppository formula calls for 150 mg of active ingredient per 2 g suppository. The active has a volume of 0.12 mL/g. The base has a density of 0.9 g/mL. Calculate the volume occupied by the drug in each suppository and the adjusted amount of base needed if the mold capacity is 2.22 mL.","options":[],"correct":"","explanation":"Drug mass = 0.15 g, volume = 0.12 mL/g \u21d2 drug volume = 0.15 \u00d7 0.12 = 0.018 mL Mold capacity = 2.22 mL Base volume = 2.22 -- 0.018 = 2.202 mL Base mass = 2.202 mL \u00d7 0.9 g/mL = 1.982 g base per supp","finalAnswer":"Base mass = 2.202 mL \u00d7 0.9 g/mL = 1.982 g base per supp","reference":"Suppositories"},{"id":"suppositories_calcfr_5","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"You are preparing 20 suppositories, each containing 250 mg of a drug with a density of 1.4 g/mL. The base (glycerinated gelatin) has a density of 1.1 g/mL. If each suppository mold holds 2.5 g of base alone, calculate the total base required for the batch.","options":[],"correct":"","explanation":"Drug density = 1.4 g/mL \u21d2 volume per 0.25 g = 0.25/1.4 = 0.179 mL Base density = 1.1 g/mL Mold holds 2.5 g base alone \u21d2 volume = 2.5/1.1 = 2.273 mL Base volume with drug = 2.273 -- 0.179 = 2.094 mL Base mass = 2.094 \u00d7 1.1 = 2.303 g per supp For 20 supps: base = 2.303 \u00d7 20 = 46.06 g, drug = 0.25 \u00d7 20 = 5 g","finalAnswer":"For 20 supps: base = 2.303 \u00d7 20 = 46.06 g, drug = 0.25 \u00d7 20 = 5 g","reference":"Suppositories"},{"id":"suppositories_calcfr_6","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"The replacement value (i.e., grams of base displaced by 1 g of drug) of Drug Z in polyethylene glycol (PEG) base is 0.6. Each suppository is to contain 300 mg of Drug Z and weigh 2.5 g. For 15 suppositories, calculate the total weight of PEG base needed.","options":[],"correct":"","explanation":"Base per supp = capacity \u2212 (drug \u00d7 replacement value) = 2.5 \u2212 (0.3 \u00d7 0.6) = 2.32g. For 15 suppositories: 2.32 \u00d7 15 = 34.8g PEG base","finalAnswer":"Base per supp = capacity \u2212 (drug \u00d7 replacement value) = 2.5 \u2212 (0.3 \u00d7 0.6) = 2.32g. For 15 suppositories: 2.32 \u00d7 15 = 34.8g PEG base","reference":"Suppositories"},{"id":"suppositories_calcfr_7","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A suppository base has a density of 0.95 g/mL. A drug with density 1.2 g/mL is to be incorporated at 10% w/w of the total suppository weight. If each suppository weighs 3 g, calculate the volume of drug and base in each suppository.","options":[],"correct":"","explanation":"Total weight = 3 g, drug = 10% \u21d2 0.3 g drug, 2.7 g base Drug volume = 0.3/1.2 = 0.25 mL Base volume = 2.7/0.95 = 2.842 mL Total volume = 0.25 + 2.842 = 3.092 mL per supp","finalAnswer":"Total volume = 0.25 + 2.842 = 3.092 mL per supp","reference":"Suppositories"},{"id":"suppositories_calcfr_8","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"A pharmacist uses a mold calibrated to 2.0 g of cocoa butter. Drug A has a density factor (i.e., grams of Drug A that would displace 1 g of base) of 1.5 relative to the base. If each suppository is to contain 100 mg of Drug A, calculate the adjusted weight of base per suppository.","options":[],"correct":"","explanation":"Base per supp = mold capacity \u2212 (drug \u00f7 DF) = 2.0 \u2212 (0.1 \u00f7 1.5) = 1.933g per suppository","finalAnswer":"Base per supp = mold capacity \u2212 (drug \u00f7 DF) = 2.0 \u2212 (0.1 \u00f7 1.5) = 1.933g per suppository","reference":"Suppositories"},{"id":"suppositories_calcfr_9","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"The occupied volume of 500 mg of a drug in a suppository is 0.4 mL. The base density is 0.9 g/mL, and the total suppository weight is 2 g. Calculate the weight of base required per suppository.","options":[],"correct":"","explanation":"Base weight = total weight \u2212 drug weight = 2 g \u2212 0.5 g = 1.5 g per suppository (check: base volume = 1.5/0.9 = 1.667 mL; total volume = 1.667 + 0.4 = 2.067 mL, consistent)","finalAnswer":"Base weight = total weight \u2212 drug weight = 2 g \u2212 0.5 g = 1.5 g per suppository (check: base volume = 1.5/0.9 = 1.667 mL; total volume = 1.667 + 0.4 = 2.067 mL, consistent)","reference":"Suppositories"},{"id":"suppositories_calcfr_10","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"A batch of 30 suppositories is to be made, each containing 150 mg of a drug with a replacement factor (i.e., grams of base displaced by 1 g of drug) of 0.8. The mold capacity is 2.1 g of base. Calculate the total amount of base and drug needed for the batch.","options":[],"correct":"","explanation":"Base per supp = 2.1 \u2212 (0.15 \u00d7 0.8) = 1.980g. For 30 suppositories: base = 1.980 \u00d7 30 = 59.4g, drug = 0.15 \u00d7 30 = 4.5g","finalAnswer":"Base per supp = 2.1 \u2212 (0.15 \u00d7 0.8) = 1.980g. For 30 suppositories: base = 1.980 \u00d7 30 = 59.4g, drug = 0.15 \u00d7 30 = 4.5g","reference":"Suppositories"},{"id":"aqueous_solutions_calcfr_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"hard","question":"Alligation: You need to prepare 500 mL of a 15% dextrose solution using 5% and 50% dextrose stock solutions. Calculate the volumes of each stock solution required.","options":[],"correct":"","explanation":"Target: 15% from 5% and 50% Parts of 50% = 15 -- 5 = 10 Parts of 5% = 50 -- 15 = 35 Total parts = 45 Volume of 50% = (10/45) \u00d7 500 = 111.1 mL Volume of 5% = (35/45) \u00d7 500 = 388.9 mL","finalAnswer":"Volume of 5% = (35/45) \u00d7 500 = 388.9 mL","reference":"Aqueous Solutions"},{"id":"sterile_forms_calcfr_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"medium","question":"mEq: A TPN order calls for 40 mEq of potassium chloride (KCl, MW = 74.5 g/mol). How many milligrams of KCl are needed? (Valence of K\u207a = 1)","options":[],"correct":"","explanation":"mEq = (mg \u00d7 valence) / MW \u21d2 mg = (mEq \u00d7 MW) / valence mg = (40 \u00d7 74.5) / 1 = 2980 mg KCl","finalAnswer":"mg = (40 \u00d7 74.5) / 1 = 2980 mg KCl","reference":"Sterile Dosage Forms"},{"id":"aqueous_solutions_calcfr_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Molarity: Calculate the molarity of a solution containing 5.85 g of NaCl (MW = 58.5 g/mol) dissolved in 250 mL of water.","options":[],"correct":"","explanation":"Moles = 5.85 / 58.5 = 0.1 mol Volume = 0.25 L Molarity = 0.1 / 0.25 = 0.4 M","finalAnswer":"Molarity = 0.1 / 0.25 = 0.4 M","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_calcfr_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Dilution (C\u2081V\u2081 = C\u2082V\u2082): You have a 10 mg/mL stock solution of Drug B. How many mL of this stock are needed to prepare 100 mL of a 2 mg/mL solution?","options":[],"correct":"","explanation":"C\u2081V\u2081 = C\u2082V\u2082 \u21d2 10 \u00d7 V\u2081 = 2 \u00d7 100 \u21d2 V\u2081 = 20 mL stock","finalAnswer":"C\u2081V\u2081 = C\u2082V\u2082 \u21d2 10 \u00d7 V\u2081 = 2 \u00d7 100 \u21d2 V\u2081 = 20 mL stock","reference":"Aqueous Solutions"},{"id":"emulsions_calcfr_1","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"HLB average: A surfactant blend contains 40% Tween 80 (HLB = 15.0) and 60% Span 80 (HLB = 4.3). Calculate the average HLB of the mixture.","options":[],"correct":"","explanation":"HLB = (0.4 \u00d7 15.0) + (0.6 \u00d7 4.3) = 6.0 + 2.58 = 8.58","finalAnswer":"HLB = (0.4 \u00d7 15.0) + (0.6 \u00d7 4.3) = 6.0 + 2.58 = 8.58","reference":"Emulsions"},{"id":"suspensions_calcfr_1","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"Stokes' Law: A spherical particle (radius = 10 \u00b5m, density = 2.5 g/cm\u00b3) is suspended in a liquid (density = 1.0 g/cm\u00b3, viscosity = 0.01 poise). Calculate the sedimentation velocity (cm/s). Use g = 980 cm/s\u00b2.","options":[],"correct":"","explanation":"Stokes' Law: v = [2r\u00b2(\u03c1_particle \u2212 \u03c1_medium)g] / (9\u03b7) r = 10 \u00b5m = 0.001 cm v = [2 \u00d7 (0.001)\u00b2 \u00d7 (2.5 \u2212 1.0) \u00d7 980] / (9 \u00d7 0.01) v = [2 \u00d7 0.000001 \u00d7 1.5 \u00d7 980] / 0.09 = 0.00294 / 0.09 v \u2248 0.0327 cm/s","finalAnswer":"v \u2248 0.0327 cm/s","reference":"Suspensions"},{"id":"suspensions_calcfr_2","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"Sedimentation volume: A suspension has an initial height of 10 cm. After standing, the sediment height is 4 cm. Calculate the sedimentation volume ratio (F).","options":[],"correct":"","explanation":"F = H_sediment / H_initial = 4 / 10 = 0.4","finalAnswer":"F = H_sediment / H_initial = 4 / 10 = 0.4","reference":"Suspensions"},{"id":"sterile_forms_calcfr_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"White--Vincent / \u0394Tf method: A 1% solution of Drug C has a freezing point depression (\u0394Tf) of 0.08\u00b0C. Blood plasma \u0394Tf = 0.52\u00b0C. Using the White--Vincent method, calculate the % w/v of NaCl (E-value = 1.0) needed to make 30 mL of a 1% Drug C solution isotonic.","options":[],"correct":"","explanation":"\u0394Tf of 1% Drug C = 0.08\u00b0C Required \u0394Tf = 0.52 -- 0.08 = 0.44\u00b0C NaCl 1% \u21d2 \u0394Tf = 0.58\u00b0C (approx) % NaCl needed = 0.44 / 0.58 = 0.76% w/v For 30 mL: 0.76 g/100 mL \u00d7 30 = 0.228 g NaCl","finalAnswer":"For 30 mL: 0.76 g/100 mL \u00d7 30 = 0.228 g NaCl","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_calcfr_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"IV drip rate: A patient is to receive 1 L of D5W over 8 hours. The IV set delivers 15 drops/mL. Calculate the drip rate in drops per minute.","options":[],"correct":"","explanation":"Volume = 1000 mL, time = 8 hr = 480 min Flow rate = 1000 / 480 = 2.083 mL/min Drops/min = 2.083 \u00d7 15 = 31.25 \u2248 31 drops/min","finalAnswer":"Drops/min = 2.083 \u00d7 15 = 31.25 \u2248 31 drops/min","reference":"Sterile Dosage Forms"},{"id":"suppositories_calcfr_11","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"A pharmacist prepares 24 suppositories, each containing 125 mg of Drug M. The mold is calibrated to 2.0 g of cocoa butter (density = 0.9 g/mL). Drug M has a displacement value (i.e., grams of Drug M that would displace 1 g of base) of 1.6. Calculate the total weight of cocoa butter required for the batch.","options":[],"correct":"","explanation":"Base per supp = 2.0 \u2212 (0.125 \u00f7 1.6) = 1.9219g. For 24 suppositories: 1.9219 \u00d7 24 = 46.12g cocoa butter","finalAnswer":"Base per supp = 2.0 \u2212 (0.125 \u00f7 1.6) = 1.9219g. For 24 suppositories: 1.9219 \u00d7 24 = 46.12g cocoa butter","reference":"Suppositories"},{"id":"suppositories_calcfr_12","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"Each suppository must weigh 2.5 g and contain 200 mg of an active ingredient. The active has a density of 1.25 g/mL, and the base (PEG) has a density of 1.10 g/mL. For 15 suppositories, calculate the total volume of active and base needed.","options":[],"correct":"","explanation":"Drug volume = 0.2/1.25 = 0.16 mL Base volume per supp = (2.5 -- 0.2)/1.10 = 2.3/1.10 = 2.091 mL For 15 supps: drug volume = 0.16 \u00d7 15 = 2.4 mL, base volume = 2.091 \u00d7 15 = 31.36 mL","finalAnswer":"For 15 supps: drug volume = 0.16 \u00d7 15 = 2.4 mL, base volume = 2.091 \u00d7 15 = 31.36 mL","reference":"Suppositories"},{"id":"suppositories_calcfr_13","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"The replacement factor (i.e., grams of base displaced by 1 g of drug) of Drug N in glycerinated gelatin base is 0.65. Each suppository is to contain 300 mg of Drug N and weigh 3.0 g. For a batch of 12 suppositories, calculate the total amount of base required.","options":[],"correct":"","explanation":"Base per supp = 3.0 \u2212 (0.3 \u00d7 0.65) = 2.8050g. For 12 suppositories: 2.8050 \u00d7 12 = 33.66g base","finalAnswer":"Base per supp = 3.0 \u2212 (0.3 \u00d7 0.65) = 2.8050g. For 12 suppositories: 2.8050 \u00d7 12 = 33.66g base","reference":"Suppositories"},{"id":"suppositories_calcfr_14","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A suppository mold holds 2.2 mL of base (density = 0.92 g/mL). A drug with density 1.4 g/mL is to be incorporated at 150 mg per suppository. Calculate the weight of base needed per suppository after accounting for the drug's occupied volume.","options":[],"correct":"","explanation":"Drug volume = 0.15/1.4 = 0.107 mL Mold capacity = 2.2 mL \u00d7 0.92 g/mL = 2.024 g base alone Base mass with drug = 2.024 -- (0.107 \u00d7 0.92) = 2.024 -- 0.098 = 1.926 g base per supp","finalAnswer":"Base mass with drug = 2.024 -- (0.107 \u00d7 0.92) = 2.024 -- 0.098 = 1.926 g base per supp","reference":"Suppositories"},{"id":"suppositories_calcfr_15","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"You are preparing 10 suppositories, each containing 250 mg of a drug with a displacement value (i.e., grams of drug that would displace 1 g of base) of 1.2. The base alone weighs 2.0 g per suppository. Calculate the total amount of base and drug needed for the batch.","options":[],"correct":"","explanation":"Base per supp = 2.0 \u2212 (0.25 \u00f7 1.2) = 1.7917g. For 10 suppositories: base = 1.7917 \u00d7 10 = 17.92g, drug = 0.25 \u00d7 10 = 2.5g","finalAnswer":"Base per supp = 2.0 \u2212 (0.25 \u00f7 1.2) = 1.7917g. For 10 suppositories: base = 1.7917 \u00d7 10 = 17.92g, drug = 0.25 \u00d7 10 = 2.5g","reference":"Suppositories"},{"id":"suppositories_calcfr_16","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A drug has a volume of 0.85 mL/g. Each 2.0 g suppository is to contain 100 mg of this drug. The base density is 0.9 g/mL. Calculate the volume of drug and base in each suppository.","options":[],"correct":"","explanation":"Drug volume = 0.1 \u00d7 0.85 = 0.085 mL Base mass = 2.0 -- 0.1 = 1.9 g Base volume = 1.9/0.9 = 2.111 mL Total volume = 0.085 + 2.111 = 2.196 mL per supp","finalAnswer":"Total volume = 0.085 + 2.111 = 2.196 mL per supp","reference":"Suppositories"},{"id":"suppositories_calcfr_17","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"The density factor (i.e., grams of Drug P that would displace 1 g of base) of Drug P relative to cocoa butter is 1.8. Each suppository is to weigh 2.0 g and contain 150 mg of Drug P. For 20 suppositories, calculate the total cocoa butter required.","options":[],"correct":"","explanation":"Base per supp = 2.0 \u2212 (0.15 \u00f7 1.8) = 1.9167g. For 20 suppositories: 1.9167 \u00d7 20 = 38.33g cocoa butter","finalAnswer":"Base per supp = 2.0 \u2212 (0.15 \u00f7 1.8) = 1.9167g. For 20 suppositories: 1.9167 \u00d7 20 = 38.33g cocoa butter","reference":"Suppositories"},{"id":"suppositories_calcfr_18","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"medium","question":"A pharmacist uses a mold calibrated to 2.5 g of base. Drug Q has a replacement value (i.e., grams of base displaced by 1 g of drug) of 0.7. If each suppository is to contain 200 mg of Drug Q, calculate the adjusted weight of base per suppository.","options":[],"correct":"","explanation":"Base per supp = mold capacity \u2212 (drug \u00d7 replacement value) = 2.5 \u2212 (0.2 \u00d7 0.7) = 2.36g per suppository","finalAnswer":"Base per supp = mold capacity \u2212 (drug \u00d7 replacement value) = 2.5 \u2212 (0.2 \u00d7 0.7) = 2.36g per suppository","reference":"Suppositories"},{"id":"suppositories_calcfr_19","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"The occupied volume of 400 mg of a drug in a suppository is 0.32 mL. The base density is 0.95 g/mL, and the total suppository weight is 2.5 g. Calculate the weight of base required per suppository.","options":[],"correct":"","explanation":"Drug mass = 0.4 g, volume = 0.32 mL Base density = 0.95 g/mL Total weight = 2.5 g \u21d2 base mass = 2.5 -- 0.4 = 2.1 g","finalAnswer":"Total weight = 2.5 g \u21d2 base mass = 2.5 -- 0.4 = 2.1 g","reference":"Suppositories"},{"id":"suppositories_calcfr_20","topicId":"suppositories","topicName":"Suppositories","type":"calc","difficulty":"hard","question":"A batch of 18 suppositories is to be made, each containing 175 mg of a drug with a density factor (i.e., grams of drug that would displace 1 g of base) of 1.3. The mold capacity is 2.2 g of base. Calculate the total amount of base and drug needed for the batch.","options":[],"correct":"","explanation":"Base per supp = 2.2 \u2212 (0.175 \u00f7 1.3) = 2.0654g. For 18 suppositories: base = 2.0654 \u00d7 18 = 37.18g, drug = 0.175 \u00d7 18 = 3.15g","finalAnswer":"Base per supp = 2.2 \u2212 (0.175 \u00f7 1.3) = 2.0654g. For 18 suppositories: base = 2.0654 \u00d7 18 = 37.18g, drug = 0.175 \u00d7 18 = 3.15g","reference":"Suppositories"},{"id":"sterile_forms_calcfr_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"Isotonicity (E-value): A prescription calls for 30 mL of a 2% solution of Drug X (E-value = 0.22). How many grams of NaCl are needed to make the solution isotonic?","options":[],"correct":"","explanation":"NaCl needed = (0.9% \u00d7 30 mL) -- (2% \u00d7 30 mL \u00d7 0.22) = (0.009 \u00d7 30) -- (0.02 \u00d7 30 \u00d7 0.22) = 0.27 -- 0.132 = 0.138 g NaCl","finalAnswer":"= (0.009 \u00d7 30) -- (0.02 \u00d7 30 \u00d7 0.22) = 0.27 -- 0.132 = 0.138 g NaCl","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_calcfr_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"medium","question":"Osmolarity: Calculate the osmolarity (mOsm/L) of a solution containing 9 g/L of NaCl (MW = 58.5 g/mol). Assume complete dissociation (i = 2).","options":[],"correct":"","explanation":"Moles NaCl = 9 / 58.5 = 0.154 mol/L Osmolarity = 0.154 \u00d7 2 = 0.308 Osm/L = 308 mOsm/L","finalAnswer":"Osmolarity = 0.154 \u00d7 2 = 0.308 Osm/L = 308 mOsm/L","reference":"Sterile Dosage Forms"},{"id":"powders_calcfr_1","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"Aliquot method: A balance has a minimum weighable quantity (MWQ) of 120 mg. You need to weigh 30 mg of a potent drug. Describe the aliquot procedure and calculate the amount of diluent needed if you use 120 mg of drug.","options":[],"correct":"","explanation":"Weigh 120 mg drug + diluent to make 120/30 = 4\u00d7 dilution Total mixture = 120 mg drug + 360 mg diluent = 480 mg Take 120 mg of mixture \u21d2 contains 30 mg drug Diluent needed = 360 mg","finalAnswer":"Diluent needed = 360 mg","reference":"Medicinal Powders"},{"id":"sterile_forms_calcfr_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"medium","question":"IV drip rate (mL/hr): A patient is to receive 1.5 L of normal saline over 12 hours. Calculate the infusion rate in mL/hr.","options":[],"correct":"","explanation":"Rate = 1500 mL / 12 hr = 125 mL/hr","finalAnswer":"Rate = 1500 mL / 12 hr = 125 mL/hr","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_calcfr_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"Isotonicity (\u0394Tf method): A 1% solution of Drug Z has a freezing point depression (\u0394Tf) of 0.10\u00b0C. Blood plasma \u0394Tf = 0.52\u00b0C. Calculate the % w/v of NaCl needed to make 50 mL of a 1% Drug Z solution isotonic.","options":[],"correct":"","explanation":"\u0394Tf needed = 0.52 -- 0.10 = 0.42\u00b0C % NaCl = 0.42 / 0.58 = 0.724% w/v","finalAnswer":"% NaCl = 0.42 / 0.58 = 0.724% w/v","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_calcfr_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"Osmolarity (multi-solute): A TPN solution contains 50 g/L of dextrose (MW = 180 g/mol, i = 1) and 3 g/L of NaCl (MW = 58.5 g/mol, i = 2). Calculate the total osmolarity in mOsm/L.","options":[],"correct":"","explanation":"Dextrose: 50/180 = 0.278 M \u21d2 278 mOsm/L NaCl: 3/58.5 = 0.0513 M \u00d7 2 = 0.1026 Osm = 102.6 mOsm/L Total = 278 + 102.6 = 380.6 mOsm/L","finalAnswer":"Total = 278 + 102.6 = 380.6 mOsm/L","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_calcfr_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"IV drip rate (drops/min): A patient is to receive 250 mL of medication over 2 hours. The IV set delivers 20 drops/mL. Calculate the drip rate in drops per minute.","options":[],"correct":"","explanation":"Flow = 250 mL / 120 min = 2.083 mL/min Drops/min = 2.083 \u00d7 20 = 41.67 \u2248 42 drops/min","finalAnswer":"Drops/min = 2.083 \u00d7 20 = 41.67 \u2248 42 drops/min","reference":"Sterile Dosage Forms"},{"id":"suspensions_calcfr_3","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"mg/kg/day (pediatric): A 15 kg child is prescribed Drug A at 10 mg/kg/day in 3 divided doses. The drug suspension is 250 mg/5 mL. Calculate the total daily volume (mL) and the volume per dose.","options":[],"correct":"","explanation":"Daily dose = 10 \u00d7 15 = 150 mg Concentration = 250 mg/5 mL = 50 mg/mL Volume = 150 / 50 = 3 mL/day Per dose = 3 / 3 = 1 mL/dose","finalAnswer":"Per dose = 3 / 3 = 1 mL/dose","reference":"Suspensions"},{"id":"sterile_forms_calcfr_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"hard","question":"Isotonicity adjustment: You need to prepare 100 mL of a 0.5% solution of Drug B (E-value = 0.35). How many mL of 0.9% NaCl solution are needed to make the final solution isotonic? (Assume volumes are additive.)","options":[],"correct":"","explanation":"NaCl needed = (0.9% \u00d7 100) -- (0.5% \u00d7 100 \u00d7 0.35) = 0.9 -- 0.175 = 0.725 g Volume of 0.9% NaCl = 0.725 / 0.009 = 80.56 mL","finalAnswer":"Volume of 0.9% NaCl = 0.725 / 0.009 = 80.56 mL","reference":"Sterile Dosage Forms"},{"id":"aqueous_solutions_calcfr_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Molarity: How many grams of KCl (MW = 74.5 g/mol) are needed to prepare 500 mL of a 0.2 M solution?","options":[],"correct":"","explanation":"Moles = 0.2 M \u00d7 0.5 L = 0.1 mol Mass = 0.1 \u00d7 74.5 = 7.45 g KCl","finalAnswer":"Mass = 0.1 \u00d7 74.5 = 7.45 g KCl","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_calcfr_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Dilution: You have a 50 mg/mL stock solution of Drug C. How many mL of this stock are needed to prepare 200 mL of a 5 mg/mL solution?","options":[],"correct":"","explanation":"50 \u00d7 V\u2081 = 5 \u00d7 200 \u21d2 V\u2081 = 20 mL stock","finalAnswer":"50 \u00d7 V\u2081 = 5 \u00d7 200 \u21d2 V\u2081 = 20 mL stock","reference":"Aqueous Solutions"},{"id":"emulsions_calcfr_2","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"HLB average: A surfactant blend contains 30% Tween 20 (HLB = 16.7) and 70% Span 60 (HLB = 4.7). Calculate the average HLB of the mixture.","options":[],"correct":"","explanation":"HLB = (0.3 \u00d7 16.7) + (0.7 \u00d7 4.7) = 5.01 + 3.29 = 8.30","finalAnswer":"HLB = (0.3 \u00d7 16.7) + (0.7 \u00d7 4.7) = 5.01 + 3.29 = 8.30","reference":"Emulsions"},{"id":"suspensions_calcfr_4","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"Stokes' Law: A particle (radius = 5 \u00b5m, density = 3.0 g/cm\u00b3) is suspended in a liquid (density = 1.0 g/cm\u00b3, viscosity = 0.02 poise). Calculate the sedimentation velocity (cm/s). Use g = 980 cm/s\u00b2.","options":[],"correct":"","explanation":"Stokes' Law: v = [2r\u00b2(\u03c1_particle \u2212 \u03c1_medium)g] / (9\u03b7) r = 5 \u00b5m = 0.0005 cm v = [2 \u00d7 (0.0005)\u00b2 \u00d7 (3.0 \u2212 1.0) \u00d7 980] / (9 \u00d7 0.02) v = [2 \u00d7 0.00000025 \u00d7 2 \u00d7 980] / 0.18 = 0.00098 / 0.18 v \u2248 0.00544 cm/s","finalAnswer":"v \u2248 0.00544 cm/s","reference":"Suspensions"},{"id":"suspensions_calcfr_5","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"Sedimentation volume: A suspension has an initial height of 12 cm. After standing, the sediment height is 5 cm. Calculate the sedimentation volume ratio (F).","options":[],"correct":"","explanation":"F = 5 / 12 = 0.417","finalAnswer":"F = 5 / 12 = 0.417","reference":"Suspensions"},{"id":"aqueous_solutions_calcfr_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"hard","question":"Alligation (three components): You need 500 mL of a 30% solution using 10%, 40%, and 60% stock solutions. If you use equal volumes of the 40% and 60% stocks, calculate the volumes of all three stocks required.","options":[],"correct":"","explanation":"Let volume of 40% = volume of 60% = x Volume of 10% = 500 -- 2x Equation: 0.10(500 -- 2x) + 0.40x + 0.60x = 0.30 \u00d7 500 50 -- 0.2x + x = 150 \u21d2 0.8x = 100 \u21d2 x = 125 mL 40% = 125 mL, 60% = 125 mL, 10% = 500 -- 250 = 250 mL","finalAnswer":"40% = 125 mL, 60% = 125 mL, 10% = 500 -- 250 = 250 mL","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_calcfr_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Molarity to % w/v: A 1.5 M solution of glucose (MW = 180 g/mol) is prepared. What is the concentration in % w/v?","options":[],"correct":"","explanation":"1.5 M = 1.5 mol/L \u00d7 180 g/mol = 270 g/L % w/v = 270 g / 1000 mL \u00d7 100 = 27% w/v","finalAnswer":"% w/v = 270 g / 1000 mL \u00d7 100 = 27% w/v","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_calcfr_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"Dilution (serial): A 10 mg/mL solution is diluted 1:5, then the resulting solution is diluted 1:10. What is the final concentration?","options":[],"correct":"","explanation":"First dilution: 10 mg/mL \u00f7 5 = 2 mg/mL Second dilution: 2 mg/mL \u00f7 10 = 0.2 mg/mL","finalAnswer":"Second dilution: 2 mg/mL \u00f7 10 = 0.2 mg/mL","reference":"Aqueous Solutions"},{"id":"emulsions_calcfr_3","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"hard","question":"HLB required: An oil phase requires an HLB of 10.5. You have Tween 80 (HLB = 15.0) and Span 80 (HLB = 4.3). Calculate the proportion (by weight) of each surfactant needed to achieve the required HLB.","options":[],"correct":"","explanation":"Let fraction of Tween 80 = x 15.0x + 4.3(1 -- x) = 10.5 15x + 4.3 -- 4.3x = 10.5 \u21d2 10.7x = 6.2 \u21d2 x = 0.58 Tween 80 = 58%, Span 80 = 42%","finalAnswer":"Tween 80 = 58%, Span 80 = 42%","reference":"Emulsions"},{"id":"ointments_b4_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which of the following ointment bases is classified as an absorption base?","options":[{"key":"A","text":"White petrolatum"},{"key":"B","text":"Hydrophilic petrolatum"},{"key":"C","text":"Cold cream (vanishing cream)"},{"key":"D","text":"Polyethylene glycol ointment"}],"correct":"B","explanation":"Hydrophilic petrolatum is an absorption base that can absorb additional aqueous solutions. White petrolatum is an oleaginous base. Cold cream is an emulsion base. PEG ointment is a water-soluble base. Hydrous lanolin is also an absorption base, but hydrophilic petrolatum is the classic example.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A patient with dry, cracked skin on the hands is prescribed an occlusive emollient. Which ointment base would provide the best occlusive effect?","options":[{"key":"A","text":"Cream base"},{"key":"B","text":"Hydrogel base"},{"key":"C","text":"Water-washable base"},{"key":"D","text":"Oleaginous base"}],"correct":"D","explanation":"Oleaginous bases (e.g., white petrolatum, white ointment) form an occlusive film that prevents transepidermal water loss, making them ideal for dry, cracked skin.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_3","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following statements regarding ointment bases is correct?","options":[{"key":"A","text":"Water-soluble bases are easily removed with water but are not washable."},{"key":"B","text":"Oleaginous bases are water-washable and cosmetically elegant."},{"key":"C","text":"Absorption bases can absorb water but cannot be washed off with water."},{"key":"D","text":"Emulsion bases are anhydrous and greasy."}],"correct":"C","explanation":"Absorption bases can absorb aqueous solutions but are not water-washable. Water-soluble bases are washable. Oleaginous bases are greasy and not washable. Emulsion bases contain both aqueous and oleaginous phases. Hydrogels are aqueous-based.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_4","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which ointment base is most appropriate for incorporating a water-soluble drug intended for topical application?","options":[{"key":"A","text":"White ointment (oleaginous)"},{"key":"B","text":"Hydrophilic ointment"},{"key":"C","text":"White petrolatum"},{"key":"D","text":"Anhydrous lanolin"}],"correct":"B","explanation":"Hydrophilic ointment (an emulsion base) can accommodate water-soluble drugs because it contains both aqueous and oleaginous phases. Oleaginous bases are best for lipid-soluble drugs.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_5","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"A pharmacist is preparing an ointment using the fusion method. Which of the following steps is correctly described?","options":[{"key":"A","text":"All ingredients are mixed at room temperature."},{"key":"B","text":"The base with the highest melting point is melted first."},{"key":"C","text":"Aqueous solutions are added before melting the base."},{"key":"D","text":"Volatile ingredients are added during heating."}],"correct":"B","explanation":"In the fusion method, the ingredient with the highest melting point is melted first, followed by ingredients with progressively lower melting points. Aqueous solutions are added after cooling, and volatile ingredients are added last at the lowest possible temperature.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_6","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following is a water-soluble ointment base?","options":[{"key":"A","text":"Hydrous lanolin"},{"key":"B","text":"Hydrophilic petrolatum"},{"key":"C","text":"Polyethylene glycol (PEG) ointment"},{"key":"D","text":"Cold cream"}],"correct":"C","explanation":"PEG ointment is a water-soluble base that is non-greasy and easily removed with water. Hydrous lanolin and hydrophilic petrolatum are absorption bases. Cold cream and rose water ointment are emulsion bases.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_7","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A patient is prescribed a topical corticosteroid ointment for psoriasis on the elbows. The pharmacist should counsel the patient to apply the ointment:","options":[{"key":"A","text":"Only once weekly to prevent skin atrophy"},{"key":"B","text":"In a thick layer and cover with an occlusive dressing"},{"key":"C","text":"After washing with hot water and soap"},{"key":"D","text":"In a thin layer to the affected area"}],"correct":"D","explanation":"Topical corticosteroid ointments should be applied in a thin layer to the affected area. Occlusive dressings increase absorption and risk of systemic effects. Hot water can irritate skin. Sun exposure is not recommended.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_8","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"Which of the following factors increases the percutaneous absorption of a drug from an ointment?","options":[{"key":"A","text":"Occlusive dressing over the application site"},{"key":"B","text":"Application to thin-skinned areas (e.g., eyelids)"},{"key":"C","text":"Hydration of the stratum corneum"},{"key":"D","text":"High molecular weight of the drug"}],"correct":"A,B,C","explanation":"Occlusive dressings, thin skin, hydration of the stratum corneum, and lipid-soluble drugs all increase percutaneous absorption. High molecular weight decreases absorption.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_9","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"Which type of ointment base is most likely to cause maceration of the skin if applied to intertriginous areas for prolonged periods?","options":[{"key":"A","text":"Oleaginous base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-soluble base"},{"key":"D","text":"Emulsion base (O/W)"}],"correct":"D","explanation":"Oil-in-water (O/W) emulsion bases (creams) contain a high water content and can cause maceration (softening and breakdown of skin) in moist intertriginous areas. Oleaginous bases are protective in these areas.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_10","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"The incorporation of a powder into an ointment base using a mortar and pestle with gradual addition of the base is known as:","options":[{"key":"A","text":"Trituration"},{"key":"B","text":"Levigation"},{"key":"C","text":"Fusion"},{"key":"D","text":"Geometric dilution"}],"correct":"B","explanation":"Levigation is the process of incorporating a powder into an ointment base by grinding with a small amount of levigating agent on a slab with a spatula, or using a mortar and pestle with gradual addition.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_11","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which of the following is an advantage of ointments over creams for certain dermatological conditions?","options":[{"key":"A","text":"Greater occlusivity and emollience"},{"key":"B","text":"Higher water content"},{"key":"C","text":"Better cosmetic acceptability"},{"key":"D","text":"Easier to wash off"}],"correct":"A","explanation":"Ointments have a higher oleaginous content, providing greater occlusivity and emollience, which is beneficial for dry, scaly conditions like psoriasis and eczema.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_12","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A pharmacist is compounding an ointment containing salicylic acid. Which ointment base would be incompatible due to pH considerations?","options":[{"key":"A","text":"White petrolatum"},{"key":"B","text":"Hydrophilic ointment"},{"key":"C","text":"Cold cream"},{"key":"D","text":"PEG ointment"}],"correct":"D","explanation":"PEG ointment can react with acidic drugs like salicylic acid, causing pH incompatibilities and potential degradation. White petrolatum and anhydrous lanolin are inert oleaginous bases.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_13","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which of the following ointment bases would be most appropriate for a patient with an allergy to wool?","options":[{"key":"A","text":"Anhydrous lanolin"},{"key":"B","text":"Hydrous lanolin"},{"key":"C","text":"White petrolatum"},{"key":"D","text":"Hydrophilic petrolatum"}],"correct":"C","explanation":"Lanolin (wool fat) is derived from sheep and can cause allergic reactions in wool-sensitive patients. White petrolatum is a purified mineral oil product and does not contain lanolin.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_14","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"An ointment prepared by melting together stearyl alcohol, white petrolatum, and propylene glycol, then adding water, is best classified as:","options":[{"key":"A","text":"An oleaginous base"},{"key":"B","text":"An absorption base"},{"key":"C","text":"An O/W emulsion base"},{"key":"D","text":"A W/O emulsion base"}],"correct":"C","explanation":"This describes the composition of a hydrophilic ointment, which is an oil-in-water (O/W) emulsion base. Stearyl alcohol and petrolatum form the oil phase; propylene glycol and water form the aqueous phase.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_15","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following statements about pastes is correct?","options":[{"key":"A","text":"Pastes contain less powder than ointments."},{"key":"B","text":"Pastes are less occlusive than ointments."},{"key":"C","text":"Pastes are more absorptive and less greasy than ointments."},{"key":"D","text":"Pastes cannot be applied to oozing lesions."}],"correct":"C","explanation":"Pastes contain a high concentration of powder (up to 50%) in an ointment base, making them more absorptive, stiffer, and less greasy than ointments. They can be applied to oozing lesions.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_16","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A pharmacist needs to compound 60 g of an ointment containing 2% miconazole nitrate. How many grams of miconazole nitrate are needed? (Round to the nearest whole number.)","options":[{"key":"A","text":"1 g"},{"key":"B","text":"1.2 g"},{"key":"C","text":"2 g"},{"key":"D","text":"3 g"}],"correct":"B","explanation":"2% of 60 g = 0.02 \u00d7 60 = 1.2 g. For NAPLEX constructed-response questions, the exact answer is 1.2 g (or 1 if rounded to the nearest whole number).","reference":"Ointments & Semisolids"},{"id":"ointments_b4_17","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of W/O (water-in-oil) emulsion ointment bases?","options":[{"key":"A","text":"They are easily washed off with water."},{"key":"B","text":"They are more cosmetically elegant than O/W bases."},{"key":"C","text":"They are more occlusive and greasy than O/W bases."},{"key":"D","text":"They are preferred for weeping dermatoses."}],"correct":"C","explanation":"W/O emulsions are more occlusive and greasy than O/W emulsions because the external phase is oil. O/W emulsions are more washable and cosmetically elegant.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_18","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"A patient is prescribed a compounded ointment that must be stored at controlled room temperature and protected from freezing. The most likely reason is:","options":[{"key":"A","text":"The base contains volatile oils"},{"key":"B","text":"The active ingredient is heat-sensitive"},{"key":"C","text":"Freezing would cause phase separation or base breakdown"},{"key":"D","text":"The ointment contains live bacterial cultures"}],"correct":"C","explanation":"Many ointment bases, especially emulsion bases, undergo irreversible phase separation or breakdown when frozen, altering consistency and drug release.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_19","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"When counseling a patient on the use of a topical antibiotic ointment, which instruction is most appropriate?","options":[{"key":"A","text":"Apply generously to cover the surrounding healthy skin"},{"key":"B","text":"Apply a thin layer to the affected area after cleansing"},{"key":"C","text":"Rub vigorously to enhance absorption"},{"key":"D","text":"Store in the refrigerator to prolong potency"}],"correct":"B","explanation":"Topical antibiotic ointments should be applied in a thin layer to the cleansed affected area. Vigorous rubbing can cause irritation. Refrigeration is unnecessary unless specified. Duration depends on the condition.","reference":"Ointments & Semisolids"},{"id":"ointments_b4_20","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which of the following ointment bases is best suited for a topical application where easy removal and non-greasiness are desired?","options":[{"key":"A","text":"White ointment"},{"key":"B","text":"Hydrophilic ointment"},{"key":"C","text":"PEG ointment"},{"key":"D","text":"Anhydrous lanolin"}],"correct":"C","explanation":"PEG (polyethylene glycol) ointment is water-soluble, non-greasy, and easily removed with water, making it ideal when cosmetic elegance and washability are desired.","reference":"Ointments & Semisolids"},{"id":"ointments_b5_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"A drug is readily degraded by water. Which ointment base would be most appropriate?","options":[{"key":"A","text":"Hydrophilic ointment"},{"key":"B","text":"Polyethylene glycol base"},{"key":"C","text":"Oil-in-water cream"},{"key":"D","text":"White petrolatum base"},{"key":"E","text":"Water-washable cream base"}],"correct":"D","explanation":"A water-labile drug needs an anhydrous base; white petrolatum (oleaginous) contains no water.","reference":"Ointments & Semisolids"},{"id":"ointments_b6_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement best characterizes an ointment relative to a cream?","options":[{"key":"A","text":"An ointment generally contains more water and is less occlusive."},{"key":"B","text":"An ointment is usually more occlusive and greasy."},{"key":"C","text":"An ointment is always an oil-in-water emulsion."},{"key":"D","text":"A cream cannot be used on skin."},{"key":"E","text":"A cream never contains preservatives."}],"correct":"B","explanation":"Ointments are usually anhydrous, occlusive and greasy; creams are emulsions containing more water and less occlusive.","reference":"Ointments & Semisolids"},{"id":"ointments_b6_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"calc","difficulty":"medium","question":"A prescription requires application of 2 g of a 1% hydrocortisone cream twice daily for 14 days. How many grams of hydrocortisone are used over the full course?","options":[{"key":"A","text":"0.28 g"},{"key":"B","text":"0.40 g"},{"key":"C","text":"0.56 g"},{"key":"D","text":"1.0 g"},{"key":"E","text":"2.8 g"}],"correct":"C","explanation":"2 g x 1% = 0.02 g hydrocortisone per application; x 2/day x 14 days = 0.56 g.","reference":"Ointments & Semisolids"},{"id":"capsules_b4_1","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following capsule sizes has the largest capacity?","options":[{"key":"A","text":"Size 000"},{"key":"B","text":"Size 0"},{"key":"C","text":"Size 1"},{"key":"D","text":"Size 3"}],"correct":"A","explanation":"Capsule sizes decrease as the number increases. Size 000 is the largest, and size 5 is the smallest. Size 000 holds approximately 1.37 mL, while size 5 holds about 0.13 mL.","reference":"Capsules"},{"id":"capsules_b4_2","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A patient has difficulty swallowing large capsules. Which capsule size would be most appropriate for a formulation requiring approximately 0.5 mL of powder fill?","options":[{"key":"A","text":"Size 000"},{"key":"B","text":"Size 0"},{"key":"C","text":"Size 1"},{"key":"D","text":"Size 3"}],"correct":"C","explanation":"Size 1 capsules have an approximate capacity of 0.5 mL. Size 0 holds ~0.68 mL, size 3 holds ~0.27 mL, and size 5 holds ~0.13 mL. Size 000 is too large.","reference":"Capsules"},{"id":"capsules_b4_3","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following statements regarding hard gelatin capsules is correct?","options":[{"key":"A","text":"Hard gelatin capsules are made primarily from hypromellose."},{"key":"B","text":"Hard gelatin capsules contain 13--16% moisture content."},{"key":"C","text":"Hard gelatin capsules are sealed with a band of gelatin at the factory."},{"key":"D","text":"Hard gelatin capsules cannot be used for hygroscopic drugs."}],"correct":"B","explanation":"Hard gelatin capsules contain 13--16% moisture, which is essential for their flexibility. They are made from gelatin (not hypromellose, which is used for veggie caps). They can be used for hygroscopic drugs with proper desiccants.","reference":"Capsules"},{"id":"capsules_b4_4","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which excipient is commonly used as a lubricant in capsule formulations to prevent powder from adhering to the capsule-filling machine?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Microcrystalline cellulose"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Starch"}],"correct":"C","explanation":"Magnesium stearate is the most commonly used lubricant in capsule formulations. Talc can also act as a glidant but is less commonly used as a primary lubricant. Lactose and MCC are diluents.","reference":"Capsules"},{"id":"capsules_b4_5","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A pharmacist receives a prescription for diltiazem 240 mg capsules. The patient states they cannot swallow capsules. Which of the following is the most appropriate action?","options":[{"key":"A","text":"Open the capsule and mix the contents with applesauce"},{"key":"B","text":"Crush the capsule and mix with water"},{"key":"C","text":"Contact the prescriber to request an alternative dosage form"},{"key":"D","text":"Recommend the patient take the capsule with a large glass of water"}],"correct":"C","explanation":"Diltiazem extended-release capsules (e.g., Cardizem CD, Tiazac) must not be opened, crushed, or chewed as this would destroy the extended-release mechanism and cause dose dumping. The pharmacist should contact the prescriber for an alternative.","reference":"Capsules"},{"id":"capsules_b4_6","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of soft gelatin capsules over hard gelatin capsules?","options":[{"key":"A","text":"Lower production cost"},{"key":"B","text":"Better stability for moisture-sensitive drugs"},{"key":"C","text":"Ability to encapsulate liquid and semi-solid fills"},{"key":"D","text":"Easier to compound extemporaneously"}],"correct":"C","explanation":"Soft gelatin capsules are uniquely suited for liquid, solution, and semi-solid fills (e.g., fish oil, vitamin E). Hard gelatin capsules are better for powders and granules. Soft gels are more expensive and not easily compounded extemporaneously.","reference":"Capsules"},{"id":"capsules_b4_7","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following capsule types is designed to bypass the stomach and release the drug in the intestine?","options":[{"key":"A","text":"Hard gelatin capsule"},{"key":"B","text":"Soft gelatin capsule"},{"key":"C","text":"Enteric-coated capsule"},{"key":"D","text":"Sustained-release capsule"}],"correct":"C","explanation":"Enteric-coated capsules are designed to resist gastric acid and dissolve in the alkaline pH of the small intestine, protecting acid-labile drugs or preventing gastric irritation.","reference":"Capsules"},{"id":"capsules_b4_8","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A formulation contains a drug that is highly hygroscopic. Which of the following would be the best approach for capsule formulation?","options":[{"key":"A","text":"Use a hard gelatin capsule with a cotton plug"},{"key":"B","text":"Use a soft gelatin capsule"},{"key":"C","text":"Use a hard gelatin capsule with a desiccant packet in the container"},{"key":"D","text":"Use an enteric-coated capsule"}],"correct":"C","explanation":"Hygroscopic drugs can be formulated in hard gelatin capsules if a desiccant (e.g., silica gel packet) is included in the container to maintain low humidity. Soft gelatin capsules are poor choices due to their higher moisture content.","reference":"Capsules"},{"id":"capsules_b4_9","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which of the following is a common diluent/filler used in capsule formulations?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Microcrystalline cellulose"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Starch"}],"correct":"A,B,D","explanation":"Lactose, microcrystalline cellulose (Avicel), and starch are common diluents/fillers. Magnesium stearate is a lubricant. Colloidal silicon dioxide is a glidant.","reference":"Capsules"},{"id":"capsules_b4_10","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"The \"locking \" mechanism of a two-piece hard gelatin capsule is achieved by:","options":[{"key":"A","text":"Interlocking grooves on the cap and body"},{"key":"B","text":"A gelatin band applied around the seam"},{"key":"C","text":"Heat-sealing the cap to the body"},{"key":"D","text":"An adhesive applied to the rim of the body"}],"correct":"A","explanation":"Hard gelatin capsules have pre-formed interlocking grooves (notches) on the cap and body that lock together when the cap is pushed onto the body. Band-sealing is an additional security measure.","reference":"Capsules"},{"id":"capsules_b4_11","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following statements about vegetarian (HPMC) capsules is correct?","options":[{"key":"A","text":"They dissolve slower than gelatin capsules in all pH conditions."},{"key":"B","text":"They are made from animal-derived collagen."},{"key":"C","text":"They have lower moisture sensitivity than gelatin capsules."},{"key":"D","text":"They cannot be used for enteric coating."}],"correct":"C","explanation":"HPMC (hypromellose) capsules have lower moisture sensitivity than gelatin capsules, making them suitable for hygroscopic formulations. They are plant-derived and available as hard capsules.","reference":"Capsules"},{"id":"capsules_b4_12","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"A patient is prescribed omeprazole 20 mg capsules. The pharmacist should counsel the patient to:","options":[{"key":"A","text":"Take the capsule with a full glass of milk"},{"key":"B","text":"Swallow the capsule whole; do not crush or chew"},{"key":"C","text":"Open the capsule and sprinkle on food"},{"key":"D","text":"Take the capsule immediately before bedtime"}],"correct":"B","explanation":"Omeprazole capsules contain enteric-coated granules that protect the acid-labile drug from gastric degradation. Crushing or chewing would destroy this protection. They should be taken before meals, not at bedtime.","reference":"Capsules"},{"id":"capsules_b4_13","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following is a disadvantage of capsules compared to tablets?","options":[{"key":"A","text":"Faster onset of action because the shell is easier to be broken"},{"key":"B","text":"Easier to swallow"},{"key":"C","text":"More susceptible to environmental humidity"},{"key":"D","text":"Better taste masking"}],"correct":"C","explanation":"Capsules are more susceptible to humidity because the gelatin shell can become brittle (low humidity) or sticky (high humidity). Tablets are generally more stable to environmental conditions.","reference":"Capsules"},{"id":"capsules_b4_14","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"The process of filling hard gelatin capsules with a formulation containing an active drug and excipients is called:","options":[{"key":"A","text":"Encapsulation"},{"key":"B","text":"Compression"},{"key":"C","text":"Granulation"},{"key":"D","text":"Coating"}],"correct":"A","explanation":"Encapsulation is the process of filling and sealing hard gelatin capsules. Compression is used for tablets. Granulation is a size-enlargement process. Coating and blending are separate unit operations.","reference":"Capsules"},{"id":"capsules_b4_15","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which of the following capsule sizes would be most appropriate for a pediatric formulation requiring a small fill volume of approximately 0.15 mL?","options":[{"key":"A","text":"Size 1"},{"key":"B","text":"Size 3"},{"key":"C","text":"Size 4"},{"key":"D","text":"Size 5"}],"correct":"D","explanation":"Size 4 capsules have an approximate capacity of 0.20--0.21 mL, and size 5 holds ~0.13 mL. Size 3 holds ~0.27 mL. For ~0.15 mL, size 4 or 5 would work; size 4 is the best practical choice among the options.","reference":"Capsules"},{"id":"capsules_b4_16","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A compounded capsule formulation contains a drug that is unstable in the presence of light. Which of the following is the best approach?","options":[{"key":"A","text":"Store capsules in a clear glass vial"},{"key":"B","text":"Use a soft gelatin capsule"},{"key":"C","text":"Add an antioxidant to the capsule shell"},{"key":"D","text":"Use opaque (amber or opaque) capsules or store in an amber container"}],"correct":"D","explanation":"Opaque or amber capsules, or storage in an amber container, protect light-sensitive drugs from photodegradation. Adding antioxidants to the shell is impractical. Transparent containers do not provide protection.","reference":"Capsules"},{"id":"capsules_b4_17","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following statements regarding the dissolution of hard gelatin capsules is correct?","options":[{"key":"A","text":"The body dissolves before the cap in all cases."},{"key":"B","text":"The cap is designed to fit loosely and fall off first."},{"key":"C","text":"The cap and body dissolve simultaneously."},{"key":"D","text":"The capsule shell dissolves in gastric fluid within 10 minutes."}],"correct":"C","explanation":"In standard hard gelatin capsules, the cap and body are made of the same material and dissolve simultaneously in gastrointestinal fluids. The entire shell typically dissolves within minutes.","reference":"Capsules"},{"id":"capsules_b4_18","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following is an appropriate use of a soft gelatin capsule?","options":[{"key":"A","text":"Encapsulating a liquid fish oil supplement"},{"key":"B","text":"Encapsulating a moisture-sensitive powder"},{"key":"C","text":"Extemporaneous compounding in the pharmacy"},{"key":"D","text":"Formulating an effervescent product"}],"correct":"A","explanation":"Soft gelatin capsules are ideal for liquid fills such as oils, solutions, and suspensions. They are not suitable for moisture-sensitive or hygroscopic drugs due to their higher moisture content ( ~6--10%).","reference":"Capsules"},{"id":"capsules_b4_19","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A pharmacist needs to prepare 30 capsules, each containing 325 mg of aspirin powder. The total weight of powder per capsule (including diluent) is 500 mg. How many total grams of powder are needed?","options":[{"key":"A","text":"10 g"},{"key":"B","text":"12 g"},{"key":"C","text":"15 g"},{"key":"D","text":"16.25 g"}],"correct":"C","explanation":"30 capsules \u00d7 500 mg/capsule = 15,000 mg = 15 g total powder needed. The aspirin content is 30 \u00d7 325 mg = 9.75 g, with the remainder being diluent.","reference":"Capsules"},{"id":"capsules_b4_20","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following is a potential problem when storing gelatin capsules in a high-humidity environment?","options":[{"key":"A","text":"The capsules become brittle and crack."},{"key":"B","text":"The capsules become soft and sticky, potentially fusing together."},{"key":"C","text":"The drug degrades by oxidation."},{"key":"D","text":"The capsules become permanently insoluble."}],"correct":"B","explanation":"High humidity causes gelatin capsules to absorb moisture, becoming soft, sticky, and potentially fusing together. Low humidity causes brittleness and cracking.","reference":"Capsules"},{"id":"capsules_b5_1","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Compared with soft gelatin capsules, a key manufacturing advantage of hard gelatin capsules is that they:","options":[{"key":"A","text":"Are always hermetically sealed"},{"key":"B","text":"Can be filled in separate shell-filling and capping steps"},{"key":"C","text":"Are designed only for liquid fills"},{"key":"D","text":"Require glycerin as an essential shell plasticizer"},{"key":"E","text":"Cannot be opened by the patient"}],"correct":"B","explanation":"Hard gelatin capsules are made as two-piece shells that are filled separately and then capped; soft gelatin capsules are formed and filled in one continuous process.","reference":"Capsules"},{"id":"capsules_b5_2","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which statement about hard gelatin capsules is incorrect?","options":[{"key":"A","text":"Their shells contain residual moisture"},{"key":"B","text":"Excessively dry conditions may make shells brittle"},{"key":"C","text":"Excess humidity may promote shell deformation or microbial concerns"},{"key":"D","text":"They are routinely hermetically sealed as part of their standard design"},{"key":"E","text":"Their shells dissolve more readily in warm than cold water"}],"correct":"D","explanation":"Hard gelatin capsules are not routinely hermetically sealed (they are two-piece shells that are simply joined, unlike soft gelatin capsules).","reference":"Capsules"},{"id":"capsules_b5_3","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which counseling instruction is inappropriate for enteric-coated hard gelatin capsules?","options":[{"key":"A","text":"Swallow with adequate water"},{"key":"B","text":"Store away from excessive humidity"},{"key":"C","text":"Open the capsule and sprinkle the enteric-coated contents without checking product-specific instructions"},{"key":"D","text":"Store under the labeled temperature conditions"},{"key":"E","text":"Do not chew the dosage form"}],"correct":"C","explanation":"Product-specific instructions must be checked before opening enteric-coated capsules; pellets should not be crushed or chewed.","reference":"Capsules"},{"id":"capsules_b5_4","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"A patient receives a prescription for delayed-release omeprazole capsules and reports difficulty swallowing. Which counseling recommendation is most appropriate?","options":[{"key":"A","text":"Crush the capsule contents and mix with applesauce"},{"key":"B","text":"Chew the capsule contents with water"},{"key":"C","text":"Open the capsule and swallow the intact enteric-coated pellets with applesauce"},{"key":"D","text":"Dissolve the capsule contents in hot water before administration"},{"key":"E","text":"Take the capsule only after a high-fat meal"}],"correct":"C","explanation":"The enteric-coated pellets should remain intact to preserve delayed release and protect the drug from gastric acid. Patients may typically open certain capsules and sprinkle intact pellets onto soft food, but should not crush or chew them.","reference":"Capsules"},{"id":"tablets_b4_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which of the following tablet excipients is primarily used to improve the flow properties of granules during tablet compression?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Microcrystalline cellulose"},{"key":"C","text":"Colloidal silicon dioxide"},{"key":"D","text":"Starch"}],"correct":"C","explanation":"Colloidal silicon dioxide (Cab-O-Sil, Aerosil) is a glidant that improves powder flow by reducing interparticle friction. Lactose and MCC are diluents. Starch can act as a disintegrant.","reference":"Tablets"},{"id":"tablets_b4_2","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"A patient is prescribed metformin extended-release 500 mg tablets. Which counseling point is most important?","options":[{"key":"A","text":"Crush the tablet if swallowing is difficult"},{"key":"B","text":"Take with a high-fat meal for better absorption"},{"key":"C","text":"Chew the tablet for faster onset"},{"key":"D","text":"Swallow whole; do not crush, chew, or split"}],"correct":"D","explanation":"Extended-release (ER) tablets contain a matrix or coating that controls drug release. Crushing, chewing, or splitting would destroy the release mechanism and cause dose dumping, potentially leading to toxicity.","reference":"Tablets"},{"id":"tablets_b4_3","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which of the following is a function of a tablet disintegrant?","options":[{"key":"A","text":"To improve the compressibility of the powder"},{"key":"B","text":"To facilitate the breakup of the tablet into smaller particles in GI fluid"},{"key":"C","text":"To reduce friction between the tablet and die wall"},{"key":"D","text":"To mask the bitter taste of the drug"}],"correct":"B","explanation":"Disintegrants (e.g., croscarmellose sodium, sodium starch glycolate, crospovidone) promote the rapid breakup of tablets into smaller particles to increase surface area for dissolution.","reference":"Tablets"},{"id":"tablets_b4_4","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Which of the following tablet compression problems is characterized by the sticking of tablet material to the punch faces, resulting in rough or pitted tablet surfaces?","options":[{"key":"A","text":"Capping"},{"key":"B","text":"Lamination"},{"key":"C","text":"Picking"},{"key":"D","text":"Mottling"}],"correct":"C","explanation":"Picking refers to material adhering to the punch faces, causing pits or roughness on the tablet surface. Capping and lamination are separation problems. Mottling is color variation. Sticking is a general term but picking is the specific term for punch-face adhesion.","reference":"Tablets"},{"id":"tablets_b4_5","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Which of the following excipients is commonly used as a binder in tablet formulations?","options":[{"key":"A","text":"Povidone (PVP)"},{"key":"B","text":"Hydroxypropyl cellulose"},{"key":"C","text":"Croscarmellose sodium"},{"key":"D","text":"Starch paste"}],"correct":"A,B,D","explanation":"Povidone, hydroxypropyl cellulose, and starch paste are binders that promote granule adhesion. Croscarmellose sodium is a disintegrant. Magnesium stearate is a lubricant.","reference":"Tablets"},{"id":"tablets_b4_6","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"A tablet that is designed to release the drug at a constant rate over an extended period is best described as:","options":[{"key":"A","text":"An immediate-release tablet"},{"key":"B","text":"A delayed-release tablet"},{"key":"C","text":"A zero-order release tablet"},{"key":"D","text":"A buccal tablet"}],"correct":"C","explanation":"Zero-order release describes constant-rate drug release over time, which is the goal of many extended-release formulations. First-order release shows decreasing rate over time.","reference":"Tablets"},{"id":"tablets_b4_7","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of film coating over sugar coating for tablets?","options":[{"key":"A","text":"Better taste masking"},{"key":"B","text":"Thicker coating for increased protection and target delivery"},{"key":"C","text":"Faster processing time and lower weight increase"},{"key":"D","text":"Better ability to hide tablet imperfections"}],"correct":"C","explanation":"Film coating adds only 2--4% weight to the tablet and is applied much faster than sugar coating (which can add 30--50% weight). Sugar coating provides better taste masking and imperfection hiding.","reference":"Tablets"},{"id":"tablets_b4_8","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"A patient is prescribed a sublingual nitroglycerin tablet. Which of the following counseling points is most appropriate?","options":[{"key":"A","text":"Swallow the tablet with a full glass of water after dissolving into the water"},{"key":"B","text":"Place the tablet under the tongue and allow it to dissolve completely"},{"key":"C","text":"Chew the tablet for faster absorption"},{"key":"D","text":"Take the tablet with food to prevent stomach upset"}],"correct":"B","explanation":"Sublingual nitroglycerin must be placed under the tongue to allow dissolution and absorption through the sublingual mucosa, bypassing first-pass metabolism. Swallowing would result in extensive first-pass metabolism and reduced efficacy.","reference":"Tablets"},{"id":"tablets_b4_9","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of effervescent tablets?","options":[{"key":"A","text":"They contain an acid and a carbonate/bicarbonate that react in water to produce CO\u2082"},{"key":"B","text":"They are designed to be swallowed whole"},{"key":"C","text":"They contain a high concentration of lubricant"},{"key":"D","text":"They are coated with an enteric polymer"}],"correct":"A","explanation":"Effervescent tablets contain an acid (e.g., citric acid) and a carbonate/bicarbonate (e.g., sodium bicarbonate) that react in water to produce carbon dioxide, causing effervescence and rapid dissolution.","reference":"Tablets"},{"id":"tablets_b4_10","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"The process of reducing the size of drug particles and excipients before tablet compression is called:","options":[{"key":"A","text":"Granulation"},{"key":"B","text":"Milling"},{"key":"C","text":"Coating"},{"key":"D","text":"Blending"}],"correct":"B","explanation":"Milling (or comminution) is the process of reducing particle size. Granulation is size enlargement. Coating, blending, and compression are separate unit operations.","reference":"Tablets"},{"id":"tablets_b4_11","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which of the following tablet defects is most likely caused by excessive moisture in the granulation?","options":[{"key":"A","text":"Capping"},{"key":"B","text":"Mottling"},{"key":"C","text":"Lamination"},{"key":"D","text":"Sticking to the punch"}],"correct":"D","explanation":"Excessive moisture can cause granules to adhere to punch faces (sticking/picking). Capping and lamination are often due to air entrapment or poor binding. Mottling is due to color migration.","reference":"Tablets"},{"id":"tablets_b4_12","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"A pharmacist receives a prescription for warfarin 5 mg tablets. The patient is also taking amiodarone. Which of the following is the most appropriate action?","options":[{"key":"A","text":"Dispense the medication without concern"},{"key":"B","text":"Counsel the patient to take warfarin with vitamin K supplements"},{"key":"C","text":"Contact the prescriber due to the significant drug interaction"},{"key":"D","text":"Recommend an OTC alternative"}],"correct":"C","explanation":"Amiodarone inhibits CYP2C9 and CYP3A4, significantly increasing warfarin plasma levels and INR. The pharmacist should contact the prescriber to discuss dose adjustment and increased INR monitoring.","reference":"Tablets"},{"id":"tablets_b4_13","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is a common diluent used in direct compression tablet formulations?","options":[{"key":"A","text":"Pregelatinized starch"},{"key":"B","text":"Croscarmellose sodium"},{"key":"C","text":"Microcrystalline cellulose"},{"key":"D","text":"Talc"}],"correct":"C","explanation":"Microcrystalline cellulose (Avicel) is the most widely used diluent/binder for direct compression due to its excellent compressibility. Pregelatinized starch is also used but MCC is the gold standard.","reference":"Tablets"},{"id":"tablets_b4_14","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following tablet types is designed to be chewed before swallowing?","options":[{"key":"A","text":"Buccal tablet"},{"key":"B","text":"Enteric-coated tablet"},{"key":"C","text":"Chewable tablet"},{"key":"D","text":"Sublingual tablet"}],"correct":"C","explanation":"Chewable tablets are formulated to be chewed before swallowing, often containing flavors and sweeteners. Buccal and sublingual tablets are designed for mucosal absorption. Enteric-coated tablets must not be chewed.","reference":"Tablets"},{"id":"tablets_b4_15","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"A tablet formulation contains 200 mg of active drug, and the total tablet weight is 400 mg. What is the drug concentration expressed as a percentage?","options":[{"key":"A","text":"20%"},{"key":"B","text":"25%"},{"key":"C","text":"40%"},{"key":"D","text":"50%"}],"correct":"D","explanation":"(200 mg / 400 mg) \u00d7 100 = 50%. This is a straightforward percentage calculation commonly tested on the NAPLEX.","reference":"Tablets"},{"id":"tablets_b4_16","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is the primary purpose of a tablet enteric coating?","options":[{"key":"A","text":"To mask the taste of the drug"},{"key":"B","text":"To protect the drug from gastric acid or protect the stomach from drug irritation"},{"key":"C","text":"To provide immediate drug release"},{"key":"D","text":"To improve tablet appearance"}],"correct":"B","explanation":"Enteric coatings resist gastric acid (pH 1--3) and dissolve in the alkaline pH of the small intestine (pH >5.5). This protects acid-labile drugs (e.g., omeprazole, erythromycin) or prevents gastric irritation (e.g., aspirin, NSAIDs).","reference":"Tablets"},{"id":"tablets_b4_17","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which of the following problems is most likely to occur if a tablet is compressed with insufficient compression force?","options":[{"key":"A","text":"Capping"},{"key":"B","text":"Excessive hardness"},{"key":"C","text":"Friability"},{"key":"D","text":"Delayed disintegration"}],"correct":"C","explanation":"Insufficient compression force results in soft, friable tablets that break or crumble easily during handling and shipping. Excessive force causes capping or excessive hardn
