y fatal precipitation hazard.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_18","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which statement about a 20% intravenous lipid emulsion is incorrect?","options":[{"key":"A","text":"It is an oil-in-water emulsion"},{"key":"B","text":"It may obscure detection of particulate precipitation in a total nutrient admixture"},{"key":"C","text":"It can help prevent essential fatty-acid deficiency"},{"key":"D","text":"It provides approximately 5 kcal/mL"},{"key":"E","text":"It is commonly used as a component of parenteral nutrition"}],"correct":"D","explanation":"A 20% lipid emulsion is an oil-in-water emulsion that provides about 2 kcal/mL (not 5 kcal/mL), supplies essential fatty acids, and its opacity can hide precipitates in a total nutrient admixture.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_19","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"hard","question":"Which vitamin is generally not included in standard adult multivitamin infusion formulations because it is commonly supplemented separately?","options":[{"key":"A","text":"Vitamin A"},{"key":"B","text":"Vitamin C"},{"key":"C","text":"Vitamin D"},{"key":"D","text":"Vitamin E"},{"key":"E","text":"Vitamin K"}],"correct":"E","explanation":"Standard adult multivitamin infusion products such as MVI-12 omit vitamin K, which is supplemented separately (some newer products include it).","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_20","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"Which excipient is least commonly selected solely as a tonicity-adjusting agent in parenteral or ophthalmic products?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Dextrose"},{"key":"C","text":"Mannitol"},{"key":"D","text":"Potassium chloride"},{"key":"E","text":"Mineral oil"}],"correct":"E","explanation":"Sodium chloride, dextrose, mannitol and potassium chloride are used to adjust tonicity in aqueous products. Mineral oil is water-immiscible and is not a tonicity adjuster.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_21","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"medium","question":"A 1-L TPN solution contains 20% dextrose and 5% amino acids. Assuming dextrose provides 3.4 kcal/g, how many nonprotein kilocalories are supplied by the dextrose?","options":[{"key":"A","text":"340 kcal"},{"key":"B","text":"500 kcal"},{"key":"C","text":"680 kcal"},{"key":"D","text":"1,000 kcal"},{"key":"E","text":"2,000 kcal"}],"correct":"C","explanation":"20% dextrose = 200 g per liter; 200 g x 3.4 kcal/g = 680 kcal.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_22","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient is prescribed insulin glargine and insulin lispro. Which statement is correct?","options":[{"key":"A","text":"Insulin glargine should be mixed with insulin lispro before injection"},{"key":"B","text":"Insulin lispro is intended for basal insulin coverage"},{"key":"C","text":"Insulin glargine is a long-acting basal insulin formulation"},{"key":"D","text":"Both products should be administered only intravenously"},{"key":"E","text":"Insulin glargine is used primarily to treat acute hypoglycemia"}],"correct":"C","explanation":"Insulin glargine is formulated for prolonged basal activity and generally should not be mixed with other insulins. Insulin lispro is rapid-acting and is used for prandial glucose control.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_23","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"A patient is prescribed two ophthalmic solutions: timolol and latanoprost. Which instruction best minimizes washout of the first product?","options":[{"key":"A","text":"Instill both products simultaneously"},{"key":"B","text":"Administer the second product immediately after the first"},{"key":"C","text":"Separate administration of the two products by at least 5 minutes"},{"key":"D","text":"Rinse the eye with tap water between products"},{"key":"E","text":"Instill the eye drops while wearing contact lenses unless otherwise directed"}],"correct":"C","explanation":"Separating ophthalmic products by at least 5 minutes reduces the likelihood that the second drop washes out the first. Follow product-specific contact-lens instructions.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_24","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which product is most likely to require reconstitution with a specified sterile diluent immediately before administration?","options":[{"key":"A","text":"A commercially available oral syrup"},{"key":"B","text":"A lyophilized intravenous monoclonal-antibody vial"},{"key":"C","text":"A chewable calcium carbonate tablet"},{"key":"D","text":"An enteric-coated proton-pump-inhibitor tablet"},{"key":"E","text":"A transdermal estradiol patch"}],"correct":"B","explanation":"Many biologics and other sterile injectables are supplied as lyophilized powders to improve stability and are reconstituted using the manufacturer-specified sterile diluent and technique.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_25","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"According to standards for aseptic sterile compounding, what is the maximum allowable air cleanliness classification inside a primary engineering control workbench (such as a laminar airflow hood)?","options":[{"key":"A","text":"ISO class 8"},{"key":"B","text":"ISO class 5"},{"key":"C","text":"ISO class 3"},{"key":"D","text":"ISO class 7"},{"key":"E","text":"ISO class 9"}],"correct":"B","explanation":"USP <797> requires the primary engineering control to provide ISO Class 5 air quality; ISO 7 and 8 describe buffer and ante areas.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b5_26","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"medium","question":"A 1 L TPN solution contains 200 g of dextrose monohydrate and 40 g of amino acids. Calculate the non-protein calories provided by this solution. (Note: Dextrose monohydrate yields 3.4 kcal/g).","options":[{"key":"A","text":"160 Kcal"},{"key":"B","text":"840 Kcal"},{"key":"C","text":"1360 Kcal"},{"key":"D","text":"680 Kcal"},{"key":"E","text":"8000 Kcal"}],"correct":"D","explanation":"200 g dextrose monohydrate x 3.4 kcal/g = 680 kcal. Amino acids are not counted as non-protein calories.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_1","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"A patient is prescribed two ophthalmic solutions. Which instruction best prevents the second product from washing out the first?","options":[{"key":"A","text":"Instill both drops simultaneously."},{"key":"B","text":"Separate the products by at least 5 minutes."},{"key":"C","text":"Rinse the eye with water between drops."},{"key":"D","text":"Apply the second drop immediately after the first."},{"key":"E","text":"Use the products only at bedtime."}],"correct":"B","explanation":"Separating ophthalmic products by at least 5 minutes prevents the second drop from washing out the first.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_2","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which statement about ophthalmic ointments is correct?","options":[{"key":"A","text":"They are administered directly into the pupil."},{"key":"B","text":"They generally produce less blurred vision than ophthalmic solutions."},{"key":"C","text":"They are placed as a thin ribbon into the lower conjunctival sac."},{"key":"D","text":"They are interchangeable with otic ointments."},{"key":"E","text":"They should be applied while wearing contact lenses unless otherwise labeled."}],"correct":"C","explanation":"Ophthalmic ointments are applied as a thin ribbon into the lower conjunctival sac. They tend to blur vision more than solutions and are not for use while wearing contact lenses unless labeled.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_3","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which step is most appropriate when withdrawing a medication from a glass ampule?","options":[{"key":"A","text":"Inject air into the ampule to equalize pressure."},{"key":"B","text":"Use a filter needle or filter straw to reduce the risk of glass particulate transfer."},{"key":"C","text":"Shake the opened ampule vigorously."},{"key":"D","text":"Save unused ampule contents for later doses."},{"key":"E","text":"Insert the needle through the rubber stopper."}],"correct":"B","explanation":"A filter needle or filter straw is used to withdraw from a glass ampule to avoid drawing glass particles; air is not injected into an ampule.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_4","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Why is air injected into a sealed multidose vial before withdrawing a dose, when appropriate?","options":[{"key":"A","text":"To sterilize the vial contents"},{"key":"B","text":"To increase drug concentration"},{"key":"C","text":"To equalize pressure and facilitate withdrawal"},{"key":"D","text":"To remove preservatives"},{"key":"E","text":"To create a vacuum within the vial"}],"correct":"C","explanation":"Injecting a volume of air equal to the volume to be withdrawn equalizes pressure and prevents a vacuum in the vial.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_5","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"A medication is formulated as a sterile, nonaqueous solution in sesame oil. Which route is generally most appropriate?","options":[{"key":"A","text":"Intravenous bolus"},{"key":"B","text":"Intravenous infusion"},{"key":"C","text":"Intramuscular injection"},{"key":"D","text":"Intrathecal injection"},{"key":"E","text":"Intra-arterial injection"}],"correct":"C","explanation":"Oil-based injections are given intramuscularly; oils must not be given intravenously because of embolism risk.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_6","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"A vial of a lyophilized monoclonal antibody is reconstituted with manufacturer-supplied diluent before dilution for infusion. Why are many biologic products supplied as lyophilized powders?","options":[{"key":"A","text":"To increase the drug\u2019s first-pass metabolism"},{"key":"B","text":"To improve stability during storage"},{"key":"C","text":"To make the product suitable for oral administration"},{"key":"D","text":"To eliminate the need for aseptic handling"},{"key":"E","text":"To allow unlimited storage after reconstitution"}],"correct":"B","explanation":"Lyophilization improves the stability of biologics during storage; the product still requires aseptic reconstitution.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_7","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"calc","difficulty":"easy","question":"A 1,000-mL intravenous solution is ordered to infuse over 8 hours. What infusion rate should be programmed in mL/hour?","options":[{"key":"A","text":"80 mL/hour"},{"key":"B","text":"100 mL/hour"},{"key":"C","text":"125 mL/hour"},{"key":"D","text":"150 mL/hour"},{"key":"E","text":"250 mL/hour"}],"correct":"C","explanation":"1,000 mL / 8 h = 125 mL/hour.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_8","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"easy","question":"A patient uses U-100 insulin. Which statement is correct?","options":[{"key":"A","text":"U-100 insulin contains 10 units/mL."},{"key":"B","text":"U-100 insulin contains 100 units/mL."},{"key":"C","text":"One insulin unit is always equal to 1 mL."},{"key":"D","text":"Any syringe can be substituted without regard to calibration."},{"key":"E","text":"U-100 insulin must be administered intravenously."}],"correct":"B","explanation":"U-100 insulin contains 100 units per mL and must be measured with an insulin syringe calibrated for U-100.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_9","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which is an advantage of a prefilled syringe compared with withdrawing drug from a vial immediately before administration?","options":[{"key":"A","text":"It eliminates the need to verify dose and expiration date."},{"key":"B","text":"It may reduce preparation steps and opportunities for dosing error."},{"key":"C","text":"It is always appropriate for multidose use."},{"key":"D","text":"It does not require aseptic technique."},{"key":"E","text":"It can be reused if medication remains."}],"correct":"B","explanation":"Prefilled syringes reduce preparation steps and dosing/contamination errors, but still require verification of drug, dose and expiration.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_10","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Why should a pharmacist assess compatibility before mixing two medications in the same intravenous bag or Y-site?","options":[{"key":"A","text":"To determine whether the drugs have identical mechanisms of action"},{"key":"B","text":"To prevent possible precipitation, degradation, or loss of potency"},{"key":"C","text":"To ensure that both medications have the same therapeutic indication"},{"key":"D","text":"To maximize the infusion pump rate"},{"key":"E","text":"To eliminate the need for patient monitoring"}],"correct":"B","explanation":"Incompatible drugs can precipitate, degrade or lose potency when mixed, so compatibility must be assessed first.","reference":"Sterile Dosage Forms"},{"id":"sterile_forms_b6_11","topicId":"sterile_forms","topicName":"Sterile Dosage Forms","type":"mcq","difficulty":"medium","question":"Which injection route is generally preferred for a 3-mL dose of a nonirritating aqueous medication when slow systemic absorption is desired and the product is not formulated for intravenous use?","options":[{"key":"A","text":"Intradermal"},{"key":"B","text":"Subcutaneous"},{"key":"C","text":"Intrathecal"},{"key":"D","text":"Intra-arterial"},{"key":"E","text":"Epidural"}],"correct":"B","explanation":"Subcutaneous injection provides slower systemic absorption than IM or IV and is used for nonirritating aqueous solutions.","reference":"Sterile Dosage Forms"},{"id":"modified_release_b4_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following best describes a modified-release dosage form?","options":[{"key":"A","text":"A dosage form that releases drug immediately upon administration"},{"key":"B","text":"A dosage form designed to alter the rate and/or timing of drug release"},{"key":"C","text":"A dosage form that dissolves only in the stomach"},{"key":"D","text":"A dosage form that is absorbed through the skin"}],"correct":"B","explanation":"Modified-release dosage forms are designed to alter the rate and/or timing of drug release compared to conventional immediate-release forms. This includes extended-release, delayed-release, and targeted-release formulations.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of an extended-release oral dosage form?","options":[{"key":"A","text":"Immediate-release ibuprofen tablet"},{"key":"B","text":"OxyContin (oxycodone ER) tablet"},{"key":"C","text":"Aspirin enteric-coated tablet"},{"key":"D","text":"Sublingual nitroglycerin tablet"}],"correct":"B","explanation":"OxyContin is a well-known extended-release (ER) formulation of oxycodone designed to provide analgesia over 12 hours. Enteric-coated aspirin is delayed-release. Sublingual nitroglycerin is immediate-release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following is a mechanism used in extended-release tablets to control drug release?","options":[{"key":"A","text":"Rapid disintegration in gastric fluid"},{"key":"B","text":"Use of a hydrophilic matrix that swells and forms a gel barrier"},{"key":"C","text":"Crushing the tablet before administration"},{"key":"D","text":"Use of water-soluble coatings only"}],"correct":"B","explanation":"Hydrophilic matrix systems (e.g., using HPMC) swell upon contact with GI fluid, forming a gel layer that controls drug diffusion and erosion, providing sustained release over time.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient is prescribed metoprolol succinate extended-release tablets. Which counseling point is most important?","options":[{"key":"A","text":"Crush the tablet if swallowing is difficult"},{"key":"B","text":"Swallow whole; do not crush, chew, or split"},{"key":"C","text":"Take with a high-fat meal for better absorption"},{"key":"D","text":"Chew the tablet for faster onset"}],"correct":"B","explanation":"Extended-release tablets must be swallowed whole. Crushing, chewing, or splitting would destroy the release-controlling matrix or coating, causing dose dumping and potentially serious adverse effects.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is an advantage of extended-release formulations over immediate-release formulations?","options":[{"key":"A","text":"Faster onset of action"},{"key":"B","text":"Reduced dosing frequency and improved patient adherence"},{"key":"C","text":"Higher peak plasma concentrations"},{"key":"D","text":"Better suited for drugs with very short half-lives only"}],"correct":"B","explanation":"Extended-release formulations reduce dosing frequency (e.g., once or twice daily instead of multiple times daily), improving patient adherence and maintaining more stable plasma concentrations. Onset is typically slower.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a disadvantage of extended-release formulations?","options":[{"key":"A","text":"Less fluctuation in plasma drug concentrations"},{"key":"B","text":"Reduced incidence of adverse effects due to lower peak concentrations"},{"key":"C","text":"Inability to easily adjust dose by splitting tablets"},{"key":"D","text":"Slower onset of action for some formulations"}],"correct":"C","explanation":"Extended-release tablets cannot be split, crushed, or chewed, making dose titration more difficult. This is a significant disadvantage when individualized dosing is needed. Slower onset is also a consideration.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following technologies is used in osmotic pump-controlled release tablets?","options":[{"key":"A","text":"Hydrophilic matrix swelling"},{"key":"B","text":"Use of an osmotic core with a laser-drilled orifice"},{"key":"C","text":"Enteric coating only"},{"key":"D","text":"Rapid-disintegrating excipients"}],"correct":"B","explanation":"Osmotic pump systems (e.g., OROS technology) use an osmotic core that draws water through a semipermeable membrane, creating pressure that pushes drug out through a laser-drilled orifice at a constant rate.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a delayed-release dosage form?","options":[{"key":"A","text":"Metformin ER tablet"},{"key":"B","text":"Omeprazole enteric-coated granules in capsules"},{"key":"C","text":"Morphine sulfate extended-release tablet"},{"key":"D","text":"Diltiazem CD capsule"}],"correct":"B","explanation":"Omeprazole capsules contain enteric-coated granules that resist gastric acid and release drug in the intestine. This is delayed-release, not extended-release. Metformin ER, morphine ER, and diltiazem CD are extended-release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_9","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is the primary purpose of enteric coating?","options":[{"key":"A","text":"To provide immediate drug release in the stomach"},{"key":"B","text":"To protect acid-labile drugs from gastric degradation or prevent gastric irritation"},{"key":"C","text":"To increase the drug 's bioavailability by 100%"},{"key":"D","text":"To make the tablet easier to swallow"}],"correct":"B","explanation":"Enteric coatings resist gastric acid (pH 1--3) and dissolve in the alkaline pH of the small intestine (pH >5.5). This protects acid-labile drugs (e.g., omeprazole, erythromycin) or prevents gastric irritation (e.g., aspirin, NSAIDs).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_10","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following polymers is commonly used for enteric coating?","options":[{"key":"A","text":"Hydroxypropyl methylcellulose (HPMC)"},{"key":"B","text":"Cellulose acetate phthalate (CAP)"},{"key":"C","text":"Polyethylene glycol (PEG)"},{"key":"D","text":"Polyvinylpyrrolidone (PVP)"}],"correct":"B","explanation":"Cellulose acetate phthalate (CAP) is an enteric polymer that dissolves at pH >5.5. HPMC is used for film coating and matrix systems. PEG is a plasticizer/solvent. PVP is a binder.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_11","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient is prescribed a transdermal patch (modified-release dosage form). Which of the following is an advantage of this route?","options":[{"key":"A","text":"Rapid onset comparable to intravenous administration"},{"key":"B","text":"Avoidance of first-pass hepatic metabolism and steady drug delivery"},{"key":"C","text":"Ability to immediately stop drug absorption by removing the patch"},{"key":"D","text":"Both B and C"}],"correct":"D","explanation":"Transdermal patches provide steady drug delivery over days and avoid first-pass metabolism. Drug absorption can be terminated by removing the patch. Onset is not as rapid as IV.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_12","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a characteristic of reservoir-type transdermal patches compared to matrix-type patches?","options":[{"key":"A","text":"Reservoir patches have the drug uniformly dispersed throughout the adhesive"},{"key":"B","text":"Reservoir patches contain a separate drug layer enclosed by a rate-controlling membrane"},{"key":"C","text":"Reservoir patches cannot provide zero-order release"},{"key":"D","text":"Reservoir patches are always smaller than matrix patches"}],"correct":"B","explanation":"Reservoir-type transdermal patches contain a separate drug reservoir enclosed by a rate-controlling membrane (e.g., nitroglycerin patch). Matrix-type patches have drug dispersed in the adhesive polymer.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_13","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is a potential problem with modified-release dosage forms?","options":[{"key":"A","text":"They are always more stable than immediate-release forms"},{"key":"B","text":"Dose dumping can occur if the formulation is altered (crushed, chewed, or exposed to alcohol)"},{"key":"C","text":"They are always less expensive than immediate-release forms"},{"key":"D","text":"They never require special storage conditions"}],"correct":"B","explanation":"Dose dumping is a serious risk with modified-release formulations if they are crushed, chewed, or taken with alcohol (which can dissolve the matrix/coating), leading to rapid release of the entire dose and potential toxicity.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_14","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a targeted drug delivery system?","options":[{"key":"A","text":"Immediate-release aspirin tablet"},{"key":"B","text":"Mesalamine delayed-release tablets for colonic delivery"},{"key":"C","text":"Conventional ibuprofen capsule"},{"key":"D","text":"Simple aqueous solution"}],"correct":"B","explanation":"Mesalamine (5-aminosalicylic acid) delayed-release formulations (e.g., Asacol, Lialda) are designed to release drug specifically in the terminal ileum and colon for treatment of inflammatory bowel disease.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_15","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following is a mechanism of drug release from polymeric nanoparticles used in modified-release formulations?","options":[{"key":"A","text":"Immediate dissolution of the drug upon contact with water"},{"key":"B","text":"Drug diffusion through the polymer matrix and polymer erosion/degradation"},{"key":"C","text":"Rapid disintegration of the nanoparticle in the stomach"},{"key":"D","text":"Active transport of the polymer across the intestinal wall"}],"correct":"B","explanation":"Polymeric nanoparticles release drug through diffusion from the polymer matrix and/or erosion/degradation of the polymer (e.g., PLGA nanoparticles). This provides controlled and often targeted release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_16","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an advantage of liposomal drug delivery systems?","options":[{"key":"A","text":"They always increase oral bioavailability of all drugs"},{"key":"B","text":"They can improve drug solubility, reduce toxicity, and enable targeted delivery"},{"key":"C","text":"They are stable indefinitely at room temperature"},{"key":"D","text":"They are inexpensive and easy to manufacture"}],"correct":"B","explanation":"Liposomal delivery systems can encapsulate hydrophilic and lipophilic drugs, improving solubility, reducing toxicity (by shielding the drug from healthy tissues), and enabling passive or active targeting. They are expensive and have stability limitations.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_17","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following modified-release formulations uses a coating that dissolves at a specific pH to release drug in the colon?","options":[{"key":"A","text":"Time-dependent release system"},{"key":"B","text":"pH-dependent release system"},{"key":"C","text":"Osmotic pump system"},{"key":"D","text":"Ion-exchange resin system"}],"correct":"B","explanation":"pH-dependent release systems use polymers (e.g., Eudragit S) that dissolve at the higher pH of the colon (pH 7--8) but remain intact at gastric and upper intestinal pH, enabling colonic targeting.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_18","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a consideration when counseling patients on extended-release capsules containing beads or pellets?","options":[{"key":"A","text":"The beads can be crushed and mixed with food if swallowing is difficult"},{"key":"B","text":"The capsule can be opened and the contents sprinkled on soft food for some products, but not others"},{"key":"C","text":"All extended-release capsules can be opened and mixed with liquids"},{"key":"D","text":"Extended-release capsules should always be chewed"}],"correct":"B","explanation":"Some extended-release capsules (e.g., certain brands of divalproex ER, mesalamine) can be opened and sprinkled on soft food, but many cannot (e.g., diltiazem CD, omeprazole granules have specific instructions). The pharmacist must check the specific product labeling.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_19","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a zero-order release modified dosage form?","options":[{"key":"A","text":"Immediate-release acetaminophen tablet"},{"key":"B","text":"Nitroglycerin transdermal patch"},{"key":"C","text":"Conventional amoxicillin capsule"},{"key":"D","text":"Aspirin plain tablet"}],"correct":"B","explanation":"Nitroglycerin transdermal patches and some osmotic pump tablets (e.g., Concerta) are designed to deliver drug at a constant rate (zero-order kinetics) over a specified period, maintaining steady plasma levels.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_20","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which of the following is a potential consequence of alcohol-induced dose dumping from an extended-release formulation?","options":[{"key":"A","text":"Slower drug absorption and reduced efficacy"},{"key":"B","text":"Rapid release of the entire dose, potentially causing toxicity"},{"key":"C","text":"No change in drug release kinetics"},{"key":"D","text":"Conversion of the drug to an inactive metabolite"}],"correct":"B","explanation":"Alcohol can dissolve the rate-controlling matrix or coating of some extended-release formulations (e.g., certain opioid ER tablets), causing rapid release of the entire dose (dose dumping), which can lead to serious toxicity or death.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b4_21","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which of the following modified-release technologies uses coated drug particles that release drug at different time intervals after administration?","options":[{"key":"A","text":"Single-unit osmotic pump"},{"key":"B","text":"Multiparticulate/pellet system with different coating thicknesses"},{"key":"C","text":"Hydrophilic matrix tablet only"},{"key":"D","text":"Immediate-release granule system"}],"correct":"B","explanation":"Multiparticulate systems (e.g., pellets with varying coating thicknesses or different polymers) can be designed to release drug at different time intervals, providing pulsatile or extended-release profiles. This is used in some advanced ER formulations.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A drug undergoes extensive first-pass hepatic metabolism and biliary excretion after oral administration. Which dosage form is most likely to improve systemic bioavailability by bypassing first-pass metabolism?","options":[{"key":"A","text":"Conventional immediate-release tablet"},{"key":"B","text":"Oral solution"},{"key":"C","text":"Enteric-coated capsule"},{"key":"D","text":"Transdermal patch"},{"key":"E","text":"Effervescent powder"}],"correct":"D","explanation":"A transdermal system bypasses the GI tract and first-pass hepatic metabolism, increasing bioavailability.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which is not an advantage of a transdermal drug-delivery system?","options":[{"key":"A","text":"Potential for self-administration"},{"key":"B","text":"Avoidance of gastrointestinal degradation"},{"key":"C","text":"Ability to discontinue delivery by removing the patch"},{"key":"D","text":"Suitability for very large drug doses"},{"key":"E","text":"Potential for sustained drug input"}],"correct":"D","explanation":"Transdermal delivery is limited to potent drugs with low daily doses; it is not suitable for very large doses.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which factor is least likely to directly determine the transdermal flux of a drug from an otherwise functional patch?","options":[{"key":"A","text":"Drug molecular weight"},{"key":"B","text":"Drug lipophilicity"},{"key":"C","text":"Drug solubility in the patch and skin"},{"key":"D","text":"Condition and integrity of the skin barrier"},{"key":"E","text":"The color of the outer backing layer"}],"correct":"E","explanation":"Drug size, lipophilicity, solubility and skin integrity influence transdermal flux; the color of the backing layer does not.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which dosage form is particularly promising for minimally invasive administration of certain protein vaccines?","options":[{"key":"A","text":"Enteric-coated tablet"},{"key":"B","text":"Conventional syrup"},{"key":"C","text":"Microneedle patch"},{"key":"D","text":"Rectal suppository"},{"key":"E","text":"Oral elixir"}],"correct":"C","explanation":"Microneedle patches painlessly deliver proteins and vaccines through the skin with minimal invasiveness.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which patient instruction is inappropriate for a transdermal patch?","options":[{"key":"A","text":"Apply to clean, dry skin at an approved site"},{"key":"B","text":"Avoid lotions at the application site unless directed"},{"key":"C","text":"Rotate application sites when instructed"},{"key":"D","text":"Cut any patch into smaller pieces to customize the dose"},{"key":"E","text":"Remove the patch if severe irritation develops and seek advice"}],"correct":"D","explanation":"Patches should not be cut, because that can alter drug delivery and cause dosing errors or loss of controlled release.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"An immediate-release oral drug is taken three times daily and causes adverse effects associated with peak\u2013trough plasma concentration fluctuations. Which dosage form is most likely to reduce those fluctuations?","options":[{"key":"A","text":"Effervescent tablet"},{"key":"B","text":"Controlled-release tablet"},{"key":"C","text":"Chewable tablet"},{"key":"D","text":"Oral powder"},{"key":"E","text":"Enteric-coated tablet only"}],"correct":"B","explanation":"Controlled-release dosage forms smooth plasma concentrations and reduce peak-trough fluctuation.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"An in vitro\u2013in vivo correlation (IVIVC) most commonly links:","options":[{"key":"A","text":"In vitro drug release with in vivo drug exposure or absorption"},{"key":"B","text":"In vitro dissolution with manufacturing cost"},{"key":"C","text":"In vivo efficacy with excipient color"},{"key":"D","text":"In vivo clearance with tablet hardness only"},{"key":"E","text":"Dissolution testing with toxicity testing only"}],"correct":"A","explanation":"IVIVC establishes a predictive relationship between an in vitro property (usually dissolution/release) and an in vivo response (absorption or plasma level).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which formulation strategy is most appropriate for targeting drug release to the colon?","options":[{"key":"A","text":"Immediate-release syrup"},{"key":"B","text":"Sublingual tablet"},{"key":"C","text":"pH-dependent polymer coating combined with delayed-release design"},{"key":"D","text":"Buccal film"},{"key":"E","text":"Intramuscular depot injection"}],"correct":"C","explanation":"Colon targeting commonly uses pH-dependent polymer coatings in a delayed-release design so the drug is released in the distal intestine.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_9","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which dosage forms are generally most suitable for long-term treatment of chronic hypertension when stable plasma concentrations and convenient dosing are desired?","options":[{"key":"A","text":"Extended-release or controlled-release oral tablets"},{"key":"B","text":"Sublingual tablets and rectal suppositories"},{"key":"C","text":"Immediate-release tablets every 2 hours"},{"key":"D","text":"Topical ointment and oral gargle"},{"key":"E","text":"IV bolus injection and buccal lozenge"}],"correct":"A","explanation":"Extended- or controlled-release oral tablets maintain steadier plasma levels with convenient dosing in chronic therapy.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_10","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which medication order should prompt the pharmacist to contact the prescriber because the dosage form may be unsafe or ineffective as written?","options":[{"key":"A","text":"Metoprolol succinate extended-release tablet, swallow whole"},{"key":"B","text":"Diltiazem extended-release capsule, swallow whole"},{"key":"C","text":"Oxycodone extended-release tablet, crush before administration"},{"key":"D","text":"Potassium chloride extended-release tablet, take with water"},{"key":"E","text":"Venlafaxine extended-release capsule, take once daily"}],"correct":"C","explanation":"Crushing an extended-release opioid can cause dose dumping, potentially producing dangerously rapid drug release and overdose.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_11","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient has severe nausea and vomiting and cannot retain oral medications. The prescriber wants to avoid gastrointestinal absorption and hepatic first-pass metabolism. Which route is most appropriate for a drug that is suitable for transdermal delivery?","options":[{"key":"A","text":"Oral immediate-release tablet"},{"key":"B","text":"Oral suspension"},{"key":"C","text":"Rectal suppository"},{"key":"D","text":"Transdermal patch"},{"key":"E","text":"Enteric-coated capsule"}],"correct":"D","explanation":"A transdermal system bypasses the GI tract and first-pass hepatic metabolism. Rectal dosing may partially reduce first-pass exposure, but absorption can be variable and is not as reliably independent of GI factors.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_12","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which patient action is inappropriate when using a transdermal patch?","options":[{"key":"A","text":"Applying the patch to clean, dry, intact skin"},{"key":"B","text":"Rotating application sites as instructed"},{"key":"C","text":"Removing the old patch before applying a new one"},{"key":"D","text":"Cutting the patch in half to reduce the dose"},{"key":"E","text":"Folding the used patch with adhesive sides together before disposal"}],"correct":"D","explanation":"Cutting patches can alter drug delivery and cause inaccurate dosing or loss of controlled-release function. A pharmacist should verify whether a specific product has any manufacturer-supported exception.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b5_13","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"A patient requires a medication for a chronic condition, has difficulty remembering multiple daily doses, and would benefit from relatively stable drug concentrations. Assuming the drug is appropriate for modified release, which option is best?","options":[{"key":"A","text":"Immediate-release tablet three times daily"},{"key":"B","text":"Sublingual tablet as needed"},{"key":"C","text":"Extended-release oral tablet once daily"},{"key":"D","text":"Oral powder administered every 4 hours"},{"key":"E","text":"Rectal suppository once daily regardless of indication"}],"correct":"C","explanation":"Extended-release products can reduce dosing frequency and peak-to-trough fluctuation, though they are not appropriate for every drug or clinical situation.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_1","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"A patient uses metoprolol succinate extended-release tablets. Which instruction is best?","options":[{"key":"A","text":"Crush the tablet to improve onset of action."},{"key":"B","text":"Chew the tablet with food."},{"key":"C","text":"Swallow the tablet whole unless product-specific labeling permits splitting."},{"key":"D","text":"Dissolve the tablet in water before administration."},{"key":"E","text":"Take the tablet only when symptomatic."}],"correct":"C","explanation":"Metoprolol succinate ER tablets are swallowed whole (scored tablets may be split only as labeling allows); crushing or chewing destroys the extended-release mechanism.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_2","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient has difficulty swallowing a delayed-release capsule containing enteric-coated pellets. Which recommendation is most appropriate?","options":[{"key":"A","text":"Crush the pellets into applesauce."},{"key":"B","text":"Open the capsule and chew the pellets."},{"key":"C","text":"Open the capsule and swallow intact pellets with soft food, if permitted by labeling."},{"key":"D","text":"Dissolve the pellets in hot tea before taking."},{"key":"E","text":"Substitute an extended-release tablet automatically."}],"correct":"C","explanation":"Enteric-coated pellets may be sprinkled intact on soft food if labeling permits; crushing or chewing them destroys the delayed-release coating.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_3","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which characteristic best distinguishes a transdermal system from a topical cream?","options":[{"key":"A","text":"A transdermal system is always applied to mucous membranes."},{"key":"B","text":"A transdermal system is designed to deliver drug through intact skin into systemic circulation."},{"key":"C","text":"A topical cream cannot contain an active pharmaceutical ingredient."},{"key":"D","text":"A transdermal system produces only local skin effects."},{"key":"E","text":"A topical cream is always sterile."}],"correct":"B","explanation":"A transdermal system delivers drug through intact skin into the systemic circulation, whereas topical creams generally act locally.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_4","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"calc","difficulty":"easy","question":"A transdermal system delivers 0.1 mg/hour of drug continuously for 72 hours. How much drug is delivered during one complete application period?","options":[{"key":"A","text":"0.3 mg"},{"key":"B","text":"1.2 mg"},{"key":"C","text":"2.4 mg"},{"key":"D","text":"7.2 mg"},{"key":"E","text":"72 mg"}],"correct":"D","explanation":"0.1 mg/h x 72 h = 7.2 mg.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_5","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which statement best describes a delayed-release product?","options":[{"key":"A","text":"It releases drug immediately after administration."},{"key":"B","text":"It releases drug at a slower but constant rate from the time of administration."},{"key":"C","text":"It releases drug after a time lag or after reaching a specific region, such as the intestine."},{"key":"D","text":"It always provides therapeutic effect for exactly 24 hours."},{"key":"E","text":"It must be administered sublingually."}],"correct":"C","explanation":"Delayed-release products release drug after a lag time or at a particular site (e.g., the intestine) rather than immediately.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_6","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which prescription should be questioned because the dosage form may be inappropriate for a patient with an enteral feeding tube?","options":[{"key":"A","text":"Acetaminophen immediate-release oral liquid"},{"key":"B","text":"Metoprolol tartrate immediate-release tablet, if properly prepared"},{"key":"C","text":"Nifedipine extended-release tablet to be crushed and administered through the tube"},{"key":"D","text":"Omeprazole delayed-release granules, if handled according to product instructions"},{"key":"E","text":"A commercially available enteral liquid medication"}],"correct":"C","explanation":"Extended-release tablets should not be crushed because of dose dumping and loss of release control, which is inappropriate for tube administration.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_7","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A patient experiences adverse effects with a drug administered as an immediate-release tablet three times daily because plasma concentrations peak soon after each dose. What dosage-form strategy may reduce peak\u2013trough fluctuation?","options":[{"key":"A","text":"Change to a controlled-release product, if clinically appropriate"},{"key":"B","text":"Crush each immediate-release tablet"},{"key":"C","text":"Use an effervescent formulation"},{"key":"D","text":"Add a sweetening agent"},{"key":"E","text":"Convert the medication to an ophthalmic solution"}],"correct":"A","explanation":"A controlled-release product reduces peak-trough fluctuation, where clinically appropriate.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_b6_8","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Which characteristic is a potential advantage of an implantable drug-delivery system?","options":[{"key":"A","text":"It always allows immediate cessation of therapy without a procedure."},{"key":"B","text":"It can provide prolonged release over weeks to months."},{"key":"C","text":"It eliminates all risk of infection."},{"key":"D","text":"It is suitable for every medication."},{"key":"E","text":"It guarantees complete avoidance of adverse effects."}],"correct":"B","explanation":"Implants can release drug for weeks to months, improving adherence, but they require a procedure to place and remove.","reference":"Modified-Release Dosage Forms"},{"id":"aqueous_solutions_addcalc_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"How many milliequivalents (mEq) of sodium are in 10 mL of 0.9% NaCl (w/v)? (Na = 23, Cl = 35.5; NaCl MW = 58.5 g/mol; valence = 1)","options":[],"correct":"","explanation":"0.9% w/v = 0.9 g/100 mL = 9 mg/mL. In 10 mL: 9 mg/mL \u00d7 10 mL = 90 mg NaCl. mEq = (mg / MW) \u00d7 valence = (90 mg / 58.5 mg/mmol) \u00d7 1 = 1.54 mEq Na\u207a.","finalAnswer":"0.9% w/v = 0.9 g/100 mL = 9 mg/mL. In 10 mL: 9 mg/mL \u00d7 10 mL = 90 mg NaCl. mEq = (mg / MW) \u00d7 valence = (90 mg / 58.5 mg/mmol) \u00d7 1 = 1.54 mEq Na\u207a.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A potassium chloride oral solution is labeled 20 mEq/15 mL. How many mg of KCl are in one 15 mL dose? (K = 39, Cl = 35.5; KCl MW = 74.5 g/mol; valence = 1)","options":[],"correct":"","explanation":"mEq = (mg / MW) \u00d7 valence \u2192 mg = mEq \u00d7 MW / valence = 20 mEq \u00d7 74.5 mg/mmol / 1 = 1,490 mg KCl per 15 mL.","finalAnswer":"mEq = (mg / MW) \u00d7 valence \u2192 mg = mEq \u00d7 MW / valence = 20 mEq \u00d7 74.5 mg/mmol / 1 = 1,490 mg KCl per 15 mL.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A patient is ordered 40 mEq of MgSO\u2084 IV. The available solution is 50% MgSO\u2084 (w/v). How many mL are required? (MgSO\u2084\u00b77H\u2082O MW \u2248 246.5 g/mol; Mg valence = 2)","options":[],"correct":"","explanation":"50% w/v = 50 g/100 mL = 0.5 g/mL = 500 mg/mL. mEq/mL = (mg/mL / MW) \u00d7 valence = (500 / 246.5) \u00d7 2 \u2248 4.06 mEq/mL. Volume = 40 mEq / 4.06 mEq/mL \u2248 9.85 mL.","finalAnswer":"50% w/v = 50 g/100 mL = 0.5 g/mL = 500 mg/mL. mEq/mL = (mg/mL / MW) \u00d7 valence = (500 / 246.5) \u00d7 2 \u2248 4.06 mEq/mL. Volume = 40 mEq / 4.06 mEq/mL \u2248 9.85 mL.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"You have 500 mL of a 10% w/v dextrose solution. How many mL of water must you add to make a 5% w/v solution?","options":[],"correct":"","explanation":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (10%)(500 mL) = (5%)(V\u2082) \u2192 V\u2082 = 1,000 mL. Water to add = 1,000 \u2212 500 = 500 mL.","finalAnswer":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (10%)(500 mL) = (5%)(V\u2082) \u2192 V\u2082 = 1,000 mL. Water to add = 1,000 \u2212 500 = 500 mL.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"How many mL of a 25% w/v stock solution are needed to prepare 200 mL of a 10% w/v solution?","options":[],"correct":"","explanation":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (25%)(V\u2081) = (10%)(200 mL) \u2192 V\u2081 = 80 mL of stock; add 120 mL diluent.","finalAnswer":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (25%)(V\u2081) = (10%)(200 mL) \u2192 V\u2081 = 80 mL of stock; add 120 mL diluent.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A 1:100 stock solution is diluted 1:10, then that solution is diluted 1:5. What is the final concentration relative to the original stock?","options":[],"correct":"","explanation":"1:100 = 1/100. After 1:10 \u2192 (1/100) \u00d7 (1/10) = 1/1,000. After 1:5 \u2192 (1/1,000) \u00d7 (1/5) = 1/5,000. Final = 1:5,000 of original.","finalAnswer":"1:100 = 1/100. After 1:10 \u2192 (1/100) \u00d7 (1/10) = 1/1,000. After 1:5 \u2192 (1/1,000) \u00d7 (1/5) = 1/5,000. Final = 1:5,000 of original.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A pharmacist dissolves 7.5 g of drug in enough water to make 250 mL. Express the concentration as % w/v and as mg/mL.","options":[],"correct":"","explanation":"% w/v = (g / mL) \u00d7 100 = (7.5 g / 250 mL) \u00d7 100 = 3% w/v. mg/mL = 7,500 mg / 250 mL = 30 mg/mL.","finalAnswer":"% w/v = (g / mL) \u00d7 100 = (7.5 g / 250 mL) \u00d7 100 = 3% w/v. mg/mL = 7,500 mg / 250 mL = 30 mg/mL.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"An ointment contains 3 g of drug in 60 g of total ointment. What is the % w/w concentration?","options":[],"correct":"","explanation":"% w/w = (g drug / g total) \u00d7 100 = (3 / 60) \u00d7 100 = 5% w/w.","finalAnswer":"% w/w = (g drug / g total) \u00d7 100 = (3 / 60) \u00d7 100 = 5% w/w.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_9","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A solution contains 500 mg of drug per 100 mL. Express this as: (a) % w/v, (b) mg/mL, (c) g/L.","options":[],"correct":"","explanation":"(a) 500 mg = 0.5 g \u2192 (0.5 g / 100 mL) \u00d7 100 = 0.5% w/v. (b) 500 mg / 100 mL = 5 mg/mL. (c) 500 mg/100 mL = 5,000 mg/L = 5 g/L.","finalAnswer":"(a) 500 mg = 0.5 g \u2192 (0.5 g / 100 mL) \u00d7 100 = 0.5% w/v. (b) 500 mg / 100 mL = 5 mg/mL. (c) 500 mg/100 mL = 5,000 mg/L = 5 g/L.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_addcalc_10","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"hard","question":"A TPN order requires 30 mEq of potassium acetate. The available solution is 2 mEq/mL. How many mL are needed, and what is the % w/v if the solution's concentration is 392 mg/mL (potassium acetate MW = 98.1 g/mol; valence = 1)?","options":[],"correct":"","explanation":"Volume = 30 mEq / (2 mEq/mL) = 15 mL. % w/v = (mg/mL / 10) = 392 mg/mL \u2192 39.2% w/v.","finalAnswer":"Volume = 30 mEq / (2 mEq/mL) = 15 mL. % w/v = (mg/mL / 10) = 392 mg/mL \u2192 39.2% w/v.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which condition is most likely to accelerate hydrolysis (inversion) of sucrose in aqueous solution?","options":[{"key":"A","text":"Refrigeration at neutral pH"},{"key":"B","text":"Heating at acidic pH"},{"key":"C","text":"Freezing at alkaline pH"},{"key":"D","text":"Storage in an amber bottle"},{"key":"E","text":"Increasing solution viscosity"}],"correct":"B","explanation":"Sucrose inversion is acid-catalyzed hydrolysis to glucose and fructose, and heat speeds it up. Syrups are therefore kept near neutral pH and stored cool.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"hard","question":"The aqueous solubility of a weakly basic drug would most likely be increased by:","options":[{"key":"A","text":"Lowering the pH substantially below its pKa"},{"key":"B","text":"Reducing its particle size"},{"key":"C","text":"Increasing viscosity with a gelling polymer"},{"key":"D","text":"Eliminating agitation during preparation"},{"key":"E","text":"Adding a weak base to the vehicle"}],"correct":"A","explanation":"A weak base is more soluble when ionized, which occurs at pH below its pKa. Raising the pH converts it to the poorly soluble free base, and adding a weak base to the vehicle also raises pH. Reducing particle size speeds dissolution but does not change equilibrium solubility.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"At the same molar concentration, which compound is expected to cause the greatest freezing-point depression in water?","options":[{"key":"A","text":"Glucose"},{"key":"B","text":"Sodium chloride"},{"key":"C","text":"Calcium chloride"},{"key":"D","text":"Urea"},{"key":"E","text":"Mannitol"}],"correct":"C","explanation":"Colligative effects depend on the number of particles. CaCl2 dissociates into 3 ions, NaCl into 2, and the nonelectrolytes (glucose, urea, mannitol) do not dissociate.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which process is not a standard method for obtaining purified water?","options":[{"key":"A","text":"Distillation"},{"key":"B","text":"Reverse osmosis"},{"key":"C","text":"Deionization"},{"key":"D","text":"Ultraviolet treatment"},{"key":"E","text":"Crystallization inversion"}],"correct":"E","explanation":"Purified water is prepared by distillation, ion exchange (deionization), reverse osmosis, and similar treatments. 'Crystallization inversion' is not a purification method.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which salt is expected to have the lowest aqueous solubility?","options":[{"key":"A","text":"Sodium nitrate"},{"key":"B","text":"Potassium chloride"},{"key":"C","text":"Ammonium acetate"},{"key":"D","text":"Calcium carbonate"},{"key":"E","text":"Sodium bicarbonate"}],"correct":"D","explanation":"Calcium carbonate is practically insoluble in water, whereas sodium nitrate, potassium chloride, ammonium acetate and sodium bicarbonate are all water-soluble.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which intervention would generally not improve the aqueous solubility of a weak acid?","options":[{"key":"A","text":"Raising pH above the drug\u2019s pKa"},{"key":"B","text":"Preparing a sodium salt, when suitable"},{"key":"C","text":"Adding hydrochloric acid to lower pH"},{"key":"D","text":"Reducing particle size"},{"key":"E","text":"Using a cosolvent system"}],"correct":"C","explanation":"Weak acids are more soluble when ionized (pH above the pKa, or as a sodium salt). Adding HCl lowers the pH and shifts the drug to its less soluble unionized form.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"easy","question":"How many grams of sucrose are needed to prepare 500 mL of syrup containing 85% w/v sucrose?","options":[{"key":"A","text":"42.5 g"},{"key":"B","text":"85 g"},{"key":"C","text":"250 g"},{"key":"D","text":"425 g"},{"key":"E","text":"850 g"}],"correct":"D","explanation":"85% w/v = 85 g per 100 mL, so 500 mL requires 85 x 5 = 425 g sucrose.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b5_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"What is the pH of a buffer prepared with equal molar concentrations of lactic acid and sodium lactate if the pKa of lactic acid is 3.86?","options":[{"key":"A","text":"2.86"},{"key":"B","text":"3.00"},{"key":"C","text":"3.86"},{"key":"D","text":"4.86"},{"key":"E","text":"7.00"}],"correct":"C","explanation":"Henderson-Hasselbalch: pH = pKa + log([salt]/[acid]). With equal concentrations, log(1) = 0, so pH = pKa = 3.86.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b6_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A prescription states: \u201cDrug A oral solution 125 mg/5 mL. Take 375 mg by mouth three times daily for 7 days.\u201d What total volume should be dispensed?","options":[{"key":"A","text":"105 mL"},{"key":"B","text":"150 mL"},{"key":"C","text":"210 mL"},{"key":"D","text":"315 mL"},{"key":"E","text":"420 mL"}],"correct":"D","explanation":"375 mg / 125 mg x 5 mL = 15 mL per dose; 15 mL x 3/day x 7 days = 315 mL.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b6_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which technique is generally correct for administering otic drops to an adult?","options":[{"key":"A","text":"Pull the auricle down and back."},{"key":"B","text":"Pull the auricle up and back."},{"key":"C","text":"Pull the auricle forward and upward."},{"key":"D","text":"Instill drops directly on the tympanic membrane."},{"key":"E","text":"Insert the dropper tip deeply into the ear canal."}],"correct":"B","explanation":"In adults, pull the auricle up and back to straighten the ear canal; in young children pull it down and back.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b6_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"An albuterol nebulizer solution contains 2.5 mg/3 mL. A patient uses one full unit-dose vial four times daily for 5 days. What total amount of albuterol will the patient receive?","options":[{"key":"A","text":"12.5 mg"},{"key":"B","text":"25 mg"},{"key":"C","text":"40 mg"},{"key":"D","text":"50 mg"},{"key":"E","text":"60 mg"}],"correct":"D","explanation":"2.5 mg/vial x 4 vials/day x 5 days = 50 mg.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b7_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"calc","difficulty":"medium","question":"A pharmacist prepares 250 mL of an aqueous oral solution containing potassium chloride 20 mEq per 15 mL. How many total milliequivalents of potassium chloride are contained in the entire bottle?","options":[{"key":"A","text":"200 mEq"},{"key":"B","text":"250 mEq"},{"key":"C","text":"300 mEq"},{"key":"D","text":"333 mEq"},{"key":"E","text":"500 mEq"}],"correct":"D","explanation":"(20 mEq / 15 mL) x 250 mL = 333.3 mEq, or about 333 mEq of potassium chloride in the entire bottle.","reference":"Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"A tincture is labeled 1:4 (drug:solvent) in 70% v/v alcohol. If 100 mL of tincture is prepared, how many mL of pure ethanol are present?","options":[],"correct":"","explanation":"1:4 means 1 part drug + 4 parts solvent = 5 parts total. Solvent volume = (4/5) \u00d7 100 mL = 80 mL. Ethanol in solvent = 70% of 80 mL = 0.70 \u00d7 80 = 56 mL pure ethanol.","finalAnswer":"1:4 means 1 part drug + 4 parts solvent = 5 parts total. Solvent volume = (4/5) \u00d7 100 mL = 80 mL. Ethanol in solvent = 70% of 80 mL = 0.70 \u00d7 80 = 56 mL pure ethanol.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"A spirit is labeled 80 proof. What is its % v/v alcohol?","options":[],"correct":"","explanation":"In the US, proof = 2 \u00d7 % v/v. % v/v = 80 / 2 = 40% v/v.","finalAnswer":"In the US, proof = 2 \u00d7 % v/v. % v/v = 80 / 2 = 40% v/v.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"How many mL of 95% ethanol and 50% ethanol must be mixed to prepare 500 mL of 70% ethanol?","options":[],"correct":"","explanation":"Alligation: 95% --- 70% = 25 parts of 50%; 70% --- 50% = 20 parts of 95%. Ratio 95%:50% = 20:25 = 4:5. Total parts = 9. 95% = (4/9) \u00d7 500 \u2248 222.2 mL; 50% = (5/9) \u00d7 500 \u2248 277.8 mL.","finalAnswer":"Alligation: 95% --- 70% = 25 parts of 50%; 70% --- 50% = 20 parts of 95%. Ratio 95%:50% = 20:25 = 4:5. Total parts = 9. 95% = (4/9) \u00d7 500 \u2248 222.2 mL; 50% = (5/9) \u00d7 500 \u2248 277.8 mL.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"Use alligation to prepare 1 L of 60% ethanol using 90% ethanol and 40% ethanol.","options":[],"correct":"","explanation":"90% --- 60% = 30 parts of 40%; 60% --- 40% = 20 parts of 90%. Ratio 90%:40% = 30:20 = 3:2. Total parts = 5. 90% = (3/5) \u00d7 1,000 = 600 mL; 40% = (2/5) \u00d7 1,000 = 400 mL.","finalAnswer":"90% --- 60% = 30 parts of 40%; 60% --- 40% = 20 parts of 90%. Ratio 90%:40% = 30:20 = 3:2. Total parts = 5. 90% = (3/5) \u00d7 1,000 = 600 mL; 40% = (2/5) \u00d7 1,000 = 400 mL.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_5","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"You have 300 mL of 95% ethanol, 200 mL of 70% ethanol, and 500 mL of 50% ethanol. What is the final % v/v alcohol of the mixture?","options":[],"correct":"","explanation":"Total ethanol = (300\u00d70.95) + (200\u00d70.70) + (500\u00d70.50) = 285 + 140 + 250 = 675 mL. Total volume = 1,000 mL. % = 675 / 1,000 \u00d7 100 = 67.5% v/v.","finalAnswer":"Total ethanol = (300\u00d70.95) + (200\u00d70.70) + (500\u00d70.50) = 285 + 140 + 250 = 675 mL. Total volume = 1,000 mL. % = 675 / 1,000 \u00d7 100 = 67.5% v/v.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_6","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"How many mL of water must be added to 250 mL of 90% ethanol to obtain 60% ethanol?","options":[],"correct":"","explanation":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (90%)(250) = (60%)(V\u2082) \u2192 V\u2082 = 375 mL. Water to add = 375 \u2212 250 = 125 mL.","finalAnswer":"C\u2081V\u2081 = C\u2082V\u2082 \u2192 (90%)(250) = (60%)(V\u2082) \u2192 V\u2082 = 375 mL. Water to add = 375 \u2212 250 = 125 mL.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_7","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"A compounding order requires 8 oz (\u2248240 mL) of 45% ethanol. You have 70% and 30% ethanol. How many mL of each should you use?","options":[],"correct":"","explanation":"Alligation: 70% --- 45% = 25 parts of 30%; 45% --- 30% = 15 parts of 70%. Ratio 70%:30% = 25:15 = 5:3. Total parts = 8. 70% = (5/8) \u00d7 240 = 150 mL; 30% = (3/8) \u00d7 240 = 90 mL.","finalAnswer":"Alligation: 70% --- 45% = 25 parts of 30%; 45% --- 30% = 15 parts of 70%. Ratio 70%:30% = 25:15 = 5:3. Total parts = 8. 70% = (5/8) \u00d7 240 = 150 mL; 30% = (3/8) \u00d7 240 = 90 mL.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_8","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"You need 600 mL of 55% ethanol. You have 85% ethanol and water (0% ethanol). How many mL of each?","options":[],"correct":"","explanation":"Alligation: 85% --- 55% = 30 parts water; 55% --- 0% = 55 parts 85%. Ratio 85%:water = 55:30 = 11:6. Total parts = 17. 85% = (11/17) \u00d7 600 \u2248 388.2 mL; water = (6/17) \u00d7 600 \u2248 211.8 mL.","finalAnswer":"Alligation: 85% --- 55% = 30 parts water; 55% --- 0% = 55 parts 85%. Ratio 85%:water = 55:30 = 11:6. Total parts = 17. 85% = (11/17) \u00d7 600 \u2248 388.2 mL; water = (6/17) \u00d7 600 \u2248 211.8 mL.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_9","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"A mouthwash is formulated with 12% v/v ethanol. If a patient uses 15 mL per dose, how many mL of pure ethanol are ingested per dose?","options":[],"correct":"","explanation":"12% of 15 mL = 0.12 \u00d7 15 = 1.8 mL pure ethanol.","finalAnswer":"12% of 15 mL = 0.12 \u00d7 15 = 1.8 mL pure ethanol.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_addcalc_10","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"You prepared 400 mL of 65% ethanol but need 70%. How many mL of 95% ethanol must you add (assuming volumes are additive) to reach 70%?","options":[],"correct":"","explanation":"Let x = mL of 95% added. Ethanol: 0.65(400) + 0.95x = 0.70(400 + x). 260 + 0.95x = 280 + 0.70x \u2192 0.25x = 20 \u2192 x = 80 mL of 95% ethanol.","finalAnswer":"Let x = mL of 95% added. Ethanol: 0.65(400) + 0.95x = 0.70(400 + x). 260 + 0.95x = 280 + 0.70x \u2192 0.25x = 20 \u2192 x = 80 mL of 95% ethanol.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b5_1","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"A clear, sweetened hydroalcoholic oral preparation containing flavoring materials is best classified as a:","options":[{"key":"A","text":"Syrup"},{"key":"B","text":"Elixir"},{"key":"C","text":"Tincture"},{"key":"D","text":"Aromatic water"},{"key":"E","text":"Spirit"}],"correct":"B","explanation":"Elixirs are clear, sweetened, flavored hydroalcoholic solutions. Syrups are aqueous sucrose solutions, tinctures are alcoholic extracts, and spirits are high-alcohol solutions of volatile substances.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b5_2","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"medium","question":"A hydroalcoholic tincture is diluted extensively with water. What formulation problem is most likely if the alcohol concentration falls below that needed to keep nonpolar constituents dissolved?","options":[{"key":"A","text":"Increased isotonicity"},{"key":"B","text":"Precipitation or turbidity"},{"key":"C","text":"Increased antimicrobial preservation"},{"key":"D","text":"Reduced risk of oxidation"},{"key":"E","text":"Increased volatility of water"}],"correct":"B","explanation":"Diluting a tincture lowers its alcohol content, so nonpolar constituents (resins, oils, alkaloid bases) come out of solution as a precipitate or turbidity.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b5_3","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which preparation is typically considered a nonaqueous pharmaceutical solution?","options":[{"key":"A","text":"Gargle"},{"key":"B","text":"Enema"},{"key":"C","text":"Ophthalmic solution"},{"key":"D","text":"Collodion"},{"key":"E","text":"Douche"}],"correct":"D","explanation":"Collodion (pyroxylin in ether and alcohol) is a nonaqueous solution. Gargles, enemas, ophthalmic solutions and douches are aqueous.","reference":"Non-Aqueous Solutions"},{"id":"non_aqueous_solutions_b5_4","topicId":"non_aqueous_solutions","topicName":"Non-Aqueous Solutions","type":"calc","difficulty":"medium","question":"A prescription calls for 120 mL of a final elixir containing 30% v/v alcohol. The available high-alcohol elixir contains 70% v/v alcohol and the low-alcohol elixir contains 10% v/v alcohol. How many milliliters of each should be used?","options":[{"key":"A","text":"20 mL high-alcohol elixir and 100 mL low-alcohol elixir"},{"key":"B","text":"40 mL high-alcohol elixir and 80 mL low-alcohol elixir"},{"key":"C","text":"60 mL high-alcohol elixir and 60 mL low-alcohol elixir"},{"key":"D","text":"80 mL high-alcohol elixir and 40 mL low-alcohol elixir"},{"key":"E","text":"100 mL high-alcohol elixir and 20 mL low-alcohol elixir"}],"correct":"B","explanation":"Alligation: high-strength parts = |30 - 10| = 20; low-strength parts = |70 - 30| = 40; total 60 parts. 120 mL x 20/60 = 40 mL of 70% elixir and 80 mL of 10% elixir. Check: (40 x 0.70 + 80 x 0.10)/120 = 30%.","reference":"Non-Aqueous Solutions"},{"id":"suspensions_addcalc_1","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A suspension's particle radius is doubled while all other factors remain constant. According to Stokes' law, how does the sedimentation rate change?","options":[],"correct":"","explanation":"Stokes' law: v \u221d r\u00b2. If r \u2192 2r, then v \u2192 (2)\u00b2 = 4 times faster.","finalAnswer":"Stokes' law: v \u221d r\u00b2. If r \u2192 2r, then v \u2192 (2)\u00b2 = 4 times faster.","reference":"Suspensions"},{"id":"suspensions_addcalc_2","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"hard","question":"Which change will decrease the sedimentation rate of a suspension: (a) increasing particle size, (b) increasing viscosity of the vehicle, (c) decreasing density difference between particle and vehicle?","options":[],"correct":"","explanation":"(b) and (c) decrease sedimentation rate. (a) increases it.","finalAnswer":"(b) and (c) decrease sedimentation rate. (a) increases it.","reference":"Suspensions"},{"id":"suspensions_addcalc_3","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A liquid has a mass of 120 g and occupies 100 mL. What is its specific gravity?","options":[],"correct":"","explanation":"Density = 120 g / 100 mL = 1.20 g/mL. Specific gravity = 1.20 / 1.00 = 1.20.","finalAnswer":"Density = 120 g / 100 mL = 1.20 g/mL. Specific gravity = 1.20 / 1.00 = 1.20.","reference":"Suspensions"},{"id":"suspensions_addcalc_4","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A suspension vehicle has a density of 1.08 g/mL. What is its specific gravity (water = 1.00 g/mL)?","options":[],"correct":"","explanation":"SG = 1.08 / 1.00 = 1.08.","finalAnswer":"SG = 1.08 / 1.00 = 1.08.","reference":"Suspensions"},{"id":"suspensions_addcalc_5","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"How many grams does 250 mL of a liquid with specific gravity 1.25 weigh?","options":[],"correct":"","explanation":"Density = 1.25 g/mL. Mass = 1.25 g/mL \u00d7 250 mL = 312.5 g.","finalAnswer":"Density = 1.25 g/mL. Mass = 1.25 g/mL \u00d7 250 mL = 312.5 g.","reference":"Suspensions"},{"id":"suspensions_addcalc_6","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A powder has a specific gravity of 2.5. What volume (mL) does 50 g of this powder occupy?","options":[],"correct":"","explanation":"Density = 2.5 g/mL. Volume = mass / density = 50 g / 2.5 g/mL = 20 mL.","finalAnswer":"Density = 2.5 g/mL. Volume = mass / density = 50 g / 2.5 g/mL = 20 mL.","reference":"Suspensions"},{"id":"suspensions_addcalc_7","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A suspension is to contain 250 mg/5 mL. How many grams of drug are needed to prepare 120 mL?","options":[],"correct":"","explanation":"250 mg/5 mL = 50 mg/mL. For 120 mL: 50 mg/mL \u00d7 120 mL = 6,000 mg = 6 g.","finalAnswer":"250 mg/5 mL = 50 mg/mL. For 120 mL: 50 mg/mL \u00d7 120 mL = 6,000 mg = 6 g.","reference":"Suspensions"},{"id":"suspensions_addcalc_8","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A pediatric suspension is labeled 125 mg/5 mL. The ordered dose is 7.5 mg/kg for a 16 kg child. How many mL are required per dose?","options":[],"correct":"","explanation":"Dose = 7.5 mg/kg \u00d7 16 kg = 120 mg. Concentration = 125 mg/5 mL = 25 mg/mL. Volume = 120 mg / 25 mg/mL = 4.8 mL.","finalAnswer":"Dose = 7.5 mg/kg \u00d7 16 kg = 120 mg. Concentration = 125 mg/5 mL = 25 mg/mL. Volume = 120 mg / 25 mg/mL = 4.8 mL.","reference":"Suspensions"},{"id":"suspensions_addcalc_9","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"Two suspensions have sedimentation volumes (F) of 0.6 and 0.9. Which is more stable against caking, and why?","options":[],"correct":"","explanation":"F = 0.9 is more stable. Higher F indicates a larger, less compact sediment, reducing caking.","finalAnswer":"F = 0.9 is more stable. Higher F indicates a larger, less compact sediment, reducing caking.","reference":"Suspensions"},{"id":"suspensions_addcalc_10","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A suspension vehicle has a specific gravity of 1.10. If 100 g of vehicle is used, what is its volume in mL?","options":[],"correct":"","explanation":"Density = 1.10 g/mL. Volume = 100 g / 1.10 g/mL \u2248 90.9 mL.","finalAnswer":"Density = 1.10 g/mL. Volume = 100 g / 1.10 g/mL \u2248 90.9 mL.","reference":"Suspensions"},{"id":"suspensions_b5_1","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"The principal formulation disadvantage of a pharmaceutical suspension is usually:","options":[{"key":"A","text":"Inability to deliver insoluble drugs"},{"key":"B","text":"Physical instability, such as sedimentation and caking"},{"key":"C","text":"Lack of need for shaking"},{"key":"D","text":"Complete absence of dose variation"},{"key":"E","text":"Inability to use flavoring agents"}],"correct":"B","explanation":"The main drawback of suspensions is physical instability: sedimentation, caking and the need to redisperse before each dose.","reference":"Suspensions"},{"id":"suspensions_b5_2","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"According to Stokes\u2019 law, increasing the viscosity of the dispersion medium will generally:","options":[{"key":"A","text":"Increase sedimentation rate"},{"key":"B","text":"Decrease sedimentation rate"},{"key":"C","text":"Increase particle density"},{"key":"D","text":"Reduce particle diameter"},{"key":"E","text":"Eliminate the need for a suspending agent"}],"correct":"B","explanation":"Stokes' law: sedimentation rate = d^2(rho_s - rho_l)g / 18 eta. Raising medium viscosity (eta) slows sedimentation.","reference":"Suspensions"},{"id":"suspensions_b5_3","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Compared with an individual particle, a floc generally:","options":[{"key":"A","text":"Has a smaller effective particle size"},{"key":"B","text":"Sediments more slowly because it is lighter"},{"key":"C","text":"Forms a loosely associated aggregate with a larger effective size"},{"key":"D","text":"Cannot be redispersed after settling"},{"key":"E","text":"Has no influence on sedimentation behavior"}],"correct":"C","explanation":"A floc is a loose aggregate of particles with a larger effective size. Flocs sett
