ng-acting injectable depot formulation given monthly. She asks how this differs from her previous daily oral tablet. What is the most appropriate distinction?","options":[{"key":"A","text":"Depot provides sustained release over weeks to months"},{"key":"B","text":"Depot provides immediate release like oral tablets"},{"key":"C","text":"Depot is only for oral administration"},{"key":"D","text":"Depot is less effective than oral tablets"}],"correct":"A","explanation":"Depot injections provide prolonged systemic exposure over time. If you'd like, I can next: - Convert these into a printable student handout (cases only, then separate answer key). - Align specific cases to NAPLEX competency statements (e.g., 1.2.14 dosage forms, 2.x sterile compounding). \u2042 1. https://www.uspnf.com/sites/default/files/usp_pdf/EN/USPNF/pharmaceuticalDosageForms.pdf 2. https://www.youtube.com/watch?v=LTj5E6eiKqA 3. https://www.varsitytutors.com/practice/subjects/naplex/lessons/dosage-forms-and-routes 4. https://quizlet.com/1097937551/naplex-prep-questions-flash-cards/ 5. https://www.youtube.com/watch?v=QZQkh638S_I 6. https://pharmacylibrary.com/doi/10.21019/9781582123578.ch18 7. https://www.scribd.com/document/541031389/Compounding-NAPLEX-Notes 8. https://www.ema.europa.eu/en/human-regulatory-overview/research-development/scientific-guidelines/quality-medicines-questions-answers-introduction/quality-medicines-questions-answers-part-2 9. https://www.ashp.org/-/media/assets/news-and-media/docs/ASHP-Guideline-Quality-Assurance-for-Pharmacy-Prepared-Sterile-Products.pdf 10. https://nabp.pharmacy/wp-content/uploads/NAPLEX-Content-Outline.pdf 11. https://pharmacy.uworld.com/guideline-drug-updates-errata/ 12. https://bevinzey.com/blog/easy-naplex-sterile-compounding-practice-questions 13. https://www.scribd.com/document/954228889/COC-Exam-Pharma-Degree-1 14. https://www.alghad.edu.ly/control_panel/books/pharmacy-case-studies-2009(1).pdf 15. https://bevinzey.com/blog/naplex-pharmaceutical-calculations-practice-questions 16. https://www.youtube.com/watch?v=pbpy13hPXCI 17. https://pharmacyquestionbank.com/naplex-practice-questions/ 18. https://pmc.ncbi.nlm.nih.gov/articles/PMC8006480/(https://pmc.ncbi.nlm.nih.gov/articles/PMC8006480/) 19. https://pmc.ncbi.nlm.nih.gov/articles/PMC8051898/","reference":"Modified-Release Dosage Forms"},{"id":"ointments_b3_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which ointment base is composed primarily of hydrocarbons and provides the greatest occlusive effect?","options":[{"key":"A","text":"Oleaginous base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-removable base"},{"key":"D","text":"Water-soluble base"}],"correct":"A","explanation":"Oleaginous bases (e.g., white petrolatum, yellow petrolatum, mineral oil) are hydrocarbon-based, highly occlusive, and provide the greatest barrier effect by preventing transepidermal water loss. They are anhydrous, non-washable, and chemically inert.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which topical dosage form is 80% oil and 20% water?","options":[{"key":"A","text":"Cream"},{"key":"B","text":"Lotion"},{"key":"C","text":"Ointment"},{"key":"D","text":"Paste"}],"correct":"C","explanation":"Ointments typically contain ~80% oil and ~20% water (or are anhydrous). Creams are ~50% oil/50% water. Lotions are thin liquids with higher water content. Pastes contain high percentages of powder (up to 50%).","reference":"Ointments & Semisolids"},{"id":"ointments_b3_3","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Mometasone is available as both an ointment and a cream. Which formulation has higher potency and why?","options":[{"key":"A","text":"Cream---better penetration through hydrated skin"},{"key":"B","text":"Ointment---greater occlusion leads to enhanced penetration"},{"key":"C","text":"Cream---lower lipid content allows faster release"},{"key":"D","text":"Ointment---contains penetration enhancers"}],"correct":"B","explanation":"Ointments are more occlusive than creams, creating a barrier that hydrates the stratum corneum and enhances percutaneous absorption of the active drug. This increases potency despite the same drug concentration.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_4","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement correctly describes the difference between creams and ointments?","options":[{"key":"A","text":"Creams are more occlusive than ointments"},{"key":"B","text":"Ointments are oil-in-water emulsions; creams are water-in-oil"},{"key":"C","text":"Creams are generally less greasy and more cosmetically acceptable"},{"key":"D","text":"Ointments are primarily water-based preparations"}],"correct":"C","explanation":"Creams are oil-in-water or water-in-oil emulsions that are less greasy, easier to spread, and more cosmetically acceptable than ointments. Ointments are more greasy, occlusive, and difficult to wash off.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_5","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"hard","question":"An absorption base differs from an oleaginous base in that it:","options":[{"key":"A","text":"Is completely water-soluble"},{"key":"B","text":"Can incorporate significant amounts of aqueous phase"},{"key":"C","text":"Provides less occlusion than oleaginous bases"},{"key":"D","text":"Contains no hydrocarbon components"}],"correct":"B","explanation":"Absorption bases (e.g., hydrophilic petrolatum, lanolin, Aquaphor) contain emulsifying agents that allow them to absorb aqueous solutions and form water-in-oil emulsions. Oleaginous bases cannot absorb water.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_6","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"A patient is prescribed a topical corticosteroid for a weeping, exudative skin lesion. Which formulation is most appropriate?","options":[{"key":"A","text":"Ointment"},{"key":"B","text":"Cream"},{"key":"C","text":"Paste"},{"key":"D","text":"Gel"}],"correct":"B","explanation":"creams are more appropriate for weeping lesions","reference":"Ointments & Semisolids"},{"id":"ointments_b3_7","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of pastes compared to ointments?","options":[{"key":"A","text":"Higher water content"},{"key":"B","text":"Lower viscosity"},{"key":"C","text":"Greater proportion of solid material"},{"key":"D","text":"Better spreadability on skin"}],"correct":"C","explanation":"Pastes contain a high concentration of powdered solids (typically 20-50%), making them stiffer, more absorptive, and less greasy than ointments. They adhere well to skin and provide protective barrier effects.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_8","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"When counseling a patient on applying nitroglycerin ointment, which instruction is most important?","options":[{"key":"A","text":"Apply with bare hands for better absorption"},{"key":"B","text":"Use a glove or applicator to limit exposure to the administrator"},{"key":"C","text":"Apply to a hairy area for better adhesion"},{"key":"D","text":"Massage vigorously into the skin"}],"correct":"B","explanation":"Nitroglycerin is absorbed through intact skin. Healthcare providers and caregivers must use gloves or applicators to avoid accidental systemic absorption and hypotension. Patients should also avoid rubbing the ointment into the skin.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_9","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which ointment base type is water-washable and contains polyethylene glycols?","options":[{"key":"A","text":"Oleaginous base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-removable base"},{"key":"D","text":"Water-soluble base"}],"correct":"D","explanation":"Water-soluble bases (e.g., PEG ointment) contain polyethylene glycols and are completely water-washable. They do not contain oil or petrolatum and are non-occlusive, making them ideal for hairy areas or when easy removal is desired.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_10","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement about suppository bases is true?","options":[{"key":"A","text":"They must melt at temperatures above 40\u00b0C"},{"key":"B","text":"Theobroma oil is a synthetic base"},{"key":"C","text":"Polyethylene glycol bases are water-soluble"},{"key":"D","text":"Suppository bases should be stored at room temperature indefinitely"}],"correct":"C","explanation":"PEG bases are water-soluble and dissolve in mucosal fluids rather than melting at body temperature. Cocoa butter melts at body temperature. Suppositories require cool storage and have limited stability.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_11","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"A patient with dry, scaly skin would benefit most from which formulation?","options":[{"key":"A","text":"Lotion"},{"key":"B","text":"Gel"},{"key":"C","text":"Ointment"},{"key":"D","text":"Solution"}],"correct":"C","explanation":"Ointments are most effective for dry, scaly skin because they are highly occlusive and emollient. They trap moisture in the stratum corneum, soften scales, and restore the skin barrier. Creams and lotions are less occlusive.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_12","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a thickening agent in semisolid formulations?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Carbomer"},{"key":"C","text":"Povidone"},{"key":"D","text":"Magnesium stearate"}],"correct":"B","explanation":"Carbomers (e.g., Carbopol) are synthetic high-molecular-weight polymers used as thickening, suspending, and gelling agents in semisolids. They create clear, aqueous gels and provide viscosity at low concentrations.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_13","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Under the revised USP <795> (effective Nov 2023), what is the default Beyond-Use Date (BUD) for a NON-preserved, water-containing (aqueous) topical semisolid formulation?","options":[{"key":"A","text":"7 days at room temperature"},{"key":"B","text":"14 days refrigerated"},{"key":"C","text":"35 days at controlled room temperature"},{"key":"D","text":"90 days"}],"correct":"B","explanation":"Non-preserved aqueous preparations (water activity aw \u2265 0.6) are limited to a 14-day BUD and must be refrigerated, per the revised USP <795>. Preserved aqueous preparations may instead be assigned up to 35 days at controlled room temperature or refrigerated.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_14","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which type of ointment base is composed of lanolin, Aquaphor, and similar ingredients?","options":[{"key":"A","text":"Oleaginous base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-soluble base"},{"key":"D","text":"Hydrocarbon base"}],"correct":"B","explanation":"Absorption bases include lanolin (wool fat), hydrophilic petrolatum (Aquaphor), and similar ingredients that can absorb water while remaining anhydrous. They form water-in-oil emulsions when water is added.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_15","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"What is the primary advantage of water-soluble ointment bases?","options":[{"key":"A","text":"Enhanced occlusion"},{"key":"B","text":"Non-greasy and easily washed off"},{"key":"C","text":"Superior stability in all conditions"},{"key":"D","text":"Better for hairy skin areas"}],"correct":"B","explanation":"Water-soluble bases (PEG ointments) are completely water-washable, non-greasy, and cosmetically elegant. They are ideal for facial application, hairy areas, and when patients prefer a non-occlusive, easy-to-remove product.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_16","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which of the following is NOT a characteristic of oleaginous bases?","options":[{"key":"A","text":"Emollient properties"},{"key":"B","text":"Occlusive film formation"},{"key":"C","text":"Water-miscible"},{"key":"D","text":"Chemically inert"}],"correct":"C","explanation":"Oleaginous bases (hydrocarbon bases) are NOT water-miscible --- they are hydrophobic and cannot absorb or mix with water. They are emollient, occlusive, chemically inert, and anhydrous.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_17","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"A topical product containing benzoyl peroxide and erythromycin for acne is classified as which type of dosage form?","options":[{"key":"A","text":"Cream"},{"key":"B","text":"Ointment"},{"key":"C","text":"Gel"},{"key":"D","text":"Paste"}],"correct":"C","explanation":"Benzoyl peroxide/erythromycin combination products are typically formulated as gels. Gels are clear or translucent semisolids that are alcohol-based or water-based, providing a drying effect and good drug delivery to acne-prone skin.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_18","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which counseling point is correct for patients using topical corticosteroid ointments?","options":[{"key":"A","text":"Apply a thick layer for best results"},{"key":"B","text":"Use only on infected skin areas"},{"key":"C","text":"Apply a thin layer and rub in gently"},{"key":"D","text":"Wash hands after application only if using potent steroids"}],"correct":"C","explanation":"Topical corticosteroids should be applied as a thin layer to the affected area and gently rubbed in. Thick layers do not improve efficacy and increase side effects. Occlusion should only be used under prescriber direction.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_19","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"What is the primary function of emulsifying agents in semisolid formulations?","options":[{"key":"A","text":"Enhance drug solubility"},{"key":"B","text":"Stabilize emulsion systems and prevent phase separation"},{"key":"C","text":"Increase viscosity"},{"key":"D","text":"Improve product appearance"}],"correct":"B","explanation":"Emulsifying agents (surfactants) reduce interfacial tension between oil and water phases, creating a stable emulsion and preventing separation. They form a protective film around dispersed droplets.","reference":"Ointments & Semisolids"},{"id":"ointments_b3_20","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which base is most appropriate for a drug that is unstable in the presence of water?","options":[{"key":"A","text":"Oil-in-water emulsion base"},{"key":"B","text":"Oleaginous base"},{"key":"C","text":"Water-soluble base"},{"key":"D","text":"Cream base"}],"correct":"B","explanation":"Oleaginous bases are anhydrous (water-free) and protect water-sensitive drugs from hydrolysis. Water-soluble bases and creams contain water, which would degrade moisture-sensitive active ingredients.","reference":"Ointments & Semisolids"},{"id":"capsules_b3_1","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which capsule type is required to have the strength (mcg or mg per capsule) clearly stated on the label for compounded products?","options":[{"key":"A","text":"Hard gelatin capsules only"},{"key":"B","text":"Soft gelatin capsules only"},{"key":"C","text":"Both hard and soft capsules"},{"key":"D","text":"Enteric-coated capsules only"}],"correct":"C","explanation":"USP <795 > requires that all compounded capsules, both hard and soft gelatin, have the drug strength clearly stated on the label in metric units (mg, mcg, etc.) to ensure accurate dosing and prevent medication errors.","reference":"Capsules"},{"id":"capsules_b3_2","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A patient complains of jitteriness in the morning and inattention in the afternoon after taking Focalin XR capsules whole. Upon questioning, the patient admits opening the capsules and chewing the beads. What is the most likely cause?","options":[{"key":"A","text":"The patient is taking the wrong dose"},{"key":"B","text":"Chewing the beads destroys the extended-release coating, causing dose-dumping"},{"key":"C","text":"The patient is allergic to the capsule shell"},{"key":"D","text":"The medication should be taken with food only"}],"correct":"B","explanation":"Focalin XR contains coated beads that provide a bimodal release profile. Chewing the beads destroys the extended-release coatings, causing the entire dose to be released immediately (dose-dumping). This leads to early peak levels (jitteriness) followed by subtherapeutic levels (inattention).","reference":"Capsules"},{"id":"capsules_b3_3","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"Which of the following counseling points is correct for patients using capsules containing enteric-coated beads that can be opened and sprinkled on food?","options":[{"key":"A","text":"Chewing the beads enhances absorption"},{"key":"B","text":"The mixture can sit at room temperature for up to 4 hours before administration"},{"key":"C","text":"Do not chew any long-acting pellets or beads"},{"key":"D","text":"Always add the contents to hot food for better dissolution"}],"correct":"C","explanation":"Enteric-coated or extended-release beads must be swallowed intact. Chewing or crushing destroys the protective coating or controlled-release mechanism, leading to drug degradation, gastric irritation, or dose-dumping.","reference":"Capsules"},{"id":"capsules_b3_4","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Under the revised USP <795>, what is the default Beyond-Use Date (BUD) for non-aqueous compounded capsules, assuming no applicable USP monograph or stability data exists?","options":[{"key":"A","text":"90 days"},{"key":"B","text":"180 days"},{"key":"C","text":"14 days"},{"key":"D","text":"35 days"}],"correct":"B","explanation":"Capsules fall under 'other nonaqueous dosage forms' (water activity aw < 0.6) \u2014 a category that also includes tablets, powders, suppositories, and nonaqueous topicals \u2014 which default to a 180-day BUD under the revised USP <795>. Nonaqueous ORAL LIQUIDS are the exception, defaulting to 90 days instead.","reference":"Capsules"},{"id":"capsules_b3_5","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Lactose is the most commonly used excipient in capsule formulations. What is its primary function?","options":[{"key":"A","text":"Lubricant"},{"key":"B","text":"Diluent/filler"},{"key":"C","text":"Disintegrant"},{"key":"D","text":"Binding agent"}],"correct":"B","explanation":"Lactose is the most common diluent/filler in capsule formulations. It provides bulk to low-dose drugs, improves flow properties, and is compatible with most active ingredients. It is inexpensive and readily available.","reference":"Capsules"},{"id":"capsules_b3_6","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"hard","question":"A patient with Parkinson's disease who has difficulty swallowing is started on a dopamine agonist. Which dosage forms are available for dopamine agonists?","options":[{"key":"A","text":"Oral tablets and intravenous"},{"key":"B","text":"Oral tablets and transdermal patch"},{"key":"C","text":"Sublingual and oral suspension"},{"key":"D","text":"Intramuscular and oral tablets"}],"correct":"B","explanation":"Dopamine agonists are available as oral tablets (pramipexole, ropinirole) and as transdermal patches (rotigotine). This allows dose titration and provides options for patients with dysphagia.","reference":"Capsules"},{"id":"capsules_b3_7","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following long-acting opioids can be opened and the contents sprinkled on certain foods?","options":[{"key":"A","text":"All long-acting opioids"},{"key":"B","text":"Only immediate-release formulations"},{"key":"C","text":"Some long-acting opioid capsules, as indicated in prescribing information"},{"key":"D","text":"No long-acting opioids can be opened"}],"correct":"C","explanation":"Some ER opioid capsules (e.g., Kadian, Avinza) can be opened and sprinkled on applesauce. Others (e.g., OxyContin, Opana ER) cannot be altered. Always check the specific product labeling before recommending any modification.","reference":"Capsules"},{"id":"capsules_b3_8","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"What is the purpose of the gelatin shell in a capsule?","options":[{"key":"A","text":"Mask the taste of the drug only"},{"key":"B","text":"Provide a unit dose that masks taste and facilitates swallowing"},{"key":"C","text":"Control drug release exclusively"},{"key":"D","text":"Protect the drug from light only"}],"correct":"B","explanation":"The gelatin shell serves multiple purposes: it masks unpleasant tastes and odors, protects the drug from light and oxygen, facilitates swallowing, and provides a convenient unit dose form.","reference":"Capsules"},{"id":"capsules_b3_9","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which patients are most likely to benefit from capsules that can be opened and sprinkled on soft food?","options":[{"key":"A","text":"Patients with rapid gastrointestinal transit"},{"key":"B","text":"Patients with feeding tubes or swallowing difficulties"},{"key":"C","text":"Patients requiring immediate-release medication"},{"key":"D","text":"Patients on liquid diets only"}],"correct":"B","explanation":"Sprinkling capsules are designed for patients who cannot swallow intact capsules, including pediatric patients, geriatric patients with dysphagia, and patients with feeding tubes (when appropriately formulated).","reference":"Capsules"},{"id":"capsules_b3_10","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"When preparing a prescription for capsules, the label must include which information?","options":[{"key":"A","text":"Only the drug name"},{"key":"B","text":"Strength per capsule and total quantity"},{"key":"C","text":"Directions for opening the capsules"},{"key":"D","text":"Storage temperature only"}],"correct":"B","explanation":"USP <795 > and pharmacy regulations require that capsule labels state the strength per capsule (e.g., \"125 mg/capsule \") and the total quantity dispensed. Directions for opening should only be included if specifically indicated.","reference":"Capsules"},{"id":"capsules_b3_11","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about hard gelatin capsules?","options":[{"key":"A","text":"They contain plasticizers"},{"key":"B","text":"They are primarily used for liquid fills"},{"key":"C","text":"They consist of two telescoping halves"},{"key":"D","text":"They cannot be colored"}],"correct":"C","explanation":"Hard gelatin capsules consist of two separate pieces (body and cap) that telescope together. They are filled with powders or granules and are sealed either mechanically or by banding.","reference":"Capsules"},{"id":"capsules_b3_12","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"A patient reports seeing the shell of their long-acting medication in their stool. What is the appropriate counseling response?","options":[{"key":"A","text":"The medication is not being absorbed and should be discontinued"},{"key":"B","text":"The patient should take the medication with food"},{"key":"C","text":"This is normal for osmotic release systems (ghost tablet/capsule)"},{"key":"D","text":"The patient should switch to a different formulation"}],"correct":"C","explanation":"Osmotic release systems (OROS) and some matrix formulations release drug while the outer shell or matrix remains intact and is excreted in the stool. This is normal and indicates the drug was properly released.","reference":"Capsules"},{"id":"capsules_b3_13","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which excipient is commonly used as a lubricant in capsule formulations to aid in the filling process?","options":[{"key":"A","text":"Microcrystalline cellulose"},{"key":"B","text":"Lactose"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Povidone"}],"correct":"C","explanation":"Magnesium stearate is the most common lubricant in capsule formulations. It prevents powder from adhering to the capsule-filling machine components, ensuring consistent fill weights and smooth operation.","reference":"Capsules"},{"id":"capsules_b3_14","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"What is the primary advantage of soft gelatin capsules?","options":[{"key":"A","text":"Lower cost than hard capsules"},{"key":"B","text":"Can contain liquid or semi-solid fills, improving bioavailability of poorly soluble drugs"},{"key":"C","text":"Faster dissolution than hard capsules"},{"key":"D","text":"No need for preservatives"}],"correct":"B","explanation":"Soft gelatin capsules are uniquely suited for liquid, semi-solid, and oil-based fills. This improves bioavailability of poorly water-soluble drugs by presenting them in a solubilized or dispersed state.","reference":"Capsules"},{"id":"capsules_b3_15","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Why should patients be counseled NOT to let a mixture of capsule contents and soft food \"sit too long\" before administration?","options":[{"key":"A","text":"The drug may degrade in the food"},{"key":"B","text":"The food may become unpalatable"},{"key":"C","text":"The drug may dissolve and become ineffective before reaching the stomach"},{"key":"D","text":"The capsule shell may dissolve in the food"}],"correct":"C","explanation":"Some drugs (especially enteric-coated or extended-release beads) may begin dissolving in the food or be inactivated by digestive enzymes. The mixture should be consumed immediately after preparation.","reference":"Capsules"},{"id":"capsules_b3_16","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which statement regarding the handling of long-acting capsules is correct?","options":[{"key":"A","text":"All long-acting capsules can be opened and sprinkled on food"},{"key":"B","text":"Crushing or chewing long-acting medications could lead to a fatal dose"},{"key":"C","text":"Long-acting beads can be chewed if the capsule is difficult to swallow"},{"key":"D","text":"Long-acting medications can be split for dose adjustments"}],"correct":"B","explanation":"Crushing or chewing long-acting or extended-release capsules destroys the controlled-release mechanism, causing rapid release of the entire dose (dose-dumping). This can lead to severe toxicity or death, especially with narrow therapeutic index drugs.","reference":"Capsules"},{"id":"capsules_b3_17","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"USP <795> guidelines for non-sterile compounding apply to which capsule preparation activity?","options":[{"key":"A","text":"Manufacturing commercially available capsules"},{"key":"B","text":"Compounding capsules in a pharmacy setting"},{"key":"C","text":"Quality control testing of manufactured capsules"},{"key":"D","text":"Only sterile capsule preparations"}],"correct":"B","explanation":"USP <795 > applies to non-sterile compounding in pharmacy settings, including the preparation of compounded capsules. It does not apply to commercial manufacturing of capsules (which is covered by cGMP).","reference":"Capsules"},{"id":"capsules_b3_18","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which of the following is used as a disintegrant in capsule formulations to promote breakup in the GI tract?","options":[{"key":"A","text":"Sodium starch glycolate"},{"key":"B","text":"Magnesium stearate"},{"key":"C","text":"Stearic acid"},{"key":"D","text":"Talc"}],"correct":"A","explanation":"Sodium starch glycolate (Explotab) is a superdisintegrant used in capsule and tablet formulations. It swells rapidly on contact with water, promoting breakup of the capsule contents in the GI tract.","reference":"Capsules"},{"id":"capsules_b3_19","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"A patient is prescribed Singulair granules. How should this product be administered?","options":[{"key":"A","text":"Mixed with 5 mL of baby formula or breast milk"},{"key":"B","text":"Taken whole with a full glass of water"},{"key":"C","text":"Chewed before swallowing"},{"key":"D","text":"Dissolved in hot tea"}],"correct":"A","explanation":"Montelukast (Singulair) granules are specifically designed to be mixed with 5 mL of soft food (applesauce, baby formula, breast milk) at room temperature. Do not dissolve in water or other liquids.","reference":"Capsules"},{"id":"capsules_b3_20","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"What is the main reason for using enteric-coated pellets within a capsule?","options":[{"key":"A","text":"To improve taste"},{"key":"B","text":"To provide sustained release"},{"key":"C","text":"To protect the drug from gastric acid or protect the stomach from the drug"},{"key":"D","text":"To increase the speed of drug release"}],"correct":"C","explanation":"Enteric coatings resist stomach acid (pH 1-3) and dissolve in the intestine (pH >5.5). This protects acid-labile drugs (e.g., omeprazole, pancrelipase) or prevents gastric irritation (e.g., NSAIDs).","reference":"Capsules"},{"id":"tablets_b3_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following tablet types is designed to disintegrate in the mouth without water?","options":[{"key":"A","text":"Enteric-coated tablet"},{"key":"B","text":"Buccal tablet"},{"key":"C","text":"Orally disintegrating tablet (ODT)"},{"key":"D","text":"Effervescent tablet"}],"correct":"C","explanation":"ODTs (e.g., Zofran ODT, Maxalt-MLT) are formulated to disintegrate rapidly in the mouth within seconds without water. They are ideal for patients with dysphagia, nausea, or limited access to water.","reference":"Tablets"},{"id":"tablets_b3_2","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"A patient prescribed an enteric-coated tablet asks if they can crush it for easier swallowing. What is the correct counseling response?","options":[{"key":"A","text":"Yes, crushing is acceptable if taken with food"},{"key":"B","text":"Yes, if the tablet is scored"},{"key":"C","text":"No, crushing would destroy the enteric coating, potentially causing gastric irritation or drug inactivation"},{"key":"D","text":"Yes, but only if the patient has no stomach issues"}],"correct":"C","explanation":"Enteric-coated tablets are designed to resist gastric acid and dissolve in the intestine. Crushing destroys the coating, exposing the drug to stomach acid (inactivation) or causing gastric irritation (NSAIDs).","reference":"Tablets"},{"id":"tablets_b3_3","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which abbreviation indicates a delayed-release tablet designed to release medication later, often in the intestine?","options":[{"key":"A","text":"IR"},{"key":"B","text":"ER"},{"key":"C","text":"DR"},{"key":"D","text":"SR"}],"correct":"C","explanation":"DR indicates delayed-release, meaning the drug is released at a time other than immediately after administration (e.g., enteric-coated tablets). ER = extended-release, SR = sustained-release, IR = immediate-release.","reference":"Tablets"},{"id":"tablets_b3_4","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What is the primary purpose of an enteric coating on a tablet?","options":[{"key":"A","text":"Mask bitter taste"},{"key":"B","text":"Prevent drug release in the stomach; dissolve in higher intestinal pH"},{"key":"C","text":"Provide extended release"},{"key":"D","text":"Improve tablet appearance"}],"correct":"B","explanation":"Enteric coatings protect acid-labile drugs from gastric degradation and prevent gastric irritation from drugs. They dissolve at intestinal pH (\u22655.5) due to ionization of carboxyl groups.","reference":"Tablets"},{"id":"tablets_b3_5","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet can be split if scored and if approved by the pharmacist?","options":[{"key":"A","text":"Extended-release tablet"},{"key":"B","text":"Enteric-coated tablet"},{"key":"C","text":"Immediate-release, scored tablet"},{"key":"D","text":"Sublingual tablet"}],"correct":"C","explanation":"Only immediate-release tablets with a score line should be split. Extended-release, enteric-coated, and sublingual tablets should never be split unless specifically indicated by the manufacturer.","reference":"Tablets"},{"id":"tablets_b3_6","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"A patient reports seeing an intact tablet shell in their stool. They are taking an osmotic release oral system (OROS) medication. What should you counsel them?","options":[{"key":"A","text":"The medication is not working and they should see their doctor"},{"key":"B","text":"This is normal; the tablet shell is not absorbed and appears in the stool as a \"ghost tablet\""},{"key":"C","text":"They should stop taking the medication immediately"},{"key":"D","text":"They should crush the tablet to prevent this"}],"correct":"B","explanation":"OROS systems (e.g., Concerta) use a semipermeable membrane that remains intact after drug release and is excreted in the stool. This is normal and does not indicate medication failure.","reference":"Tablets"},{"id":"tablets_b3_7","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which type of tablet is placed between the cheek and gum for absorption through the buccal mucosa?","options":[{"key":"A","text":"Sublingual tablet"},{"key":"B","text":"Buccal tablet"},{"key":"C","text":"Orally disintegrating tablet"},{"key":"D","text":"Effervescent tablet"}],"correct":"B","explanation":"Buccal tablets are placed between the cheek (buccal mucosa) and gum. They dissolve slowly, allowing drug absorption through the oral mucosa, bypassing first-pass metabolism. Sublingual tablets go under the tongue.","reference":"Tablets"},{"id":"tablets_b3_8","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which route of tablet administration bypasses first-pass hepatic metabolism?","options":[{"key":"A","text":"Oral"},{"key":"B","text":"Sublingual"},{"key":"C","text":"Rectal (some but not all)"},{"key":"D","text":"Both B and C, depending on the formulation"}],"correct":"D","explanation":"Sublingual and buccal routes bypass first-pass metabolism by absorbing directly into the systemic circulation. Rectal administration may partially bypass first-pass metabolism depending on placement (lower rectum).","reference":"Tablets"},{"id":"tablets_b3_9","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What does the abbreviation \"IR\" indicate for a tablet formulation?","options":[{"key":"A","text":"Immediate-release"},{"key":"B","text":"Inhibited-release"},{"key":"C","text":"Intestinal-release"},{"key":"D","text":"Ionic-release"}],"correct":"A","explanation":"IR = Immediate-release, meaning the drug is released promptly after administration (typically within 30-60 minutes). This is the standard release profile for most conventional tablets.","reference":"Tablets"},{"id":"tablets_b3_10","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about effervescent tablets?","options":[{"key":"A","text":"They should be swallowed whole with water"},{"key":"B","text":"They must be dissolved in water before administration"},{"key":"C","text":"They are only available as non-prescription products"},{"key":"D","text":"They are designed for buccal administration"}],"correct":"B","explanation":"Effervescent tablets contain acid (citric/tartaric acid) and bicarbonate that react in water to produce CO\u2082. They must be completely dissolved in water before ingestion to prevent gas-related discomfort.","reference":"Tablets"},{"id":"tablets_b3_11","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"A patient with Parkinson's disease who has difficulty swallowing is prescribed a dopamine agonist. Which dosage forms are available?","options":[{"key":"A","text":"Only oral tablets"},{"key":"B","text":"Oral tablets and transdermal patch"},{"key":"C","text":"Sublingual tablets and intravenous"},{"key":"D","text":"Only intravenous formulations"}],"correct":"B","explanation":"Dopamine agonists are available as oral tablets (pramipexole, ropinirole) and transdermal patches (rotigotine). Patches provide an option for patients with swallowing difficulties.","reference":"Tablets"},{"id":"tablets_b3_12","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"What is the proper instruction for administering a sublingual tablet?","options":[{"key":"A","text":"Place under the tongue and allow to dissolve; do not swallow"},{"key":"B","text":"Chew thoroughly before swallowing"},{"key":"C","text":"Swallow whole with a full glass of water"},{"key":"D","text":"Place between cheek and gum"}],"correct":"A","explanation":"Sublingual tablets (e.g., nitroglycerin) must be placed under the tongue and allowed to dissolve completely. Swallowing the tablet or chewing it prevents sublingual absorption and first-pass bypass.","reference":"Tablets"},{"id":"tablets_b3_13","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"hard","question":"Why are long-acting tablets used rather than immediate-release formulations?","options":[{"key":"A","text":"To achieve a faster onset of action"},{"key":"B","text":"To reduce high \"peaks\" in drug concentration which reduces side effects"},{"key":"C","text":"To increase the total daily dose"},{"key":"D","text":"To allow for once-weekly dosing"}],"correct":"B","explanation":"Long-acting/extended-release formulations reduce peak-to-trough fluctuations, minimizing concentration-dependent side effects while maintaining therapeutic levels. This improves tolerability and adherence.","reference":"Tablets"},{"id":"tablets_b3_15","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"A scored tablet should be split:","options":[{"key":"A","text":"By the patient's fingers"},{"key":"B","text":"Using a tablet splitter for accurate dosing"},{"key":"C","text":"By biting it with teeth"},{"key":"D","text":"By crushing between two spoons"}],"correct":"B","explanation":"A tablet splitter provides the most accurate and consistent splitting of scored tablets. Manual splitting with fingers or biting can result in uneven doses and medication errors.","reference":"Tablets"},{"id":"tablets_b3_16","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which statement about modified-release tablets is correct?","options":[{"key":"A","text":"All modified-release tablets can be split"},{"key":"B","text":"Modified-release tablets should never be crushed or chewed unless specifically indicated"},{"key":"C","text":"Modified-release tablets can be crushed if the patient has difficulty swallowing"},{"key":"D","text":"Modified-release tablets release drug immediately upon ingestion"}],"correct":"B","explanation":"Modified-release tablets (ER, SR, DR) are designed for controlled delivery. Crushing or chewing destroys the release mechanism, potentially causing dose-dumping, toxicity, or therapeutic failure.","reference":"Tablets"},{"id":"tablets_b3_17","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"A patient is taking a metformin extended-release tablet. What important counseling point applies?","options":[{"key":"A","text":"The tablet can be split for dose adjustment"},{"key":"B","text":"The tablet shell may appear in the stool"},{"key":"C","text":"The tablet should be chewed for better absorption"},{"key":"D","text":"The tablet should be taken on an empty stomach"}],"correct":"B","explanation":"ER tablets may have ghost shells","reference":"Tablets"},{"id":"tablets_b3_18","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of buccal tablets compared to sublingual tablets?","options":[{"key":"A","text":"Faster onset of action"},{"key":"B","text":"Placed between gum and cheek"},{"key":"C","text":"Must be swallowed whole"},{"key":"D","text":"Bypasses the GI tract but not first-pass metabolism"}],"correct":"B","explanation":"Buccal tablets are placed between the cheek and gum; sublingual tablets are placed under the tongue. Both provide mucosal absorption and first-pass bypass.","reference":"Tablets"},{"id":"tablets_b3_19","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"What is the maximum BUD for water-containing oral formulations under USP <795> guidelines?","options":[{"key":"A","text":"7 days at room temperature"},{"key":"B","text":"14 days when stored at controlled cold temperature"},{"key":"C","text":"30 days under refrigeration"},{"key":"D","text":"45 days"}],"correct":"B","explanation":"USP <795 > states that water-containing oral formulations have a maximum BUD of 14 days when stored under refrigeration. Room temperature storage is 30 days maximum.","reference":"Tablets"},{"id":"tablets_b3_20","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which tablet type would be MOST appropriate for a patient who has difficulty swallowing and requires rapid drug absorption?","options":[{"key":"A","text":"Extended-release tablet"},{"key":"B","text":"Orally disintegrating tablet (ODT)"},{"key":"C","text":"Effervescent tablet"},{"key":"D","text":"Enteric-coated tablet"}],"correct":"B","explanation":"ODTs dissolve rapidly in the mouth without water and provide rapid absorption through the oral mucosa (or via swallowing after dissolution). They are ideal for patients with dysphagia who need fast onset.","reference":"Tablets"},{"id":"powders_b3_1","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"A bottle containing 2 avoirdupois ounces of phenobarbital is available to manufacture capsules, each containing \u00bc grain of phenobarbital. How many capsules can be manufactured? (1 avoirdupois ounce = 437.5 grains)","options":[{"key":"A","text":"350 capsules"},{"key":"B","text":"771 capsules"},{"key":"C","text":"1750 capsules"},{"key":"D","text":"3500 capsules"}],"correct":"D","explanation":"2 \u00d7 437.5 / 0.25 = 3500","reference":"Medicinal Powders"},{"id":"powders_b3_2","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"How many grams of aspirin should be used to prepare 1.255 kg of a powder containing aspirin 6 parts, phenacetin 3 parts, and caffeine 1 part?","options":[{"key":"A","text":"125 g"},{"key":"B","text":"375 g"},{"key":"C","text":"753 g"},{"key":"D","text":"125.5 g"}],"correct":"C","explanation":"1.255 kg \u00d7 6/10 = 0.753 kg = 753 g of aspirin.","reference":"Medicinal Powders"},{"id":"powders_b3_3","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which sweetener added to some drug formulations causes gas, cramping, and bloating in sensitive patients?","options":[{"key":"A","text":"Sucrose"},{"key":"B","text":"Sorbitol"},{"key":"C","text":"Aspartame"},{"key":"D","text":"Dextrose"}],"correct":"B","explanation":"Sorbitol is a sugar alcohol that is incompletely absorbed in the small intestine. In sensitive patients, it can cause osmotic diarrhea, gas, cramping, and bloating, especially at higher doses.","reference":"Medicinal Powders"},{"id":"powders_b3_4","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which sweetener is dangerous for patients with phenylketonuria (PKU)?","options":[{"key":"A","text":"Sucrose"},{"key":"B","text":"Sorbitol"},{"key":"C","text":"Aspartame"},{"key":"D","text":"Mannitol"}],"correct":"C","explanation":"Aspartame contains phenylalanine, which is toxic to patients with PKU who cannot metabolize this amino acid. All products containing aspartame must include a PKU warning.","reference":"Medicinal Powders"},{"id":"powders_b3_5","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"What is the appropriate counseling point for patients using oral granules or powders that can be mixed with soft food?","options":[{"key":"A","text":"The mixture should be heated for better dissolution"},{"key":"B","text":"The patient should not let the mixture sit for too long before administration"},{"key":"C","text":"The powder can be added to any liquid, including hot coffee"},{"key":"D","text":"The powder should be chewed for faster effect"}],"correct":"B","explanation":"Once mixed with soft food, the drug may begin dissolving or degrading. The mixture should be consumed immediately (typically within 15-30 minutes) to ensure the full dose is administered.","reference":"Medicinal Powders"},{"id":"powders_b3_7","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"What is a eutectic mixture, and what is its relevance in powder formulations?","options":[{"key":"A","text":"A mixture that has a higher melting point than individual components"},{"key":"B","text":"A mixture of components that liquefy when combined, requiring careful formulation"},{"key":"C","text":"A mixture with improved flow properties"},{"key":"D","text":"A mixture that is always hygroscopic"}],"correct":"B","explanation":"Eutectic mixtures form when two or more solids have a combined melting point below room temperature, resulting in liquefaction (e.g., camphor + menthol). This requires addition of absorbents (e.g., magnesium oxide) to maintain powder form.","reference":"Medicinal Powders"},{"id":"powders_b3_8","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"A prescription calls for atropine sulfate 1/200 gr, codeine phosphate \u00bc gr, and aspirin 5 gr, #24 capsules. Atropine sulfate is only available as 1/150 gr tablets. How many atropine sulfate tablets are needed for this prescription?","options":[{"key":"A","text":"3 tablets"},{"key":"B","text":"6 tablets"},{"key":"C","text":"12 tablets"},{"key":"D","text":"18 tablets"}],"correct":"D","explanation":"24 \u00d7 1/200 = 0.12 gr total; 0.12 / (1/150) = 18","reference":"Medicinal Powders"},{"id":"powders_b3_9","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following is a characteristic of powders used for oral administration?","options":[{"key":"A","text":"They are always sterile"},{"key":"B","text":"They must be reconstituted before use"},{"key":"C","text":"They can be mixed with food or liquids for patients with swallowing difficulties"},{"key":"D","text":"They cannot be used for modified-release products"}],"correct":"C","explanation":"Oral powders and granules can be mixed with soft food or liquids for patients who cannot swallow tablets or capsules. This provides flexible administration options while maintaining stability.","reference":"Medicinal Powders"},{"id":"powders_b3_10","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"In non-sterile compounding, what is the default Beyond-Use Date (BUD) for non-aqueous SOLID formulations (e.g., compounded powders) under the revised USP <795>?","options":[{"key":"A","text":"14 days"},{"key":"B","text":"90 days"},{"key":"C","text":"180 days"},{"key":"D","text":"1 year"}],"correct":"C","explanation":"Powders, like other nonaqueous solid dosage forms (water activity aw < 0.6), default to a 180-day BUD under the revised USP <795>, absent applicable stability information or a USP\u2013NF monograph.","reference":"Medicinal Powders"},{"id":"powders_b3_11","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"What is the primary purpose of levigation in powder compounding?","options":[{"key":"A","text":"To increase powder volume"},{"key":"B","text":"To reduce particle size of a powder using a mortar and pestle with a liquid"},{"key":"C","text":"To mix powders of different densities"},{"key":"D","text":"To sterilize the powder"}],"correct":"B","explanation":"Levigation is the process of reducing particle size and dispersing powder in a small amount of liquid (levigating agent) in which the powder is insoluble. This is used in ointment and paste compounding.","reference":"Medicinal Powders"},{"id":"powders_b3_12","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"When compounding powders, geometric dilution is used to:","options":[{"key":"A","text":"Save time"},{"key":"B","text":"Ensure uniform distribution of potent ingredients when mixing unequal amounts"},{"key":"C","text":"Reduce particle size"},{"key":"D","text":"Add color to the powder"}],"correct":"B","explanation":"Geometric dilution ensures uniform distribution of potent drugs by mixing them with equal portions of diluent in stepwise fashion. This prevents concentration gradients in the final mixture.","reference":"Medicinal Powders"},{"id":"powders_b3_13","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which of the following is the most appropriate counseling point for oral powders that require reconstitution?","options":[{"key":"A","text":"Use tap water to reconstitute all powders"},{"key":"B","text":"Discard any unused portion after the recommended BUD"},{"key":"C","text":"The reconstituted product can be stored at room temperature indefinitely"},{"key":"D","text":"Shake vigorously for 5 minutes after reconstitution"}],"correct":"B","explanation":"Reconstituted oral suspensions have limited stability and must be discarded after the manufacturer 's recommended BUD (typically 7-14 days refrigerated). Shaking, not refrigeration alone, ensures uniformity.","reference":"Medicinal Powders"},{"id":"powders_b3_14","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"A powder mixture contains 20% zinc oxide. How many grams of zinc oxide are in 3.5 kg of the powder?","options":[{"key":"A","text":"70 g"},{"key":"B","text":"175 g"},{"key":"C","text":"350 g"},{"key":"D","text":"700 g"}],"correct":"D","explanation":"3,500 g \u00d7 0.20 = 700 g","reference":"Medicinal Powders"},{"id":"powders_b3_15","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"What is the default Beyond-Use Date (BUD) for a non-aqueous ORAL LIQUID formulation under the revised USP <795>?","options":[{"key":"A","text":"14 days"},{"key":"B","text":"90 days"},{"key":"C","text":"180 days"},{"key":"D","text":"1 year"}],"correct":"B","explanation":"Nonaqueous ORAL LIQUIDS (water activity aw < 0.6) are the one exception among nonaqueous dosage forms: they default to a 90-day BUD under the revised USP <795>, versus 180 days for other nonaqueous forms (capsules, tablets, powders, suppositories, etc.).","reference":"Medicinal Powders"},{"id":"powders_b3_16","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following powders requires special handling due to being hygroscopic?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Magnesium stearate"},{"key":"C","text":"Calcium chloride"},{"key":"D","text":"Starch"}],"correct":"C","explanation":"Calcium chloride is highly hygroscopic and deliquescent, absorbing atmospheric moisture to the point of dissolving. It must be stored in tightly closed containers with desiccants.","reference":"Medicinal Powders"},{"id":"powders_b3_17","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"A patient prescribed Singulair granules asks for administration instructions. What is the correct response?","options":[{"key":"A","text":"Swallow the granules whole with a glass of water"},{"key":"B","text":"The granules can be mixed with 5 mL of baby formula or breast milk"},{"key":"C","text":"The granules should be chewed thoroughly"},{"key":"D","text":"The granules can be dissolved in hot tea"}],"correct":"B","explanation":"Montelukast (Singulair) granules should be mixed with 5 mL of soft food at room temperature (applesauce, formula, breast milk) and administered immediately. Do not mix with water or other liquids.","reference":"Medicinal Powders"},{"id":"powders_b3_18","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"What is the function of a diluent in a powder formulation?","options":[{"key":"A","text":"To increase the potency of the drug"},{"key":"B","text":"To increase the bulk of the powder to make it easier to handle and dose"},{"key":"C","text":"To improve the taste of the powder"},{"key":"D","text":"To preserve the powder"}],"correct":"B","explanation":"Diluents (fillers) like lactose, starch, and microcrystalline cellulose add bulk to low-dose drugs, making them practical to measure, handle, and compound into unit doses.","reference":"Medicinal Powders"},{"id":"powders_b3_19","topicId":"powders","topicName":"Medicinal Powders","type":"calc","difficulty":"hard","question":"How many chloramphenicol capsules (250 mg each) are needed to provide 25 mg/kg/day for 7 days for a person weighing 200 lb? (1 kg = 2.2 lb)","options":[{"key":"A","text":"64 capsules"},{"key":"B","text":"90 capsules"},{"key":"C","text":"127 capsules"},{"key":"D","text":"140 capsules"}],"correct":"A","explanation":"200 lb/2.2 = 90.9 kg; 90.9 \u00d7 25 = 2,272.7 mg/day; \u00d7 7 = 15,909 mg; /250 = 63.6 \u2248 64","reference":"Medicinal Powders"},{"id":"powders_b3_20","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which of the following statements about powder flow is true?","options":[{"key":"A","text":"Powders with smaller particles have better flow properties"},{"key":"B","text":"Glidants like colloidal silicon dioxide are added to improve powder flow"},{"key":"C","text":"All powders flow equally well"},{"key":"D","text":"Moisture improves powder flow"}],"correct":"B","explanation":"Glidants (e.g., colloidal silicon dioxide, talc) reduce interparticle friction and improve powder flow by coating particles and reducing surface roughness. Poor flow leads to inconsistent dosing.","reference":"Medicinal Powders"},{"id":"suppositories_b3_1","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the principal advantage of the suppository route of administration?","options":[{"key":"A","text":"It provides the fastest onset of action of all routes"},{"key":"B","text":"It can be used for local and systemic effects, and avoids first-pass metabolism"},{"key":"C","text":"It is the most comfortable route for all patients"},{"key":"D","text":"It ensures 100% bioavailability of all drugs"}],"correct":"B","explanation":"Suppositories provide both local (hemorrhoids, constipation) and systemic (antiemetics, analgesics) effects. Drugs absorbed in the lower rectum partially bypass first-pass metabolism through the portal system.","reference":"Suppositories"},{"id":"suppositories_b3_2","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"At what temperature should suppositories typically be stored?","options":[{"key":"A","text":"Room temperature"},{"key":"B","text":"A cool place such as a refrigerator"},{"key":"C","text":"In the freezer"},{"key":"D","text":"At 37\u00b0C"}],"correct":"B","explanation":"Fatty bases (cocoa butter, Witepsol) melt at body temperature (34-37\u00b0C) and can soften at room temperature. Suppositories should be stored in a cool place, typically refrigerated (2-8\u00b0C), to maintain shape and integrity.","reference":"Suppositories"},{"id":"suppositories_b3_3","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"What is the density factor used in suppository compounding?","options":[{"key":"A","text":"DF = B / (A + C - B)"},{"key":"B","text":"DF = A / (B + C - A)"},{"key":"C","text":"DF = B - A - C"},{"key":"D","text":"DF = A \u00d7 B \u00d7 C"}],"correct":"A","explanation":"where A = weight of suppository blank; B = weight of medication per suppository; C = total weight","reference":"Suppositories"},{"id":"suppositories_b3_4","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which suppository base is a natural fat that melts at body temperature?","options":[{"key":"A","text":"Polyethylene glycol"},{"key":"B","text":"Theobroma oil (cocoa butter)"},{"key":"C","text":"Glycerinated gelatin"},{"key":"D","text":"Propylene glycol"}],"correct":"B","explanation":"Theobroma oil (cocoa butter) is a natural vegetable fat that melts at body temperature (34-35\u00b0C). It is the traditional suppository base but has stability and polymorphism issues.","reference":"Suppositories"},{"id":"suppositories_b3_5","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is NOT a quality control test for suppositories?","options":[{"key":"A","text":"Melting range test"},{"key":"B","text":"Hardness test"},{"key":"C","text":"Disintegration test"},{"key":"D","text":"Breaking test"}],"correct":"C","explanation":"Dissolution and melting are tested; disintegration is not standard","reference":"Suppositories"},{"id":"suppositories_b3_6","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Polyethylene glycol (PEG) suppository bases differ from fatty bases in that they:","options":[{"key":"A","text":"Must be stored in the freezer"},{"key":"B","text":"Are water-soluble and do not require refrigeration"},{"key":"C","text":"Melt at body temperature"},{"key":"D","text":"Are only suitable for adult patients"}],"correct":"B","explanation":"PEG bases are water-soluble and dissolve in mucosal fluids. They do not melt at body temperature and do not require refrigeration, making them more stable and easier to store than fatty bases.","reference":"Suppositories"},{"id":"suppositories_b3_7","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"A patient experiences local rectal irritation after using a suppository. What is a potential cause?","options":[{"key":"A","text":"The drug is working correctly"},{"key":"B","text":"The base may be irritating, or the patient may be sensitive to an ingredient"},{"key":"C","text":"The suppository was stored correctly"},{"key":"D","text":"The suppository melted too quickly"}],"correct":"B","explanation":"Rectal irritation can result from the base itself (especially PEG), the active drug, or preservatives. Patients with sensitive rectal mucosa may experience burning, stinging, or discomfort.","reference":"Suppositories"},{"id":"suppositories_b3_8","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the purpose of the melting range test for suppositories?","options":[{"key":"A","text":"To ensure the suppository dissolves in water"},{"key":"B","text":"To ensure the suppository melts at or near body temperature for proper drug release"},{"key":"C","text":"To determine the shelf-life of the product"},{"key":"D","text":"To measure the hardness of the suppository"}],"correct":"B","explanation":"The melting range test ensures the suppository base melts at body temperature (34-37\u00b0C) for proper drug release. If the melting point is too high or too low, drug release and efficacy are compromised.","reference":"Suppositories"},{"id":"suppositories_b3_9","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following drugs is commonly available as a rectal suppository?","options":[{"key":"A","text":"Amoxicillin"},{"key":"B","text":"Acetaminophen"},{"key":"C","text":"Lisinopril"},{"key":"D","text":"Metformin"}],"correct":"B","explanation":"Acetaminophen is commonly available as a rectal suppository (e.g., FeverAll) for patients who cannot take oral medications due to nausea, vomiting, or NPO status.","reference":"Suppositories"},{"id":"suppositories_b3_10","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"In a hospital setting, what is the appropriate counseling point for a patient receiving a suppository?","options":[{"key":"A","text":"Insert the suppository immediately after removal from the refrigerator"},{"key":"B","text":"If the suppository is too soft, it should be chilled before insertion"},{"key":"C","text":"The suppository should be chewed for faster effect"},{"key":"D","text":"The suppository should be stored at room temperature after compounding"}],"correct":"B","explanation":"Suppositories that are too soft (due to warming) should be chilled in the refrigerator briefly before insertion. This firms them up for easier insertion without melting.","reference":"Suppositories"},{"id":"suppositories_b3_11","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about glycerinated gelatin suppositories?","options":[{"key":"A","text":"They are used for systemic drug delivery only"},{"key":"B","text":"They are water-soluble and release drug through slow dissolution"},{"key":"C","text":"They melt quickly at body temperature"},{"key":"D","text":"They must be stored in the freezer"}],"correct":"B","explanation":"Glycerinated gelatin bases are water-soluble and dissolve slowly in body fluids, providing prolonged drug release. They are primarily used for vaginal suppositories (pessaries).","reference":"Suppositories"},{"id":"suppositories_b3_12","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Why is theobroma oil less commonly used today compared to other bases?","options":[{"key":"A","text":"It is too expensive"},{"key":"B","text":"It is not approved by the FDA"},{"key":"C","text":"It has poor stability, tends to become brittle, and can adhere to molds"},{"key":"D","text":"It causes more irritation than other bases"}],"correct":"C","explanation":"Theobroma oil exhibits polymorphism, becoming brittle or soft if overheated. It also adheres to molds and can become rancid. These stability issues have led to the development of more reliable bases.","reference":"Suppositories"},{"id":"suppositories_b3_13","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement is correct about the absorption of drugs from suppositories?","options":[{"key":"A","text":"All drugs are equally absorbed from suppositories"},{"key":"B","text":"The lower two-thirds of the rectum drains into the systemic circulation, avoiding first-pass metabolism for some drugs"},{"key":"C","text":"Suppository administration always results in 100% bioavailability"},{"key":"D","text":"First-pass metabolism is completely unavoidable with suppositories"}],"correct":"B","explanation":"The inferior and middle hemorrhoidal veins drain into the systemic circulation (inferior vena cava), bypassing the portal system. This allows partial avoidance of first-pass metabolism.","reference":"Suppositories"},{"id":"suppositories_b3_14","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"The liquefaction or softening time test for suppositories is used to determine:","options":[{"key":"A","text":"The drug content"},{"key":"B","text":"How quickly the suppository will soften after insertion"},{"key":"C","text":"The weight variation of the product"},{"key":"D","text":"The color uniformity"}],"correct":"B","explanation":"The liquefaction/softening time test measures how long it takes for the suppository to soften or melt at body temperature. This predicts drug release characteristics in vivo.","reference":"Suppositories"},{"id":"suppositories_b3_15","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the appropriate response if a patient cannot retain a suppository?","options":[{"key":"A","text":"Insert the suppository deeper into the rectum"},{"key":"B","text":"Advise the patient to lie down for at least 15 minutes after insertion"},{"key":"C","text":"Tell the patient to use half the suppository"},{"key":"D","text":"Advise the patient to insert the suppository while standing"}],"correct":"B","explanation":"Lying down for 15-30 minutes after insertion allows the suppository to melt and reduces the urge to expel it. The patient should be advised to avoid immediate defecation.","reference":"Suppositories"},{"id":"suppositories_b3_16","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the primary reason for using suppositories in pediatric patients?","options":[{"key":"A","text":"Better taste than oral medications"},{"key":"B","text":"An alternative when oral administration is not tolerated (e.g., vomiting)"},{"key":"C","text":"Faster absorption than intravenous"},{"key":"D","text":"Lower cost than oral medications"}],"correct":"B","explanation":"Suppositories are valuable in pediatric patients who are vomiting, unable to swallow, or need to avoid oral medications (e.g., post-operative patients). They provide a reliable alternative route.","reference":"Suppositories"},{"id":"suppositories_b3_17","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which suppository base is most likely to be compatible with water-soluble drugs?","options":[{"key":"A","text":"Theobroma oil"},{"key":"B","text":"Cocoa butter"},{"key":"C","text":"PEG base"},{"key":"D","text":"Hydrogenated vegetable oil"}],"correct":"C","explanation":"PEG bases are water-soluble and compatible with water-soluble drugs. Fatty bases (cocoa butter, Witepsol) are better suited for lipophilic drugs. Water-soluble drugs may not release well from fatty bases.","reference":"Suppositories"},{"id":"suppositories_b3_18","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"A patient with AIDS wasting syndrome may benefit from which suppository formulation?","options":[{"key":"A","text":"Prochlorperazine suppository for nausea"},{"key":"B","text":"Amoxicillin suppository"},{"key":"C","text":"Metformin suppository"},{"key":"D","text":"Losartan suppository"}],"correct":"A","explanation":"antiemetic suppositories may be used when oral administration is not possible","reference":"Suppositories"},{"id":"suppositories_b3_19","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the ideal melting point for a suppository base?","options":[{"key":"A","text":"30\u00b0C"},{"key":"B","text":"37\u00b0C (body temperature)"},{"key":"C","text":"40\u00b0C"},{"key":"D","text":"25\u00b0C"}],"correct":"B","explanation":"The ideal melting point is body temperature (37\u00b0C) to ensure melting and drug release upon insertion. A range of 34-37\u00b0C is acceptable to account for individual variation.","reference":"Suppositories"},{"id":"suppositories_b3_20","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which of the following is the correct procedure for compounding suppositories using the fusion method?","options":[{"key":"A","text":"Grind the active ingredient, melt the base, mix, pour into molds, and cool"},{"key":"B","text":"Mix all ingredients at room temperature and pour into molds"},{"key":"C","text":"Grind all dry ingredients together and compress into suppositories"},{"key":"D","text":"Dissolve active ingredient in water and freeze"}],"correct":"A","explanation":"The fusion method involves: (1) grinding the active ingredient to fine powder, (2) melting the base gently (avoiding overheating), (3) mixing the drug into the molten base, (4) pouring into pre-lubricated molds, and (5) cooling to solidify.","reference":"Suppositories"},{"id":"aqueous_solutions_b3_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about aqueous solutions?","options":[{"key":"A","text":"They are sterile preparations"},{"key":"B","text":"They consist of one or more drugs dissolved in water"},{"key":"C","text":"They require shaking before administration"},{"key":"D","text":"They are always clear and colorless"}],"correct":"B","explanation":"Aqueous solutions are homogeneous, single-phase systems where the drug is completely dissolved in water. They are clear (not necessarily colorless), and do not require shaking like suspensions.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Ophthalmic dosage forms must be sterile. Which other route does NOT require sterile dosage forms?","options":[{"key":"A","text":"Otic"},{"key":"B","text":"Ophthalmic"},{"key":"C","text":"Injectable"},{"key":"D","text":"Intravenous"}],"correct":"A","explanation":"Topical applications to epithelial surfaces do not require sterility","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"Which of the following is the most important consideration when preparing an aqueous solution for oral administration?","options":[{"key":"A","text":"Color of the final solution"},{"key":"B","text":"Stability of the drug in water"},{"key":"C","text":"Viscosity of the solution"},{"key":"D","text":"Taste of the solution"}],"correct":"B","explanation":"The chemical stability of the drug in aqueous solution is the most critical consideration. Hydrolysis, oxidation, and pH-dependent degradation can significantly affect shelf-life and potency.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"What is the BUD for water-containing oral formulations when stored at controlled cold temperature according to USP <795>?","options":[{"key":"A","text":"7 days"},{"key":"B","text":"14 days"},{"key":"C","text":"30 days"},{"key":"D","text":"45 days"}],"correct":"B","explanation":"USP <795 > specifies that water-containing oral formulations have a maximum BUD of 14 days when stored under refrigeration (2-8\u00b0C). This limits microbial growth and chemical degradation.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which preservative is commonly used in aqueous solutions to prevent microbial growth?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Methylparaben"},{"key":"C","text":"Sodium starch glycolate"},{"key":"D","text":"Povidone"}],"correct":"B","explanation":"Methylparaben (and propylparaben) are common antimicrobial preservatives in aqueous solutions. They are effective against bacteria and fungi, especially in combination (parabens).","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"An aqueous solution containing a drug with limited water solubility requires:","options":[{"key":"A","text":"The addition of a solubilizing agent or cosolvent"},{"key":"B","text":"Heating to a higher temperature"},{"key":"C","text":"Refrigeration only"},{"key":"D","text":"A higher concentration of drug"}],"correct":"A","explanation":"Poorly water-soluble drugs require solubilizing agents (surfactants), cosolvents (ethanol, propylene glycol, glycerin), or pH adjustment to achieve adequate solubility in aqueous solution.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is a common concern when preparing oral aqueous solutions?","options":[{"key":"A","text":"Microbial contamination"},{"key":"B","text":"Incompatibility with the container"},{"key":"C","text":"Chemical degradation of the active ingredient"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"All are concerns: microbial contamination (requires preservatives), incompatibility with the container (leaching, adsorption), and chemical degradation (hydrolysis, oxidation).","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"medium","question":"What is the primary advantage of using purified water in pharmaceutical compounding?","options":[{"key":"A","text":"It contains essential minerals for stability"},{"key":"B","text":"It is free from ions and other contaminants that could affect drug stability"},{"key":"C","text":"It has a longer shelf-life than tap water"},{"key":"D","text":"It is less expensive than other water sources"}],"correct":"B","explanation":"Purified water USP is free from ions, heavy metals, and other contaminants that could catalyze degradation or interact with drugs. This ensures product stability and safety.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_9","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following drugs is most susceptible to hydrolysis in aqueous solution?","options":[{"key":"A","text":"Aspirin"},{"key":"B","text":"Sodium chloride"},{"key":"C","text":"Dextrose"},{"key":"D","text":"Potassium chloride"}],"correct":"A","explanation":"Aspirin (acetylsalicylic acid) is highly susceptible to hydrolysis, breaking down into salicylic acid and acetic acid. This reaction is pH-dependent and accelerated by moisture and heat.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_10","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"hard","question":"A patient is prescribed an oral aqueous solution of an antibiotic that requires refrigeration. What should the patient be counseled?","options":[{"key":"A","text":"The solution can be left at room temperature for up to 1 week"},{"key":"B","text":"The solution should be stored in the refrigerator and discarded after the BUD"},{"key":"C","text":"The solution should be frozen for long-term storage"},{"key":"D","text":"The solution does not require any special storage"}],"correct":"B","explanation":"Antibiotic solutions (especially reconstituted suspensions) have limited stability and must be refrigerated. Patients should be counseled to discard unused portions after the manufacturer 's BUD (typically 7-14 days).","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_11","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following excipients is used as a buffer in aqueous solutions?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Sodium citrate"},{"key":"C","text":"Sucrose"},{"key":"D","text":"Propylene glycol"}],"correct":"B","explanation":"Sodium citrate is a buffering agent that maintains pH stability in aqueous solutions. Buffers resist pH changes from drug degradation, CO\u2082 absorption, or other factors.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_12","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"What is the purpose of adding a chelating agent (e.g., EDTA) to an aqueous solution?","options":[{"key":"A","text":"To enhance drug solubility"},{"key":"B","text":"To bind metal ions that could catalyze drug degradation"},{"key":"C","text":"To improve the taste"},{"key":"D","text":"To increase the viscosity"}],"correct":"B","explanation":"EDTA (edetate disodium) chelates metal ions (iron, copper, etc.) that catalyze oxidation reactions. This stabilizes oxidation-sensitive drugs by removing catalytic metals.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_13","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following is TRUE about syrups compared to simple aqueous solutions?","options":[{"key":"A","text":"Syrups have no preservatives"},{"key":"B","text":"Syrups contain high concentrations of sugar, which provides some preservative effect"},{"key":"C","text":"Syrups are not aqueous solutions"},{"key":"D","text":"Syrups cannot be used for pediatric patients"}],"correct":"B","explanation":"Syrups contain 64-66% sucrose, which creates a high osmotic pressure that inhibits microbial growth. This provides a natural preservative effect (though additional preservatives may be used).","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_14","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"The pH of an aqueous solution is important because it affects:","options":[{"key":"A","text":"Drug solubility and stability"},{"key":"B","text":"Color of the solution only"},{"key":"C","text":"Viscosity only"},{"key":"D","text":"Container compatibility only"}],"correct":"A","explanation":"pH significantly affects the solubility (ionization) and stability (hydrolysis, oxidation) of drugs in aqueous solution. Maintaining optimal pH is critical for product quality.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b3_15","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which of the following factors does NOT affect the stability of an aqueous solution?","options":[{"ke
