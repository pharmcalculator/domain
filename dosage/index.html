le quickly but form a loose sediment that redisperses easily.","reference":"Suspensions"},{"id":"suspensions_b5_4","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"Which material is least likely to function as a suspending agent?","options":[{"key":"A","text":"Sodium carboxymethylcellulose"},{"key":"B","text":"Xanthan gum"},{"key":"C","text":"Bentonite"},{"key":"D","text":"Tragacanth"},{"key":"E","text":"Light mineral oil"}],"correct":"E","explanation":"CMC sodium, xanthan gum, bentonite and tragacanth are viscosity-building suspending agents; light mineral oil is not.","reference":"Suspensions"},{"id":"suspensions_b5_5","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"Dry powders intended for reconstitution as oral suspensions are especially common for:","options":[{"key":"A","text":"Oral antibiotics"},{"key":"B","text":"Transdermal drugs"},{"key":"C","text":"Intravenous anesthetics"},{"key":"D","text":"Ophthalmic anesthetics"},{"key":"E","text":"Rectal antiemetics"}],"correct":"A","explanation":"Many oral antibiotics are unstable in water, so they are supplied as dry powders to be reconstituted as oral suspensions.","reference":"Suspensions"},{"id":"suspensions_b5_6","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which excipient is primarily a suspending agent rather than a wetting agent for hydrophobic powders?","options":[{"key":"A","text":"Glycerin"},{"key":"B","text":"Propylene glycol"},{"key":"C","text":"Ethanol"},{"key":"D","text":"Methylcellulose"},{"key":"E","text":"Polysorbate 80"}],"correct":"D","explanation":"Methylcellulose raises viscosity and acts as a suspending agent. Glycerin, propylene glycol, ethanol and polysorbate 80 are used to wet hydrophobic powders.","reference":"Suspensions"},{"id":"suspensions_b5_7","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A pharmacist reconstitutes a dry powder to 100 mL, yielding an amoxicillin suspension containing 250 mg per 5 mL. How many grams of amoxicillin are present in the final reconstituted suspension?","options":[{"key":"A","text":"1.25 g"},{"key":"B","text":"2.50 g"},{"key":"C","text":"3.75 g"},{"key":"D","text":"5.00 g"},{"key":"E","text":"10.0 g"}],"correct":"D","explanation":"250 mg per 5 mL x 100 mL = 5,000 mg = 5.00 g amoxicillin.","reference":"Suspensions"},{"id":"suspensions_b5_8","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"easy","question":"A child is prescribed amoxicillin 400 mg orally every 12 hours for 10 days. The pharmacy dispenses amoxicillin suspension 400 mg/5 mL. What total volume should be dispensed?","options":[{"key":"A","text":"50 mL"},{"key":"B","text":"75 mL"},{"key":"C","text":"100 mL"},{"key":"D","text":"125 mL"},{"key":"E","text":"200 mL"}],"correct":"C","explanation":"Each dose is 5 mL. The patient receives 2 doses/day for 10 days: 5 mL x 2 x 10 = 100 mL.","reference":"Suspensions"},{"id":"suspensions_b5_9","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"A pharmacist reconstitutes a powder for oral suspension. Which instruction is most important to include on the dispensing label when appropriate for that product?","options":[{"key":"A","text":"\u201cTake on an empty stomach only.\u201d"},{"key":"B","text":"\u201cShake well before each use.\u201d"},{"key":"C","text":"\u201cDo not refrigerate under any circumstances.\u201d"},{"key":"D","text":"\u201cDo not measure with an oral syringe.\u201d"},{"key":"E","text":"\u201cStore in the freezer after opening.\u201d"}],"correct":"B","explanation":"Suspensions can settle during storage, so shaking is essential to promote dose uniformity. Labeling should also include storage conditions and the beyond-use date after reconstitution.","reference":"Suspensions"},{"id":"suspensions_b6_1","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"medium","question":"A child is prescribed azithromycin suspension, 200 mg/5 mL. The dose is 300 mg orally once daily for 3 days. What volume should be administered per dose?","options":[{"key":"A","text":"5 mL"},{"key":"B","text":"6 mL"},{"key":"C","text":"7.5 mL"},{"key":"D","text":"10 mL"},{"key":"E","text":"15 mL"}],"correct":"C","explanation":"300 mg / 200 mg x 5 mL = 7.5 mL per dose.","reference":"Suspensions"},{"id":"suspensions_b6_2","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"Which counseling point is most important when dispensing a reconstituted oral antibiotic suspension?","options":[{"key":"A","text":"Keep the bottle uncapped after each dose to prevent pressure buildup."},{"key":"B","text":"Shake well before each dose."},{"key":"C","text":"Always freeze the suspension after the first dose."},{"key":"D","text":"Use a household teaspoon to measure doses."},{"key":"E","text":"Discard the bottle after each administration."}],"correct":"B","explanation":"Suspensions settle, so shaking before each dose ensures uniform dosing. Also use an oral syringe or dosing device, not a household spoon.","reference":"Suspensions"},{"id":"suspensions_b6_3","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which statement correctly distinguishes an oral solution from an oral suspension?","options":[{"key":"A","text":"A solution always requires shaking before use."},{"key":"B","text":"A suspension contains a drug dissolved at the molecular level."},{"key":"C","text":"A solution contains drug particles dispersed but not dissolved."},{"key":"D","text":"A suspension may require shaking to redistribute settled drug particles."},{"key":"E","text":"A solution cannot contain flavoring agents or preservatives."}],"correct":"D","explanation":"A solution is homogeneous and does not need shaking. A suspension contains undissolved particles that settle and must be redispersed.","reference":"Suspensions"},{"id":"suspensions_b6_4","topicId":"suspensions","topicName":"Suspensions","type":"calc","difficulty":"easy","question":"A dry powder for oral suspension contains sufficient drug to yield 100 mL after reconstitution. The final concentration is 250 mg/5 mL. How many grams of drug are in the bottle after reconstitution?","options":[{"key":"A","text":"1.25 g"},{"key":"B","text":"2.50 g"},{"key":"C","text":"5.00 g"},{"key":"D","text":"7.50 g"},{"key":"E","text":"10.0 g"}],"correct":"C","explanation":"250 mg per 5 mL x 100 mL = 5,000 mg = 5.00 g.","reference":"Suspensions"},{"id":"suspensions_b6_5","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which instruction improves delivery from a metered-dose inhaler (MDI)?","options":[{"key":"A","text":"Inhale rapidly before actuating the inhaler."},{"key":"B","text":"Actuate the inhaler after finishing the inhalation."},{"key":"C","text":"Begin a slow, deep inhalation while actuating the device."},{"key":"D","text":"Exhale directly into the mouthpiece immediately before and after actuation."},{"key":"E","text":"Skip breath-holding after inhalation."}],"correct":"C","explanation":"Begin a slow, deep inhalation as the MDI is actuated, then hold the breath for about 10 seconds to improve lung deposition.","reference":"Suspensions"},{"id":"suspensions_b6_6","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"easy","question":"A patient uses fluticasone propionate by oral inhalation. Which counseling recommendation reduces the risk of oropharyngeal candidiasis?","options":[{"key":"A","text":"Take the inhaler with a high-fat meal."},{"key":"B","text":"Rinse the mouth and spit after use."},{"key":"C","text":"Use the inhaler only when experiencing acute bronchospasm."},{"key":"D","text":"Store the inhaler in a freezer."},{"key":"E","text":"Swallow water immediately after each inhalation."}],"correct":"B","explanation":"Rinsing the mouth and spitting after inhaled corticosteroid use reduces oropharyngeal candidiasis.","reference":"Suspensions"},{"id":"suspensions_b6_7","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"Which is the most appropriate instruction for a corticosteroid nasal spray?","options":[{"key":"A","text":"Aim the nozzle toward the nasal septum."},{"key":"B","text":"Aim the nozzle slightly away from the nasal septum."},{"key":"C","text":"Sniff forcefully after spraying to ensure drug reaches the lungs."},{"key":"D","text":"Share the device with household members if cleaned between uses."},{"key":"E","text":"Use only after placing the head fully backward."}],"correct":"B","explanation":"Aim the nozzle slightly away from the septum (toward the outer wall of the nostril) to reduce irritation and nosebleeds, and do not sniff forcefully.","reference":"Suspensions"},{"id":"suspensions_b6_8","topicId":"suspensions","topicName":"Suspensions","type":"mcq","difficulty":"medium","question":"A patient needs rapid relief of acute bronchospasm but has difficulty coordinating use of a standard MDI. Which dosage form or device may improve drug delivery if the medication is appropriate?","options":[{"key":"A","text":"Enteric-coated tablet"},{"key":"B","text":"Transdermal patch"},{"key":"C","text":"Metered-dose inhaler with a valved holding chamber"},{"key":"D","text":"Delayed-release capsule"},{"key":"E","text":"Rectal suppository"}],"correct":"C","explanation":"A valved holding chamber (spacer) helps patients who cannot coordinate MDI actuation with inhalation.","reference":"Suspensions"},{"id":"emulsions_addcalc_1","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"An emulsion contains 30 mL oil and 70 mL water. What is the internal phase volume fraction (\u03d5) if oil is the internal phase?","options":[],"correct":"","explanation":"Total volume = 30 + 70 = 100 mL. \u03d5 = 30 / 100 = 0.30.","finalAnswer":"Total volume = 30 + 70 = 100 mL. \u03d5 = 30 / 100 = 0.30.","reference":"Emulsions"},{"id":"emulsions_addcalc_2","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"An emulsion has 40 mL internal phase and 160 mL total volume. What is the % internal phase by volume?","options":[],"correct":"","explanation":"% = (40 / 160) \u00d7 100 = 25%.","finalAnswer":"% = (40 / 160) \u00d7 100 = 25%.","reference":"Emulsions"},{"id":"emulsions_addcalc_3","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"You need an emulsifier blend with HLB 10. You have Surf A (HLB 15) and Surf B (HLB 5). What ratio (A:B) by weight will give HLB 10?","options":[],"correct":"","explanation":"Let fraction of A = x. HLB_blend = 15x + 5(1\u2212x) = 10 \u2192 15x + 5 \u2212 5x = 10 \u2192 10x = 5 \u2192 x = 0.5. Ratio A:B = 0.5:0.5 = 1:1.","finalAnswer":"Let fraction of A = x. HLB_blend = 15x + 5(1\u2212x) = 10 \u2192 15x + 5 \u2212 5x = 10 \u2192 10x = 5 \u2192 x = 0.5. Ratio A:B = 0.5:0.5 = 1:1.","reference":"Emulsions"},{"id":"emulsions_addcalc_4","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"An emulsifier blend contains 3 g of Surf X (HLB 12) and 2 g of Surf Y (HLB 4). What is the HLB of the blend?","options":[],"correct":"","explanation":"HLB_blend = (3\u00d712 + 2\u00d74) / (3+2) = (36 + 8) / 5 = 44 / 5 = 8.8.","finalAnswer":"HLB_blend = (3\u00d712 + 2\u00d74) / (3+2) = (36 + 8) / 5 = 44 / 5 = 8.8.","reference":"Emulsions"},{"id":"emulsions_addcalc_5","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"A formulator needs 10 g total emulsifier with HLB 9 using Surf P (HLB 13) and Surf Q (HLB 7). How many grams of each are required?","options":[],"correct":"","explanation":"Let x = g of P. Then (10\u2212x) = g of Q. 13x + 7(10\u2212x) = 9\u00d710 \u2192 13x + 70 \u2212 7x = 90 \u2192 6x = 20 \u2192 x \u2248 3.33 g P; Q = 6.67 g.","finalAnswer":"Let x = g of P. Then (10\u2212x) = g of Q. 13x + 7(10\u2212x) = 9\u00d710 \u2192 13x + 70 \u2212 7x = 90 \u2192 6x = 20 \u2192 x \u2248 3.33 g P; Q = 6.67 g.","reference":"Emulsions"},{"id":"emulsions_addcalc_6","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"As the internal phase volume increases beyond ~74%, what phenomenon is likely in an O/W emulsion, and why?","options":[],"correct":"","explanation":"Phase inversion or coalescence is likely. Beyond ~74% (maximum packing for spheres), the internal phase cannot be accommodated, destabilizing the O/W structure.","finalAnswer":"Phase inversion or coalescence is likely. Beyond ~74% (maximum packing for spheres), the internal phase cannot be accommodated, destabilizing the O/W structure.","reference":"Emulsions"},{"id":"emulsions_addcalc_7","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"An emulsifier blend has an HLB of 4. Is it more suitable for an O/W or W/O emulsion? Explain briefly.","options":[],"correct":"","explanation":"W/O. Low HLB (3--6) favors water-in-oil emulsions; high HLB (8--18) favors oil-in-water.","finalAnswer":"W/O. Low HLB (3--6) favors water-in-oil emulsions; high HLB (8--18) favors oil-in-water.","reference":"Emulsions"},{"id":"emulsions_addcalc_8","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"hard","question":"An emulsion contains 25 g oil (density 0.9 g/mL) and 75 g water (density 1.0 g/mL). If oil is the internal phase, what is \u03d5 (internal phase volume / total volume)?","options":[],"correct":"","explanation":"Oil volume = 25 g / 0.9 g/mL \u2248 27.78 mL. Water volume = 75 g / 1.0 g/mL = 75 mL. Total = 102.78 mL. \u03d5 = 27.78 / 102.78 \u2248 0.27.","finalAnswer":"Oil volume = 25 g / 0.9 g/mL \u2248 27.78 mL. Water volume = 75 g / 1.0 g/mL = 75 mL. Total = 102.78 mL. \u03d5 = 27.78 / 102.78 \u2248 0.27.","reference":"Emulsions"},{"id":"emulsions_addcalc_9","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"medium","question":"Two O/W emulsions have internal phase volume fractions of 0.3 and 0.6. Which is more prone to creaming, and why?","options":[],"correct":"","explanation":"\u03d5 = 0.3 is more prone to creaming. Lower internal phase volume allows faster droplet movement upward; higher \u03d5 increases viscosity and reduces creaming.","finalAnswer":"\u03d5 = 0.3 is more prone to creaming. Lower internal phase volume allows faster droplet movement upward; higher \u03d5 increases viscosity and reduces creaming.","reference":"Emulsions"},{"id":"emulsions_addcalc_10","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"hard","question":"You are compounding 100 g of an O/W emulsion with 20% internal oil phase (by weight; oil density 0.9 g/mL). You plan to use 5% total emulsifier (by total weight) with a target HLB of 11 using Surf M (HLB 16) and Surf N (HLB 8). Calculate: (a) grams of oil, (b) grams of each surfactant.","options":[],"correct":"","explanation":"(a) Oil = 20% of 100 g = 20 g. (b) Total emulsifier = 5 g. Let x = g of M. 16x + 8(5\u2212x) = 11\u00d75 \u2192 16x + 40 \u2212 8x = 55 \u2192 8x = 15 \u2192 x = 1.875 g M; N = 3.125 g.","finalAnswer":"(a) Oil = 20% of 100 g = 20 g. (b) Total emulsifier = 5 g. Let x = g of M. 16x + 8(5\u2212x) = 11\u00d75 \u2192 16x + 40 \u2212 8x = 55 \u2192 8x = 15 \u2192 x = 1.875 g M; N = 3.125 g.","reference":"Emulsions"},{"id":"emulsions_b5_1","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"Which emulsifier is primarily mineral-derived rather than plant- or animal-derived?","options":[{"key":"A","text":"Acacia"},{"key":"B","text":"Pectin"},{"key":"C","text":"Gelatin"},{"key":"D","text":"Casein"},{"key":"E","text":"Bentonite"}],"correct":"E","explanation":"Bentonite is a clay (hydrated aluminum silicate) and mineral-derived. Acacia and pectin are plant-derived; gelatin and casein are animal-derived.","reference":"Emulsions"},{"id":"emulsions_b5_2","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"Which term does not normally describe an emulsion instability or emulsion type?","options":[{"key":"A","text":"Creaming"},{"key":"B","text":"Coalescence"},{"key":"C","text":"Breaking"},{"key":"D","text":"Water-in-oil"},{"key":"E","text":"Flocculation volume"}],"correct":"E","explanation":"Flocculation volume describes suspension sedimentation, not emulsion instability or type. Creaming, coalescence and breaking are instabilities; water-in-oil is an emulsion type.","reference":"Emulsions"},{"id":"emulsions_b5_3","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"medium","question":"A surfactant with which HLB range is generally most suitable for forming an oil-in-water emulsion?","options":[{"key":"A","text":"1\u20133"},{"key":"B","text":"3\u20136"},{"key":"C","text":"7\u20139"},{"key":"D","text":"8\u201318"},{"key":"E","text":"19\u201325 only"}],"correct":"D","explanation":"Surfactants with HLB of about 8-18 favor oil-in-water emulsions; HLB 3-6 favors water-in-oil.","reference":"Emulsions"},{"id":"emulsions_b5_4","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"The English method of emulsion preparation is also called the:","options":[{"key":"A","text":"Dry-gum method"},{"key":"B","text":"Wet-gum method"},{"key":"C","text":"Bottle method"},{"key":"D","text":"Beaker method"},{"key":"E","text":"Phase-inversion temperature method"}],"correct":"B","explanation":"The English method is the wet-gum method (oil added to a preformed gum mucilage); the dry-gum method is the Continental method.","reference":"Emulsions"},{"id":"emulsions_b5_5","topicId":"emulsions","topicName":"Emulsions","type":"mcq","difficulty":"easy","question":"Which of the following is a hydrophilic gum emulsifying agent?","options":[{"key":"A","text":"Acacia"},{"key":"B","text":"Span 80"},{"key":"C","text":"Sorbitan monostearate"},{"key":"D","text":"Cetyl alcohol"},{"key":"E","text":"Glyceryl monostearate"}],"correct":"A","explanation":"Acacia is a hydrophilic gum emulsifier. Span 80, sorbitan monostearate, cetyl alcohol and glyceryl monostearate are lipophilic.","reference":"Emulsions"},{"id":"emulsions_b5_6","topicId":"emulsions","topicName":"Emulsions","type":"calc","difficulty":"hard","question":"Calculate the required HLB of an oil phase composed of 30 g mineral oil (required HLB = 10) and 20 g isopropyl myristate (required HLB = 11.5).","options":[{"key":"A","text":"9.4"},{"key":"B","text":"10.0"},{"key":"C","text":"10.6"},{"key":"D","text":"11.5"},{"key":"E","text":"21.5"}],"correct":"C","explanation":"Required HLB of the blend = (30 x 10 + 20 x 11.5) / 50 = 530 / 50 = 10.6.","reference":"Emulsions"}];
</script>
<script>
/* ============================================================
   Dosage Forms & NAPLEX Question Bank — Self-Assessment App
   Vanilla JS, single-file friendly, localStorage persistence.
   ============================================================ */
(function () {
  "use strict";

  /* ---------------- Question Bank Data ---------------- */
  // QUESTIONS_DATA is injected below (see build step) as a JSON array.
  var QUESTIONS = window.__QUESTIONS__ || [];

  var TOPIC_META = {
    ointments:              { name: "Ointments & Semisolids",        color: "amber",  cssVar: "--amber"  },
    capsules:               { name: "Capsules",                      color: "teal",   cssVar: "--teal"   },
    tablets:                { name: "Tablets",                       color: "sage",   cssVar: "--sage"   },
    powders:                { name: "Medicinal Powders",             color: "clay",   cssVar: "--clay"   },
    suppositories:          { name: "Suppositories",                 color: "plum",   cssVar: "--plum"   },
    aqueous_solutions:      { name: "Aqueous Solutions",             color: "azure",  cssVar: "--azure"  },
    non_aqueous_solutions:  { name: "Non-Aqueous Solutions",         color: "ochre",  cssVar: "--ochre"  },
    colloids:               { name: "Colloids",                      color: "rose",   cssVar: "--rose"   },
    suspensions:            { name: "Suspensions",                   color: "moss",   cssVar: "--moss"   },
    emulsions:              { name: "Emulsions",                     color: "coral",  cssVar: "--coral"  },
    sterile_forms:          { name: "Sterile Dosage Forms",          color: "indigo", cssVar: "--indigo" },
    modified_release:       { name: "Modified-Release Dosage Forms", color: "slate",  cssVar: "--slate"  }
  };
  var TOPIC_ORDER = ["ointments","capsules","tablets","powders","suppositories",
    "aqueous_solutions","non_aqueous_solutions","colloids","suspensions","emulsions",
    "sterile_forms","modified_release"];
  var DIFFICULTIES = ["easy","medium","hard"];
  var TYPE_LABELS = {
    mcq: "Multiple Choice",
    sata: "Select All That Apply",
    ordered: "Ordered Response",
    case: "Case-Based",
    image: "Image-Based",
    calc: "Calculation"
  };

  /* ---------------- Persistent State ---------------- */
  var STORAGE_KEY = "naplex_qbank_state_v1";

  function defaultState() {
    return { attempts: [], qstats: {} };
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed.attempts) parsed.attempts = [];
      if (!parsed.qstats) parsed.qstats = {};
      return parsed;
    } catch (e) { return defaultState(); }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* storage unavailable; fail silently */ }
  }

  var state = loadState();

  /* ---------------- Runtime (non-persisted) ---------------- */
  var route = "dashboard";
  var QTYPES = ["mcq","case","calc"];
  var setupConfig = {
    mode: "practice",
    topics: TOPIC_ORDER.slice(),
    difficulties: DIFFICULTIES.slice(),
    types: QTYPES.slice(),
    examLevel: "all",
    count: 20
  };
  var session = null; // active quiz session
  var reviewSourceRoute = "results"; // where "back" from a review goes

  /* ---------------- Utility functions ---------------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function pct(n) { return Math.round(n * 100); }
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " +
           d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function qById(id) {
    for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === id) return QUESTIONS[i];
    return null;
  }
  function correctKeys(q) { return q.correct.split(",").map(function (s) { return s.trim(); }); }
  function isCorrectKey(q, key) { return correctKeys(q).indexOf(key) !== -1; }
  function correctLabel(q) { return correctKeys(q).join(" or "); }

  function extractNumbers(str) {
    if (!str) return [];
    var matches = String(str).match(/-?\d+(?:,\d{3})*(?:\.\d+)?/g) || [];
    return matches.map(function (m) { return parseFloat(m.replace(/,/g, "")); }).filter(function (n) { return !isNaN(n); });
  }
  function compareNumericAnswer(userInput, expected) {
    var userNums = extractNumbers(userInput);
    var expectedNums = extractNumbers(expected);
    if (userNums.length === 0 || expectedNums.length === 0) return false;
    for (var i = 0; i < expectedNums.length; i++) {
      var target = expectedNums[i];
      for (var j = 0; j < userNums.length; j++) {
        var guess = userNums[j];
        var tolerance = Math.max(Math.abs(target) * 0.03, 0.05); // 3% relative, small absolute floor
        if (Math.abs(guess - target) <= tolerance) return true;
      }
    }
    return false;
  }

  window.App = {}; // public surface for inline event handlers

  /* ---------------- Stats & Analytics ---------------- */
  function qStat(qid) {
    return state.qstats[qid] || { seen: 0, correct: 0, lastResult: null, lastTs: null };
  }
  function recordAnswer(qid, isCorrect) {
    var s = state.qstats[qid] || { seen: 0, correct: 0, lastResult: null, lastTs: null };
    s.seen += 1;
    if (isCorrect) s.correct += 1;
    s.lastResult = isCorrect ? "correct" : "incorrect";
    s.lastTs = Date.now();
    state.qstats[qid] = s;
  }
  function topicQuestions(topicId) {
    return QUESTIONS.filter(function (q) { return q.topicId === topicId; });
  }
  function topicStats(topicId) {
    var qs = topicQuestions(topicId);
    var seen = 0, correct = 0, attempted = 0;
    qs.forEach(function (q) {
      var s = state.qstats[q.id];
      if (s && s.seen > 0) {
        attempted++;
        seen += s.seen;
        correct += s.correct;
      }
    });
    var acc = seen > 0 ? correct / seen : null;
    return {
      topicId: topicId,
      total: qs.length,
      attemptedQuestions: attempted,
      coverage: qs.length ? attempted / qs.length : 0,
      seenCount: seen,
      correctCount: correct,
      accuracy: acc
    };
  }
  function allTopicStats() {
    return TOPIC_ORDER.map(topicStats);
  }
  function overallStats() {
    var totalSeen = 0, totalCorrect = 0, totalQ = QUESTIONS.length, attempted = 0;
    QUESTIONS.forEach(function (q) {
      var s = state.qstats[q.id];
      if (s && s.seen > 0) {
        attempted++;
        totalSeen += s.seen;
        totalCorrect += s.correct;
      }
    });
    return {
      totalQuestions: totalQ,
      attemptedQuestions: attempted,
      coverage: totalQ ? attempted / totalQ : 0,
      accuracy: totalSeen > 0 ? totalCorrect / totalSeen : null,
      totalSeen: totalSeen,
      totalCorrect: totalCorrect
    };
  }
  function readinessScore() {
    var o = overallStats();
    if (o.attemptedQuestions === 0) return 0;
    var acc = o.accuracy || 0;
    var cov = o.coverage;
    // Weighted: accuracy carries more weight, but coverage matters so
    // a student can't hit 100% readiness from a handful of easy questions.
    var score = acc * 0.75 + cov * 0.25;
    return clamp(Math.round(score * 100), 0, 100);
  }
  function masteryLabel(topicId) {
    var st = topicStats(topicId);
    if (st.attemptedQuestions === 0) return "new";
    if (st.accuracy === null) return "new";
    if (st.coverage < 0.3) return st.accuracy >= 0.7 ? "developing" : "weak";
    if (st.accuracy >= 0.85) return "mastered";
    if (st.accuracy >= 0.6) return "developing";
    return "weak";
  }
  function masteryPillClass(label) {
    return { mastered: "m-mastered", developing: "m-developing", weak: "m-weak", new: "m-new" }[label] || "m-new";
  }
  function masteryText(label) {
    return { mastered: "Mastered", developing: "Developing", weak: "Needs Review", new: "Not Started" }[label] || "Not Started";
  }
  function weakTopics() {
    return allTopicStats()
      .filter(function (t) { return t.attemptedQuestions > 0 && t.accuracy !== null && t.accuracy < 0.7; })
      .sort(function (a, b) { return a.accuracy - b.accuracy; });
  }
  function difficultyStats() {
    var out = {};
    DIFFICULTIES.forEach(function (d) { out[d] = { seen: 0, correct: 0 }; });
    QUESTIONS.forEach(function (q) {
      var s = state.qstats[q.id];
      if (s && s.seen > 0) {
        out[q.difficulty].seen += s.seen;
        out[q.difficulty].correct += s.correct;
      }
    });
    return out;
  }

  /* ---------------- Quiz Session Building ---------------- */
  function poolFor(topics, difficulties, types) {
    types = types || QTYPES;
    return QUESTIONS.filter(function (q) {
      return topics.indexOf(q.topicId) !== -1 && difficulties.indexOf(q.difficulty) !== -1 && types.indexOf(q.type) !== -1;
    });
  }

  function weightedSample(pool, n, weightFn) {
    var items = pool.map(function (q) { return { q: q, w: Math.max(weightFn(q), 0.01) }; });
    var out = [];
    n = Math.min(n, items.length);
    for (var k = 0; k < n; k++) {
      var total = items.reduce(function (sum, it) { return sum + it.w; }, 0);
      var r = Math.random() * total;
      var acc = 0, pickIdx = 0;
      for (var i = 0; i < items.length; i++) {
        acc += items[i].w;
        if (r <= acc) { pickIdx = i; break; }
      }
      out.push(items[pickIdx].q);
      items.splice(pickIdx, 1);
    }
    return out;
  }

  function adaptiveWeight(q) {
    var s = qStat(q.id);
    var tstat = topicStats(q.topicId);
    var w = 1;
    if (s.seen === 0) w += 2.2; // prioritize unseen material
    else {
      var qAcc = s.correct / s.seen;
      w += (1 - qAcc) * 3; // missed questions weighted higher
    }
    if (tstat.accuracy !== null) w += (1 - tstat.accuracy) * 2; // weak topics weighted higher
    return w;
  }

  function buildSession(config) {
    var pool;
    if (config.mode === "final") {
      var examDiffs = config.examLevel === "all" ? DIFFICULTIES.slice() : [config.examLevel];
      pool = poolFor(TOPIC_ORDER, examDiffs, config.types);
    } else {
      pool = poolFor(config.topics, config.difficulties, config.types);
    }
    var chosen;
    if (config.mode === "adaptive") {
      chosen = weightedSample(pool, config.count, adaptiveWeight);
    } else {
      chosen = shuffle(pool).slice(0, Math.min(config.count, pool.length));
    }
    return {
      mode: config.mode,
      config: config,
      order: chosen.map(function (q) { return q.id; }),
      idx: 0,
      answers: {}, // qid -> {chosen, correct, timeMs}
      startTs: Date.now(),
      qStartTs: Date.now()
    };
  }

  function feedbackWithheld(mode) { return mode === "exam" || mode === "final"; }

  function finishSession() {
    var qids = session.order;
    var total = qids.length;
    var correct = 0;
    qids.forEach(function (qid) {
      var a = session.answers[qid];
      if (a && a.correct) correct++;
      // For exam/final modes, stats are recorded at finish time (below, once).
    });
    if (feedbackWithheld(session.mode)) {
      qids.forEach(function (qid) {
        var a = session.answers[qid];
        if (a) recordAnswer(qid, a.correct);
      });
    }
    var byTopic = {};
    qids.forEach(function (qid) {
      var q = qById(qid);
      var a = session.answers[qid];
      if (!byTopic[q.topicId]) byTopic[q.topicId] = { seen: 0, correct: 0 };
      byTopic[q.topicId].seen++;
      if (a && a.correct) byTopic[q.topicId].correct++;
    });
    var attempt = {
      id: "a_" + Date.now(),
      ts: Date.now(),
      mode: session.mode,
      topics: session.config.mode === "final" ? TOPIC_ORDER.slice() : session.config.topics.slice(),
      difficulties: session.config.difficulties.slice(),
      total: total,
      correct: correct,
      durationMs: Date.now() - session.startTs,
      byTopic: byTopic,
      answers: qids.map(function (qid) {
        var a = session.answers[qid] || { chosen: null, correct: false };
        return { qid: qid, chosen: a.chosen, correct: a.correct, userInput: a.userInput || null };
      })
    };
    state.attempts.unshift(attempt);
    if (state.attempts.length > 100) state.attempts.length = 100;
    saveState();
    return attempt;
  }

  /* ---------------- Rendering: Nav ---------------- */
  function renderNav() {
    var nav = $("#mainNav");
    var tabs = [
      { id: "dashboard", label: "Dashboard" },
      { id: "setup", label: "Practice" },
      { id: "progress", label: "Progress" },
      { id: "manual", label: "Manual" }
    ];
    nav.innerHTML = "";
    tabs.forEach(function (t) {
      var isActive = route === t.id || (t.id === "setup" && (route === "quiz" || route === "results"));
      var b = el('<button class="' + (isActive ? "active" : "") + '">' + esc(t.label) + "</button>");
      b.addEventListener("click", function () {
        if (route === "quiz" && !confirm("Leave this quiz? Your progress on this attempt will be lost.")) return;
        navigate(t.id === "setup" ? "setup" : t.id);
      });
      nav.appendChild(b);
    });
  }

  function navigate(r) {
    route = r;
    renderNav();
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------------- Rendering: Dashboard ---------------- */
  function renderDashboard() {
    var overall = overallStats();
    var readiness = readinessScore();
    var topics = allTopicStats();
    var weak = weakTopics();
    var recentAttempts = state.attempts.slice(0, 5);

    var readinessMsg;
    if (overall.attemptedQuestions === 0) {
      readinessMsg = "Take your first quiz to establish a baseline readiness score.";
    } else if (readiness >= 85) {
      readinessMsg = "Strong performance across the bank. Keep reinforcing with mixed review.";
    } else if (readiness >= 65) {
      readinessMsg = "Solid progress. Focus remaining time on the topics flagged below.";
    } else {
      readinessMsg = "Early stage. Build coverage across all six topics before narrowing in.";
    }

    var topicRows = topics.map(function (t) {
      var meta = TOPIC_META[t.topicId];
      var pctVal = t.accuracy === null ? 0 : pct(t.accuracy);
      var label = t.accuracy === null ? "—" : pctVal + "%";
      var mLabel = masteryLabel(t.topicId);
      return '<div class="topic-row">' +
        '<div class="ticon" style="background:var(' + meta.cssVar + '-soft, ' + '#eee' + ');">' + topicIconSvg(t.topicId, meta.cssVar) + '</div>' +
        '<div class="tname">' + esc(meta.name) + '</div>' +

          '<div class="qs-row"><span class="label">Overall accuracy</span><span class="value">' + (overall.accuracy === null ? "—" : pct(overall.accuracy) + "%") + '</span></div>' +
          '<div class="qs-row"><span class="label">Quizzes completed</span><span class="value">' + state.attempts.length + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="grid grid-2">' +
        '<div class="card pad">' +
          '<h2 class="section-title">Topic Breakdown</h2>' +

        '<div class="card pad">' +

      '<div class="grid grid-2" style="margin-top:16px;">' +
        '<div class="card pad">' +

          '<h2 class="section-title" style="margin-bottom:0;">Ready to practice?</h2>' +
          '<p class="section-sub" style="margin-bottom:0;">Build a custom quiz by topic, difficulty, and mode — or jump into a full mixed exam.</p>' +
          '<button class="btn btn-primary" onclick="App.goSetup()">Start a quiz →</button>' +
        '</div>' +
      '</div>';

    $("#view").innerHTML = html;

  /* ---------------- Rendering: Setup ---------------- */
  var MODE_INFO = {
    practice: { name: "Practice Mode",  desc: "Instant feedback after each question. Best for learning." },
    exam:     { name: "Exam Mode",      desc: "Feedback withheld until the quiz ends. Simulates test conditions." },
    adaptive: { name: "Adaptive Mode",  desc: "Automatically weights questions toward your weaker topics." },
    final:    { name: "Final Exam",     desc: "Random questions pulled from all 12 topics. Choose your level and length." }
  };

  function renderSetup() {
    var isFinal = setupConfig.mode === "final";
    var examDiffs = setupConfig.examLevel === "all" ? DIFFICULTIES.slice() : [setupConfig.examLevel];
    var pool = isFinal
      ? poolFor(TOPIC_ORDER, examDiffs, setupConfig.types)
      : poolFor(setupConfig.topics, setupConfig.difficulties, setupConfig.types);
    var maxCount = Math.max(pool.length, 1);
    setupConfig.count = clamp(setupConfig.count, Math.min(5, maxCount), maxCount);

    var modeCards = ["practice", "exam", "adaptive", "final"].map(function (m) {
      var info = MODE_INFO[m];
      var sel = setupConfig.mode === m;
      return '<button class="mode-card' + (sel ? " selected" : "") + '" onclick="App.setMode(\'' + m + '\')">' +
        '<h4>' + info.name + '</h4><p>' + info.desc + '</p></button>';
    }).join("");

    var topicChips = TOPIC_ORDER.map(function (tid) {
      var meta = TOPIC_META[tid];
      var st = topicStats(tid);
      var sel = setupConfig.topics.indexOf(tid) !== -1;
      var accLabel = st.accuracy === null ? "no data" : pct(st.accuracy) + "%";
      return '<button class="topic-chip' + (sel ? " selected" : "") + '" onclick="App.toggleTopic(\'' + tid + '\')">' +
        '<span class="dot" style="background:var(' + meta.cssVar + ');"></span>' +
        '<span class="tc-name">' + esc(meta.name) + '</span>' +
        '<span class="tc-pct">' + accLabel + '</span>' +
        '</button>';
    }).join("");

    var diffSeg = DIFFICULTIES.map(function (d) {
      var sel = setupConfig.difficulties.indexOf(d) !== -1;
      return '<button class="' + (sel ? "active" : "") + '" onclick="App.toggleDifficulty(\'' + d + '\')" style="text-transform:capitalize;">' + d + "</button>";
    }).join("");

    var levelOptions = [["all", "All Levels"], ["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]];
    var levelSeg = levelOptions.map(function (pair) {
      var sel = setupConfig.examLevel === pair[0];
      return '<button class="' + (sel ? "active" : "") + '" onclick="App.setExamLevel(\'' + pair[0] + '\')">' + pair[1] + "</button>";
    }).join("");

    var typeLabels = { mcq: "Standard", case: "Case-Based", calc: "Calculations" };
    var typeSeg = QTYPES.map(function (t) {
      var sel = setupConfig.types.indexOf(t) !== -1;
      return '<button class="' + (sel ? "active" : "") + '" onclick="App.toggleType(\'' + t + '\')">' + typeLabels[t] + "</button>";
    }).join("");

    var topicsBlock = isFinal
      ? '<div class="setup-group">' +
          '<label class="grouplabel">Topics</label>' +
          '<div class="card pad" style="background:var(--paper-2);box-shadow:none;padding:14px 18px;">' +
            '<span class="small-muted">Final Exam always draws randomly across all 12 topics for a comprehensive, NAPLEX-style assessment.</span>' +
          '</div>' +
        '</div>'
      : '<div class="setup-group">' +
          '<div class="flex-between" style="margin-bottom:12px;">' +
            '<label class="grouplabel" style="margin-bottom:0;">Topics</label>' +
            '<div style="display:flex;gap:8px;">' +
              '<button class="btn btn-ghost btn-sm" onclick="App.allTopics(true)">Select all</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="App.allTopics(false)">Clear</button>' +
            '</div>' +
          '</div>' +
          '<div class="topic-picker">' + topicChips + '</div>' +
        '</div>';

    var levelBlock = isFinal
      ? '<div class="setup-group" style="margin-bottom:0;"><label class="grouplabel">Level</label><div class="seg">' + levelSeg + '</div></div>'
      : '<div class="setup-group" style="margin-bottom:0;"><label class="grouplabel">Difficulty</label><div class="seg">' + diffSeg + '</div></div>';

    var html =
      '<div class="card pad">' +
        '<h2 class="section-title">Build Your Quiz</h2>' +
        '<p class="section-sub">Choose a mode, topics, and difficulty. ' + pool.length + ' question' + (pool.length === 1 ? "" : "s") + ' match your current filters.</p>' +

        '<div class="setup-group">' +
          '<label class="grouplabel">Quiz Mode</label>' +
          '<div class="mode-cards">' + modeCards + '</div>' +
        '</div>' +

        topicsBlock +

        '<div class="grid grid-3">' +
          levelBlock +
          '<div class="setup-group" style="margin-bottom:0;">' +
            '<label class="grouplabel">Question Type</label>' +
            '<div class="seg">' + typeSeg + '</div>' +
          '</div>' +
          '<div class="setup-group" style="margin-bottom:0;">' +
            '<label class="grouplabel">Number of Questions</label>' +
            '<div class="range-row">' +
              '<input type="range" min="' + Math.min(5, maxCount) + '" max="' + maxCount + '" value="' + setupConfig.count + '" oninput="App.setCount(this.value)">' +
              '<span class="count-badge">' + setupConfig.count + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<hr class="divider">' +
        '<div class="flex-between">' +
          '<div class="small-muted">Standard = single-best-answer multiple choice. Case-Based = patient-vignette items. Calculations = pharmacy math problems.</div>' +
          '<button class="btn btn-primary btn-block" style="max-width:220px;flex-shrink:0;margin-left:16px;" ' +
            (pool.length === 0 ? "disabled" : "") + ' onclick="App.beginQuiz()">Start Quiz →</button>' +
        '</div>' +
      '</div>';

    $("#view").innerHTML = html;
  }

  App.setMode = function (m) { setupConfig.mode = m; renderSetup(); };
  App.setExamLevel = function (lvl) { setupConfig.examLevel = lvl; renderSetup(); };
  App.toggleTopic = function (tid) {
    var i = setupConfig.topics.indexOf(tid);
    if (i === -1) setupConfig.topics.push(tid); else setupConfig.topics.splice(i, 1);
    renderSetup();
  };
  App.allTopics = function (on) {
    setupConfig.topics = on ? TOPIC_ORDER.slice() : [];
    renderSetup();
  };
  App.toggleDifficulty = function (d) {
    var i = setupConfig.difficulties.indexOf(d);
    if (i === -1) setupConfig.difficulties.push(d); else setupConfig.difficulties.splice(i, 1);
    if (setupConfig.difficulties.length === 0) setupConfig.difficulties = [d]; // never allow zero
    renderSetup();
  };
  App.toggleType = function (t) {
    var i = setupConfig.types.indexOf(t);
    if (i === -1) setupConfig.types.push(t); else setupConfig.types.splice(i, 1);
    if (setupConfig.types.length === 0) setupConfig.types = [t]; // never allow zero
    renderSetup();
  };
  App.setCount = function (v) { setupConfig.count = parseInt(v, 10); renderSetup(); };
  App.goSetup = function () { navigate("setup"); };
  App.startTopicPractice = function (tid) {
    setupConfig.topics = [tid];
    setupConfig.difficulties = DIFFICULTIES.slice();
    setupConfig.types = QTYPES.slice();
    setupConfig.mode = "adaptive";
    var pool = poolFor(setupConfig.topics, setupConfig.difficulties, setupConfig.types);
    setupConfig.count = Math.min(15, pool.length);
    navigate("setup");
  };
  App.beginQuiz = function () {
    if (setupConfig.topics.length === 0) { alert("Select at least one topic."); return; }
    session = buildSession(setupConfig);
    if (session.order.length === 0) { alert("No questions match these filters."); return; }
    navigate("quiz");
  };

  /* ---------------- Rendering: Quiz ---------------- */
  function renderQuiz() {
    if (!session) { navigate("dashboard"); return; }
    var qid = session.order[session.idx];
    var q = qById(qid);
    var meta = TOPIC_META[q.topicId];
    var total = session.order.length;
    var answered = session.answers[qid];
    var isExam = feedbackWithheld(session.mode);
    var locked = !!answered; // for practice/adaptive, locked once answered (shows feedback)
    var isFreeResponse = !q.options || q.options.length === 0;

    var diffPillClass = { easy: "pill-sage", medium: "pill-amber", hard: "pill-clay" }[q.difficulty];

    var bodyHtml, feedbackHtml = "", canAdvance;

    if (isFreeResponse) {
      // Work-it-out calculation: type an answer, check it, then reveal the full solution.
      var checked = !!(answered && answered.checked);
      var revealed = !!(answered && answered.revealed);
      var userInput = (answered && answered.userInput) || "";

      if (!checked) {
        bodyHtml = '<div class="note-box amber" style="margin-top:4px;">' +
          '<h4>Work it out</h4>' +
          '<p>Solve this on paper or in your head, type your final answer below, then check it.</p>' +
          '</div>' +
          '<div class="calc-answer-row">' +
            '<input type="text" id="calcAnswerInput" class="calc-answer-input" placeholder="e.g. 21.6 g" value="' + esc(userInput) + '" oninput="App.onCalcInput(this.value)" onkeydown="if(event.key===\'Enter\'){App.checkCalcAnswer();}">' +
            '<button class="btn btn-amber" id="calcCheckBtn" onclick="App.checkCalcAnswer()" ' + (userInput.trim() ? "" : "disabled") + '>Check Answer</button>' +
          '</div>';
      } else if (!revealed) {
        bodyHtml =
          '<div class="calc-answer-row locked-row"><span class="calc-your-answer">Your answer: <strong>' + esc(userInput) + '</strong></span></div>' +
          '<div class="feedback-box ' + (answered.autoCorrect ? "correct" : "incorrect") + '" style="margin-top:12px;">' +
            '<div class="feedback-head">' + (answered.autoCorrect ? "✓ Looks correct" : "✕ Doesn\u2019t match the expected answer") + '</div>' +
            '<div class="feedback-body">Expected: ' + esc(q.finalAnswer || q.explanation) + '</div>' +
          '</div>' +
          '<button class="btn btn-primary" style="margin-top:14px;" onclick="App.revealSolution()">Show Step-by-Step Solution</button>';
      } else {
        bodyHtml =
          '<div class="calc-answer-row locked-row"><span class="calc-your-answer">Your answer: <strong>' + esc(userInput) + '</strong></span></div>' +
          '<div class="feedback-box correct" style="border-color:var(--line);background:var(--paper-2);margin-top:12px;">' +
            '<div class="feedback-head" style="color:var(--teal-deep);">Step-by-Step Solution</div>' +
            '<div class="feedback-body">' + esc(q.explanation) + '</div>' +
          '</div>' +
          '<div class="override-row">' +
            '<span class="small-muted">Auto-check said ' + (answered.autoCorrect ? "correct" : "incorrect") + '. Disagree (e.g. rounding, units, multi-part answer)?</span>' +
            '<div style="display:flex;gap:8px;margin-top:8px;">' +
              '<button class="btn btn-ghost btn-sm" onclick="App.overrideGrade(true)">Mark as correct</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="App.overrideGrade(false)">Mark as incorrect</button>' +
            '</div>' +
          '</div>';
        feedbackHtml = '<div class="feedback-box ' + (answered.correct ? "correct" : "incorrect") + '" style="margin-top:14px;">' +
          '<div class="feedback-head">' + (answered.correct ? "✓ Marked correct" : "✕ Marked incorrect") + '</div>' +
          '<div class="feedback-ref">Reference: ' + esc(q.reference) + ' — review module</div>' +
          '</div>';
      }
      canAdvance = revealed;
    } else {
      var optsHtml = q.options.map(function (o) {
        var cls = "opt";
        if (locked) {
          if (!isExam) {
            if (isCorrectKey(q, o.key)) cls += " correct";
            else if (answered && answered.chosen === o.key) cls += " incorrect";
          } else if (answered && answered.chosen === o.key) {
            cls += " selected";
          }
        }
        return '<button class="' + cls + (locked ? " locked" : "") + '" ' +
          (locked ? "disabled" : 'onclick="App.selectOption(\'' + o.key + '\')"') + '>' +
          '<span class="okey">' + o.key + '</span><span class="otext">' + esc(o.text) + '</span>' +
          '</button>';
      }).join("");
      bodyHtml = '<div class="opt-list">' + optsHtml + '</div>';

      if (locked && !isExam) {
        var correctChoice = answered.correct;
        feedbackHtml = '<div class="feedback-box ' + (correctChoice ? "correct" : "incorrect") + '">' +
          '<div class="feedback-head">' + (correctChoice ? "✓ Correct" : "✕ Incorrect — correct answer: " + correctLabel(q)) + '</div>' +
          (q.explanation ? '<div class="feedback-body">' + esc(q.explanation) + '</div>' : '') +
          '<div class="feedback-ref">Reference: ' + esc(q.reference) + ' — review module</div>' +
          '</div>';
      }
      canAdvance = isExam ? !!answered : locked;
    }

    var nextLabel = session.idx === total - 1 ? "Finish Quiz" : "Next Question →";

    var html =
      '<div class="quiz-header">' +
        '<span class="pill pill-teal">' + esc(MODE_INFO[session.mode].name) + '</span>' +
        '<div class="progress-track"><div style="width:' + Math.round(((session.idx) / total) * 100) + '%;"></div></div>' +
        '<span class="small-muted">Question ' + (session.idx + 1) + ' of ' + total + '</span>' +
      '</div>' +
      '<div class="qcard">' +
        '<div class="qcard-perf"></div>' +
        '<div class="qcard-label">' +
          '<span class="pill" style="background:var(' + meta.cssVar + '-soft);color:var(' + meta.cssVar + ');">' + esc(meta.name) + '</span>' +
          '<span style="display:flex;gap:8px;">' +
          (q.type === "case" ? '<span class="pill pill-teal">Case-Based</span>' : '') +
          (q.type === "calc" ? '<span class="pill pill-amber">Calculation</span>' : '') +
          '<span class="pill ' + diffPillClass + '" style="text-transform:capitalize;">' + q.difficulty + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="qcard-body">' +
          '<div class="qtext"' + (q.type === "case" ? ' style="font-family:var(--sans);font-size:1rem;font-weight:400;color:var(--ink);"' : '') + '>' + esc(q.question) + '</div>' +
          bodyHtml +
          feedbackHtml +
        '</div>' +
      '</div>' +
      '<div class="quiz-footer">' +
        '<button class="btn btn-ghost btn-sm" onclick="App.exitQuiz()">Exit quiz</button>' +
        '<button class="btn btn-primary" ' + (canAdvance ? "" : "disabled") + ' onclick="App.nextQuestion()">' + nextLabel + '</button>' +
      '</div>';

    $("#view").innerHTML = html;
  }

  var pendingCalcInput = ""; // tracks the input box value between keystrokes, before Check is clicked

  App.onCalcInput = function (val) {
    pendingCalcInput = val;
    var btn = document.getElementById("calcCheckBtn");
    if (btn) btn.disabled = !val.trim();
  };

  App.checkCalcAnswer = function () {
    var input = document.getElementById("calcAnswerInput");
    var val = input ? input.value : pendingCalcInput;
    if (!val || !val.trim()) return;
    var qid = session.order[session.idx];
    var q = qById(qid);
    var autoCorrect = compareNumericAnswer(val, q.finalAnswer || q.explanation);
    session.answers[qid] = {
      chosen: null, userInput: val, checked: true, autoCorrect: autoCorrect,
      revealed: false, correct: autoCorrect, timeMs: Date.now() - session.qStartTs
    };
    pendingCalcInput = "";
    renderQuiz();
  };

  App.revealSolution = function () {
    var qid = session.order[session.idx];
    var prev = session.answers[qid] || {};
    prev.revealed = true;
    session.answers[qid] = prev;
    if (!feedbackWithheld(session.mode)) recordAnswer(qid, prev.correct);
    saveState();
    renderQuiz();
  };

  App.overrideGrade = function (isCorrect) {
    var qid = session.order[session.idx];
    var prev = session.answers[qid] || {};
    var wasRecorded = !feedbackWithheld(session.mode); // stats were already recorded at reveal time
    prev.correct = isCorrect;
    session.answers[qid] = prev;
    if (wasRecorded) {
      // adjust the just-recorded stat to reflect the corrected grade
      var s = state.qstats[qid];
      if (s && s.seen > 0) {
        var wasCorrect = s.lastResult === "correct";
        if (wasCorrect !== isCorrect) {
          s.correct += isCorrect ? 1 : -1;
          s.lastResult = isCorrect ? "correct" : "incorrect";
        }
      }
    }
    saveState();
    renderQuiz();
  };

  App.selectOption = function (key) {
    var qid = session.order[session.idx];
    if (session.answers[qid]) return; // already answered
    var q = qById(qid);
    var isCorrect = isCorrectKey(q, key);
    session.answers[qid] = { chosen: key, correct: isCorrect, timeMs: Date.now() - session.qStartTs };
    if (!feedbackWithheld(session.mode)) recordAnswer(qid, isCorrect); // practice/adaptive: live stats
    saveState();
    renderQuiz();
  };

  App.nextQuestion = function () {
    if (session.idx < session.order.length - 1) {
      session.idx++;
      session.qStartTs = Date.now();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      var attempt = finishSession();
      reviewSourceRoute = "results";
      lastAttempt = attempt;
      session = null;
      navigate("results");
    }
  };

  App.exitQuiz = function () {
    if (!confirm("Exit this quiz? Your progress on this attempt will not be saved.")) return;
    session = null;
    navigate("dashboard");
  };

    else msg = "This is a good area to prioritize in your remaining study time.";

    var topicBreakdown = Object.keys(attempt.byTopic).map(function (tid) {

    var reviewHtml = attempt.answers.map(function (a, i) {

      var meta = TOPIC_META[q.topicId];

      var bodyHtml;
      if (isFreeResponse) {
        bodyHtml =
          (a.userInput ? '<div class="calc-answer-row locked-row" style="margin-bottom:10px;"><span class="calc-your-answer">Your answer: <strong>' + esc(a.userInput) + '</strong></span></div>' : '') +
          '<div class="feedback-body" style="font-size:.85rem;"><strong>Expected:</strong> ' + esc(q.finalAnswer || "") + '</div>' +
          '<div class="feedback-body" style="font-size:.85rem;"><strong>Step-by-Step Solution:</strong> ' + esc(q.explanation) + '</div>';
      } else {
        var optsHtml = q.options.map(function (o) {
          var cls = "review-opt";
          if (isCorrectKey(q, o.key)) cls += " correct";
          else if (a.chosen === o.key) cls += " incorrect";
          var marker = isCorrectKey(q, o.key) ? "✓" : (a.chosen === o.key ? "✕" : "");
          return '<div class="' + cls + '"><strong>' + o.key + ')</strong> ' + esc(o.text) + (marker ? '<span style="margin-left:auto;">' + marker + '</span>' : '') + '</div>';
        }).join("");
        bodyHtml = '<div class="review-opts">' + optsHtml + '</div>' +
          (q.explanation ? '<div class="feedback-body" style="font-size:.85rem;"><strong>Explanation:</strong> ' + esc(q.explanation) + '</div>' : '');
      }
      return '<div class="review-item">' +
        '<div class="flex-between">' +
          '<span class="pill" style="background:var(' + meta.cssVar + '-soft);color:var(' + meta.cssVar + ');">' + esc(meta.name) + '</span>' +
          '<span class="pill ' + (a.correct ? "pill-sage" : "pill-clay") + '">' + (a.correct ? "Correct" : "Incorrect") + '</span>' +
        '</div>' +
        '<div class="review-q">' + (i + 1) + '. ' + esc(q.question) + '</div>' +
        bodyHtml +
        '<div class="feedback-ref">Reference: ' + esc(q.reference) + ' — review module</div>' +
      '</div>';
    }).join("");

    var html =
      '<div class="card">' +
        '<div class="result-hero">' +
          '<p class="readiness-eyebrow" style="color:var(--muted);">Quiz Complete — ' + esc(MODE_INFO[attempt.mode] ? MODE_INFO[attempt.mode].name : attempt.mode) + '</p>' +
          '<div class="result-score">' + attempt.correct + '/' + attempt.total + '<span> · ' + scorePct + '%</span></div>' +
          '<div class="result-msg">' + msg + '</div>' +
          '<div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
            '<button class="btn btn-primary" onclick="App.goSetup()">New Quiz</button>' +
            '<button class="btn btn-ghost" onclick="App.navigateHome()">Back to Dashboard</button>' +

        '<h2 class="section-title">Topic Breakdown</h2>' +

  /* ---------------- Rendering: Progress ---------------- */
  function sparkline(values, w, h) {
    if (values.length === 0) return '<p class="small-muted">No attempts yet.</p>';
    if (values.length === 1) values = [values[0], values[0]];
    var max = 100, min = 0;
    var stepX = w / (values.length - 1);
    var pts = values.map(function (v, i) {
      var x = i * stepX;
      var y = h - ((v - min) / (max - min)) * h;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    var lastX = (values.length - 1) * stepX;
    var lastY = h - ((values[values.length - 1] - min) / (max - min)) * h;
    var areaPts = "0," + h + " " + pts + " " + lastX.toFixed(1) + "," + h;
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + areaPts + '" fill="rgba(31,75,74,0.10)" stroke="none"></polyline>' +
      '<polyline points="' + pts + '" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
      '</svg>';
  }

        '<td style="text-align:center;">' + t.attemptedQuestions + '/' + t.total + '</td>' +

          '<h2 class="section-title">Accuracy by Difficulty</h2>' +

  /* ---------------- Rendering: Manual ---------------- */
  function renderManual() {
    var toc = [

    }).join("");

    var topicRowsHtml = TOPIC_ORDER.map(function (tid) {

    }).join("");

    var html =
      '<div class="manual-layout">' +
        '<div class="card pad manual-nav-card">' +
          '<h2 class="section-title" style="font-size:1.1rem;">Contents</h2>' +
          '<div class="manual-toc">' + tocHtml + '</div>' +
        '</div>' +
        '<div class="card pad manual-section">' +

          '<h2 class="section-title">User Manual</h2>' +
          '<p class="section-sub">Dosage Forms Q-Bank — a NAPLEX self-assessment tool covering ' + QUESTIONS.length + ' questions across 12 dosage-form topics. This page is a quick-reference version of the full manual, built into the app.</p>' +

          '<h3 id="overview" class="mh">1. Overview</h3>' +
          '<p>This app is a self-assessment tool built to help PharmD students prepare for the NAPLEX. It covers twelve dosage-form topics with ' + QUESTIONS.length + ' questions in total, spanning standard multiple-choice, patient-vignette case studies, and pharmacy calculations.</p>' +
          '<p>The entire application lives in a single HTML file — nothing to install, no account, and no internet connection required after download. Your quiz history and performance statistics save automatically in your browser\u2019s local storage, so progress persists between sessions on the same device and browser.</p>' +
          '<div class="note-box"><h4>Before you begin</h4><p>Because progress is stored locally in your browser, it will not follow you to a different computer or browser automatically, and clearing your browser data will erase it. See the FAQ below for details.</p></div>' +
          '<h4 class="mh4">What\u2019s in the question bank</h4>' +
          '<div style="overflow-x:auto;">' + '<table class="manual-table"><thead><tr><th>Topic</th><th>Total</th><th>Standard</th><th>Case-Based</th><th>Calculation</th></tr></thead><tbody>' + topicRowsHtml + '</tbody></table>' + '</div>' +
          '<p>Every question includes the correct answer and, where the source material provided one, a written explanation and a reference tag pointing back to its topic.</p>' +

          '<h3 id="getting-started" class="mh">2. Getting Started</h3>' +
          '<h4 class="mh4">Opening the app</h4>' +
          '<ol><li>Locate the downloaded HTML file.</li><li>Double-click it, or right-click and choose \u201cOpen with\u201d your preferred browser.</li><li>The Dashboard loads automatically \u2014 there is no login or setup step.</li></ol>' +
          '<h4 class="mh4">Layout at a glance</h4>' +
          '<p>Four tabs sit in the top-right corner of every screen:</p>' +
          '<ul><li><strong>Dashboard</strong> \u2014 your readiness score, topic breakdown, and recommendations.</li>' +
          '<li><strong>Practice</strong> \u2014 where you build and start a quiz.</li>' +
          '<li><strong>Progress</strong> \u2014 your score trend, topic mastery table, and full quiz history.</li>' +
          '<li><strong>Manual</strong> \u2014 this page.</li></ul>' +
          '<p>You can switch between tabs at any time, except mid-quiz, where switching tabs will prompt a confirmation since it ends your current attempt.</p>' +

          '<h3 id="dashboard-help" class="mh">3. The Dashboard</h3>' +
          '<h4 class="mh4">NAPLEX readiness score</h4>' +
          '<p>A single 0\u2013100 score combining two things: <strong>Accuracy</strong> (75% of the score) \u2014 the percentage of attempted questions you\u2019ve answered correctly \u2014 and <strong>Coverage</strong> (25% of the score) \u2014 the percentage of the full question bank you\u2019ve attempted at least once. This weighting means a high score requires both consistent accuracy and broad exposure across the bank.</p>' +
          '<h4 class="mh4">Topic breakdown &amp; mastery badges</h4>' +
          '<div style="overflow-x:auto;">' + '<table class="manual-table"><thead><tr><th>Badge</th><th>Meaning</th></tr></thead><tbody>' +
          '<tr><td>Not Started</td><td>You haven\u2019t attempted any questions in this topic yet.</td></tr>' +
          '<tr><td>Needs Review</td><td>Accuracy is below 60%, or below 70% with limited coverage.</td></tr>' +
          '<tr><td>Developing</td><td>Accuracy is roughly 60\u201385%, or above 70% with limited coverage.</td></tr>' +
          '<tr><td>Mastered</td><td>Accuracy is 85% or higher across a meaningful share of the topic\u2019s questions.</td></tr>' +
          '</tbody></table>' + '</div>' +
          '<h4 class="mh4">Recommended focus &amp; recent activity</h4>' +
          '<p>Once you\u2019ve attempted questions in at least one topic, the Recommended Focus panel lists topics below 70% accuracy, weakest first, each with a \u201cPractice this topic\u201d button that jumps to the quiz builder pre-filled in Adaptive Mode. Recent Activity shows your five most recent quiz attempts \u2014 the full history lives on the Progress tab.</p>' +

          '<h3 id="building-quiz" class="mh">4. Building a Quiz</h3>' +
          '<p>Open the Practice tab to configure and start a quiz. Every quiz is built from four settings: mode, topics (or level, for Final Exam), question type, and question count.</p>' +
          '<h4 class="mh4">Quiz modes</h4>' +
          '<div style="overflow-x:auto;">' + '<table class="manual-table"><thead><tr><th>Mode</th><th>Feedback</th><th>Topic Scope</th><th>Best For</th></tr></thead><tbody>' +
          '<tr><td>Practice Mode</td><td>Instant, after each question</td><td>Your choice</td><td>Learning new material</td></tr>' +
          '<tr><td>Exam Mode</td><td>Withheld until quiz ends</td><td>Your choice</td><td>Simulating test conditions</td></tr>' +
          '<tr><td>Adaptive Mode</td><td>Instant, after each question</td><td>Your choice, weighted toward weak spots</td><td>Targeted review</td></tr>' +
          '<tr><td>Final Exam</td><td>Withheld until quiz ends</td><td>Always all 12 topics</td><td>Full-length, comprehensive simulation</td></tr>' +
          '</tbody></table>' + '</div>' +
          '<p>Adaptive Mode selects questions using a weighted algorithm that favors questions you haven\u2019t seen yet, questions you\u2019ve previously answered incorrectly, and topics where your overall accuracy is lower.</p>' +
          '<div class="note-box amber"><h4>About Final Exam Mode</h4><p>Final Exam mirrors the real NAPLEX: a long, mixed-topic assessment with no mid-test feedback. Because it always draws from all 12 topics, the topic picker is replaced with a single-select <strong>Level</strong> control (All Levels / Easy / Medium / Hard).</p></div>' +
          '<h4 class="mh4">Topics, difficulty, question type &amp; count</h4>' +
          '<p>For Practice, Exam, and Adaptive modes, choose any combination of the 12 topics and any combination of Easy/Medium/Hard difficulty (at least one of each must stay selected). The Question Type control filters by <strong>Standard</strong> (single-best-answer), <strong>Case-Based</strong> (patient vignettes), or <strong>Calculations</strong> (pharmacy math) \u2014 any combination, at least one active. A slider sets how many questions the quiz contains, bounded by how many match your current filters. Click \u201cStart Quiz\u201d once at least one question matches.</p>' +

          '<h3 id="taking-quiz" class="mh">5. Taking a Quiz</h3>' +
          '<h4 class="mh4">The question card</h4>' +
          '<p>Each question displays a topic badge, a type badge (Case-Based or Calculation, when applicable), a difficulty badge, and the question stem with four or five answer options labeled A\u2013D (or A\u2013E).</p>' +
          '<h4 class="mh4">Answering</h4>' +
          '<p>In <strong>Practice / Adaptive</strong> mode, the correct answer is highlighted immediately after you click, with an explanation box when one is available. In <strong>Exam / Final Exam</strong> mode, your selection is simply marked as chosen with no indication of correctness until the quiz ends. Once answered, a question locks \u2014 use \u201cNext Question\u201d (or \u201cFinish Quiz\u201d) to proceed.</p>' +
          '<p>A small number of questions accept more than one correct answer; selecting any accepted answer is scored correct, and the review screen shows all accepted answers. The \u201cExit quiz\u201d button ends your attempt without saving a score (with a confirmation prompt).</p>' +

          '<h3 id="results-review" class="mh">6. Results &amp; Review</h3>' +
          '<p>When a quiz ends you\u2019ll see your score and a short calibrated message, a topic breakdown for that specific attempt, and a full review of every question \u2014 your answer vs. the correct answer, the explanation (when available), and a topic reference. This review is the primary study tool after an Exam or Final Exam attempt, since it\u2019s the first time you see which answers were right or wrong.</p>' +

          '<h3 id="progress-help" class="mh">7. Progress Tracking</h3>' +
          '<p>The Progress tab shows a <strong>score trend</strong> chart across your last 20 attempts, <strong>accuracy by difficulty</strong> across everything you\u2019ve done, a detailed <strong>topic mastery table</strong> (coverage, attempts, accuracy, mastery badge per topic), and your 15 most recent <strong>quiz history</strong> entries. A \u201cReset all data\u201d button permanently erases all saved progress from this browser \u2014 useful if you want to start tracking from a clean slate.</p>' +

          '<h3 id="faq" class="mh">8. Troubleshooting &amp; FAQ</h3>' +
          '<dl class="manual-faq">' +
          '<dt>Why is my progress showing 0 again?</dt><dd>Progress is saved in your browser\u2019s local storage, tied to that specific browser and device. It resets if you open the file in a different browser, use a private/incognito window, switch computers, or clear your browsing data. It is not stored in the file itself or any cloud account.</dd>' +
          '<dt>Can I use this on my phone or tablet?</dt><dd>Yes \u2014 the app is responsive and works in any mobile browser. Progress is saved locally to that device, separately from your desktop progress.</dd>' +
          '<dt>Why doesn\u2019t every question have an explanation?</dt><dd>Explanations are included wherever the source material provided one. Where none was provided, the app shows the correct answer without inventing a rationale.</dd>' +
          '<dt>Can I back up or share my progress?</dt><dd>Not directly through the app. Progress lives in browser local storage only. Screenshot the Progress tab if you want to preserve a snapshot before clearing data or switching machines.</dd>' +
          '<dt>The quiz builder says \u201c0 questions match your current filters.\u201d What do I do?</dt><dd>Your combination of topic, level/difficulty, and question type is too narrow. Broaden one filter until the count is above zero.</dd>' +
          '<dt>Does this app require an internet connection?</dt><dd>No, once downloaded. The one exception is the display font, which loads from Google Fonts if available; offline, the app falls back to your system font with no loss of functionality.</dd>' +
          '</dl>' +

          '<div class="note-box"><h4>A note on scope</h4><p>This tool is a self-assessment aid, not a substitute for your program\u2019s official NAPLEX preparation materials or board-approved review courses. Use it to identify weak areas and reinforce recall alongside your primary coursework.</p></div>' +

          '<h3 id="disclaimer" class="mh">9. Disclaimer</h3>' +
          '<p>Dosage Forms Q-Bank is an independent, unofficial study aid. It is <strong>not produced, reviewed, endorsed, or affiliated with the National Association of Boards of Pharmacy (NABP)</strong> or any organization that administers the NAPLEX, and \u201cNAPLEX\u201d is referenced solely to describe the exam this tool is intended to help you prepare for.</p>' +
          '<p>Questions, answers, and explanations were compiled from course and study materials and may contain errors, omissions, or content that has since become outdated as pharmacy practice, guidelines, or the official exam blueprint change. Nothing in this app should be treated as authoritative, current, or complete pharmacy, clinical, medical, or legal guidance.</p>' +
          '<p>Your performance within this app \u2014 including your readiness score, quiz results, and mastery badges \u2014 is a rough self-assessment signal only. It is <strong>not predictive</strong> of your performance on the actual NAPLEX and should not be relied upon as the basis for exam-readiness decisions. Always defer to your program\u2019s official curriculum, faculty guidance, and board-approved review resources.</p>' +

          '<h3 id="terms" class="mh">10. Terms of Use</h3>' +
          '<p>By opening and using this application, you agree to the following terms:</p>' +

          '<li><strong>Permitted use.</strong> This tool is provided for personal, educational, non-commercial study use. You may use it to practice and self-assess your knowledge of pharmaceutical dosage forms.</li>' +
          '<li><strong>No warranty.</strong> The app and its content are provided \u201cas is,\u201d without warranty of any kind, express or implied, including but not limited to accuracy, completeness, fitness for a particular purpose, or that use of this tool will lead to any particular exam outcome.</li>' +

          '<li><strong>No redistribution as official material.</strong> Please don\u2019t represent this tool or its contents as official NAPLEX practice material, or as endorsed by any licensing or accrediting body.</li>' +
          '<li><strong>Changes.</strong> Whoever distributes this file to you (your instructor, program, or institution) may update, replace, or discontinue it at any time; these terms apply to the version of the app you currently have open.</li>' +
          '</ul>' +

          '<h3 id="privacy" class="mh">11. Privacy Policy</h3>' +
          '<p>This app is designed with a straightforward, privacy-first architecture:</p>' +
          '<ul>' +
          '<li><strong>No data collection.</strong> The app does not have a server. It does not transmit your quiz answers, scores, progress, or any other information anywhere. There is no account, login, or sign-up, so no personal information is ever requested or stored.</li>' +
          '<li><strong>Local storage only.</strong> Your quiz history and performance statistics are saved using your browser\u2019s built-in local storage, entirely on your own device. This data is never sent over the network, never visible to the app\u2019s creators, and never shared with any third party.</li>' +
          '<li><strong>No cookies, analytics, or tracking.</strong> The app does not use cookies, analytics scripts, advertising pixels, or any other tracking technology.</li>' +
          '<li><strong>One external resource.</strong> When you have an internet connection, the app loads a display font from Google Fonts. This is the only network request the app makes; if you\u2019re offline, the app falls back to your system font automatically and functions identically. Requesting that font file is subject to Google\u2019s own privacy practices, not this app\u2019s.</li>' +
          '<li><strong>Your data, your control.</strong> Because everything is stored locally, you fully control it. Use the \u201cReset all data\u201d button on the Progress tab to permanently erase your saved history, or clear your browser\u2019s site data for this file to achieve the same result.</li>' +

          '<p class="small-muted" style="font-size:.78rem;margin-top:6px;">Last updated: ' + new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) + '.</p>' +

        '</div>' +
      '</div>';

    $("#view").innerHTML = html;

  /* ---------------- Router ---------------- */
  function render() {
    if (route === "dashboard") renderDashboard();
    else if (route === "setup") renderSetup();
    else if (route === "quiz") renderQuiz();
    else if (route === "results") renderResults();
    else if (route === "progress") renderProgress();
    else if (route === "manual") renderManual();
    else renderDashboard();
  }

  /* ---------------- Consent Modal ---------------- */
  var CONSENT_KEY = "naplex_qbank_consent_v1";
  function hasConsented() {
    try { return localStorage.getItem(CONSENT_KEY) === "1"; }
    catch (e) { return true; } // if storage is unavailable, don't block usage
  }
  function grantConsent() {
    try { localStorage.setItem(CONSENT_KEY, "1"); } catch (e) { /* ignore */ }
    var overlay = document.getElementById("consentOverlay");
    if (overlay) overlay.remove();
    document.body.style.overflow = "";
  }
  function showConsentModal() {
    document.body.style.overflow = "hidden";
    var overlay = el(
      '<div class="consent-overlay" id="consentOverlay">' +
        '<div class="consent-modal" role="dialog" aria-modal="true" aria-labelledby="consentTitle">' +
          '<div class="consent-header">' +
            '<h2 id="consentTitle">Before you start</h2>' +
            '<p>Please read the summary below. Full text is always available in the Manual tab.</p>' +
          '</div>' +
          '<div class="consent-body">' +
            '<h4>Disclaimer</h4>' +
            '<p>This is an independent, unofficial study aid \u2014 it is <strong>not affiliated with, endorsed by, or reviewed by NABP</strong> or any organization that administers the NAPLEX. Questions and explanations may contain errors or become outdated. Your results here are a rough self-assessment signal only and are <strong>not predictive</strong> of your actual exam outcome. Always defer to your program\u2019s official curriculum and board-approved review materials.</p>' +
            '<h4>Terms of Use</h4>' +
            '<ul>' +
              '<li>Provided \u201cas is,\u201d for personal educational use, with no warranty of accuracy or fitness for any purpose.</li>' +
              '<li>The creators and distributors are not liable for any outcome connected to your use of this tool.</li>' +
            '</ul>' +
            '<h4>Privacy</h4>' +
            '<ul>' +
              '<li>This app has no server and collects nothing. There is no account, login, or tracking.</li>' +
              '<li>Your quiz history and scores are saved only in your browser\u2019s local storage, on this device, and are never transmitted anywhere.</li>' +
              '<li>The only network request is an optional font load from Google Fonts; the app works fully offline without it.</li>' +
            '</ul>' +
          '</div>' +
          '<div class="consent-footer">' +
            '<label class="consent-check">' +
              '<input type="checkbox" id="consentCheckbox" onchange="App.onConsentCheck(this.checked)">' +
              '<span>I have read and agree to the Disclaimer, Terms of Use, and Privacy Policy.</span>' +
            '</label>' +
            '<div class="consent-actions" id="consentActions">' +
              '<button class="consent-decline" onclick="App.declineConsent()">I don\u2019t agree</button>' +
              '<button class="btn btn-primary" id="consentAgreeBtn" disabled onclick="App.agreeConsent()">Agree &amp; Start Studying</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    document.body.appendChild(overlay);
  }
  App.onConsentCheck = function (checked) {
    var btn = document.getElementById("consentAgreeBtn");
    if (btn) btn.disabled = !checked;
  };
  App.agreeConsent = function () { grantConsent(); };
  App.declineConsent = function () {
    var actions = document.getElementById("consentActions");
    if (actions) {
      actions.innerHTML = '<span class="consent-declined-msg">You can close this browser tab. No data was collected or saved.</span>';
    }
  };

  /* ---------------- Init ---------------- */
  function init() {
    renderNav();
    render();
    if (!hasConsented()) showConsentModal();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
