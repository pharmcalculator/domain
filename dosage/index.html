Vaginal delivery for localized mucosal action (e.g., contraceptive"},{"key":"C","text":"Urethral delivery of systemic antihypertensives"},{"key":"D","text":"Ophthalmic systemic delivery"}],"correct":"B","explanation":"Glycerinated gelatin bases dissolve slowly in mucous secretions, making them suitable for localized vaginal administration.","reference":"Suppositories"},{"id":"suppositories_91","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"What is the typical weight of a standard adult rectal suppository prepared with a cocoa butter base?","options":[{"key":"A","text":"0.5 gram"},{"key":"B","text":"1 gram"},{"key":"C","text":"2 grams"},{"key":"D","text":"5 grams"}],"correct":"C","explanation":"Standard adult rectal suppositories weigh approximately 2 grams when using cocoa butter; pediatric suppositories weigh approximately 1 gram.","reference":"Suppositories"},{"id":"suppositories_92","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"The presence of water in a suppository formulation generally leads to:","options":[{"key":"A","text":"Accelerated drug degradation, microbial growth, and need for"},{"key":"B","text":"Increased structural stability and hardness"},{"key":"C","text":"Shorter melt time in fatty bases"},{"key":"D","text":"Complete elimination of skin irritation"}],"correct":"A","explanation":"Water in suppositories promotes hydrolysis of drugs, microbial contamination, and crystallization as water evaporates.","reference":"Suppositories"},{"id":"suppositories_93","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which base is a semi-synthetic fatty base that does NOT exhibit unstable polymorphism like cocoa butter?","options":[{"key":"A","text":"Fattibase / Witepsol"},{"key":"B","text":"Polyethylene Glycol 4000"},{"key":"C","text":"Glycerinated gelatin"},{"key":"D","text":"Stearic acid"}],"correct":"A","explanation":"Fattibase and Witepsol are hard-fat bases designed with narrow melting ranges that avoid unstable polymorphism during heating.","reference":"Suppositories"},{"id":"suppositories_94","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"To prevent air bubbles and premature settling of insoluble drug powders during suppository fusion molding, the compounded liquid mass should be poured:","options":[{"key":"A","text":"At maximum boiling temperature into cold molds"},{"key":"B","text":"Just above the solidification point with continuous stirring"},{"key":"C","text":"Directly into frozen metal molds"},{"key":"D","text":"Under a deep vacuum seal"}],"correct":"B","explanation":"Pouring near the congealing temperature ensures high viscosity, preventing heavy powder particles from settling to the tip.","reference":"Suppositories"},{"id":"suppositories_95","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"What is the purpose of 'overfilling' suppository mold cavities during pour molding?","options":[{"key":"A","text":"To make the suppositories heavier than commercial doses"},{"key":"B","text":"To compensate for volumetric contraction/shrinkage of the base"},{"key":"C","text":"To eliminate the need for mold lubricants"},{"key":"D","text":"To ensure complete evaporation of residual water"}],"correct":"B","explanation":"Bases shrink upon cooling, creating a depression at the top. Overfilling leaves extra mass that is scraped flat after cooling.","reference":"Suppositories"},{"id":"suppositories_96","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"hard","question":"Which of the following describes the mechanism of action for glycerin suppositories used for constipation?","options":[{"key":"A","text":"Systemic stimulation of the enteric nervous system"},{"key":"B","text":"Local hyperosmotic draw of fluid causing mucosal irritation and"},{"key":"C","text":"Direct enzymatic digestion of stool mass"},{"key":"D","text":"Neutralization of fecal bile acids"}],"correct":"B","explanation":"Glycerin acts as a local hyperosmotic agent, drawing fluid into the colon, lubricating stool, and stimulating evacuative reflexes.","reference":"Suppositories"},{"id":"suppositories_97","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"A urethral suppository (e.g., MUSE / alprostadil) is also historically known as a:","options":[{"key":"A","text":"Pessary"},{"key":"B","text":"Bougie"},{"key":"C","text":"Insert"},{"key":"D","text":"Chartula"}],"correct":"B","explanation":"Urethral suppositories were traditionally called bougies; vaginal suppositories were termed pessaries.","reference":"Suppositories"},{"id":"suppositories_98","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which packaging requirement is essential for cocoa butter suppositories dispensed in warm summer months?","options":[{"key":"A","text":"Refrigerated storage (2-8 deg C)"},{"key":"B","text":"Light-protected glass bottle at room temperature"},{"key":"C","text":"Vacuum-sealed foil pouches with desiccant"},{"key":"D","text":"Permeable cardboard box"}],"correct":"A","explanation":"Cocoa butter melts at 34-35 deg C. High ambient heat softens or melts them unless refrigerated.","reference":"Suppositories"},{"id":"suppositories_99","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which physiological factor reduces rectal drug absorption compared to small intestine absorption?","options":[{"key":"A","text":"Higher mucosal surface area due to villi in the rectum"},{"key":"B","text":"Smaller mucosal surface area and low fluid volume (\\~3 mL) in the"},{"key":"C","text":"Increased motility and peristaltic churning in the rectum"},{"key":"D","text":"Highly acidic rectal fluid pH (\\~1.2)"}],"correct":"B","explanation":"^2) and minimal fluid volume compared to the small intestine.","reference":"Suppositories"},{"id":"suppositories_100","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"When inserting a rectal suppository, the patient should lie in which position for optimal placement and retention?","options":[{"key":"A","text":"Supine with arms raised"},{"key":"B","text":"Sims\\' position (lying on side with upper knee bent)"},{"key":"C","text":"Prone with head elevated"},{"key":"D","text":"High Fowler\\'s upright position"}],"correct":"B","explanation":"' position (left lateral side with right knee flexed) allows comfortable insertion along the natural anatomical curve of the rectum.","reference":"Suppositories"},{"id":"modified_release_101","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Patients taking Concerta (methylphenidate) should be counseled about observing an intact tablet shell in their stool. This drug delivery technology is called:","options":[{"key":"A","text":"Enteric coated matrix"},{"key":"B","text":"OROS (Osmotic Release Oral System)"},{"key":"C","text":"Soluble hydrophilic gel"},{"key":"D","text":"Microencapsulated ion-exchange resin"}],"correct":"B","explanation":"OROS utilizes an insoluble semipermeable membrane shell with an osmotically active core that pushes drug through a laser-drilled orifice, leaving an intact shell excreted in stool.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_102","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"What happens when an extended-release dosage form undergoes 'dose dumping' due to co-ingestion with alcohol?","options":[{"key":"A","text":"The drug is completely inactivated"},{"key":"B","text":"The entire dose is released prematurely, causing rapid toxicity"},{"key":"C","text":"Absorption is delayed by 24 hours"},{"key":"D","text":"The formulation forms an insoluble precipitate in the stomach"}],"correct":"B","explanation":"Alcohol can dissolve protective polymer matrices or coatings, releasing the entire extended dose simultaneously (dose dumping).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_103","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Hydrophilic matrix tablets (e.g., using Hypromellose / HPMC) control drug release primarily through which mechanism upon hydration?","options":[{"key":"A","text":"Formation of a viscous gel barrier through which drug diffuses"},{"key":"B","text":"Rapid osmotic bursting of the tablet coat"},{"key":"C","text":"Acid-dependent enzymatic cleavage"},{"key":"D","text":"Ion exchange with GI electrolytes"}],"correct":"A","explanation":"HPMC hydrates in water to form a swollen gel layer. Drug release occurs by slow diffusion through the gel layer and erosion of the matrix.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_104","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Enteric coatings like cellulose acetate phthalate or Eudragit L dissolve specifically in environments where the pH is:","options":[{"key":"A","text":"Less than 2.0 (stomach)"},{"key":"B","text":"Greater than 5.5 to 6.0 (duodenum/jejunum)"},{"key":"C","text":"Neutral 7.4 in systemic blood only"},{"key":"D","text":"Extremely basic (> 10.0)"}],"correct":"B","explanation":"Enteric polymers contain carboxyl groups that remain un-ionized and insoluble in stomach acid (pH 1-3) but ionize and dissolve in higher intestinal pH (>5.5).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_105","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Zero-order drug release kinetics from a modified-release formulation indicates that:","options":[{"key":"A","text":"The rate of drug release is proportional to remaining drug"},{"key":"B","text":"The rate of drug release is constant over time, independent of"},{"key":"C","text":"Drug release occurs only after a 12-hour lag time"},{"key":"D","text":"Drug is released exponentially in rapid bursts"}],"correct":"B","explanation":"Zero-order delivery maintains a constant amount of drug released per unit time, resulting in stable plasma concentration.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_106","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Toprol XL (metoprolol succinate extended-release) is one of the few extended-release tablets that can be split at the score line because:","options":[{"key":"A","text":"It is a liquid gel capsule"},{"key":"B","text":"It consists of coated micro-pellets compressed into a scored"},{"key":"C","text":"It uses an insoluble plastic matrix shell"},{"key":"D","text":"It is an immediate-release tablet with a slow half-life"}],"correct":"B","explanation":"Toprol XL consists of multiple unit reservoir pellets. Splitting along the score line leaves individual coated pellets intact.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_107","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which modified-release technology uses insoluble synthetic polymers (e.g., ethylcellulose, PVC) that remain intact throughout the GI tract and release drug by diffusion?","options":[{"key":"A","text":"Insoluble polymer matrix"},{"key":"B","text":"Hydrophilic eroding matrix"},{"key":"C","text":"Soluble enteric film"},{"key":"D","text":"Ion-exchange resin complex"}],"correct":"A","explanation":"Insoluble polymer matrices form a porous rigid structure. GI fluids enter pores, dissolve the drug, and diffuse out while the inert matrix is excreted intact.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_108","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Ion-exchange resin delivery systems (e.g., Tussionex liquid suspension) release drug in the GI tract by exchanging bound drug ions for:","options":[{"key":"A","text":"Endogenous ions like Na+ and Cl- in digestive fluids"},{"key":"B","text":"Water molecules"},{"key":"C","text":"Bile salts exclusively"},{"key":"D","text":"Pancreatic lipase enzymes"}],"correct":"A","explanation":"Drug-resin complexes exchange ionic drug molecules for ions (Na+, Cl-) naturally present in GI fluids at a controlled rate.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_109","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"A delayed-release (DR) formulation differs fundamentally from an extended-release (ER) formulation because DR:","options":[{"key":"A","text":"Prolongs drug action over 24 hours continuously"},{"key":"B","text":"Releases the drug at a time other than immediately after"},{"key":"C","text":"Achieves zero-order absorption throughout the entire GI tract"},{"key":"D","text":"Bypasses systemic circulation entirely"}],"correct":"B","explanation":"Delayed-release delays release until reaching a target site (e.g., enteric coating), whereas extended-release prolongs duration of action.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_110","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"What is the primary rationale for formulating a short half-life drug (t1/2 < 2 hours) into an extended-release oral dosage form?","options":[{"key":"A","text":"To avoid hepatic metabolism entirely"},{"key":"B","text":"To reduce dosing frequency and maintain therapeutic plasma levels"},{"key":"C","text":"To increase maximum peak plasma concentration (Cmax)"},{"key":"D","text":"To reduce overall manufacturing cost"}],"correct":"B","explanation":"ER formulations extend duration of action for short half-life drugs, improving patient adherence and avoiding toxicity from peak spikes.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_111","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Co-administration of high-fat meals with certain modified-release formulations can significantly alter drug absorption by:","options":[{"key":"A","text":"Enhancing matrix dissolution or delaying gastric emptying"},{"key":"B","text":"Permanently binding the active drug"},{"key":"C","text":"Destroying the drug molecule via oxidation"},{"key":"D","text":"Neutralizing stomach acidity"}],"correct":"A","explanation":"High-fat meals delay gastric emptying, increase bile secretions, or dissolve lipophilic matrix components, altering absorption profiles.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_112","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which extended-release mechanism relies on semipermeable membrane coatings surrounding a core with an osmotic push layer?","options":[{"key":"A","text":"Elementary Osmotic Pump (EOP) / Push-Pull System"},{"key":"B","text":"Erodible hydrogel matrix"},{"key":"C","text":"Ion-exchange complexation"},{"key":"D","text":"Fluidized bed granule coating"}],"correct":"A","explanation":"Push-pull osmotic systems have an upper drug layer and lower osmotic push layer; water influx expands the push layer, pumping drug out.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_113","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Why are drugs with very large single doses (e.g., > 1000 mg) generally UNSUITABLE for extended-release tablet conversion?","options":[{"key":"A","text":"They cannot be dissolved in stomach acid"},{"key":"B","text":"The added matrix excipients would make the resulting tablet too"},{"key":"C","text":"They exhibit zero-order elimination in blood"},{"key":"D","text":"They cause irreversible renal failure"}],"correct":"B","explanation":"ER tablets require substantial amounts of rate-controlling polymers. High-dose active drugs yield impractically large tablets.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_114","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Bystolic (nebivolol) or similar immediate-release drugs differ from modified-release drugs primarily in terms of:","options":[{"key":"A","text":"Inherent elimination half-life vs. formulation-controlled release"},{"key":"B","text":"Route of administration"},{"key":"C","text":"Chemical purity requirements"},{"key":"D","text":"Need for FDA Orange Book ratings"}],"correct":"A","explanation":"Long-acting drugs achieve prolonged action due to long intrinsic half-lives; modified-release drugs rely on formulation technology to prolong action of short half-life drugs.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_115","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"What is a major counseling point for a patient prescribed an Enteric-Coated Aspirin (Ecotrin) tablet for cardio-protection?","options":[{"key":"A","text":"Crush the tablet for faster heart attack protection"},{"key":"B","text":"Swallow whole; do not crush or chew, as this destroys the"},{"key":"C","text":"Take with high-proof alcohol to speed absorption"},{"key":"D","text":"Dissolve in hot water before drinking"}],"correct":"B","explanation":"Chewing or crushing enteric-coated tablets exposes gastric mucosa to direct drug contact, causing stomach irritation.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_116","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"Transdermal patch drug delivery systems (e.g., Duragesic / fentanyl) provide modified release across skin primarily via:","options":[{"key":"A","text":"Active electrical iontophoresis continuously"},{"key":"B","text":"Passive diffusion across the stratum corneum barrier"},{"key":"C","text":"Thermal skin ablation"},{"key":"D","text":"Subcutaneous capillary suction"}],"correct":"B","explanation":"Transdermal patches deliver small, lipophilic drugs across the rate-limiting stratum corneum barrier into systemic circulation via passive diffusion.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_117","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"easy","question":"Which of the following is an example of a Pulsatile-Release drug delivery system?","options":[{"key":"A","text":"Adderall XR (delivering two sequential bursts: immediate release"},{"key":"B","text":"Concerta OROS"},{"key":"C","text":"Toprol XL"},{"key":"D","text":"Slow-K"}],"correct":"A","explanation":"Pulsatile release provides rapid release bursts at specific time intervals (e.g., dual-bead technology mimic two daily doses).","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_118","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"medium","question":"What role does ethylcellulose play in modified-release bead technology (such as Focalin XR capsules)?","options":[{"key":"A","text":"Superdisintegrant to speed breakdown"},{"key":"B","text":"Insoluble water-permeable film coating controlling drug diffusion"},{"key":"C","text":"Soluble binder for immediate release"},{"key":"D","text":"pH-sensitive enteric polymer"}],"correct":"B","explanation":"Ethylcellulose is a water-insoluble polymer used to coat drug beads, controlling diffusion rate based on film coating thickness.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_119","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Why must extended-release potassium chloride tablets (e.g., K-Tab, Micro-K) be designed to release potassium slowly throughout the GI tract?","options":[{"key":"A","text":"Potassium is rapidly destroyed by stomach acid"},{"key":"B","text":"High localized potassium concentrations cause severe GI mucosal"},{"key":"C","text":"Potassium cannot be absorbed in the small intestine"},{"key":"D","text":"To prevent rapid hepatic clearance"}],"correct":"B","explanation":"Rapid localized release of potassium causes mucosal lesions, erosion, and gastrointestinal ulceration; slow release prevents high local concentrations.","reference":"Modified-Release Dosage Forms"},{"id":"modified_release_120","topicId":"modified_release","topicName":"Modified-Release Dosage Forms","type":"mcq","difficulty":"hard","question":"Which term describes a formulation engineered to target drug release at a specific region of the lower GI tract, such as the colon (e.g., Lialda for ulcerative colitis)?","options":[{"key":"A","text":"Targeted / Site-specific modified release"},{"key":"B","text":"Transdermal delivery"},{"key":"C","text":"Zero-order sublingual release"},{"key":"D","text":"Immediate-release buccal matrix"}],"correct":"A","explanation":"Lialda uses MMX technology (pH-dependent coating dissolving at pH >= 7 in terminal ileum combined with multi-matrix core) to target colonic release.","reference":"Modified-Release Dosage Forms"},{"id":"ointments_b2_1","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which base is most appropriate for a water-soluble drug intended for release from an ointment?","options":[{"key":"A","text":"Hydrocarbon base"},{"key":"B","text":"Absorption base"},{"key":"C","text":"Water-removable base"},{"key":"D","text":"Oleaginous base"}],"correct":"C","explanation":"Water-removable (O/W emulsion) bases generally allow better release of water-soluble drugs than oleaginous bases.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_2","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement best describes an oleaginous ointment base?","options":[{"key":"A","text":"It contains water and is washable"},{"key":"B","text":"It is occlusive and promotes hydration of the stratum corneum"},{"key":"C","text":"It is primarily used for weeping lesions"},{"key":"D","text":"It has high drug release for hydrophilic drugs"}],"correct":"B","explanation":"Oleaginous (hydrocarbon) bases are occlusive, emollient, and enhance skin hydration.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_3","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"Which ointment base is classified as an absorption base?","options":[{"key":"A","text":"Petrolatum"},{"key":"B","text":"Hydrophilic petrolatum"},{"key":"C","text":"Lanolin"},{"key":"D","text":"Polyethylene glycol ointment"}],"correct":"C","explanation":"Lanolin and lanolin derivatives are classic absorption bases that can incorporate some aqueous solutions.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_4","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"A patient complains that an ointment is \"too greasy\" and difficult to wash off. Which base type is most likely responsible?","options":[{"key":"A","text":"Water-soluble base"},{"key":"B","text":"Water-removable base"},{"key":"C","text":"Oleaginous base"},{"key":"D","text":"Emulsion base"}],"correct":"C","explanation":"Oleaginous bases (e.g., petrolatum) are greasy and not easily washed off with water.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_5","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which factor most favors drug release from an ointment?","options":[{"key":"A","text":"High affinity of drug for the base"},{"key":"B","text":"Low affinity of drug for the base"},{"key":"C","text":"High viscosity of the base"},{"key":"D","text":"Large particle size of drug in suspension"}],"correct":"B","explanation":"Drugs with lower affinity for the base partition more readily into the skin, enhancing release.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_6","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which ointment base is most suitable for incorporating a large volume of aqueous solution?","options":[{"key":"A","text":"White petrolatum"},{"key":"B","text":"Hydrophilic petrolatum"},{"key":"C","text":"Polyethylene glycol (PEG) ointment"},{"key":"D","text":"Mineral oil"}],"correct":"C","explanation":"PEG ointments are water-soluble and can incorporate significant amounts of aqueous solutions.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_7","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which characteristic is typical of water-removable ointment bases?","options":[{"key":"A","text":"They are occlusive and non-washable"},{"key":"B","text":"They are O/W emulsions and washable with water"},{"key":"C","text":"They cannot incorporate aqueous solutions"},{"key":"D","text":"They are primarily hydrocarbon-based"}],"correct":"B","explanation":"Water-removable bases are O/W emulsions, less occlusive, and washable.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_8","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement about ointment preparation by fusion is correct?","options":[{"key":"A","text":"All components must be water-soluble"},{"key":"B","text":"Heat-sensitive drugs should be added after cooling"},{"key":"C","text":"The base must always be melted at >100\u00b0C"},{"key":"D","text":"Levigation is not used with fusion"}],"correct":"B","explanation":"Heat-sensitive drugs are added after the base has cooled to avoid degradation.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_9","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which ointment base is most likely to cause stinging on application to broken skin?","options":[{"key":"A","text":"Petrolatum"},{"key":"B","text":"Lanolin"},{"key":"C","text":"Polyethylene glycol"},{"key":"D","text":"Mineral oil"}],"correct":"C","explanation":"PEG bases can sting or irritate damaged skin due to their hygroscopic nature.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_10","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"medium","question":"A pharmacist is compounding an ointment with a solid drug. Which technique is used to reduce particle size and ensure smoothness?","options":[{"key":"A","text":"Trituration"},{"key":"B","text":"Levigation"},{"key":"C","text":"Spatulation"},{"key":"D","text":"Decantation"}],"correct":"B","explanation":"Levigation uses a non-solvent to reduce particle size and improve smoothness in semisolids.1{.underline}","reference":"Ointments & Semisolids"},{"id":"ointments_b2_11","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which route of administration is most commonly associated with ointments?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Topical"},{"key":"C","text":"Sublingual"},{"key":"D","text":"Inhalation"}],"correct":"B","explanation":"Ointments are primarily topical dosage forms.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_12","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which property makes an ointment base more occlusive?","options":[{"key":"A","text":"High water content"},{"key":"B","text":"High oil content with minimal water"},{"key":"C","text":"Presence of surfactants"},{"key":"D","text":"Low viscosity"}],"correct":"B","explanation":"High oil content and low water content increase occlusivity.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_13","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which ointment base is most appropriate for a patient with a known lanolin allergy?","options":[{"key":"A","text":"Hydrophilic petrolatum"},{"key":"B","text":"White ointment USP"},{"key":"C","text":"Anhydrous lanolin"},{"key":"D","text":"Aquaphor-type absorption base"}],"correct":"B","explanation":"White ointment (petrolatum-based) avoids lanolin.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_14","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement about ointment stability is correct?","options":[{"key":"A","text":"Ointments never require preservatives"},{"key":"B","text":"Microbial growth is impossible in oleaginous bases"},{"key":"C","text":"Water-containing bases may require preservatives"},{"key":"D","text":"All ointments are stable indefinitely at room temperature"}],"correct":"C","explanation":"Bases containing water can support microbial growth and often need preservatives.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_15","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which factor would decrease the rate of drug release from an ointment?","options":[{"key":"A","text":"Decreased base viscosity"},{"key":"B","text":"Increased drug solubility in the base"},{"key":"C","text":"Increased drug concentration in the base"},{"key":"D","text":"Increased skin hydration"}],"correct":"B","explanation":"Higher drug solubility in the base reduces the driving force for partitioning into skin.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_16","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used to adjust the consistency of ointments?","options":[{"key":"A","text":"Sodium chloride"},{"key":"B","text":"Microcrystalline cellulose"},{"key":"C","text":"White wax"},{"key":"D","text":"Glycerin"}],"correct":"C","explanation":"Waxes (e.g., white wax) are used to stiffen ointment bases.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_17","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which ointment base is most likely to be incompatible with silver salts?","options":[{"key":"A","text":"Petrolatum"},{"key":"B","text":"Polyethylene glycol"},{"key":"C","text":"Lanolin"},{"key":"D","text":"Mineral oil"}],"correct":"B","explanation":"PEG bases can complex with certain metal ions, including silver.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_18","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which description best fits a \"water-soluble\" ointment base?","options":[{"key":"A","text":"Contains no water but absorbs it"},{"key":"B","text":"Contains water and oil in an O/W emulsion"},{"key":"C","text":"Contains no oleaginous components and is washable with water"},{"key":"D","text":"Contains primarily hydrocarbons"}],"correct":"C","explanation":"Water-soluble bases (e.g., PEG ointments) contain no oil and are water-washable.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_19","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which statement about ointment packaging is correct?","options":[{"key":"A","text":"Ointments should always be packaged in glass only"},{"key":"B","text":"Collapsible tubes help minimize contamination and oxidation"},{"key":"C","text":"Wide-mouth jars are preferred for all ointments"},{"key":"D","text":"Ointments do not require protection from light"}],"correct":"B","explanation":"Collapsible tubes reduce exposure to air and contamination.","reference":"Ointments & Semisolids"},{"id":"ointments_b2_20","topicId":"ointments","topicName":"Ointments & Semisolids","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most appropriate for ointment use?","options":[{"key":"A","text":"Apply a thick layer to enhance absorption"},{"key":"B","text":"Rub vigorously until completely absorbed"},{"key":"C","text":"Apply a thin film to the affected area"},{"key":"D","text":"Use only on broken skin for best effect"}],"correct":"C","explanation":"Ointments are typically applied as a thin film to the affected area.","reference":"Ointments & Semisolids"},{"id":"capsules_b2_1","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule type is most suitable for filling with liquids or semi-solids?","options":[{"key":"A","text":"Hard gelatin capsule"},{"key":"B","text":"Soft gelatin capsule"},{"key":"C","text":"Enteric-coated hard capsule"},{"key":"D","text":"HPMC capsule"}],"correct":"B","explanation":"Soft gelatin capsules are designed to encapsulate liquids and semi-solids.","reference":"Capsules"},{"id":"capsules_b2_2","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"A patient reports that a capsule sticks in the throat. Which counseling point is most appropriate?","options":[{"key":"A","text":"Crush the capsule and mix with food"},{"key":"B","text":"Take with a full glass of water while upright"},{"key":"C","text":"Chew the capsule before swallowing"},{"key":"D","text":"Take the capsule on an empty stomach only"}],"correct":"B","explanation":"Taking with plenty of water while upright helps prevent esophageal lodging.","reference":"Capsules"},{"id":"capsules_b2_3","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which statement about hard gelatin capsules is correct?","options":[{"key":"A","text":"They consist of a single piece"},{"key":"B","text":"They are filled as two separate pieces (body and cap)"},{"key":"C","text":"They cannot contain powders"},{"key":"D","text":"They are always enteric-coated"}],"correct":"B","explanation":"Hard capsules have a body and cap that are filled and then joined.","reference":"Capsules"},{"id":"capsules_b2_4","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a diluent in capsule formulations?","options":[{"key":"A","text":"Glycerin"},{"key":"B","text":"Lactose"},{"key":"C","text":"Propylene glycol"},{"key":"D","text":"Sorbitol"}],"correct":"B","explanation":"Lactose and other powders are common diluents in hard capsules.","reference":"Capsules"},{"id":"capsules_b2_5","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule shell material is most appropriate for a vegetarian patient?","options":[{"key":"A","text":"Gelatin derived from bovine source"},{"key":"B","text":"Gelatin derived from porcine source"},{"key":"C","text":"Hypromellose (HPMC)"},{"key":"D","text":"Soft gelatin"}],"correct":"C","explanation":"HPMC capsules are plant-based and suitable for vegetarians.","reference":"Capsules"},{"id":"capsules_b2_6","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which factor most affects the stability of gelatin capsules in high-humidity environments?","options":[{"key":"A","text":"Increased brittleness"},{"key":"B","text":"Softening and deformation"},{"key":"C","text":"Increased dissolution rate"},{"key":"D","text":"No effect"}],"correct":"B","explanation":"High humidity can cause gelatin capsules to soften and deform.2{.underline}()","reference":"Capsules"},{"id":"capsules_b2_7","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which statement about modified-release capsules is correct?","options":[{"key":"A","text":"They should never be opened under any circumstances"},{"key":"B","text":"Some may be opened and sprinkled on food if labeled appropriately"},{"key":"C","text":"They release drug only in the stomach"},{"key":"D","text":"They contain only liquid fills"}],"correct":"B","explanation":"Some MR capsules contain coated beads that can be sprinkled if the labeling allows.","reference":"Capsules"},{"id":"capsules_b2_8","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule defect is characterized by separation of the cap from the body?","options":[{"key":"A","text":"Telescoping"},{"key":"B","text":"Cracking"},{"key":"C","text":"Banding failure"},{"key":"D","text":"Cap-body separation"}],"correct":"D","explanation":"Cap-body separation is a common capsule defect affecting integrity.","reference":"Capsules"},{"id":"capsules_b2_9","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"medium","question":"Which dissolution test condition is typically used for capsules in USP?","options":[{"key":"A","text":"Simulated gastric fluid at 37\u00b0C"},{"key":"B","text":"Simulated intestinal fluid at 25\u00b0C"},{"key":"C","text":"Water at 100\u00b0C"},{"key":"D","text":"Ethanol at 37\u00b0C"}],"correct":"A","explanation":"Capsules are often tested in simulated gastric/intestinal fluids at 37\u00b0C.","reference":"Capsules"},{"id":"capsules_b2_10","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which drug property makes a soft gelatin capsule particularly advantageous?","options":[{"key":"A","text":"High melting point solid"},{"key":"B","text":"Poorly water-soluble liquid or oil solution"},{"key":"C","text":"Highly hygroscopic powder"},{"key":"D","text":"Gas at room temperature"}],"correct":"B","explanation":"Softgels are ideal for lipophilic liquids and oil solutions.","reference":"Capsules"},{"id":"capsules_b2_11","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which storage condition is most critical for maintaining capsule integrity?","options":[{"key":"A","text":"Protection from light only"},{"key":"B","text":"Controlled temperature and humidity"},{"key":"C","text":"Freezing temperatures"},{"key":"D","text":"High humidity to prevent brittleness"}],"correct":"B","explanation":"Temperature and humidity control prevent softening or brittleness.","reference":"Capsules"},{"id":"capsules_b2_12","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which statement about capsule filling is correct?","options":[{"key":"A","text":"Powders must be compressible like tablets"},{"key":"B","text":"Flow properties of the powder are critical for uniform fill weight"},{"key":"C","text":"Capsules cannot contain more than one drug"},{"key":"D","text":"All capsules are filled by hand in commercial manufacturing"}],"correct":"B","explanation":"Good powder flow ensures uniform fill weight and dose.","reference":"Capsules"},{"id":"capsules_b2_13","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule type is most appropriate for a drug that is unstable in the presence of moisture?","options":[{"key":"A","text":"Soft gelatin capsule with aqueous fill"},{"key":"B","text":"Hard gelatin capsule with hygroscopic excipients"},{"key":"C","text":"HPMC capsule with desiccant in packaging"},{"key":"D","text":"Uncoated gelatin capsule stored in high humidity"}],"correct":"C","explanation":"HPMC capsules with desiccants better protect moisture-sensitive drugs.","reference":"Capsules"},{"id":"capsules_b2_14","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which patient population may require special consideration with gelatin capsules?","options":[{"key":"A","text":"Patients with lactose intolerance"},{"key":"B","text":"Patients with certain religious dietary restrictions"},{"key":"C","text":"Patients with hypertension"},{"key":"D","text":"Patients with asthma"}],"correct":"B","explanation":"Gelatin may be porcine or bovine, raising religious or dietary concerns.","reference":"Capsules"},{"id":"capsules_b2_15","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule feature allows for delayed release?","options":[{"key":"A","text":"Colored shell"},{"key":"B","text":"Enteric coating on the capsule or internal beads"},{"key":"C","text":"Larger capsule size"},{"key":"D","text":"Soft gelatin construction"}],"correct":"B","explanation":"Enteric coatings prevent release in the stomach.","reference":"Capsules"},{"id":"capsules_b2_16","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule size is typically the largest?","options":[{"key":"A","text":"Size 4"},{"key":"B","text":"Size 2"},{"key":"C","text":"Size 00"},{"key":"D","text":"Size 5"}],"correct":"C","explanation":"Capsule sizes range from 5 (smallest) to 000 (largest); 00 is very large.","reference":"Capsules"},{"id":"capsules_b2_17","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which statement about capsule disintegration is correct?","options":[{"key":"A","text":"Disintegration is not required for capsules"},{"key":"B","text":"Capsules must disintegrate to release drug for absorption"},{"key":"C","text":"Disintegration time is irrelevant to bioavailability"},{"key":"D","text":"All capsules disintegrate in less than 1 minute"}],"correct":"B","explanation":"Disintegration is necessary for drug release and absorption.","reference":"Capsules"},{"id":"capsules_b2_18","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which excipient might be added to capsule formulations to improve powder flow?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Colloidal silicon dioxide"},{"key":"C","text":"Sodium starch glycolate"},{"key":"D","text":"Microcrystalline cellulose"}],"correct":"B","explanation":"Colloidal silicon dioxide is a glidant that improves flow.","reference":"Capsules"},{"id":"capsules_b2_19","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which capsule-related medication error is most dangerous?","options":[{"key":"A","text":"Taking a capsule with juice instead of water"},{"key":"B","text":"Chewing or crushing a modified-release capsule"},{"key":"C","text":"Taking a capsule with food instead of on an empty stomach"},{"key":"D","text":"Storing capsules in a pill organizer"}],"correct":"B","explanation":"Crushing MR capsules can cause dose dumping and toxicity.","reference":"Capsules"},{"id":"capsules_b2_20","topicId":"capsules","topicName":"Capsules","type":"mcq","difficulty":"easy","question":"Which label instruction is most appropriate for a capsule that can be opened?","options":[{"key":"A","text":"\"Do not crush or chew\""},{"key":"B","text":"\"May be opened and contents sprinkled on applesauce\""},{"key":"C","text":"\"Take with grapefruit juice\""},{"key":"D","text":"\"Dissolve in water before taking\""}],"correct":"B","explanation":"Specific labeling indicates when sprinkling is acceptable.","reference":"Capsules"},{"id":"tablets_b2_1","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet type is designed to dissolve in the mouth without water?","options":[{"key":"A","text":"Chewable tablet"},{"key":"B","text":"Orally disintegrating tablet (ODT)"},{"key":"C","text":"Enteric-coated tablet"},{"key":"D","text":"Extended-release tablet"}],"correct":"B","explanation":"ODTs disintegrate rapidly in the mouth without water.","reference":"Tablets"},{"id":"tablets_b2_2","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a binder in tablet formulations?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Microcrystalline cellulose"},{"key":"C","text":"Povidone (PVP)"},{"key":"D","text":"Sodium starch glycolate"}],"correct":"C","explanation":"Povidone is a common binder that promotes granule cohesion.","reference":"Tablets"},{"id":"tablets_b2_3","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet defect is described as separation of the tablet into layers?","options":[{"key":"A","text":"Chipping"},{"key":"B","text":"Capping"},{"key":"C","text":"Picking"},{"key":"D","text":"Mottling"}],"correct":"B","explanation":"Capping is the separation of the top or bottom layer of a tablet.","reference":"Tablets"},{"id":"tablets_b2_4","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which statement about enteric-coated tablets is correct?","options":[{"key":"A","text":"They dissolve rapidly in the stomach"},{"key":"B","text":"They are designed to resist gastric acid and dissolve in the intestine"},{"key":"C","text":"They should be crushed for faster onset"},{"key":"D","text":"They are only used for parenteral drugs"}],"correct":"B","explanation":"Enteric coatings prevent release in the acidic stomach.","reference":"Tablets"},{"id":"tablets_b2_5","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which excipient is primarily used as a disintegrant in tablets?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Sodium starch glycolate"},{"key":"C","text":"Talc"},{"key":"D","text":"Stearic acid"}],"correct":"B","explanation":"Sodium starch glycolate swells in water to promote disintegration.","reference":"Tablets"},{"id":"tablets_b2_6","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet type is most appropriate for a drug that causes gastric irritation?","options":[{"key":"A","text":"Chewable tablet"},{"key":"B","text":"Enteric-coated tablet"},{"key":"C","text":"Sublingual tablet"},{"key":"D","text":"Effervescent tablet"}],"correct":"B","explanation":"Enteric coating protects the stomach and reduces irritation.","reference":"Tablets"},{"id":"tablets_b2_7","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which manufacturing process involves compressing powder directly without granulation?","options":[{"key":"A","text":"Wet granulation"},{"key":"B","text":"Dry granulation"},{"key":"C","text":"Direct compression"},{"key":"D","text":"Fluid bed coating"}],"correct":"C","explanation":"Direct compression compresses the powder blend directly.2{.underline}","reference":"Tablets"},{"id":"tablets_b2_8","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which test is used to ensure uniformity of drug content in tablets?","options":[{"key":"A","text":"Dissolution test"},{"key":"B","text":"Content uniformity test"},{"key":"C","text":"Friability test"},{"key":"D","text":"Hardness test"}],"correct":"B","explanation":"Content uniformity testing ensures each tablet contains the labeled amount.","reference":"Tablets"},{"id":"tablets_b2_9","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which factor most affects tablet dissolution rate?","options":[{"key":"A","text":"Tablet color"},{"key":"B","text":"Particle size of the drug"},{"key":"C","text":"Packaging material"},{"key":"D","text":"Tablet shape"}],"correct":"B","explanation":"Smaller particle size increases surface area and dissolution rate.2{.underline}","reference":"Tablets"},{"id":"tablets_b2_10","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which statement about extended-release (ER) tablets is correct?","options":[{"key":"A","text":"They can be crushed to facilitate administration"},{"key":"B","text":"They release drug over an extended period to reduce dosing frequency"},{"key":"C","text":"They are designed for immediate release in the stomach"},{"key":"D","text":"They are only available as capsules"}],"correct":"B","explanation":"ER tablets prolong drug release to maintain therapeutic levels.","reference":"Tablets"},{"id":"tablets_b2_11","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a lubricant in tablet formulations?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Magnesium stearate"},{"key":"C","text":"Povidone"},{"key":"D","text":"Starch"}],"correct":"B","explanation":"Magnesium stearate reduces friction during tablet compression.","reference":"Tablets"},{"id":"tablets_b2_12","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet characteristic is measured using a friability tester?","options":[{"key":"A","text":"Hardness"},{"key":"B","text":"Weight variation"},{"key":"C","text":"Tendency to break or chip during handling"},{"key":"D","text":"Dissolution rate"}],"correct":"C","explanation":"Friability measures the tablet's resistance to abrasion.","reference":"Tablets"},{"id":"tablets_b2_13","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with sublingual tablets?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Buccal/sublingual"},{"key":"C","text":"Rectal"},{"key":"D","text":"Transdermal"}],"correct":"B","explanation":"Sublingual tablets are placed under the tongue for rapid absorption.","reference":"Tablets"},{"id":"tablets_b2_14","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet type is designed to release drug in the colon?","options":[{"key":"A","text":"Immediate-release tablet"},{"key":"B","text":"Enteric-coated tablet"},{"key":"C","text":"Colonic-targeted delayed-release tablet"},{"key":"D","text":"Chewable tablet"}],"correct":"C","explanation":"Colonic-targeted systems use pH- or time-dependent coatings.","reference":"Tablets"},{"id":"tablets_b2_15","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which statement about chewable tablets is correct?","options":[{"key":"A","text":"They must be swallowed whole"},{"key":"B","text":"They contain sweeteners and flavorings"},{"key":"C","text":"They are always enteric-coated"},{"key":"D","text":"They are designed for parenteral use"}],"correct":"B","explanation":"Chewables include flavors and sweeteners for palatability.","reference":"Tablets"},{"id":"tablets_b2_16","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which tablet manufacturing issue can result from excessive moisture?","options":[{"key":"A","text":"Capping"},{"key":"B","text":"Sticking and picking"},{"key":"C","text":"Mottling"},{"key":"D","text":"All of the above"}],"correct":"D","explanation":"Excess moisture can cause multiple tablet defects.","reference":"Tablets"},{"id":"tablets_b2_17","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which analytical test is required to ensure that a tablet releases drug at the intended rate?","options":[{"key":"A","text":"Weight variation"},{"key":"B","text":"Dissolution test"},{"key":"C","text":"Hardness test"},{"key":"D","text":"Thickness measurement"}],"correct":"B","explanation":"Dissolution testing verifies drug release profiles.","reference":"Tablets"},{"id":"tablets_b2_18","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"medium","question":"Which tablet type is most appropriate for patients with dysphagia who can still swallow small particles?","options":[{"key":"A","text":"Large ER tablet"},{"key":"B","text":"Orally disintegrating tablet"},{"key":"C","text":"Enteric-coated tablet"},{"key":"D","text":"Sublingual tablet"}],"correct":"B","explanation":"ODTs disintegrate in the mouth, aiding patients with swallowing difficulties.","reference":"Tablets"},{"id":"tablets_b2_19","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which statement about scored tablets is correct?","options":[{"key":"A","text":"They should never be split"},{"key":"B","text":"They are designed to be split for dose adjustment"},{"key":"C","text":"They are only used for controlled substances"},{"key":"D","text":"They are always extended-release"}],"correct":"B","explanation":"Scored tablets are intended to be split for dose flexibility.","reference":"Tablets"},{"id":"tablets_b2_20","topicId":"tablets","topicName":"Tablets","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a filler/diluent in tablets?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Lactose"},{"key":"C","text":"Sodium starch glycolate"},{"key":"D","text":"Povidone"}],"correct":"B","explanation":"Lactose is a widely used diluent in tablet formulations.","reference":"Tablets"},{"id":"powders_b2_1","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which dosage form is defined as a dry, finely divided drug or mixture of drugs intended for internal or external use?","options":[{"key":"A","text":"Ointment"},{"key":"B","text":"Powder"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Suspension"}],"correct":"B","explanation":"Powders are dry, finely divided solid dosage forms.","reference":"Medicinal Powders"},{"id":"powders_b2_2","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which type of powder is intended to be dissolved or dispersed in water before administration?","options":[{"key":"A","text":"Dusting powder"},{"key":"B","text":"Effervescent powder"},{"key":"C","text":"Powder for oral solution/suspension"},{"key":"D","text":"Insufflation powder"}],"correct":"C","explanation":"Powders for oral solution/suspension are reconstituted with water.","reference":"Medicinal Powders"},{"id":"powders_b2_3","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which property is most important for a powder intended for inhalation?","options":[{"key":"A","text":"Large particle size (>100 \u00b5m)"},{"key":"B","text":"Particle size in the respirable range (1--5 \u00b5m)"},{"key":"C","text":"High hygroscopicity"},{"key":"D","text":"High density"}],"correct":"B","explanation":"Particles of 1--5 \u00b5m reach the lower respiratory tract.","reference":"Medicinal Powders"},{"id":"powders_b2_4","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used to improve flow of powders?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Colloidal silicon dioxide"},{"key":"C","text":"Glycerin"},{"key":"D","text":"Propylene glycol"}],"correct":"B","explanation":"Colloidal silicon dioxide is a glidant that improves powder flow.","reference":"Medicinal Powders"},{"id":"powders_b2_5","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which statement about effervescent powders is correct?","options":[{"key":"A","text":"They contain only drug and no excipients"},{"key":"B","text":"They release carbon dioxide upon contact with water"},{"key":"C","text":"They are intended for topical use only"},{"key":"D","text":"They should be taken without dissolving"}],"correct":"B","explanation":"Effervescent powders contain acid and carbonate/bicarbonate that generate CO\u2082 in water.","reference":"Medicinal Powders"},{"id":"powders_b2_6","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which powder type is intended for application to the skin to reduce friction and moisture?","options":[{"key":"A","text":"Insufflation powder"},{"key":"B","text":"Dusting powder"},{"key":"C","text":"Effervescent powder"},{"key":"D","text":"Powder for injection"}],"correct":"B","explanation":"Dusting powders are applied topically to absorb moisture and reduce friction.","reference":"Medicinal Powders"},{"id":"powders_b2_7","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which factor most affects the uniformity of dose in divided powders?","options":[{"key":"A","text":"Color of the powder"},{"key":"B","text":"Particle size and mixing uniformity"},{"key":"C","text":"Packaging material"},{"key":"D","text":"Taste of the powder"}],"correct":"B","explanation":"Uniform particle size and thorough mixing ensure dose uniformity.1{.underline}","reference":"Medicinal Powders"},{"id":"powders_b2_8","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which statement about bulk powders is correct?","options":[{"key":"A","text":"They are pre-divided into individual doses"},{"key":"B","text":"They are dispensed in a single container with instructions to measure each dose"},{"key":"C","text":"They are always sterile"},{"key":"D","text":"They are intended only for parenteral use"}],"correct":"B","explanation":"Bulk powders are dispensed in bulk with directions for measuring doses.","reference":"Medicinal Powders"},{"id":"powders_b2_9","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which technique is used to reduce particle size of a powder?","options":[{"key":"A","text":"Levigation"},{"key":"B","text":"Trituration"},{"key":"C","text":"Decantation"},{"key":"D","text":"Filtration"}],"correct":"B","explanation":"Trituration (grinding) reduces particle size.","reference":"Medicinal Powders"},{"id":"powders_b2_10","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which powder dosage form is intended for introduction into body cavities (e.g., nasal, vaginal)?","options":[{"key":"A","text":"Dusting powder"},{"key":"B","text":"Insufflation powder"},{"key":"C","text":"Effervescent powder"},{"key":"D","text":"Powder for oral suspension"}],"correct":"B","explanation":"Insufflation powders are introduced into body cavities.","reference":"Medicinal Powders"},{"id":"powders_b2_11","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which statement about powder stability is correct?","options":[{"key":"A","text":"Powders are never affected by moisture"},{"key":"B","text":"Hygroscopic powders may cake or clump in humid conditions"},{"key":"C","text":"Powders do not require protection from light"},{"key":"D","text":"All powders are chemically stable indefinitely"}],"correct":"B","explanation":"Hygroscopic powders can absorb moisture, leading to caking.","reference":"Medicinal Powders"},{"id":"powders_b2_12","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a diluent in oral powders?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Lactose"},{"key":"C","text":"Sodium lauryl sulfate"},{"key":"D","text":"Glycerin"}],"correct":"B","explanation":"Lactose is a common diluent in oral powder formulations.","reference":"Medicinal Powders"},{"id":"powders_b2_13","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"medium","question":"Which patient counseling point is most important for a powder for oral suspension?","options":[{"key":"A","text":"\"Take with alcohol for better absorption\""},{"key":"B","text":"\"Shake well before each use after reconstitution\""},{"key":"C","text":"\"Store in the freezer after mixing\""},{"key":"D","text":"\"Do not refrigerate under any circumstances\""}],"correct":"B","explanation":"Shaking ensures uniform suspension of the drug after reconstitution.","reference":"Medicinal Powders"},{"id":"powders_b2_14","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which property is desirable for a powder intended for wound application?","options":[{"key":"A","text":"High hygroscopicity"},{"key":"B","text":"Sterility and non-irritancy"},{"key":"C","text":"Strong odor"},{"key":"D","text":"Bright color"}],"correct":"B","explanation":"Powders for wounds should be sterile and non-irritating.","reference":"Medicinal Powders"},{"id":"powders_b2_15","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which statement about geometric dilution is correct?","options":[{"key":"A","text":"It is used to mix a small amount of potent drug with a large amount of diluent"},{"key":"B","text":"It is used to dissolve drugs in water"},{"key":"C","text":"It is used to sterilize powders"},{"key":"D","text":"It is used to coat tablets"}],"correct":"A","explanation":"Geometric dilution ensures uniform distribution of potent drugs.","reference":"Medicinal Powders"},{"id":"powders_b2_16","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which powder type is most appropriate for a drug that is unstable in solution?","options":[{"key":"A","text":"Powder for oral solution to be reconstituted at time of use"},{"key":"B","text":"Pre-mixed liquid solution"},{"key":"C","text":"Emulsion"},{"key":"D","text":"Syrup"}],"correct":"A","explanation":"Powders for reconstitution improve stability for drugs unstable in solution.","reference":"Medicinal Powders"},{"id":"powders_b2_17","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with insufflation powders?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Nasal or other body cavities"},{"key":"C","text":"Transdermal"},{"key":"D","text":"Ophthalmic"}],"correct":"B","explanation":"Insufflation powders are administered into nasal or other cavities.","reference":"Medicinal Powders"},{"id":"powders_b2_18","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which statement about powder packaging is correct?","options":[{"key":"A","text":"All powders are packaged in glass only"},{"key":"B","text":"Moisture-resistant containers are important for hygroscopic powders"},{"key":"C","text":"Powders do not require child-resistant packaging"},{"key":"D","text":"Light protection is never necessary"}],"correct":"B","explanation":"Moisture-resistant packaging protects hygroscopic powders.","reference":"Medicinal Powders"},{"id":"powders_b2_19","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a flavoring agent in oral powders?","options":[{"key":"A","text":"Magnesium stearate"},{"key":"B","text":"Sucrose or artificial sweeteners"},{"key":"C","text":"Sodium starch glycolate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Sweeteners and flavors improve palatability of oral powders.","reference":"Medicinal Powders"},{"id":"powders_b2_20","topicId":"powders","topicName":"Medicinal Powders","type":"mcq","difficulty":"easy","question":"Which powder characteristic is most critical for inhalation products?","options":[{"key":"A","text":"Taste"},{"key":"B","text":"Particle size distribution and aerodynamic properties"},{"key":"C","text":"Color"},{"key":"D","text":"Odor"}],"correct":"B","explanation":"Particle size and aerodynamics determine lung deposition.","reference":"Medicinal Powders"},{"id":"suppositories_b2_1","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with suppositories?","options":[{"key":"A","text":"Oral"},{"key":"B","text":"Rectal, vaginal, or urethral"},{"key":"C","text":"Intravenous"},{"key":"D","text":"Transdermal"}],"correct":"B","explanation":"Suppositories are inserted into rectal, vaginal, or urethral cavities.","reference":"Suppositories"},{"id":"suppositories_b2_2","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which base is most commonly used for rectal suppositories?","options":[{"key":"A","text":"Polyethylene glycol"},{"key":"B","text":"Cocoa butter (theobroma oil)"},{"key":"C","text":"Glycerin"},{"key":"D","text":"Water"}],"correct":"B","explanation":"Cocoa butter is a classic fatty base for rectal suppositories.1{.underline}","reference":"Suppositories"},{"id":"suppositories_b2_3","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about cocoa butter suppository bases is correct?","options":[{"key":"A","text":"They melt at body temperature"},{"key":"B","text":"They are water-soluble"},{"key":"C","text":"They are irritant to mucous membranes"},{"key":"D","text":"They do not require refrigeration"}],"correct":"A","explanation":"Cocoa butter melts near body temperature, releasing the drug.","reference":"Suppositories"},{"id":"suppositories_b2_4","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which suppository base is water-soluble and hygroscopic?","options":[{"key":"A","text":"Cocoa butter"},{"key":"B","text":"Glycerinated gelatin"},{"key":"C","text":"Polyethylene glycol (PEG)"},{"key":"D","text":"White wax"}],"correct":"C","explanation":"PEG bases are water-soluble and hygroscopic.","reference":"Suppositories"},{"id":"suppositories_b2_5","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which patient counseling point is most appropriate for rectal suppositories?","options":[{"key":"A","text":"\"Insert while standing upright\""},{"key":"B","text":"\"Insert pointed end first, after removing wrapper\""},{"key":"C","text":"\"Chew before swallowing\""},{"key":"D","text":"\"Dissolve in water before use\""}],"correct":"B","explanation":"Suppositories are inserted pointed-end first after unwrapping.","reference":"Suppositories"},{"id":"suppositories_b2_6","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which factor most affects drug release from a fatty suppository base?","options":[{"key":"A","text":"Color of the base"},{"key":"B","text":"Melting point and drug solubility in the base"},{"key":"C","text":"Smell of the base"},{"key":"D","text":"Shape of the suppository"}],"correct":"B","explanation":"Melting behavior and drug solubility control release.","reference":"Suppositories"},{"id":"suppositories_b2_7","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about glycerinated gelatin suppositories is correct?","options":[{"key":"A","text":"They are used primarily for rectal administration"},{"key":"B","text":"They are used primarily for vaginal administration"},{"key":"C","text":"They melt at room temperature"},{"key":"D","text":"They are oil-based"}],"correct":"B","explanation":"Glycerinated gelatin bases are often used for vaginal suppositories.","reference":"Suppositories"},{"id":"suppositories_b2_8","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which method is commonly used to prepare suppositories in the laboratory?","options":[{"key":"A","text":"Direct compression"},{"key":"B","text":"Fusion and molding"},{"key":"C","text":"Lyophilization"},{"key":"D","text":"Spray drying"}],"correct":"B","explanation":"Suppositories are typically prepared by melting the base and molding.","reference":"Suppositories"},{"id":"suppositories_b2_9","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about storage of suppositories is correct?","options":[{"key":"A","text":"All suppositories should be stored at room temperature"},{"key":"B","text":"Fatty-base suppositories may require refrigeration to prevent melting"},{"key":"C","text":"Suppositories do not require protection from moisture"},{"key":"D","text":"Suppositories are stable indefinitely"}],"correct":"B","explanation":"Fatty bases can soften or melt at high temperatures.","reference":"Suppositories"},{"id":"suppositories_b2_10","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which advantage is associated with rectal administration via suppository?","options":[{"key":"A","text":"Avoidance of first-pass metabolism for some drugs"},{"key":"B","text":"Guaranteed 100% bioavailability"},{"key":"C","text":"Rapid onset for all drugs"},{"key":"D","text":"No local irritation possible"}],"correct":"A","explanation":"Rectal route can partially bypass hepatic first-pass metabolism.","reference":"Suppositories"},{"id":"suppositories_b2_11","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which excipient is used to increase the melting point of a suppository base?","options":[{"key":"A","text":"Glycerin"},{"key":"B","text":"White wax"},{"key":"C","text":"Propylene glycol"},{"key":"D","text":"Sorbitol"}],"correct":"B","explanation":"Waxes can raise the melting point of fatty bases.","reference":"Suppositories"},{"id":"suppositories_b2_12","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about PEG suppository bases is correct?","options":[{"key":"A","text":"They melt at body temperature"},{"key":"B","text":"They dissolve in rectal fluids rather than melt"},{"key":"C","text":"They are oleaginous"},{"key":"D","text":"They are not compatible with water-soluble drugs"}],"correct":"B","explanation":"PEG bases dissolve in mucosal fluids instead of melting.","reference":"Suppositories"},{"id":"suppositories_b2_13","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which patient population may particularly benefit from suppository dosage forms?","options":[{"key":"A","text":"Patients with severe nausea/vomiting"},{"key":"B","text":"Patients who prefer oral medications"},{"key":"C","text":"Patients with no swallowing difficulties"},{"key":"D","text":"Patients who can take oral medications easily"}],"correct":"A","explanation":"Suppositories are useful when oral administration is not feasible.","reference":"Suppositories"},{"id":"suppositories_b2_14","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about urethral suppositories is correct?","options":[{"key":"A","text":"They are commonly used in outpatient practice"},{"key":"B","text":"They are long, slender, and intended for urethral insertion"},{"key":"C","text":"They are identical to rectal suppositories"},{"key":"D","text":"They are always water-soluble"}],"correct":"B","explanation":"Urethral suppositories (bougies) are long and slender.","reference":"Suppositories"},{"id":"suppositories_b2_15","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which factor would decrease drug release from a suppository?","options":[{"key":"A","text":"High drug solubility in the base and low solubility in mucosal fluid"},{"key":"B","text":"Low drug solubility in the base and high solubility in mucosal fluid"},{"key":"C","text":"Low melting point of the base"},{"key":"D","text":"High surface area of the suppository"}],"correct":"A","explanation":"If the drug prefers the base over the mucosal fluid, release is reduced.","reference":"Suppositories"},{"id":"suppositories_b2_16","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about suppository weight uniformity is correct?","options":[{"key":"A","text":"Weight variation is not important for suppositories"},{"key":"B","text":"Uniform weight ensures consistent drug dose per unit"},{"key":"C","text":"Suppositories are not required to meet any weight standards"},{"key":"D","text":"Weight variation is only important for oral dosage forms"}],"correct":"B","explanation":"Uniform weight helps ensure dose uniformity.","reference":"Suppositories"},{"id":"suppositories_b2_17","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"medium","question":"Which base is most appropriate for a water-soluble drug intended for rectal use where rapid release is desired?","options":[{"key":"A","text":"Cocoa butter with high drug solubility"},{"key":"B","text":"PEG base with low drug solubility"},{"key":"C","text":"Cocoa butter with low drug solubility and high solubility in rectal fluid"},{"key":"D","text":"Anhydrous lanolin"}],"correct":"C","explanation":"Low solubility in the base and high in rectal fluid favors release from fatty bases.","reference":"Suppositories"},{"id":"suppositories_b2_18","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about vaginal suppositories is correct?","options":[{"key":"A","text":"They are always called tablets"},{"key":"B","text":"They are often formulated as ovules"},{"key":"C","text":"They are only used for systemic therapy"},{"key":"D","text":"They cannot contain antifungal agents"}],"correct":"B","explanation":"Vaginal suppositories are often oval or egg-shaped (ovules).1{.underline}()","reference":"Suppositories"},{"id":"suppositories_b2_19","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which handling instruction is most appropriate for suppositories?","options":[{"key":"A","text":"\"Store in direct sunlight to maintain firmness\""},{"key":"B","text":"\"Keep in a cool place; refrigerate if soft\""},{"key":"C","text":"\"Soak in water before insertion\""},{"key":"D","text":"\"Crush before use\""}],"correct":"B","explanation":"Cool storage prevents softening or melting.","reference":"Suppositories"},{"id":"suppositories_b2_20","topicId":"suppositories","topicName":"Suppositories","type":"mcq","difficulty":"easy","question":"Which statement about bioavailability from rectal suppositories is correct?","options":[{"key":"A","text":"It is always 100%"},{"key":"B","text":"It can be variable depending on placement and formulation"},{"key":"C","text":"It is always lower than oral"},{"key":"D","text":"It is unaffected by fecal matter"}],"correct":"B","explanation":"Rectal absorption is variable due to placement, contents, and formulation.","reference":"Suppositories"},{"id":"aqueous_solutions_b2_1","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement best defines an aqueous solution?","options":[{"key":"A","text":"A preparation with solid particles dispersed in oil"},{"key":"B","text":"A homogeneous mixture of drug dissolved in water or water-based vehicle"},{"key":"C","text":"A two-phase system with oil droplets in water"},{"key":"D","text":"A solid dosage form"}],"correct":"B","explanation":"Aqueous solutions are single-phase systems with drug dissolved in water.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_2","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used to adjust the tonicity of ophthalmic aqueous solutions?","options":[{"key":"A","text":"Ethanol"},{"key":"B","text":"Sodium chloride"},{"key":"C","text":"Glycerin"},{"key":"D","text":"Propylene glycol"}],"correct":"B","explanation":"Sodium chloride is used to make solutions isotonic with tears.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_3","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor most affects the solubility of a drug in an aqueous solution?","options":[{"key":"A","text":"Color of the solution"},{"key":"B","text":"pH and temperature"},{"key":"C","text":"Packaging material"},{"key":"D","text":"Smell"}],"correct":"B","explanation":"pH and temperature significantly influence aqueous solubility.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_4","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about preservatives in aqueous solutions is correct?","options":[{"key":"A","text":"Preservatives are never needed"},{"key":"B","text":"Multi-dose aqueous solutions often require preservatives to prevent microbial growth"},{"key":"C","text":"Preservatives are only used in solid dosage forms"},{"key":"D","text":"All aqueous solutions are sterile without preservatives"}],"correct":"B","explanation":"Multi-dose aqueous products typically need preservatives.1{.underline}","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_5","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which route of administration is associated with ophthalmic aqueous solutions?","options":[{"key":"A","text":"Intravenous"},{"key":"B","text":"Ocular"},{"key":"C","text":"Rectal"},{"key":"D","text":"Inhalation"}],"correct":"B","explanation":"Ophthalmic solutions are instilled into the eye.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_6","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about sterile aqueous solutions for injection is correct?","options":[{"key":"A","text":"They may contain visible particles"},{"key":"B","text":"They must be free of pyrogens and microbes"},{"key":"C","text":"They do not require isotonicity"},{"key":"D","text":"They can be stored at any temperature"}],"correct":"B","explanation":"Injectable solutions must be sterile and pyrogen-free.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_7","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which excipient is commonly used as a co-solvent in aqueous solutions to enhance solubility?","options":[{"key":"A","text":"Lactose"},{"key":"B","text":"Ethanol or propylene glycol"},{"key":"C","text":"Magnesium stearate"},{"key":"D","text":"Talc"}],"correct":"B","explanation":"Co-solvents like ethanol or propylene glycol increase drug solubility.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_8","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about syrups is correct?","options":[{"key":"A","text":"They are concentrated aqueous solutions of sugar with or without drug"},{"key":"B","text":"They contain no sugar"},{"key":"C","text":"They are always alcohol-based"},{"key":"D","text":"They are solid dosage forms"}],"correct":"A","explanation":"Syrups are concentrated aqueous sugar solutions.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_9","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which factor is most important for the chemical stability of an aqueous solution?","options":[{"key":"A","text":"Color of the container"},{"key":"B","text":"pH and presence of stabilizers"},{"key":"C","text":"Smell of the solution"},{"key":"D","text":"Taste only"}],"correct":"B","explanation":"pH control and stabilizers help prevent degradation.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_10","topicId":"aqueous_solutions","topicName":"Aqueous Solutions","type":"mcq","difficulty":"easy","question":"Which statement about elixirs is correct?","options":[{"key":"A","text":"They are sugar-free aqueous solutions"},{"key":"B","text":"They are hydroalcoholic solutions containing sweeteners and flavorings"},{"key":"C","text":"They are solid dosage forms"},{"key":"D","text":"They contain no alcohol"}],"correct":"B","explanation":"Elixirs are hydroalcoholic, sweetened, flavored solutions.","reference":"Aqueous Solutions"},{"id":"aqueous_solutions_b2_11","topicId":"aqueous_solutions","topicName":"Aqueous Solutio
